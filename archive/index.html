ting-get-24millionyen-in-4years.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;コンサルに転職して4年で年収を2400万円にする方法&quot;],&quot;published&quot;:[3,&quot;2023-07-07T08:00:39.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/consulting-get-24millionyen-in-4years.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;簿記2級合格体験記（18日間/75時間）&quot;],&quot;prevSlug&quot;:[0,&quot;uscpa-time-to-pass-boki2&quot;],&quot;nextTitle&quot;:[0,&quot;ビジネス実務法務検定2級 合格体験記（6日間/22時間）&quot;],&quot;nextSlug&quot;:[0,&quot;business-law-pass-in-short-time&quot;],&quot;editorId&quot;:[0,&quot;consulting-get-24millionyen-in-4years&quot;]}],&quot;body&quot;:[0,&quot;※以下で紹介する方法は、細部を除き**私自身で実証済み**。\r\n\r\n\r\n\r\n## 4年で年収2400万円にする方法\r\n\r\n以下のようにすれば、**4年で年収2400万円**になる。\r\n\r\n- **0年：**総合系コンサルティングファームに転職する。年収**500万円**。\r\n- **1.5年：**シニアコンサルタントに昇進。年収**700万円**。\r\n- **2年：**退職し、フリーランスのシニアコンサルタント募集案件を受託開始。年収**1200万円**。\r\n- **3年：**シニアコンサルタントとして入っている案件で、マネージャーロールを巻き取る。年収**1500万円**。\r\n- **3.5年：**マネージャー募集案件を受託。年収**2000万円**。\r\n- **4年：**報酬アップを交渉、または案件を変える。年収**2400万円**。\r\n\r\n（尚、案件単位で報酬を上げていくので、便宜上、上記の年収表記は「その時点の月額報酬×12ヶ月」で計算し、また端数は丸めている）\r\n\r\n## よくある質問\r\n\r\n### 案件はどうやって見つける？\r\n\r\nフリーランスコンサル案件の**斡旋事業者が大量にいる**。\r\n\r\n「フリーランス コンサル」でGoogle検索すればたくさん出てくるが、上場企業としては例えば[みらいワークス](https://mirai-works.co.jp/)がある。こうした事業者とオンラインで①web登録、②履歴書の送付、③面談を済ませると、それ以降、**経歴にマッチする案件が大量に送られてくる**ようになる。\r\n\r\nその後、案件を一つ選び斡旋事業者に連絡すると**案件先と面談**になり、**問題がなければ受託**できる。\r\n\r\n### 案件受託に営業活動は必要ない？\r\n\r\n上記のように斡旋業者が案件紹介してくるため、**営業活動は不要**。\r\n\r\nランサーズやクラウドワークス等のクラウドソーシングと似ているが、**レビューがつかない分、楽である**。フリーランスコンサルの募集者は斡旋事業者から送られてくる**履歴書と面談だけを頼り**に、採用を判断する。  \r\n（私自身、フリーランスの採用をやっていたため、採用側のプロセスを把握している）\r\n\r\n### 案件先はどういう会社が多い？\r\n\r\nあくまで私の専門分野における体感だが、**総合系コンサルティングファーム**が**90%**、**スタートアップ**が**10%**程度。\r\n\r\n**総合系コンサルティングファーム**は業界構造上の理由により人手が足りずとも一先ず提案活動をし、**受注した後**で**フリーランスを募集**し**プロジェクトメンバーを補充**をすることが多くなっている。\r\n\r\n一方で**スタートアップ**は、**設立5年以上**/**年商5億円以上**の会社が多い印象。  \r\n事業拡大で**人手が足りない**一方、正規雇用は解雇が難しいのでリスクが高く、また採用競争の厳しさにより良い人材が採れないため、短期コストが高くとも**気軽に採用/契約解除できる**フリーランスを欲しているようである。\r\n\r\n### フリーランスコンサルの需要は続く？\r\n\r\n先のことは分からないが、「フリーランスコンサル市場はバブル」と言われながら**10年以上に渡り市場は拡大**し続け、需給逼迫からか**報酬単価も上がり続けている**ので、2～3年で市場が消えることは考えづらい。\r\n\r\n実際、需給はかなり逼迫しており、**フリーランスとして採用されている身でありながらその会社のフリーランス採用を任される、**という謎の状況を何度か経験した。\r\n\r\n### どういう分野のコンサルに需要がある？\r\n\r\n私自身はコンサル斡旋事業者ではないのため**正確な数値は持ってい**ないが、体感では、総合コンサルファーム案件では以下の順に多い印象：\r\n\r\n1. ERP導入\r\n2. PMO\r\n3. 業務改革（SCM等）\r\n4. 新規事業、DX\r\n5. 戦略（中期経営計画の策定など）\r\n\r\nスタートアップ案件の場合は、基本的に経営企画やBizDevの一員としての動きを要求される。\r\n\r\n### コンサルファーム案件とスタートアップ案件で違いはある？\r\n\r\nあくまで私の印象だが、全く**違**う。\r\n\r\nスタートアップ案件では、カウンターパートは**代表や取締役、事業部長**であることが多い。従って、基本的に**物事がすぐ決ま**る。\r\n\r\nslackで取締役に「これをやったほうが良い」と書くと、10分後に「お願いする」と返信があり、意思決定フェーズは終了、実行を開始する。\r\n\r\n一方でコンサルファームは、私が新卒で入った頃と比べても「**巨大な官僚機構化**」が進み、プロジェクト内部ですら様々な**稟議的なもの**を走らせる必要がある上、最終顧客（自分のクライアントであるコンサルファームのクライアント）は基本的にJTCなので、そこでまた**稟議的な作業**が延々走る。\r\n\r\n結果として**延々とお伺い資料を作**るのが仕事となる（コンサル＝文房具論）。\r\n\r\n文面から滲み出ているように私はスタートアップ案件のほうが断然好きであり、途中からそればかり受託していたが、ゆったりしたペースで資料作りに専念したい人はコンサルファーム案件のほうが性に合うかもしれない。\r\n\r\n尚、私がフリーランス案件を受注していたのは**2年以上前**であるため、今は事情が変わっているかもしれない。あしからず。\r\n\r\n### 年収2,400万円をさらに超えることは可能？\r\n\r\n**複数案件を掛け持ちすれば可能**。  \r\n（私自身やったので**実証済み**）\r\n\r\nその際は工夫が必要だが、長くなるので割愛。  \r\n（知りたい人はコメント欄に質問下さい）\r\n\r\n一方、**案件掛け持ちせずに年収2,400万円を超えられるか**だが、私自身は月額報酬200万円以上の案件を受託したことがなく、**未経験のことを書くのは性に合わない**ため、「**分からない**」というのが回答になる。\r\n\r\nただし、報酬が200万円/月を超える案件をweb上で見たことはあるので、可能なのかもしれない。\r\n\r\n### フリーランスコンサルにはどういう人が多い？\r\n\r\nコンサルファーム案件は、**コンサル経験者以外はほぼ応募不可**のため、どこかの**ファームで2～5年の勤務経験がある**人達が多かった。\r\n\r\n**スタートアップのBizDev案件**もそういう経歴の人が多かったが、コンサル経験が必須なことは少ないため、コンサルファーム案件よりは**経歴が多様**だった。\r\n\r\nちなみに私はフリーランスをやった後に会社を興したが、同様の人は非常に多く、特にスタートアップ案件では採用されたフリーランスの**3割くらいは1年以内に起業のため契約終了**していた（案件の途中で起業した者もいた）。\r\n\r\nまた、事業が上手くいかず**フリーランスに出戻る人**もたくさんいるが、案件を半年から一年こなして**軍資金を作り直し**、**またビジネスを立ち上げる**人も結構いる。\r\n\r\n事実上、**起業家のセーフティーネット**と化している。\r\n\r\n### 本当に平均的なコンサルでも転職後4年で2,400万円稼げる？\r\n\r\nとりあえず、私がコンサルファームに所属していた**10年ほど前**の「平均的なコンサル」であれば、稼げると思われる。\r\n\r\nただ最近は**採用基準が非常に緩くなった**と聞くので、「**今の平均的コンサルでもイケるのか？**」と問われると、**ちょっと分からない**。\r\n\r\n### 筆者はコンサル就職後に4年で年収2,400万円になった？\r\n\r\n私は新卒でコンサルファームに就職した後、途中で**大学院**に行ったり、友人の**スタートアップを手伝ったり**していたので、それらの期間を含めると、4年以上かかっている。\r\n\r\nただ、ファーム勤務およびフリーランスの**合計期間は4年**であり、経験上フリーランスの**報酬は年齢と関係ない**ため、私のような**寄り道をしなければ、4年で2,400万円稼げる**。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/consulting-get-24millionyen-in-4years.md&quot;],&quot;digest&quot;:[0,&quot;bcf4b820290eecb3&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;※以下で紹介する方法は、細部を除き&lt;strong&gt;私自身で実証済み&lt;/strong&gt;。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;4年で年収2400万円にする方法\&quot;&gt;4年で年収2400万円にする方法&lt;a class=\&quot;anchor\&quot; href=\&quot;#4年で年収2400万円にする方法\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;以下のようにすれば、&lt;strong&gt;4年で年収2400万円&lt;/strong&gt;になる。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;0年：&lt;strong&gt;総合系コンサルティングファームに転職する。年収&lt;/strong&gt;500万円&lt;/strong&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;1.5年：&lt;strong&gt;シニアコンサルタントに昇進。年収&lt;/strong&gt;700万円&lt;/strong&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;2年：&lt;strong&gt;退職し、フリーランスのシニアコンサルタント募集案件を受託開始。年収&lt;/strong&gt;1200万円&lt;/strong&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;3年：&lt;strong&gt;シニアコンサルタントとして入っている案件で、マネージャーロールを巻き取る。年収&lt;/strong&gt;1500万円&lt;/strong&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;3.5年：&lt;strong&gt;マネージャー募集案件を受託。年収&lt;/strong&gt;2000万円&lt;/strong&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;4年：&lt;strong&gt;報酬アップを交渉、または案件を変える。年収&lt;/strong&gt;2400万円&lt;/strong&gt;。&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;（尚、案件単位で報酬を上げていくので、便宜上、上記の年収表記は「その時点の月額報酬×12ヶ月」で計算し、また端数は丸めている）&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;よくある質問\&quot;&gt;よくある質問&lt;a class=\&quot;anchor\&quot; href=\&quot;#よくある質問\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;section&gt;&lt;h3 id=\&quot;案件はどうやって見つける\&quot;&gt;案件はどうやって見つける？&lt;a class=\&quot;anchor\&quot; href=\&quot;#案件はどうやって見つける\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;フリーランスコンサル案件の&lt;strong&gt;斡旋事業者が大量にいる&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;「フリーランス コンサル」でGoogle検索すればたくさん出てくるが、上場企業としては例えば&lt;a href=\&quot;https://mirai-works.co.jp/\&quot;&gt;みらいワークス&lt;/a&gt;がある。こうした事業者とオンラインで①web登録、②履歴書の送付、③面談を済ませると、それ以降、&lt;strong&gt;経歴にマッチする案件が大量に送られてくる&lt;/strong&gt;ようになる。&lt;/p&gt;&lt;p&gt;その後、案件を一つ選び斡旋事業者に連絡すると&lt;strong&gt;案件先と面談&lt;/strong&gt;になり、&lt;strong&gt;問題がなければ受託&lt;/strong&gt;できる。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;案件受託に営業活動は必要ない\&quot;&gt;案件受託に営業活動は必要ない？&lt;a class=\&quot;anchor\&quot; href=\&quot;#案件受託に営業活動は必要ない\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;上記のように斡旋業者が案件紹介してくるため、&lt;strong&gt;営業活動は不要&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;ランサーズやクラウドワークス等のクラウドソーシングと似ているが、&lt;strong&gt;レビューがつかない分、楽である&lt;/strong&gt;。フリーランスコンサルの募集者は斡旋事業者から送られてくる&lt;strong&gt;履歴書と面談だけを頼り&lt;/strong&gt;に、採用を判断する。&lt;br&gt;\n（私自身、フリーランスの採用をやっていたため、採用側のプロセスを把握している）&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;案件先はどういう会社が多い\&quot;&gt;案件先はどういう会社が多い？&lt;a class=\&quot;anchor\&quot; href=\&quot;#案件先はどういう会社が多い\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;あくまで私の専門分野における体感だが、&lt;strong&gt;総合系コンサルティングファーム&lt;/strong&gt;が&lt;strong&gt;90%&lt;/strong&gt;、&lt;strong&gt;スタートアップ&lt;/strong&gt;が**10%**程度。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;総合系コンサルティングファーム&lt;/strong&gt;は業界構造上の理由により人手が足りずとも一先ず提案活動をし、&lt;strong&gt;受注した後&lt;/strong&gt;で&lt;strong&gt;フリーランスを募集&lt;/strong&gt;し&lt;strong&gt;プロジェクトメンバーを補充&lt;/strong&gt;をすることが多くなっている。&lt;/p&gt;&lt;p&gt;一方で&lt;strong&gt;スタートアップ&lt;/strong&gt;は、&lt;strong&gt;設立5年以上&lt;/strong&gt;/&lt;strong&gt;年商5億円以上&lt;/strong&gt;の会社が多い印象。&lt;br&gt;\n事業拡大で&lt;strong&gt;人手が足りない&lt;/strong&gt;一方、正規雇用は解雇が難しいのでリスクが高く、また採用競争の厳しさにより良い人材が採れないため、短期コストが高くとも&lt;strong&gt;気軽に採用/契約解除できる&lt;/strong&gt;フリーランスを欲しているようである。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;フリーランスコンサルの需要は続く\&quot;&gt;フリーランスコンサルの需要は続く？&lt;a class=\&quot;anchor\&quot; href=\&quot;#フリーランスコンサルの需要は続く\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;先のことは分からないが、「フリーランスコンサル市場はバブル」と言われながら&lt;strong&gt;10年以上に渡り市場は拡大&lt;/strong&gt;し続け、需給逼迫からか&lt;strong&gt;報酬単価も上がり続けている&lt;/strong&gt;ので、2～3年で市場が消えることは考えづらい。&lt;/p&gt;&lt;p&gt;実際、需給はかなり逼迫しており、**フリーランスとして採用されている身でありながらその会社のフリーランス採用を任される、**という謎の状況を何度か経験した。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;どういう分野のコンサルに需要がある\&quot;&gt;どういう分野のコンサルに需要がある？&lt;a class=\&quot;anchor\&quot; href=\&quot;#どういう分野のコンサルに需要がある\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;私自身はコンサル斡旋事業者ではないのため&lt;strong&gt;正確な数値は持ってい&lt;/strong&gt;ないが、体感では、総合コンサルファーム案件では以下の順に多い印象：&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;ERP導入&lt;/li&gt;\n&lt;li&gt;PMO&lt;/li&gt;\n&lt;li&gt;業務改革（SCM等）&lt;/li&gt;\n&lt;li&gt;新規事業、DX&lt;/li&gt;\n&lt;li&gt;戦略（中期経営計画の策定など）&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;スタートアップ案件の場合は、基本的に経営企画やBizDevの一員としての動きを要求される。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;コンサルファーム案件とスタートアップ案件で違いはある\&quot;&gt;コンサルファーム案件とスタートアップ案件で違いはある？&lt;a class=\&quot;anchor\&quot; href=\&quot;#コンサルファーム案件とスタートアップ案件で違いはある\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;あくまで私の印象だが、全く&lt;strong&gt;違&lt;/strong&gt;う。&lt;/p&gt;&lt;p&gt;スタートアップ案件では、カウンターパートは&lt;strong&gt;代表や取締役、事業部長&lt;/strong&gt;であることが多い。従って、基本的に&lt;strong&gt;物事がすぐ決ま&lt;/strong&gt;る。&lt;/p&gt;&lt;p&gt;slackで取締役に「これをやったほうが良い」と書くと、10分後に「お願いする」と返信があり、意思決定フェーズは終了、実行を開始する。&lt;/p&gt;&lt;p&gt;一方でコンサルファームは、私が新卒で入った頃と比べても「&lt;strong&gt;巨大な官僚機構化&lt;/strong&gt;」が進み、プロジェクト内部ですら様々な&lt;strong&gt;稟議的なもの&lt;/strong&gt;を走らせる必要がある上、最終顧客（自分のクライアントであるコンサルファームのクライアント）は基本的にJTCなので、そこでまた&lt;strong&gt;稟議的な作業&lt;/strong&gt;が延々走る。&lt;/p&gt;&lt;p&gt;結果として&lt;strong&gt;延々とお伺い資料を作&lt;/strong&gt;るのが仕事となる（コンサル＝文房具論）。&lt;/p&gt;&lt;p&gt;文面から滲み出ているように私はスタートアップ案件のほうが断然好きであり、途中からそればかり受託していたが、ゆったりしたペースで資料作りに専念したい人はコンサルファーム案件のほうが性に合うかもしれない。&lt;/p&gt;&lt;p&gt;尚、私がフリーランス案件を受注していたのは&lt;strong&gt;2年以上前&lt;/strong&gt;であるため、今は事情が変わっているかもしれない。あしからず。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;年収2400万円をさらに超えることは可能\&quot;&gt;年収2,400万円をさらに超えることは可能？&lt;a class=\&quot;anchor\&quot; href=\&quot;#年収2400万円をさらに超えることは可能\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;複数案件を掛け持ちすれば可能&lt;/strong&gt;。&lt;br&gt;\n（私自身やったので&lt;strong&gt;実証済み&lt;/strong&gt;）&lt;/p&gt;&lt;p&gt;その際は工夫が必要だが、長くなるので割愛。&lt;br&gt;\n（知りたい人はコメント欄に質問下さい）&lt;/p&gt;&lt;p&gt;一方、&lt;strong&gt;案件掛け持ちせずに年収2,400万円を超えられるか&lt;/strong&gt;だが、私自身は月額報酬200万円以上の案件を受託したことがなく、&lt;strong&gt;未経験のことを書くのは性に合わない&lt;/strong&gt;ため、「&lt;strong&gt;分からない&lt;/strong&gt;」というのが回答になる。&lt;/p&gt;&lt;p&gt;ただし、報酬が200万円/月を超える案件をweb上で見たことはあるので、可能なのかもしれない。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;フリーランスコンサルにはどういう人が多い\&quot;&gt;フリーランスコンサルにはどういう人が多い？&lt;a class=\&quot;anchor\&quot; href=\&quot;#フリーランスコンサルにはどういう人が多い\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;コンサルファーム案件は、&lt;strong&gt;コンサル経験者以外はほぼ応募不可&lt;/strong&gt;のため、どこかの&lt;strong&gt;ファームで2～5年の勤務経験がある&lt;/strong&gt;人達が多かった。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;スタートアップのBizDev案件&lt;/strong&gt;もそういう経歴の人が多かったが、コンサル経験が必須なことは少ないため、コンサルファーム案件よりは&lt;strong&gt;経歴が多様&lt;/strong&gt;だった。&lt;/p&gt;&lt;p&gt;ちなみに私はフリーランスをやった後に会社を興したが、同様の人は非常に多く、特にスタートアップ案件では採用されたフリーランスの&lt;strong&gt;3割くらいは1年以内に起業のため契約終了&lt;/strong&gt;していた（案件の途中で起業した者もいた）。&lt;/p&gt;&lt;p&gt;また、事業が上手くいかず&lt;strong&gt;フリーランスに出戻る人&lt;/strong&gt;もたくさんいるが、案件を半年から一年こなして&lt;strong&gt;軍資金を作り直し&lt;/strong&gt;、&lt;strong&gt;またビジネスを立ち上げる&lt;/strong&gt;人も結構いる。&lt;/p&gt;&lt;p&gt;事実上、&lt;strong&gt;起業家のセーフティーネット&lt;/strong&gt;と化している。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;本当に平均的なコンサルでも転職後4年で2400万円稼げる\&quot;&gt;本当に平均的なコンサルでも転職後4年で2,400万円稼げる？&lt;a class=\&quot;anchor\&quot; href=\&quot;#本当に平均的なコンサルでも転職後4年で2400万円稼げる\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;とりあえず、私がコンサルファームに所属していた&lt;strong&gt;10年ほど前&lt;/strong&gt;の「平均的なコンサル」であれば、稼げると思われる。&lt;/p&gt;&lt;p&gt;ただ最近は&lt;strong&gt;採用基準が非常に緩くなった&lt;/strong&gt;と聞くので、「&lt;strong&gt;今の平均的コンサルでもイケるのか？&lt;/strong&gt;」と問われると、&lt;strong&gt;ちょっと分からない&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;筆者はコンサル就職後に4年で年収2400万円になった\&quot;&gt;筆者はコンサル就職後に4年で年収2,400万円になった？&lt;a class=\&quot;anchor\&quot; href=\&quot;#筆者はコンサル就職後に4年で年収2400万円になった\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;私は新卒でコンサルファームに就職した後、途中で&lt;strong&gt;大学院&lt;/strong&gt;に行ったり、友人の&lt;strong&gt;スタートアップを手伝ったり&lt;/strong&gt;していたので、それらの期間を含めると、4年以上かかっている。&lt;/p&gt;&lt;p&gt;ただ、ファーム勤務およびフリーランスの&lt;strong&gt;合計期間は4年&lt;/strong&gt;であり、経験上フリーランスの&lt;strong&gt;報酬は年齢と関係ない&lt;/strong&gt;ため、私のような&lt;strong&gt;寄り道をしなければ、4年で2,400万円稼げる&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;4年で年収2400万円にする方法&quot;],&quot;text&quot;:[0,&quot;4年で年収2400万円にする方法#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;よくある質問&quot;],&quot;text&quot;:[0,&quot;よくある質問#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;案件はどうやって見つける&quot;],&quot;text&quot;:[0,&quot;案件はどうやって見つける？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;案件受託に営業活動は必要ない&quot;],&quot;text&quot;:[0,&quot;案件受託に営業活動は必要ない？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;案件先はどういう会社が多い&quot;],&quot;text&quot;:[0,&quot;案件先はどういう会社が多い？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;フリーランスコンサルの需要は続く&quot;],&quot;text&quot;:[0,&quot;フリーランスコンサルの需要は続く？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;どういう分野のコンサルに需要がある&quot;],&quot;text&quot;:[0,&quot;どういう分野のコンサルに需要がある？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;コンサルファーム案件とスタートアップ案件で違いはある&quot;],&quot;text&quot;:[0,&quot;コンサルファーム案件とスタートアップ案件で違いはある？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;年収2400万円をさらに超えることは可能&quot;],&quot;text&quot;:[0,&quot;年収2,400万円をさらに超えることは可能？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;フリーランスコンサルにはどういう人が多い&quot;],&quot;text&quot;:[0,&quot;フリーランスコンサルにはどういう人が多い？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;本当に平均的なコンサルでも転職後4年で2400万円稼げる&quot;],&quot;text&quot;:[0,&quot;本当に平均的なコンサルでも転職後4年で2,400万円稼げる？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;筆者はコンサル就職後に4年で年収2400万円になった&quot;],&quot;text&quot;:[0,&quot;筆者はコンサル就職後に4年で年収2,400万円になった？#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;コンサルに転職して4年で年収を2400万円にする方法&quot;],&quot;slug&quot;:[0,&quot;consulting-get-24millionyen-in-4years&quot;],&quot;published&quot;:[3,&quot;2023-07-07T08:00:39.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/consulting-get-24millionyen-in-4years.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,10],&quot;words&quot;:[0,2077],&quot;excerpt&quot;:[0,&quot;※以下で紹介する方法は、細部を除き私自身で実証済み。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;consulting-get-24millionyen-in-4years&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;uscpa-time-to-pass-boki2.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;簿記2級合格体験記（18日間/75時間）&quot;],&quot;published&quot;:[3,&quot;2023-07-03T08:00:37.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/uscpa-time-to-pass-boki2.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;米国公認会計士（USCPA）合格体験記（7.5ヶ月間/750時間）&quot;],&quot;prevSlug&quot;:[0,&quot;how-to-pass-uscpa-in-750hours&quot;],&quot;nextTitle&quot;:[0,&quot;コンサルに転職して4年で年収を2400万円にする方法&quot;],&quot;nextSlug&quot;:[0,&quot;consulting-get-24millionyen-in-4years&quot;],&quot;editorId&quot;:[0,&quot;uscpa-time-to-pass-boki2&quot;]}],&quot;body&quot;:[0,&quot;**簿記2級に合格**した。\r\n\r\n18日間（75時間）かかった。\r\n\r\n\r\n\r\n## 予備校\r\n\r\n予備校は[スタディングの簿記2級コース](https://studying.jp/boki/)を使った。\r\n\r\n無料の[CPAラーニング](https://www.cpa-learning.com/)も検討したが、スマホ学習の効率性をUSCPA受験で実感した結果、**スマホUXが優れていた**スタディングにした。\r\n\r\n## 教材\r\n\r\nスタディングは以下のように様々な教材・機能を提供しているのだが、時短のため、一部しか使わなかった。\r\n\r\n- 講義動画：**見ない**\r\n- テキスト：使った\r\n- 演習問題：使った\r\n- AI復習（※）：使った\r\n- 実戦略UPテスト：**やらない**\r\n- 模試：使った\r\n\r\n（※）AI復習：AIが適切な日に適切な問題を出題してくれる機能\r\n\r\n## 教材以外の道具\r\n\r\n**iPhone、電卓、iPhoneメモアプリ、Studyplus**を以下のように使った。\r\n\r\n- **iPhone：**スタディングの教材をこなす\r\n- **電卓：**試験で必要なため、演習で使う\r\n- **iPhoneメモアプリ：**学習上の気づきをメモ\r\n- **Studyplus：**勉強時間を管理\r\n\r\nちなみに電卓は、ネットで評判の良かったSHARPの[EL-G37](https://www.amazon.co.jp/dp/B00EB70MCO?tag=note0e2a-22&amp;linkCode=ogi&amp;th=1&amp;psc=1)を買った。\r\n\r\n## 勉強時間\r\n\r\n勉強時間は以下だった。\r\n\r\n1. テキストを読む：**15時間**\r\n2. 演習問題を解く：**30時間**\r\n3. 模試を解く：**20時間**\r\n4. 電卓練習：**10時間**\r\n5. 受験\r\n\r\n合計：**75時間**\r\n\r\n**学習開始時点では40時間ほどで合格するつもり**だったが、模試を受けたところ、**電卓を叩くのが遅すぎて時間切れになる**と判明したため、電卓の練習を取り入れ、結果として**75時間**となった。\r\n\r\n尚、2023年にもなって**電卓を打つ練習が必要になる**試験構成なのは、いかにも**日本らしい時代錯誤**で、やる気が著しく減退した。\r\n\r\n## 受験の結果\r\n\r\nスコア**90点**で**合格**した。\r\n\r\n## 感想\r\n\r\n合格できたのは良かったが、**本番が模試に比べ簡単**で、電卓練習などしなくとも**当初の勉強計画（40時間）で合格できた**感があった。  \r\n**全問題**で「**計算が簡単に済むように前提が組んである」**作為性が感じられたため、運の所為ではなく**、スタディングの模試は、CBT試験の本番より難易度が高い**という理解のほうが正しい印象。\r\n\r\nまた繰り返しになるが、**2023年にもなって計算を電卓でやらせるのは正気の沙汰ではない**。米国公認会計士試験は普通にExcelである（USCPA合格体験記は[ここ](/how-to-pass-uscpa-in-750hours/)）。簿記1級はCBT試験すらないということで、今の所あまり受験する気は起きない。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/uscpa-time-to-pass-boki2.md&quot;],&quot;digest&quot;:[0,&quot;b6f356550d311dee&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;簿記2級に合格&lt;/strong&gt;した。&lt;/p&gt;\n&lt;p&gt;18日間（75時間）かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;予備校\&quot;&gt;予備校&lt;a class=\&quot;anchor\&quot; href=\&quot;#予備校\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;予備校は&lt;a href=\&quot;https://studying.jp/boki/\&quot;&gt;スタディングの簿記2級コース&lt;/a&gt;を使った。&lt;/p&gt;&lt;p&gt;無料の&lt;a href=\&quot;https://www.cpa-learning.com/\&quot;&gt;CPAラーニング&lt;/a&gt;も検討したが、スマホ学習の効率性をUSCPA受験で実感した結果、&lt;strong&gt;スマホUXが優れていた&lt;/strong&gt;スタディングにした。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材\&quot;&gt;教材&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;スタディングは以下のように様々な教材・機能を提供しているのだが、時短のため、一部しか使わなかった。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;講義動画：&lt;strong&gt;見ない&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;テキスト：使った&lt;/li&gt;\n&lt;li&gt;演習問題：使った&lt;/li&gt;\n&lt;li&gt;AI復習（※）：使った&lt;/li&gt;\n&lt;li&gt;実戦略UPテスト：&lt;strong&gt;やらない&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;模試：使った&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;（※）AI復習：AIが適切な日に適切な問題を出題してくれる機能&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材以外の道具\&quot;&gt;教材以外の道具&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材以外の道具\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;iPhone、電卓、iPhoneメモアプリ、Studyplus&lt;/strong&gt;を以下のように使った。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;**iPhone：**スタディングの教材をこなす&lt;/li&gt;\n&lt;li&gt;**電卓：**試験で必要なため、演習で使う&lt;/li&gt;\n&lt;li&gt;**iPhoneメモアプリ：**学習上の気づきをメモ&lt;/li&gt;\n&lt;li&gt;**Studyplus：**勉強時間を管理&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;ちなみに電卓は、ネットで評判の良かったSHARPの&lt;a href=\&quot;https://www.amazon.co.jp/dp/B00EB70MCO?tag=note0e2a-22&amp;#x26;linkCode=ogi&amp;#x26;th=1&amp;#x26;psc=1\&quot;&gt;EL-G37&lt;/a&gt;を買った。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勉強時間\&quot;&gt;勉強時間&lt;a class=\&quot;anchor\&quot; href=\&quot;#勉強時間\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;勉強時間は以下だった。&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;テキストを読む：&lt;strong&gt;15時間&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;演習問題を解く：&lt;strong&gt;30時間&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;模試を解く：&lt;strong&gt;20時間&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;電卓練習：&lt;strong&gt;10時間&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;受験&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;合計：&lt;strong&gt;75時間&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;学習開始時点では40時間ほどで合格するつもり&lt;/strong&gt;だったが、模試を受けたところ、&lt;strong&gt;電卓を叩くのが遅すぎて時間切れになる&lt;/strong&gt;と判明したため、電卓の練習を取り入れ、結果として&lt;strong&gt;75時間&lt;/strong&gt;となった。&lt;/p&gt;&lt;p&gt;尚、2023年にもなって&lt;strong&gt;電卓を打つ練習が必要になる&lt;/strong&gt;試験構成なのは、いかにも&lt;strong&gt;日本らしい時代錯誤&lt;/strong&gt;で、やる気が著しく減退した。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;受験の結果\&quot;&gt;受験の結果&lt;a class=\&quot;anchor\&quot; href=\&quot;#受験の結果\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;スコア&lt;strong&gt;90点&lt;/strong&gt;で&lt;strong&gt;合格&lt;/strong&gt;した。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;感想\&quot;&gt;感想&lt;a class=\&quot;anchor\&quot; href=\&quot;#感想\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;合格できたのは良かったが、&lt;strong&gt;本番が模試に比べ簡単&lt;/strong&gt;で、電卓練習などしなくとも&lt;strong&gt;当初の勉強計画（40時間）で合格できた&lt;/strong&gt;感があった。&lt;br&gt;\n&lt;strong&gt;全問題&lt;/strong&gt;で「&lt;strong&gt;計算が簡単に済むように前提が組んである」&lt;strong&gt;作為性が感じられたため、運の所為ではなく&lt;/strong&gt;、スタディングの模試は、CBT試験の本番より難易度が高い&lt;/strong&gt;という理解のほうが正しい印象。&lt;/p&gt;&lt;p&gt;また繰り返しになるが、&lt;strong&gt;2023年にもなって計算を電卓でやらせるのは正気の沙汰ではない&lt;/strong&gt;。米国公認会計士試験は普通にExcelである（USCPA合格体験記は&lt;a href=\&quot;/how-to-pass-uscpa-in-750hours/\&quot;&gt;ここ&lt;/a&gt;）。簿記1級はCBT試験すらないということで、今の所あまり受験する気は起きない。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;予備校&quot;],&quot;text&quot;:[0,&quot;予備校#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材&quot;],&quot;text&quot;:[0,&quot;教材#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材以外の道具&quot;],&quot;text&quot;:[0,&quot;教材以外の道具#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強時間&quot;],&quot;text&quot;:[0,&quot;勉強時間#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;受験の結果&quot;],&quot;text&quot;:[0,&quot;受験の結果#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;感想&quot;],&quot;text&quot;:[0,&quot;感想#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;簿記2級合格体験記（18日間/75時間）&quot;],&quot;slug&quot;:[0,&quot;uscpa-time-to-pass-boki2&quot;],&quot;published&quot;:[3,&quot;2023-07-03T08:00:37.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/uscpa-time-to-pass-boki2.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,3],&quot;words&quot;:[0,694],&quot;excerpt&quot;:[0,&quot;簿記2級に合格した。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;uscpa-time-to-pass-boki2&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;how-to-pass-uscpa-in-750hours.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;米国公認会計士（USCPA）合格体験記（7.5ヶ月間/750時間）&quot;],&quot;published&quot;:[3,&quot;2023-06-22T09:06:30.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/06/how-to-pass-uscpa-in-750hours.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;&quot;],&quot;prevSlug&quot;:[0,&quot;&quot;],&quot;nextTitle&quot;:[0,&quot;簿記2級合格体験記（18日間/75時間）&quot;],&quot;nextSlug&quot;:[0,&quot;uscpa-time-to-pass-boki2&quot;],&quot;editorId&quot;:[0,&quot;how-to-pass-uscpa-in-750hours&quot;]}],&quot;body&quot;:[0,&quot;**米国公認会計士（USCPA）試験に全科目合格**した。\r\n\r\n100時間/月の勉強で、7ヶ月半（749時間）かかった。\r\n\r\n\r\n\r\n## 予備校\r\n\r\n予備校は[アビタス](https://www.abitus.co.jp/uscpa/)。\r\n\r\n当初は予備校を使わず市販の教材のみで受験する予定だったが、受験資格を得るのに米国大学の単位が必要だったため方針転換した。\r\n\r\nカルフォルニア州立大学との提携により**オンライン試験で単位を取得でき、その他諸々の評判が良い**アビタスを選んだ。\r\n\r\n## 教材\r\n\r\nアビタスのUS CPAコースは、以下のように様々な教材を提供しているが、時短のため、**一部しか使わなかった**。\r\n\r\n- 講義動画：**見ない**\r\n- 紙の教科書：**見ない**\r\n- 紙の演習問題：**見ない**\r\n- 教科書アプリ：使った\r\n- 演習アプリ：使った\r\n\r\n**動画や紙の教材は、**学習効率が悪いので**無視**。\r\n\r\n**アプリ教材**は、持ち運びが楽、場所を選ばずスキマ時間で学習可能、スクショを用いたまとめノート作成が簡単、タッチペンで手書きメモ可能、情報検索が高速、といった利点があり、**効率的な学習**ができたように思う。\r\n\r\n## 教材以外の道具\r\n\r\n**iPhone、iPad、タブレットスタンド、iPhoneメモアプリ、Studyplus**を以下のように使った。\r\n\r\n- **iPhone**：演習アプリをやる\r\n- **iPad**：教科書アプリを読む\r\n- [**タブレットスタンド**](https://www.amazon.co.jp/gp/product/B06XG7XJ8K/ref=ppx_yo_dt_b_search_asin_title?ie=UTF8&amp;psc=1)：iPadを置く（意外に超重要）\r\n- [**タッチペン**](https://www.amazon.co.jp/Apple-%E3%82%A2%E3%83%83%E3%83%97%E3%83%AB-MU8F2J-A-Pencil/dp/B07KR69HH9/ref=sr_1_4?crid=3U37M24GUBUJ0&amp;keywords=apple%E3%83%9A%E3%83%B3%E3%82%B7%E3%83%AB&amp;qid=1687249841&amp;s=computers&amp;sprefix=apple%E3%83%9A%E3%83%B3%E3%82%B7%E3%83%AB%2Ccomputers%2C181&amp;sr=1-4)：タブレット上でアプリ教科書に書き込む\r\n- [**メモアプリ**](https://support.apple.com/ja-jp/HT205773)：まとめノートを作成\r\n- [**Studyplus**](https://www.studyplus.jp/)：勉強時間を管理\r\n\r\n**あらゆる作業をスマホ/タブレットで気軽に実行可能にし**、効率性・継続性の維持に努めた。\r\n\r\n## 勉強方法\r\n\r\nUSCPA試験は4科目（FAR, AUD, BEC, REG）あるが、科目毎に以下のルーチンを実施した。\r\n\r\n1. **教科書を1周する**\r\n2. **MC（多肢選択）問題を1周する**\r\n3. **TBS（事例形式）問題を1周する**\r\n4. **教科書をもう1周する**\r\n5. **AICPA過去問と模試はやらない**\r\n6. **受験**\r\n\r\nよって、基本的に**教科書は2周、演習問題は1周**した。  \r\n（厳密には上記に加え、単位取得試験分が0.3周程度ある）\r\n\r\nUSCPA界隈では、**演習問題を何周もするのが良いという意見が多い**が（[たけぞう氏：8周](https://uscpa-self-investment.com/mondaishu_8shuu/)、[ecoslyme](https://ecoslyme.com/uscpa/uscpa-study-knowhow/)[氏](https://uscpa-self-investment.com/mondaishu_8shuu/)：～5周、[アビタス：3周](https://www.abitus.co.jp/column_voice/uscpa/column_voice60.html)）、私には**効率が悪く**感じられたため、基本的に**1周しかしなかった**。\r\n\r\nAICPA過去問や模試も、同様の理由で、ほぼやらなかった。\r\n\r\nその分、**教科書に書いてあることの本質を理解する**ため、**GoogleやGPT-4を用いた調査**に時間を使った。\r\n\r\n## 勉強時間\r\n\r\n**25時間/週を目標に勉強**した。\r\n\r\n週末は家族との時間に集中するため、基本的に**平日：5時間、週末：0時間**とした。\r\n\r\nただ、仕事の繁忙期や妻の第三子出産、連休、ChatGPTで遊ぶのが楽しすぎる等により、**波が結構あった**（2週間ほど一切勉強しない等）。\r\n\r\n科目別の勉強時間は以下のとおり。\r\n\r\n- **FAR：**370時間（49.4%）\r\n- **AUD：**100時間（13.3%）\r\n- **BEC：**118時間（15.7%）\r\n- **REG：**158時間（21.1%）\r\n- **英文会計：**3時間（0.4%）\r\n\r\n合計：749時間（100%）\r\n\r\nUS CPAは**「FARに合格すれば試験を半分終えたに等しい」**という言説をよく目にするが、自分に関する限り、そのとおりだった。\r\n\r\n## スコア\r\n\r\nUSCPAの各科目は、99点満点で75点取ると合格する。  \r\n科目別のスコアは以下のとおりだった。\r\n\r\n- **FAR：**82\r\n- **AUD：**86\r\n- **BEC：**94\r\n- **REG：**82\r\n\r\n## 事前知識\r\n\r\n簿記3級、国内MBA、IELTS 8.0を取得済み。  \r\n仕訳やファイナンスの基礎は理解しており、英語の長文もあまり苦労せずに読める状態で勉強を開始した。\r\n\r\n## 試験内容に関する印象\r\n\r\n意味のない暗記や、重箱の隅を突付くような問題は出題されず、**ストレートに本質を問うものばかり**出るので、**良い試験**だと感じた。\r\n\r\nまた、日本の資格試験によく見られる、答案の手書きを要求したり、試験日が年に一度しかない、といった**非合理性/非効率性がなく、**国民性の違いを感じた。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/how-to-pass-uscpa-in-750hours.md&quot;],&quot;digest&quot;:[0,&quot;e98e5e6a737eabc8&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;米国公認会計士（USCPA）試験に全科目合格&lt;/strong&gt;した。&lt;/p&gt;\n&lt;p&gt;100時間/月の勉強で、7ヶ月半（749時間）かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;予備校\&quot;&gt;予備校&lt;a class=\&quot;anchor\&quot; href=\&quot;#予備校\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;予備校は&lt;a href=\&quot;https://www.abitus.co.jp/uscpa/\&quot;&gt;アビタス&lt;/a&gt;。&lt;/p&gt;&lt;p&gt;当初は予備校を使わず市販の教材のみで受験する予定だったが、受験資格を得るのに米国大学の単位が必要だったため方針転換した。&lt;/p&gt;&lt;p&gt;カルフォルニア州立大学との提携により&lt;strong&gt;オンライン試験で単位を取得でき、その他諸々の評判が良い&lt;/strong&gt;アビタスを選んだ。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材\&quot;&gt;教材&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;アビタスのUS CPAコースは、以下のように様々な教材を提供しているが、時短のため、&lt;strong&gt;一部しか使わなかった&lt;/strong&gt;。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;講義動画：&lt;strong&gt;見ない&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;紙の教科書：&lt;strong&gt;見ない&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;紙の演習問題：&lt;strong&gt;見ない&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;教科書アプリ：使った&lt;/li&gt;\n&lt;li&gt;演習アプリ：使った&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;動画や紙の教材は、&lt;strong&gt;学習効率が悪いので&lt;/strong&gt;無視&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;アプリ教材&lt;/strong&gt;は、持ち運びが楽、場所を選ばずスキマ時間で学習可能、スクショを用いたまとめノート作成が簡単、タッチペンで手書きメモ可能、情報検索が高速、といった利点があり、&lt;strong&gt;効率的な学習&lt;/strong&gt;ができたように思う。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材以外の道具\&quot;&gt;教材以外の道具&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材以外の道具\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;iPhone、iPad、タブレットスタンド、iPhoneメモアプリ、Studyplus&lt;/strong&gt;を以下のように使った。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;iPhone&lt;/strong&gt;：演習アプリをやる&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;iPad&lt;/strong&gt;：教科書アプリを読む&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://www.amazon.co.jp/gp/product/B06XG7XJ8K/ref=ppx_yo_dt_b_search_asin_title?ie=UTF8&amp;#x26;psc=1\&quot;&gt;&lt;strong&gt;タブレットスタンド&lt;/strong&gt;&lt;/a&gt;：iPadを置く（意外に超重要）&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://www.amazon.co.jp/Apple-%E3%82%A2%E3%83%83%E3%83%97%E3%83%AB-MU8F2J-A-Pencil/dp/B07KR69HH9/ref=sr_1_4?crid=3U37M24GUBUJ0&amp;#x26;keywords=apple%E3%83%9A%E3%83%B3%E3%82%B7%E3%83%AB&amp;#x26;qid=1687249841&amp;#x26;s=computers&amp;#x26;sprefix=apple%E3%83%9A%E3%83%B3%E3%82%B7%E3%83%AB%2Ccomputers%2C181&amp;#x26;sr=1-4\&quot;&gt;&lt;strong&gt;タッチペン&lt;/strong&gt;&lt;/a&gt;：タブレット上でアプリ教科書に書き込む&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://support.apple.com/ja-jp/HT205773\&quot;&gt;&lt;strong&gt;メモアプリ&lt;/strong&gt;&lt;/a&gt;：まとめノートを作成&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://www.studyplus.jp/\&quot;&gt;&lt;strong&gt;Studyplus&lt;/strong&gt;&lt;/a&gt;：勉強時間を管理&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;あらゆる作業をスマホ/タブレットで気軽に実行可能にし&lt;/strong&gt;、効率性・継続性の維持に努めた。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勉強方法\&quot;&gt;勉強方法&lt;a class=\&quot;anchor\&quot; href=\&quot;#勉強方法\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;USCPA試験は4科目（FAR, AUD, BEC, REG）あるが、科目毎に以下のルーチンを実施した。&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;教科書を1周する&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;MC（多肢選択）問題を1周する&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;TBS（事例形式）問題を1周する&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;教科書をもう1周する&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;AICPA過去問と模試はやらない&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;受験&lt;/strong&gt;&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;よって、基本的に&lt;strong&gt;教科書は2周、演習問題は1周&lt;/strong&gt;した。&lt;br&gt;\n（厳密には上記に加え、単位取得試験分が0.3周程度ある）&lt;/p&gt;&lt;p&gt;USCPA界隈では、&lt;strong&gt;演習問題を何周もするのが良いという意見が多い&lt;/strong&gt;が（&lt;a href=\&quot;https://uscpa-self-investment.com/mondaishu_8shuu/\&quot;&gt;たけぞう氏：8周&lt;/a&gt;、&lt;a href=\&quot;https://ecoslyme.com/uscpa/uscpa-study-knowhow/\&quot;&gt;ecoslyme&lt;/a&gt;&lt;a href=\&quot;https://uscpa-self-investment.com/mondaishu_8shuu/\&quot;&gt;氏&lt;/a&gt;：～5周、&lt;a href=\&quot;https://www.abitus.co.jp/column_voice/uscpa/column_voice60.html\&quot;&gt;アビタス：3周&lt;/a&gt;）、私には&lt;strong&gt;効率が悪く&lt;/strong&gt;感じられたため、基本的に&lt;strong&gt;1周しかしなかった&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;AICPA過去問や模試も、同様の理由で、ほぼやらなかった。&lt;/p&gt;&lt;p&gt;その分、&lt;strong&gt;教科書に書いてあることの本質を理解する&lt;/strong&gt;ため、&lt;strong&gt;GoogleやGPT-4を用いた調査&lt;/strong&gt;に時間を使った。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勉強時間\&quot;&gt;勉強時間&lt;a class=\&quot;anchor\&quot; href=\&quot;#勉強時間\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;25時間/週を目標に勉強&lt;/strong&gt;した。&lt;/p&gt;&lt;p&gt;週末は家族との時間に集中するため、基本的に&lt;strong&gt;平日：5時間、週末：0時間&lt;/strong&gt;とした。&lt;/p&gt;&lt;p&gt;ただ、仕事の繁忙期や妻の第三子出産、連休、ChatGPTで遊ぶのが楽しすぎる等により、&lt;strong&gt;波が結構あった&lt;/strong&gt;（2週間ほど一切勉強しない等）。&lt;/p&gt;&lt;p&gt;科目別の勉強時間は以下のとおり。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;**FAR：**370時間（49.4%）&lt;/li&gt;\n&lt;li&gt;**AUD：**100時間（13.3%）&lt;/li&gt;\n&lt;li&gt;**BEC：**118時間（15.7%）&lt;/li&gt;\n&lt;li&gt;**REG：**158時間（21.1%）&lt;/li&gt;\n&lt;li&gt;**英文会計：**3時間（0.4%）&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;合計：749時間（100%）&lt;/p&gt;&lt;p&gt;US CPAは**「FARに合格すれば試験を半分終えたに等しい」**という言説をよく目にするが、自分に関する限り、そのとおりだった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;スコア\&quot;&gt;スコア&lt;a class=\&quot;anchor\&quot; href=\&quot;#スコア\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;USCPAの各科目は、99点満点で75点取ると合格する。&lt;br&gt;\n科目別のスコアは以下のとおりだった。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;**FAR：**82&lt;/li&gt;\n&lt;li&gt;**AUD：**86&lt;/li&gt;\n&lt;li&gt;**BEC：**94&lt;/li&gt;\n&lt;li&gt;**REG：**82&lt;/li&gt;\n&lt;/ul&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;事前知識\&quot;&gt;事前知識&lt;a class=\&quot;anchor\&quot; href=\&quot;#事前知識\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;簿記3級、国内MBA、IELTS 8.0を取得済み。&lt;br&gt;\n仕訳やファイナンスの基礎は理解しており、英語の長文もあまり苦労せずに読める状態で勉強を開始した。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;試験内容に関する印象\&quot;&gt;試験内容に関する印象&lt;a class=\&quot;anchor\&quot; href=\&quot;#試験内容に関する印象\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;意味のない暗記や、重箱の隅を突付くような問題は出題されず、&lt;strong&gt;ストレートに本質を問うものばかり&lt;/strong&gt;出るので、&lt;strong&gt;良い試験&lt;/strong&gt;だと感じた。&lt;/p&gt;&lt;p&gt;また、日本の資格試験によく見られる、答案の手書きを要求したり、試験日が年に一度しかない、といった**非合理性/非効率性がなく、**国民性の違いを感じた。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;予備校&quot;],&quot;text&quot;:[0,&quot;予備校#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材&quot;],&quot;text&quot;:[0,&quot;教材#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材以外の道具&quot;],&quot;text&quot;:[0,&quot;教材以外の道具#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強方法&quot;],&quot;
