pass-uscpa-in-750hours/\&quot;&gt;https://notes-of-thought.com/how-to-pass-uscpa-in-750hours/&lt;/a&gt;&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;スコア\&quot;&gt;&lt;strong&gt;スコア&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#スコア\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;CBT（computer based testing）なので、試験を終えるとすぐにスコアが画面に表示された。&lt;br&gt;\nスコアは&lt;strong&gt;83.9%&lt;strong&gt;であった（70%で合格&lt;/strong&gt;）&lt;/strong&gt;。&lt;br&gt;\n手応えよりも低かったが、合格ラインよりだいぶ上なので良しとする。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;受験の感想\&quot;&gt;受験の感想&lt;a class=\&quot;anchor\&quot; href=\&quot;#受験の感想\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;私は株式投資をしているが、制度信用の仕組みなど雑な理解で済ませていた部分が多くあり、これらがクリアになって良かった。&lt;br&gt;\nまた、非常に楽しく学習できたので、私は&lt;strong&gt;金融商品に纏わる事象に興味が湧くタチ&lt;/strong&gt;であることが確認できた。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;学習サービス&quot;],&quot;text&quot;:[0,&quot;学習サービス#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材&quot;],&quot;text&quot;:[0,&quot;教材#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材以外の道具&quot;],&quot;text&quot;:[0,&quot;教材以外の道具#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強方法&quot;],&quot;text&quot;:[0,&quot;勉強方法#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強時間&quot;],&quot;text&quot;:[0,&quot;勉強時間#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;試験&quot;],&quot;text&quot;:[0,&quot;試験#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;スコア&quot;],&quot;text&quot;:[0,&quot;スコア#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;受験の感想&quot;],&quot;text&quot;:[0,&quot;受験の感想#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;証券外務員試験合格体験記（10日間/33時間）&quot;],&quot;slug&quot;:[0,&quot;securities-sales-representatives-exam-passed&quot;],&quot;published&quot;:[3,&quot;2024-04-23T10:20:25.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/04/securities-sales-representatives-exam-passed.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,5],&quot;words&quot;:[0,903],&quot;excerpt&quot;:[0,&quot;証券外務員試験に合格した。 **33時間（10日間）**かかった。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;securities-sales-representatives-exam-passed&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;monetary-and-social-value-correlation-too-low-2.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;金銭価値と社会価値の相関が下がり過ぎではないか？（後編）&quot;],&quot;published&quot;:[3,&quot;2024-02-21T06:51:53.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/monetary-and-social-value-correlation-too-low.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;NPO法人会計の全容を軽く理解するのは意外に簡単だった&quot;],&quot;prevSlug&quot;:[0,&quot;npo_accounting_easier_than_imagined&quot;],&quot;nextTitle&quot;:[0,&quot;証券外務員試験合格体験記（10日間/33時間）&quot;],&quot;nextSlug&quot;:[0,&quot;securities-sales-representatives-exam-passed&quot;],&quot;editorId&quot;:[0,&quot;monetary-and-social-value-correlation-too-low-2&quot;]}],&quot;body&quot;:[0,&quot;[前記事](/monetary-and-social-value-correlation-too-low/)では、社会価値を測る尺度として、**金銭価値は役に立たない**ことを論じた。  \r\nそれにも関わらず、金銭価値を生み出した者を尊ぶ潮流が強まっている。  \r\n本記事では、その理由を考えてみたい。\r\n\r\n## 金銭価値と社会価値、乖離の原因\r\n\r\n金銭価値と社会価値は、何故ここまで乖離したのか？  \r\n大きな要因として、以下が考えられる：\r\n\r\n1. 金銭価値は利潤で決まる\r\n2. 利潤は、大きな市場を独占すると、最大化される\r\n3. 社会的に重要な領域における独占は、厳しく制限される\r\n4. 社会的に重要でない領域における独占は、相対的に許容される\r\n5. そのため、**規模は大きいが社会的重要度が低い市場を独占**すると、金銭価値が最も高くなる\r\n6. 結果として、社会価値と金銭価値が乖離する\r\n\r\n考えてみれば**シンプル**な話である。\r\n\r\n実際、仮に、電力会社の独占が許容されるとしよう。  \r\nそうすると、需要曲線の非弾力性により、**Meta社を遥かに凌ぐ、巨大な金銭価値**が生み出されるはずである。\r\n\r\n例えば、20世紀初頭の石油市場を独占していた、**スタンダード・オイル**。  \r\nこの企業は、米国上場企業の全時価総額のうち、6%を占めていた（[参照](https://www.investmentoffice.com/Observations/Markets_in_History/The_First_Billion-Dollar_Company.html)）。  \r\n現代で言えば**450兆円**で**、Metaの3倍**である。\r\n\r\nしかし、電力や石油等の生活インフラ市場において、無邪気に独占を認めるわけにはいかない。  \r\n初等ミクロ経済学の帰結として、独占は、価格操作や供給抑制を通じて、**社会的厚生が低下**する。  \r\nそうした観点から、**独占は厳しく制限**されるようになり、スタンダード・オイルも解体された。\r\n\r\n一方でMeta社は、価格（広告単価）を釣り上げたり、供給（広告枠）を絞ったところで、市民にとって死活問題となるほどの影響はない。  \r\nそもそも、無料C2Cプラットフォームというビジネスモデルの特性上、市民が直接、独占の弊害を受けることがない。  \r\nそのため、現行の反トラスト法の根幹を成している**消費者厚生基準**の観点からは、**明確な弊害を示すのが困難**であった。  \r\n結果として、同様のビジネスモデルを持つweb系企業は、独禁法を厳しく**適用されてこなかった**。\r\n\r\n## 金銭価値と社会価値は、むしろ逆相関\r\n\r\nMeta社の創業期に投資したピーター・ティール氏は、著書[Zero to One](https://www.amazon.co.jp/%E3%82%BC%E3%83%AD%E3%83%BB%E3%83%88%E3%82%A5%E3%83%BB%E3%83%AF%E3%83%B3-%E5%90%9B%E3%81%AF%E3%82%BC%E3%83%AD%E3%81%8B%E3%82%89%E4%BD%95%E3%82%92%E7%94%9F%E3%81%BF%E5%87%BA%E3%81%9B%E3%82%8B%E3%81%8B-%E3%83%94%E3%83%BC%E3%82%BF%E3%83%BC%E3%83%BB%E3%83%86%E3%82%A3%E3%83%BC%E3%83%AB-ebook/dp/B00NQ3QONK/ref=sr_1_1?crid=11ADFP6FZR41D&amp;dib=eyJ2IjoiMSJ9.sKbwMQsKwTXO1rQHfPus18l-mXveXy_gT31Avse2-76cnU9KEPMUNfruN6NP4alfFM9JVAb3zVamw8Es6ePgm3y3n3vOQLpSO6V-igM_Ep1V1YldpDICmhtP6J-bKhFUKvamrr__ASWHksQ-SsptzNNiF2dMdplMAFnXwDt1xtW1rADGBuBzuB92nf-CUGN8eW5m2PHRMDPMvTEve7BvT4-1cggy2jN1LFPMN-4aKCA.N-WBxOVjpAZ12TcOzXBNb_sLwGb3hiX20pm7xuNcGHo&amp;dib_tag=se&amp;keywords=%E3%82%BC%E3%83%AD%E3%83%88%E3%82%A5%E3%83%AF%E3%83%B3&amp;qid=1708350698&amp;s=english-books&amp;sprefix=%E3%82%BC%E3%83%AD%E3%83%88%E3%82%A5%E3%83%AF%E3%83%B3%2Cenglish-books%2C155&amp;sr=1-1-catcorr)で、以下のように論じている：\r\n\r\n「企業を成功に導く最良の方法は、**独禁法を回避しつつ市場を独占する**ことである」\r\n\r\nMeta社は、正にこれを実践したと言えよう。\r\n\r\n規制を回避する方法としてZero to Oneが紹介していたのは、実態よりも市場を広く捉えるよう規制当局を説得し、計算される市場占有率を低く抑えることであった。  \r\nしかし、それよりも本質的かつ効果的なのは、**そもそも事業の社会意義が低く、規制当局が気に留めない**ことである。\r\n\r\n## 社会価値と金銭価値の一致性を取り戻すには\r\n\r\nさて、この問題を解決するには、どうすれば良いか？\r\n\r\n**消費者厚生基準より包括的な観点から、独禁法/反トラスト法を捉え直す**ことである。\r\n\r\nこれは[新ブランダイス主義](https://www.rieti.go.jp/jp/publications/nts/23j001.html)という形で、既に米国で運用が始まっている。  \r\nMeta社やグーグル等の米国テック企業は今、反トラスト法違反として、連邦取引委員会から訴訟を起こされるようになった。  \r\n（後日追記：[2024年8月、グーグルが反トラスト法違反の訴訟で敗訴](https://www.jetro.go.jp/biznews/2024/08/b6ce97e5730dfab6.html)）\r\n\r\n今後、別の記事シリーズで、本問題を扱っていきたい。  \r\n  \r\n（後日追記：記事シリースで、本稿のテーマに留まらず、民主政や新自由主義全般を取り扱い、その中で、ブランダイス主義も取り上げた）\r\n\r\nhttps://notes-of-thought.com/democratization-intellectualism-stupidity-1/\r\n\r\nhttps://notes-of-thought.com/democratization-intellectualism-stupidity-2/\r\n\r\nhttps://notes-of-thought.com/democratization-intellectualism-stupidity-3/&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/monetary-and-social-value-correlation-too-low-2.md&quot;],&quot;digest&quot;:[0,&quot;3f89cad170fe178f&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;/monetary-and-social-value-correlation-too-low/\&quot;&gt;前記事&lt;/a&gt;では、社会価値を測る尺度として、&lt;strong&gt;金銭価値は役に立たない&lt;/strong&gt;ことを論じた。&lt;br&gt;\nそれにも関わらず、金銭価値を生み出した者を尊ぶ潮流が強まっている。&lt;br&gt;\n本記事では、その理由を考えてみたい。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;金銭価値と社会価値乖離の原因\&quot;&gt;金銭価値と社会価値、乖離の原因&lt;a class=\&quot;anchor\&quot; href=\&quot;#金銭価値と社会価値乖離の原因\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;金銭価値と社会価値は、何故ここまで乖離したのか？&lt;br&gt;\n大きな要因として、以下が考えられる：&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;金銭価値は利潤で決まる&lt;/li&gt;\n&lt;li&gt;利潤は、大きな市場を独占すると、最大化される&lt;/li&gt;\n&lt;li&gt;社会的に重要な領域における独占は、厳しく制限される&lt;/li&gt;\n&lt;li&gt;社会的に重要でない領域における独占は、相対的に許容される&lt;/li&gt;\n&lt;li&gt;そのため、&lt;strong&gt;規模は大きいが社会的重要度が低い市場を独占&lt;/strong&gt;すると、金銭価値が最も高くなる&lt;/li&gt;\n&lt;li&gt;結果として、社会価値と金銭価値が乖離する&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;考えてみれば&lt;strong&gt;シンプル&lt;/strong&gt;な話である。&lt;/p&gt;&lt;p&gt;実際、仮に、電力会社の独占が許容されるとしよう。&lt;br&gt;\nそうすると、需要曲線の非弾力性により、&lt;strong&gt;Meta社を遥かに凌ぐ、巨大な金銭価値&lt;/strong&gt;が生み出されるはずである。&lt;/p&gt;&lt;p&gt;例えば、20世紀初頭の石油市場を独占していた、&lt;strong&gt;スタンダード・オイル&lt;/strong&gt;。&lt;br&gt;\nこの企業は、米国上場企業の全時価総額のうち、6%を占めていた（&lt;a href=\&quot;https://www.investmentoffice.com/Observations/Markets_in_History/The_First_Billion-Dollar_Company.html\&quot;&gt;参照&lt;/a&gt;）。&lt;br&gt;\n現代で言えば&lt;strong&gt;450兆円&lt;/strong&gt;で**、Metaの3倍**である。&lt;/p&gt;&lt;p&gt;しかし、電力や石油等の生活インフラ市場において、無邪気に独占を認めるわけにはいかない。&lt;br&gt;\n初等ミクロ経済学の帰結として、独占は、価格操作や供給抑制を通じて、&lt;strong&gt;社会的厚生が低下&lt;/strong&gt;する。&lt;br&gt;\nそうした観点から、&lt;strong&gt;独占は厳しく制限&lt;/strong&gt;されるようになり、スタンダード・オイルも解体された。&lt;/p&gt;&lt;p&gt;一方でMeta社は、価格（広告単価）を釣り上げたり、供給（広告枠）を絞ったところで、市民にとって死活問題となるほどの影響はない。&lt;br&gt;\nそもそも、無料C2Cプラットフォームというビジネスモデルの特性上、市民が直接、独占の弊害を受けることがない。&lt;br&gt;\nそのため、現行の反トラスト法の根幹を成している&lt;strong&gt;消費者厚生基準&lt;/strong&gt;の観点からは、&lt;strong&gt;明確な弊害を示すのが困難&lt;/strong&gt;であった。&lt;br&gt;\n結果として、同様のビジネスモデルを持つweb系企業は、独禁法を厳しく&lt;strong&gt;適用されてこなかった&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;金銭価値と社会価値はむしろ逆相関\&quot;&gt;金銭価値と社会価値は、むしろ逆相関&lt;a class=\&quot;anchor\&quot; href=\&quot;#金銭価値と社会価値はむしろ逆相関\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;Meta社の創業期に投資したピーター・ティール氏は、著書&lt;a href=\&quot;https://www.amazon.co.jp/%E3%82%BC%E3%83%AD%E3%83%BB%E3%83%88%E3%82%A5%E3%83%BB%E3%83%AF%E3%83%B3-%E5%90%9B%E3%81%AF%E3%82%BC%E3%83%AD%E3%81%8B%E3%82%89%E4%BD%95%E3%82%92%E7%94%9F%E3%81%BF%E5%87%BA%E3%81%9B%E3%82%8B%E3%81%8B-%E3%83%94%E3%83%BC%E3%82%BF%E3%83%BC%E3%83%BB%E3%83%86%E3%82%A3%E3%83%BC%E3%83%AB-ebook/dp/B00NQ3QONK/ref=sr_1_1?crid=11ADFP6FZR41D&amp;#x26;dib=eyJ2IjoiMSJ9.sKbwMQsKwTXO1rQHfPus18l-mXveXy_gT31Avse2-76cnU9KEPMUNfruN6NP4alfFM9JVAb3zVamw8Es6ePgm3y3n3vOQLpSO6V-igM_Ep1V1YldpDICmhtP6J-bKhFUKvamrr__ASWHksQ-SsptzNNiF2dMdplMAFnXwDt1xtW1rADGBuBzuB92nf-CUGN8eW5m2PHRMDPMvTEve7BvT4-1cggy2jN1LFPMN-4aKCA.N-WBxOVjpAZ12TcOzXBNb_sLwGb3hiX20pm7xuNcGHo&amp;#x26;dib_tag=se&amp;#x26;keywords=%E3%82%BC%E3%83%AD%E3%83%88%E3%82%A5%E3%83%AF%E3%83%B3&amp;#x26;qid=1708350698&amp;#x26;s=english-books&amp;#x26;sprefix=%E3%82%BC%E3%83%AD%E3%83%88%E3%82%A5%E3%83%AF%E3%83%B3%2Cenglish-books%2C155&amp;#x26;sr=1-1-catcorr\&quot;&gt;Zero to One&lt;/a&gt;で、以下のように論じている：&lt;/p&gt;&lt;p&gt;「企業を成功に導く最良の方法は、&lt;strong&gt;独禁法を回避しつつ市場を独占する&lt;/strong&gt;ことである」&lt;/p&gt;&lt;p&gt;Meta社は、正にこれを実践したと言えよう。&lt;/p&gt;&lt;p&gt;規制を回避する方法としてZero to Oneが紹介していたのは、実態よりも市場を広く捉えるよう規制当局を説得し、計算される市場占有率を低く抑えることであった。&lt;br&gt;\nしかし、それよりも本質的かつ効果的なのは、&lt;strong&gt;そもそも事業の社会意義が低く、規制当局が気に留めない&lt;/strong&gt;ことである。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;社会価値と金銭価値の一致性を取り戻すには\&quot;&gt;社会価値と金銭価値の一致性を取り戻すには&lt;a class=\&quot;anchor\&quot; href=\&quot;#社会価値と金銭価値の一致性を取り戻すには\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;さて、この問題を解決するには、どうすれば良いか？&lt;/p&gt;&lt;p&gt;&lt;strong&gt;消費者厚生基準より包括的な観点から、独禁法/反トラスト法を捉え直す&lt;/strong&gt;ことである。&lt;/p&gt;&lt;p&gt;これは&lt;a href=\&quot;https://www.rieti.go.jp/jp/publications/nts/23j001.html\&quot;&gt;新ブランダイス主義&lt;/a&gt;という形で、既に米国で運用が始まっている。&lt;br&gt;\nMeta社やグーグル等の米国テック企業は今、反トラスト法違反として、連邦取引委員会から訴訟を起こされるようになった。&lt;br&gt;\n（後日追記：&lt;a href=\&quot;https://www.jetro.go.jp/biznews/2024/08/b6ce97e5730dfab6.html\&quot;&gt;2024年8月、グーグルが反トラスト法違反の訴訟で敗訴&lt;/a&gt;）&lt;/p&gt;&lt;p&gt;今後、別の記事シリーズで、本問題を扱っていきたい。&lt;/p&gt;&lt;p&gt;（後日追記：記事シリースで、本稿のテーマに留まらず、民主政や新自由主義全般を取り扱い、その中で、ブランダイス主義も取り上げた）&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/democratization-intellectualism-stupidity-1/\&quot;&gt;https://notes-of-thought.com/democratization-intellectualism-stupidity-1/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/democratization-intellectualism-stupidity-2/\&quot;&gt;https://notes-of-thought.com/democratization-intellectualism-stupidity-2/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/democratization-intellectualism-stupidity-3/\&quot;&gt;https://notes-of-thought.com/democratization-intellectualism-stupidity-3/&lt;/a&gt;&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;金銭価値と社会価値乖離の原因&quot;],&quot;text&quot;:[0,&quot;金銭価値と社会価値、乖離の原因#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;金銭価値と社会価値はむしろ逆相関&quot;],&quot;text&quot;:[0,&quot;金銭価値と社会価値は、むしろ逆相関#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;社会価値と金銭価値の一致性を取り戻すには&quot;],&quot;text&quot;:[0,&quot;社会価値と金銭価値の一致性を取り戻すには#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;金銭価値と社会価値の相関が下がり過ぎではないか？（後編）&quot;],&quot;slug&quot;:[0,&quot;monetary-and-social-value-correlation-too-low-2&quot;],&quot;published&quot;:[3,&quot;2024-02-21T06:51:53.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/monetary-and-social-value-correlation-too-low.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,6],&quot;words&quot;:[0,1140],&quot;excerpt&quot;:[0,&quot;前記事では、社会価値を測る尺度として、金銭価値は役に立たないことを論じた。 それにも関わらず、金銭価値を生み出した者を尊ぶ潮流が強まっている。 本記事では、その理由を考えてみたい。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;monetary-and-social-value-correlation-too-low-2&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;npo_accounting_easier_than_imagined.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;NPO法人会計の全容を軽く理解するのは意外に簡単だった&quot;],&quot;published&quot;:[3,&quot;2024-02-21T06:30:17.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/npo_accounting_easier_than_imagined.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;MIXI F2024 3Q 決算説明資料に不穏な文言&quot;],&quot;prevSlug&quot;:[0,&quot;mixi-f2024-3q-ominous-warning&quot;],&quot;nextTitle&quot;:[0,&quot;金銭価値と社会価値の相関が下がり過ぎではないか？（後編）&quot;],&quot;nextSlug&quot;:[0,&quot;monetary-and-social-value-correlation-too-low-2&quot;],&quot;editorId&quot;:[0,&quot;npo_accounting_easier_than_imagined&quot;]}],&quot;body&quot;:[0,&quot;NPO法人会計基準は非常に短く、3539文字しかない（文庫本6ページ弱）：\r\n\r\nhttps://www.npokaikeikijun.jp/about_npocas_top/about_npocas/\r\n\r\n企業会計で言えば、会計基準というより、[会計原則](https://ja.wikibooks.org/wiki/%E4%BC%81%E6%A5%AD%E4%BC%9A%E8%A8%88%E5%8E%9F%E5%89%87)のボリューム。  \r\n事業の区分表示や寄付金/助成金等の扱い以外は、特に企業会計と変わらない（※税務は未調査）。\r\n\r\n全容を把握するには、上記リンク先を読んだ上で、捕捉的に以下の本を斜め読み（または辞書として保有）すれば十分と思われる。\r\n\r\n![](/wp-content/uploads/2024/02/image-12.png)\r\n\r\n[Amazon NPO法人会計基準](https://www.amazon.co.jp/NPO%E6%B3%95%E4%BA%BA%E4%BC%9A%E8%A8%88%E5%9F%BA%E6%BA%96-%E5%AE%8C%E5%85%A8%E5%8F%8E%E9%8C%B2%E7%89%88-%E7%AC%AC3%E7%89%88-NPO%E6%B3%95%E4%BA%BA%E4%BC%9A%E8%A8%88%E5%9F%BA%E6%BA%96%E5%8D%94%E8%AD%B0%E4%BC%9A/dp/4909269029)&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/npo_accounting_easier_than_imagined.md&quot;],&quot;digest&quot;:[0,&quot;21209449138f28a3&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;NPO法人会計基準は非常に短く、3539文字しかない（文庫本6ページ弱）：&lt;/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https://www.npokaikeikijun.jp/about_npocas_top/about_npocas/\&quot;&gt;https://www.npokaikeikijun.jp/about_npocas_top/about_npocas/&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;企業会計で言えば、会計基準というより、&lt;a href=\&quot;https://ja.wikibooks.org/wiki/%E4%BC%81%E6%A5%AD%E4%BC%9A%E8%A8%88%E5%8E%9F%E5%89%87\&quot;&gt;会計原則&lt;/a&gt;のボリューム。&lt;br&gt;\n事業の区分表示や寄付金/助成金等の扱い以外は、特に企業会計と変わらない（※税務は未調査）。&lt;/p&gt;\n&lt;p&gt;全容を把握するには、上記リンク先を読んだ上で、捕捉的に以下の本を斜め読み（または辞書として保有）すれば十分と思われる。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-12.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https://www.amazon.co.jp/NPO%E6%B3%95%E4%BA%BA%E4%BC%9A%E8%A8%88%E5%9F%BA%E6%BA%96-%E5%AE%8C%E5%85%A8%E5%8F%8E%E9%8C%B2%E7%89%88-%E7%AC%AC3%E7%89%88-NPO%E6%B3%95%E4%BA%BA%E4%BC%9A%E8%A8%88%E5%9F%BA%E6%BA%96%E5%8D%94%E8%AD%B0%E4%BC%9A/dp/4909269029\&quot;&gt;Amazon NPO法人会計基準&lt;/a&gt;&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;NPO法人会計の全容を軽く理解するのは意外に簡単だった&quot;],&quot;slug&quot;:[0,&quot;npo_accounting_easier_than_imagined&quot;],&quot;published&quot;:[3,&quot;2024-02-21T06:30:17.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/npo_accounting_easier_than_imagined.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,1],&quot;words&quot;:[0,149],&quot;excerpt&quot;:[0,&quot;NPO法人会計基準は非常に短く、3539文字しかない（文庫本6ページ弱）：&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;npo_accounting_easier_than_imagined&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;mixi-f2024-3q-ominous-warning.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;MIXI F2024 3Q 決算説明資料に不穏な文言&quot;],&quot;published&quot;:[3,&quot;2024-02-09T08:23:19.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/mixi-f2024-3q-ominous-warning.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;JT株は買いか？たばこ産業の「邪悪性」を乗り越えて&quot;],&quot;prevSlug&quot;:[0,&quot;is-jt-a-buy&quot;],&quot;nextTitle&quot;:[0,&quot;NPO法人会計の全容を軽く理解するのは意外に簡単だった&quot;],&quot;nextSlug&quot;:[0,&quot;npo_accounting_easier_than_imagined&quot;],&quot;editorId&quot;:[0,&quot;mixi-f2024-3q-ominous-warning&quot;]}],&quot;body&quot;:[0,&quot;![](/wp-content/uploads/2024/02/image-11.png)\r\n\r\n[MIXI F2024 3Q 決算説明資料 p.3](https://pdf.irpocket.com/C2121/KKjE/Ot9b/ccnt.pdf)\r\n\r\n1) What&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/mixi-f2024-3q-ominous-warning.md&quot;],&quot;digest&quot;:[0,&quot;630d15c20779fdfd&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-11.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https://pdf.irpocket.com/C2121/KKjE/Ot9b/ccnt.pdf\&quot;&gt;MIXI F2024 3Q 決算説明資料 p.3&lt;/a&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;What&lt;/li&gt;\n&lt;/ol&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;MIXI F2024 3Q 決算説明資料に不穏な文言&quot;],&quot;slug&quot;:[0,&quot;mixi-f2024-3q-ominous-warning&quot;],&quot;published&quot;:[3,&quot;2024-02-09T08:23:19.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/mixi-f2024-3q-ominous-warning.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,1],&quot;words&quot;:[0,10],&quot;excerpt&quot;:[0,&quot;MIXI F2024 3Q 決算説明資料 p.3&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;mixi-f2024-3q-ominous-warning&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;is-jt-a-buy.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;JT株は買いか？たばこ産業の「邪悪性」を乗り越えて&quot;],&quot;published&quot;:[3,&quot;2024-02-02T12:25:36.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/is-jt-a-buy.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;電力会社の売上に季節性はあるか？&quot;],&quot;prevSlug&quot;:[0,&quot;utility-companies-revenue-seasonality&quot;],&quot;nextTitle&quot;:[0,&quot;MIXI F2024 3Q 決算説明資料に不穏な文言&quot;],&quot;nextSlug&quot;:[0,&quot;mixi-f2024-3q-ominous-warning&quot;],&quot;editorId&quot;:[0,&quot;is-jt-a-buy&quot;]}],&quot;body&quot;:[0,&quot;配当利回りが4.9%と高いJT株の購入を検討している（2024年2月現在）。  \r\nタバコ産業は世界的に縮小傾向で、**中長期保有に向かないのでは？**と思ったが、具体的な数字が思い浮かばなかったのため、調査した。\r\n\r\n\r\n\r\n## 市場トレンド\r\n\r\nまず「産業が世界的に縮小傾向」というのは間違いで、**市場は拡大**しており、その傾向は今後も続くとの予測。今後5年間の予想CAGRは[こちら](https://www.mordorintelligence.com/ja/industry-reports/global-tobacco-market-industry)によると3.75%。\r\n\r\n[![](/wp-content/uploads/2024/02/image-1-1024x635.png)](/wp-content/uploads/2024/02/image-1.png)\r\n\r\nソース：&lt;https://www.statista.com/outlook/cmo/tobacco-products/cigarettes/worldwide#revenue&gt;\r\n\r\nとなると、世界的に**喫煙率は上がっている**のだろうか？\r\n\r\n[![](/wp-content/uploads/2024/02/image-3.png)](/wp-content/uploads/2024/02/image-3.png)\r\n\r\nソース：&lt;https://www.afpbb.com/articles/-/3466068&gt;\r\n\r\nそんなことはなく、**世界中で下がっている**。\r\n\r\nでは、**単価が上昇**しているのか？\r\n\r\n[![](/wp-content/uploads/2024/02/image-4.png)](/wp-content/uploads/2024/02/image-4.png)\r\n\r\nソース：https://assets.tobaccofreekids.org/global/pdfs/en/Global_Cigarette_Industry_pdf.pdf\r\n\r\n**そのようである**。  \r\n2006年から2020年で、販売数は3.5%減に対し市場規模は24.3%増なので、**単価は28.8%増加**している。\r\n\r\n**単価上昇の原因**は何か？  \r\nすぐに思い浮かぶのは**たばこ税**である。\r\n\r\n[![](/wp-content/uploads/2024/02/image-5.png)](/wp-content/uploads/2024/02/image-5.png)\r\n\r\nソース：https://news.yahoo.co.jp/expert/articles/55335a7d20426c920ada2eeb7d7ede99eb46abd6\r\n\r\n日本のデータを見ると、30年で販売数は半減したにもかかわらず、税収が増えている。つまり**税負担額は2倍以上**になっている。  \r\n尚、スパンを40年に広上げると、**税負担はなんと15倍**になっているらしい。\r\n\r\n[![](/wp-content/uploads/2024/02/image-6.png)](/wp-content/uploads/2024/02/image-6.png)\r\n\r\nソース：&lt;https://gentosha-go.com/articles/-/45824&gt;\r\n\r\n結果として、日本の**たばこは価格の61.7%が税金**である。\r\n\r\n[![](/wp-content/uploads/2024/02/image-8.png)](/wp-content/uploads/2024/02/image-8.png)\r\n\r\nソース：&lt;https://www.jti.co.jp/tobacco/knowledge/tax/index.html&gt;\r\n\r\n他国も同様の状況にある場合、**世界市場の成長**は主に**税金及びこれに伴う便乗値上げ**によるものと思って良さそうである。  \r\n（精緻な分析は各国の税制や会計基準等が絡み複雑なため未実施）\r\n\r\n## JT株 中長期保有の是非\r\n\r\n以上の分析から、以下がわかった\r\n\r\n- 世界以上は**拡大傾向**\r\n- ただし**喫煙率/販売本数は大幅に低下**\r\n- 市場拡大は**販売本数の減少を単価上昇が上回った**結果\r\n- 単価上昇の主要因は**タバコ増税**\r\n\r\nすると、タバコというプロダクトは、\r\n\r\n「**世界中で国家が積極的にユーザー数を減らす努力をし、それでも残ったユーザーからは国家権力により限界まで金を毟り取る**」\r\n\r\n商材ということである。\r\n\r\nどう考えても**サステイナブルではない**。  \r\n従って基本的に長期保有には向かない。\r\n\r\n但し、「残存ユーザーから毟り取る金額の増加がユーザ数減少と釣り合っている」限りは、配当利回り5%という**甘い汁を吸えるおいしい銘柄**ではある（今の株価水準が維持される限り）。以下に書く**産業の「邪悪さ」に目を瞑る**のであれば。\r\n\r\n## タバコ産業の「邪悪さ」と株式投資\r\n\r\nいまさら論じるまでもないが、タバコは**依存性があり**、**健康に悪い**。\r\n\r\nしかも、喫煙率は社会階層と逆相関であり、**社会階層が低いほど喫煙率が高い**。\r\n\r\n![](/wp-content/uploads/2024/02/image-9-1024x657.png)\r\n\r\nソース：https://www.m.u-tokyo.ac.jp/news/admin/release_20200627.pdf\r\n\r\n言うまでもないが、**社会階層**は**教育水準/知能指数や所得と正の相関**がある。  \r\n従って**喫煙率が高いほど、教育水準/知能指数や所得が低い**。\r\n\r\nまた日本は受動喫煙問題を解決すべく屋内を原則禁煙とした上、一部の自治体では屋外も原則禁煙であるため、喫煙者は極めて限られた**狭い隔離空間で喫煙**している。\r\n\r\nこれらをまとめて表現すると、  \r\n「**知能指数や所得水準が低い人々**を**狭い空間に隔離**し**依存性のある有害物質を与える**ことで、**国家権力**を盾に**税金として金を毟り取り**、株式投資する資産を持ち自らは有害物質を消費しない**知能指数や所得水準が高い人々**に、**配当の形で分配**する」  \r\n産業ということである。\r\n\r\nつまり、「**知能指数/所得が低い人々に有害物質を与え、知能指数/所得が高い人々に所得を移転する装置**」である。\r\n\r\n価値観によるだろうが、個人的には**極めて邪悪**に感じられる。このような邪悪な営みの株価を支えるような行為をするのは如何なものか。\r\n\r\nしかし、**社会的意義と金銭価値が極めて乖離**している昨今の新自由主義社会において、儲かるビジネスの多くは上記の構造を持っている。\r\n\r\nソシャゲもSNSも、「**知能および所得水準が低い人々に依存性のある有害物を与える**ことで、**時間と金**（広告経由）**を毟り取り**、株式投資する資産を持ち自らは有害物をあまり消費しない**知能及び所得水準が高い人々**に、**キャピタルゲインの形で分配**する」産業である。\r\n\r\n現在の**グローバル経済社会はそのような構造**をしている。\r\n\r\nそのような社会で、そうした邪悪な営みに直接従事せずで済むよう経済的独立性を勝ち取るには、邪悪な営みに零細株主として関節的に関わるのを許容し、株式投資の形で金を稼がざるをえないのである。\r\n\r\n従って私は**、JT株を買う！！**  \r\n（追記：買ってから1週間ほどで売った。リターン+2.3%）\r\n\r\n（尚、社会価値と金銭価値の乖離に関する記事はこちら：[金銭価値と社会価値の相関が下がり過ぎではないか（前編）？](/monetary-and-social-value-correlation-too-low/)）&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/is-jt-a-buy.md&quot;],&quot;digest&quot;:[0,&quot;49075d9608481943&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;配当利回りが4.9%と高いJT株の購入を検討している（2024年2月現在）。&lt;br&gt;\nタバコ産業は世界的に縮小傾向で、**中長期保有に向かないのでは？**と思ったが、具体的な数字が思い浮かばなかったのため、調査した。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;市場トレンド\&quot;&gt;市場トレンド&lt;a class=\&quot;anchor\&quot; href=\&quot;#市場トレンド\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;まず「産業が世界的に縮小傾向」というのは間違いで、&lt;strong&gt;市場は拡大&lt;/strong&gt;しており、その傾向は今後も続くとの予測。今後5年間の予想CAGRは&lt;a href=\&quot;https://www.mordorintelligence.com/ja/industry-reports/global-tobacco-market-industry\&quot;&gt;こちら&lt;/a&gt;によると3.75%。&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;/wp-content/uploads/2024/02/image-1.png\&quot;&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-1-1024x635.png\&quot; alt=\&quot;\&quot;&gt;&lt;/a&gt;&lt;/p&gt;&lt;p&gt;ソース：&lt;a href=\&quot;https://www.statista.com/outlook/cmo/tobacco-products/cigarettes/worldwide#revenue\&quot;&gt;https://www.statista.com/outlook/cmo/tobacco-products/cigarettes/worldwide#revenue&lt;/a&gt;&lt;/p&gt;&lt;p&gt;となると、世界的に&lt;strong&gt;喫煙率は上がっている&lt;/strong&gt;のだろうか？&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;/wp-content/uploads/2024/02/image-3.png\&quot;&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-3.png\&quot; alt=\&quot;\&quot;&gt;&lt;/a&gt;&lt;/p&gt;&lt;p&gt;ソース：&lt;a href=\&quot;https://www.afpbb.com/articles/-/3466068\&quot;&gt;https://www.afpbb.com/articles/-/3466068&lt;/a&gt;&lt;/p&gt;&lt;p&gt;そんなことはなく、&lt;strong&gt;世界中で下がっている&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;では、&lt;strong&gt;単価が上昇&lt;/strong&gt;しているのか？&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;/wp-content/uploads/2024/02/image-4.png\&quot;&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-4.png\&quot; alt=\&quot;\&quot;&gt;&lt;/a&gt;&lt;/p&gt;&lt;p&gt;ソース：&lt;a href=\&quot;https://assets.tobaccofreekids.org/global/pdfs/en/Global_Cigarette_Industry_pdf.pdf\&quot;&gt;https://assets.tobaccofreekids.org/global/pdfs/en/Global_Cigarette_Industry_pdf.pdf&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;そのようである&lt;/strong&gt;。&lt;br&gt;\n2006年から2020年で、販売数は3.5%減に対し市場規模は24.3%増なので、&lt;strong&gt;単価は28.8%増加&lt;/strong&gt;している。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;単価上昇の原因&lt;/strong&gt;は何か？&lt;br&gt;\nすぐに思い浮かぶのは&lt;strong&gt;たばこ税&lt;/strong&gt;である。&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;/wp-content/uploads/2024/02/image-5.png\&quot;&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-5.png\&quot; alt=\&quot;\&quot;&gt;&lt;/a&gt;&lt;/p&gt;&lt;p&gt;ソース：&lt;a href=\&quot;https://news.yahoo.co.jp/expert/articles/55335a7d20426c920ada2eeb7d7ede99eb46abd6\&quot;&gt;https://news.yahoo.co.jp/expert/articles/55335a7d20426c920ada2eeb7d7ede99eb46abd6&lt;/a&gt;&lt;/p&gt;&lt;p&gt;日本のデータを見ると、30年で販売数は半減したにもかかわらず、税収が増えている。つまり&lt;strong&gt;税負担額は2倍以上&lt;/strong&gt;になっている。&lt;br&gt;\n尚、スパンを40年に広上げると、&lt;strong&gt;税負担はなんと15倍&lt;/strong&gt;になっているらしい。&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;/wp-content/uploads/2024/02/image-6.png\&quot;&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-6.png\&quot; alt=\&quot;\&quot;&gt;&lt;/a&gt;&lt;/p&gt;&lt;p&gt;ソース：&lt;a href=\&quot;https://gentosha-go.com/articles/-/45824\&quot;&gt;https:// じるまでもないが、タバコは&lt;strong&gt;依存性があり&lt;/strong&gt;、&lt;strong&gt;健康に悪い&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;しかも、喫煙率は社会階層と逆相関であり、&lt;strong&gt;社会階層が低いほど喫煙率が高い&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;&lt;img src=\&quot;/wp-content/uploads/2024/02/image-9-1024x657.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;&lt;p&gt;ソース：&lt;a href=\&quot;https://www.m.u-tokyo.ac.jp/news/admin/release_20200627.pdf\&quot;&gt;https://www.m.u-tokyo.ac.jp/news/admin/release_20200627.pdf&lt;/a&gt;&lt;/p&gt;&lt;p&gt;言うまでもないが、&lt;strong&gt;社会階層&lt;/strong&gt;は&lt;strong&gt;教育水準/知能指数や所得と正の相関&lt;/strong&gt;がある。&lt;br&gt;\n従って&lt;strong&gt;喫煙率が高いほど、教育水準/知能指数や所得が低い&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;また日本は受動喫煙問題を解決すべく屋内を原則禁煙とした上、一部の自治体では屋外も原則禁煙であるため、喫煙者は極めて限られた&lt;strong&gt;狭い隔離空間で喫煙&lt;/strong&gt;している。&lt;/p&gt;&lt;p&gt;これらをまとめて表現すると、&lt;br&gt;\n「&lt;strong&gt;知能指数や所得水準が低い人々&lt;/strong&gt;を&lt;strong&gt;狭い空間に隔離&lt;/strong&gt;し&lt;strong&gt;依存性のある有害物質を与える&lt;/strong&gt;ことで、&lt;strong&gt;国家権力&lt;/strong&gt;を盾に&lt;strong&gt;税金として金を毟り取り&lt;/strong&gt;、株式投資する資産を持ち自らは有害物質を消費しない&lt;strong&gt;知能指数や所得水準が高い人々&lt;/strong&gt;に、&lt;strong&gt;配当の形で分配&lt;/strong&gt;する」&lt;br&gt;\n産業ということである。&lt;/p&gt;&lt;p&gt;つまり、「&lt;strong&gt;知能指数/所得が低い人々に有害物質を与え、知能指数/所得が高い人々に所得を移転する装置&lt;/strong&gt;」である。&lt;/p&gt;&lt;p&gt;価値観によるだろうが、個人的には&lt;strong&gt;極めて邪悪&lt;/strong&gt;に感じられる。このような邪悪な営みの株価を支えるような行為をするのは如何なものか。&lt;/p&gt;&lt;p&gt;しかし、&lt;strong&gt;社会的意義と金銭価値が極めて乖離&lt;/strong&gt;している昨今の新自由主義社会において、儲かるビジネスの多くは上記の構造を持っている。&lt;/p&gt;&lt;p&gt;ソシャゲもSNSも、「&lt;strong&gt;知能および所得水準が低い人々に依存性のある有害物を与える&lt;/strong&gt;ことで、&lt;strong&gt;時間と金&lt;/strong&gt;（広告経由）&lt;strong&gt;を毟り取り&lt;/strong&gt;、株式投資する資産を持ち自らは有害物をあまり消費しない&lt;strong&gt;知能及び所得水準が高い人々&lt;/strong&gt;に、&lt;strong&gt;キャピタルゲインの形で分配&lt;/strong&gt;する」産業である。&lt;/p&gt;&lt;p&gt;現在の&lt;strong&gt;グローバル経済社会はそのような構造&lt;/strong&gt;をしている。&lt;/p&gt;&lt;p&gt;そのような社会で、そうした邪悪な営みに直接従事せずで済むよう経済的独立性を勝ち取るには、邪悪な営みに零細株主として関節的に関わるのを許容し、株式投資の形で金を稼がざるをえないのである。&lt;/p&gt;&lt;p&gt;従って私は**、JT株を買う！！**&lt;br&gt;\n（追記：買ってから1週間ほどで売った。リターン+2.3%）&lt;/p&gt;&lt;p&gt;（尚、社会価値と金銭価値の乖離に関する記事はこちら：&lt;a href=\&quot;/monetary-and-social-value-correlation-too-low/\&quot;&gt;金銭価値と社会価値の相関が下がり過ぎではないか（前編）？&lt;/a&gt;）&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;市場トレンド&quot;],&quot;text&quot;:[0,&quot;市場トレンド#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;jt株-中長期保有の是非&quot;],&quot;text&quot;:[0,&quot;JT株 中長期保有の是非#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;タバコ産業の邪悪さと株式投資&quot;],&quot;text&quot;:[0,&quot;タバコ産業の「邪悪さ」と株式投資#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;JT株は買いか？たばこ産業の「邪悪性」を乗り越えて&quot;],&quot;slug&quot;:[0,&quot;is-jt-a-buy&quot;],&quot;published&quot;:[3,&quot;2024-02-02T12:25:36.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/is-jt-a-buy.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,8],&quot;words&quot;:[0,1505],&quot;excerpt&quot;:[0,&quot;配当利回りが4.9%と高いJT株の購入を検討している（2024年2月現在）。 タバコ産業は世界的に縮小傾向で、**中長期保有に向かないのでは？**と思ったが、具体的な数字が思い浮かばなかったのため、調査した。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;is-jt-a-buy&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;utility-companies-revenue-seasonality.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;電力会社の売上に季節性はあるか？&quot;],&quot;published&quot;:[3,&quot;2024-01-31T12:13:32.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/utility-companies-revenues-seasonality.webp&quot lt;/strong&gt;のは直感に沿う結果。&lt;br&gt;\nただ、思ったより差が大きくないのは意外だった（変動率30%程度）。&lt;/p&gt;\n&lt;p&gt;尚、データはバフェットコードから抽出した。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;/wp-content/uploads/2024/01/image-5-1024x537.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;p&gt;おまけ&lt;/p&gt;\n&lt;p&gt;上記のついでに&lt;strong&gt;販売電力量を見たところ、ひたすら下落していて驚いた&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;/wp-content/uploads/2024/01/image-4-1024x538.png\&quot; alt=\&quot;\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;電力小売自由化の影響とも思ったが、2016年より前から下落傾向なので違うのかもしれない。&lt;br&gt;\n別の機会に調査する予定。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;電力会社の売上に季節性はあるか？&quot;],&quot;slug&quot;:[0,&quot;utility-companies-revenue-seasonality&quot;],&quot;published&quot;:[3,&quot;2024-01-31T12:13:32.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/utility-companies-revenues-seasonality.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,1],&quot;words&quot;:[0,244],&quot;excerpt&quot;:[0,&quot;東電で雑に検証した限り、ありそう。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;utility-companies-revenue-seasonality&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;monetary-and-social-value-correlation-too-low.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;金銭価値と社会価値の相関が下がり過ぎではないか？（前編）&quot;],&quot;published&quot;:[3,&quot;2024-01-26T13:16:07.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/monetary-and-social-value-correlation-too-low.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;コーポレート部門にアメーバ経営のような独立採算性は導入可能か？&quot;],&quot;prevSlug&quot;:[0,&quot;is-making-admin-departments-internal-profit-centers-possible&quot;],&quot;nextTitle&quot;:[0,&quot;電力会社の売上に季節性はあるか？&quot;],&quot;nextSlug&quot;:[0,&quot;utility-companies-revenue-seasonality&quot;],&quot;editorId&quot;:[0,&quot;monetary-and-social-value-correlation-too-low&quot;]}],&quot;body&quot;:[0,&quot;時価総額などで測られる**金銭価値**と、「人類にとって有意義」と感じる度合いとしての**社会価値**に、**大きなギャップ**が生じてはないだろうか。\r\n\r\n過去20年ほど、大きな**金銭価値を生み出した人間を尊ぶ**風潮が強まっているが、私はあまり**共感できない**。\r\n\r\n### Meta社と全発電企業、金銭価値と社会価値\r\n\r\n実際、例えば、Meta社（旧Facebook社）の時価総額は1兆ドル（約150兆円）である。  \r\nこれは2024年1月26日現在、世界の全企業のうち、7番目の大きさである。  \r\n創業者であるMark Zuckerberg氏の保有資産額は、1400億ドル（21兆円）で**、**世界5位である。\r\n\r\n事業の社会的意義を、時価総額で測るとしよう。  \r\nそうするとMeta社は、**世界で7番目に社会価値のある会社**になる。\r\n\r\n片や、日本の大手10電力会社の時価総額を合計すると、6.9兆円である。  \r\nこれは、Meta社の4.6%である。  \r\n従って、日本の10電力会社は、Meta社の**22分の1しか、社会価値を持たない**ことになる。\r\n\r\n全世界で事業展開しているMeta社と、ほぼ国内事業のみの発電企業を比較するのは、問題かもしれない。  \r\nそこで、Meta社の時価総額から、日本市場に相当する部分を抽出し、改めて日本の全電力会社と比較しよう。  \r\nそうすると、以下の結果が出る（詳細は、本記事の備考を参照）：\r\n\r\nMeta社：10.4兆円  \r\n全発電企業：10.2兆円  \r\n  \r\nつまり、日本国内において、**Meta社は、あらゆる発電事業と同等の社会価値**を持っていることになる。\r\n\r\nこの結論は、妥当であろうか？\r\n\r\n### Meta社と全発電企業の社会価値を比較する\r\n\r\n上記結論の妥当性を考えるには、社会価値という概念を深堀りする必要がありそうだ。  \r\n本記事の冒頭で私は、「人類にとって有意義」であることを、社会価値と定義した。  \r\nこの発想に基づき、社会価値の大小を判定するため**、**以下の**思考実験**をしてみよう。\r\n\r\n**「その事業がなくなった時に、より困るのはどちらか？」**\r\n\r\nなくなってしまった時に、より困るほうが、より有意義な事業と言えるだろう。  \r\nそうして見た場合、我々の問いは、以下のように表現できる。  \r\n  \r\n**「Meta社が消えた場合と、全ての発電企業が消えた場合、より困るのはどちらか？」**\r\n\r\n。。。  \r\n一応、真面目に検討してみよう。\r\n\r\nまず、**発電企業が消えた場合**である。  \r\n発電企業がなくなると、当然ながら**電力がなくなる**。  \r\n電力がなくなると、医療・水道・ガス・鉄道等の生活インフラが、全て使えなくなる。  \r\n生活レベルは、電力が普及する前の19世紀末あたりまで後退する。  \r\n寿命は大幅に減り、乳幼児死亡率は劇的に増える。  \r\n要するに、**人が大量に亡くなる**。\r\n\r\n一方で、Meta社が消えた場合、何が起こるだろうか。  \r\nFacebookやInstagram、WhatsAppがなくなる。  \r\nつまり、大手SNSの一部が使えない生活になる。  \r\n。。。  \r\n以上である。\r\n\r\nさて、状況の洗い出しができたので、次のステップである。  \r\nどちらが状況が、「より困る」であろうか。\r\n\r\n人によって意見は違うかもしれないが、少なくとも私にとっては、\r\n\r\n。。。\r\n\r\n**発電企業のほうが重要**である。\r\n\r\nいや、はっきり言って、比較にならない。\r\n\r\n**人類の文明が1.5世紀分後退**するのと、**SNSが使えなくなる**ことの勝負である。  \r\nそもそも、電力がないと、Meta社は事業を始めることすら出来ないことが、この問いの可笑しさを物語っている。\r\n\r\nおそらく、人類の99%は、私と同じ回答をするであろう。\r\n\r\n従って、**全発電企業の社会価値は、Meta社の社会価値を上回っている、**と言って問題なさそうである。\r\n\r\nにも関わらず、Meta社の時価総額は、全発電企業の時価総額と同等である（むしろ、僅かに上回っている）。\r\n\r\nこれは一体、どのように解釈すれば良いのか。\r\n\r\n### 結論\r\n\r\n答えは一つしかない。\r\n\r\n**金銭価値は、社会価値を測る尺度としては、全く役に立たない代物になりつつある**、ということだ。\r\n\r\n従ってまた、大きな金銭価値を生み出した人物を、大きな社会価値を生み出した者であるかの如く扱う風潮は、全く**実態を反映していない**。\r\n\r\nそれでは、なぜこのような、誤った潮流が蔓延るようになったのか。\r\n\r\n次回の記事では、これを考えていきたい。\r\n\r\n### 備考\r\n\r\n※**Fun Fact：**本文の数値から、Zuckerberg氏は、日本の全発電企業の合計時価総額の3倍、資産を持っている。よって、**日本の電力会社を全て買収し支配しても、資産が3分の2残る**。実際にやろうとしても、外為法の外資規制等により、実行不可能ではある。ただ、如何に凄まじいことが起きているか、感覚的に分かる見方である。\r\n\r\n※**Meta社の時価総額の日本市場分：**将来期待CFの割引現在価値として理論上定義される時価総額を客観的な形で地域別に分割するのは本来困難だが、売上高CF比率が期間・地理で一定だと過程した場合、地理別売上比で按分すれば良い。具体的には、時価総額\\*日本売上/世界売上＝時価総額\\*日本ARPU\\*日本MAU/世界売上で計算。数値はこちらの[Meta社IR資料](https://s21.q4cdn.com/399680738/files/doc_financials/2022/q4/Earnings-Presentation-Q4-2022.pdf)から抜粋。但し日本売上はFacebookとInstagramのみで構成と仮定。また日本ARPUはFacebookとInstagramで同額とし、北米 Facebook ARPU (\\$58.77)と中進国も含まれるヨーロッパ Facebook ARPU (\\$17.29)の平均（\\$38.03）と推定。日本MAUはFacebookのMAU (2,600万人)とInstagramのMAU (3,300万人）をそれぞれ[こちらの資料](https://gaiax-socialmedialab.jp/socialmedia/435)から抜粋し合算\r\n\r\n※**日本の全電力会社の時価総額：**大手10電力会社は東京電力/中部電力/関西電力/九州電力/東北電力/中国電力/北陸電力/四国電力/北海道電力/沖縄電力。これらの時価総額合計が6.9兆円。エネルギー庁の2022年データから、これら10電力会社の発電実績は日本全体の67%。発電量で外挿すると、全電力会社の時価総額は6.9兆円÷67%=10.2兆円&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/monetary-and-social-value-correlation-too-low.md&quot;],&quot;digest&quot;:[0,&quot;b291d9d4d060214a&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;時価総額などで測られる&lt;strong&gt;金銭価値&lt;/strong&gt;と、「人類にとって有意義」と感じる度合いとしての&lt;strong&gt;社会価値&lt;/strong&gt;に、&lt;strong&gt;大きなギャップ&lt;/strong&gt;が生じてはないだろうか。&lt;/p&gt;\n&lt;p&gt;過去20年ほど、大きな&lt;strong&gt;金銭価値を生み出した人間を尊ぶ&lt;/strong&gt;風潮が強まっているが、私はあまり&lt;strong&gt;共感できない&lt;/strong&gt;。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;meta社と全発電企業金銭価値と社会価値\&quot;&gt;Meta社と全発電企業、金銭価値と社会価値&lt;a class=\&quot;anchor\&quot; href=\&quot;#meta社と全発電企業金銭価値と社会価値\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;実際、例えば、Meta社（旧Facebook社）の時価総額は1兆ドル（約150兆円）である。&lt;br&gt;\nこれは2024年1月26日現在、世界の全企業のうち、7番目の大きさである。&lt;br&gt;\n創業者であるMark Zuckerberg氏の保有資産額は、1400億ドル（21兆円）で**、**世界5位である。&lt;/p&gt;&lt;p&gt;事業の社会的意義を、時価総額で測るとしよう。&lt;br&gt;\nそうするとMeta社は、&lt;strong&gt;世界で7番目に社会価値のある会社&lt;/strong&gt;になる。&lt;/p&gt;&lt;p&gt;片や、日本の大手10電力会社の時価総額を合計すると、6.9兆円である。&lt;br&gt;\nこれは、Meta社の4.6%である。&lt;br&gt;\n従って、日本の10電力会社は、Meta社の&lt;strong&gt;22分の1しか、社会価値を持たない&lt;/strong&gt;ことになる。&lt;/p&gt;&lt;p&gt;全世界で事業展開しているMeta社と、ほぼ国内事業のみの発電企業を比較するのは、問題かもしれない。&lt;br&gt;\nそこで、Meta社の時価総額から、日本市場に相当する部分を抽出し、改めて日本の全電力会社と比較しよう。&lt;br&gt;\nそうすると、以下の結果が出る（詳細は、本記事の備考を参照）：&lt;/p&gt;&lt;p&gt;Meta社：10.4兆円&lt;br&gt;\n全発電企業：10.2兆円&lt;/p&gt;&lt;p&gt;つまり、日本国内において、&lt;strong&gt;Meta社は、あらゆる発電事業と同等の社会価値&lt;/strong&gt;を持っていることになる。&lt;/p&gt;&lt;p&gt;この結論は、妥当であろうか？&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;meta社と全発電企業の社会価値を比較する\&quot;&gt;Meta社と全発電企業の社会価値を比較する&lt;a class=\&quot;anchor\&quot; href=\&quot;#meta社と全発電企業の社会価値を比較する\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;上記結論の妥当性を考えるには、社会価値という概念を深堀りする必要がありそうだ。&lt;br&gt;\n本記事の冒頭で私は、「人類にとって有意義」であることを、社会価値と定義した。&lt;br&gt;\nこの発想に基づき、社会価値の大小を判定するため**、&lt;strong&gt;以下の&lt;/strong&gt;思考実験**をしてみよう。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;「その事業がなくなった時に、より困るのはどちらか？」&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;なくなってしまった時に、より困るほうが、より有意義な事業と言えるだろう。&lt;br&gt;\nそうして見た場合、我々の問いは、以下のように表現できる。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;「Meta社が消えた場合と、全ての発電企業が消えた場合、より困るのはどちらか？」&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;。。。&lt;br&gt;\n一応、真面目に検討してみよう。&lt;/p&gt;&lt;p&gt;まず、&lt;strong&gt;発電企業が消えた場合&lt;/strong&gt;である。&lt;br&gt;\n発電企業がなくなると、当然ながら&lt;strong&gt;電力がなくなる&lt;/strong&gt;。&lt;br&gt;\n電力がなくなると、医療・水道・ガス・鉄道等の生活インフラが、全て使えなくなる。&lt;br&gt;\n生活レベルは、電力が普及する前の19世紀末あたりまで後退する。&lt;br&gt;\n寿命は大幅に減り、乳幼児死亡率は劇的に増える。&lt;br&gt;\n要するに、&lt;strong&gt;人が大量に亡くなる&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;一方で、Meta社が消えた場合、何が起こるだろうか。&lt;br&gt;\nFacebookやInstagram、WhatsAppがなくなる。&lt;br&gt;\nつまり、大手SNSの一部が使えない生活になる。&lt;br&gt;\n。。。&lt;br&gt;\n以上である。&lt;/p&gt;&lt;p&gt;さて、状況の洗い出しができたので、次のステップである。&lt;br&gt;\nどちらが状況が、「より困る」であろうか。&lt;/p&gt;&lt;p&gt;人によって意見は違うかもしれないが、少なくとも私にとっては、&lt;/p&gt;&lt;p&gt;。。。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;発電企業のほうが重要&lt;/strong&gt;である。&lt;/p&gt;&lt;p&gt;いや、はっきり言って、比較にならない。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;人類の文明が1.5世紀分後退&lt;/strong&gt;するのと、&lt;strong&gt;SNSが使えなくなる&lt;/strong&gt;ことの勝負である。&lt;br&gt;\nそもそも、電力がないと、Meta社は事業を始めることすら出来ないことが、この問いの可笑しさを物語っている。&lt;/p&gt;&lt;p&gt;おそらく、人類の99%は、私と同じ回答をするであろう。&lt;/p&gt;&lt;p&gt;従って、**全発電企業の社会価値は、Meta社の社会価値を上回っている、**と言って問題なさそうである。&lt;/p&gt;&lt;p&gt;にも関わらず、Meta社の時価総額は、全発電企業の時価総額と同等である（むしろ、僅かに上回っている）。&lt;/p&gt;&lt;p&gt;これは一体、どのように解釈すれば良いのか。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;結論\&quot;&gt;結論&lt;a class=\&quot;anchor\&quot; href=\&quot;#結論\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;答えは一つしかない。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;金銭価値は、社会価値を測る尺度としては、全く役に立たない代物になりつつある&lt;/strong&gt;、ということだ。&lt;/p&gt;&lt;p&gt;従ってまた、大きな金銭価値を生み出した人物を、大きな社会価値を生み出した者であるかの如く扱う風潮は、全く&lt;strong&gt;実態を反映していない&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;それでは、なぜこのような、誤った潮流が蔓延るようになったのか。&lt;/p&gt;&lt;p&gt;次回の記事では、これを考えていきたい。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;備考\&quot;&gt;備考&lt;a class=\&quot;anchor\&quot; href=\&quot;#備考\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;※**Fun Fact：**本文の数値から、Zuckerberg氏は、日本の全発電企業の合計時価総額の3倍、資産を持っている。よって、&lt;strong&gt;日本の電力会社を全て買収し支配しても、資産が3分の2残る&lt;/strong&gt;。実際にやろうとしても、外為法の外資規制等により、実行不可能ではある。ただ、如何に凄まじいことが起きているか、感覚的に分かる見方である。&lt;/p&gt;&lt;p&gt;※**Meta社の時価総額の日本市場分：**将来期待CFの割引現在価値として理論上定義される時価総額を客観的な形で地域別に分割するのは本来困難だが、売上高CF比率が期間・地理で一定だと過程した場合、地理別売上比で按分すれば良い。具体的には、時価総額*日本売上/世界売上＝時価総額*日本ARPU*日本MAU/世界売上で計算。数値はこちらの&lt;a href=\&quot;https://s21.q4cdn.com/399680738/files/doc_financials/2022/q4/Earnings-Presentation-Q4-2022.pdf\&quot;&gt;Meta社IR資料&lt;/a&gt;から抜粋。但し日本売上はFacebookとInstagramのみで構成と仮定。また日本ARPUはFacebookとInstagramで同額とし、北米 Facebook ARPU ($58.77)と中進国も含まれるヨーロッパ Facebook ARPU ($17.29)の平均（$38.03）と推定。日本MAUはFacebookのMAU (2,600万人)とInstagramのMAU (3,300万人）をそれぞれ&lt;a href=\&quot;https://gaiax-socialmedialab.jp/socialmedia/435\&quot;&gt;こちらの資料&lt;/a&gt;から抜粋し合算&lt;/p&gt;&lt;p&gt;※**日本の全電力会社の時価総額：**大手10電力会社は東京電力/中部電力/関西電力/九州電力/東北電力/中国電力/北陸電力/四国電力/北海道電力/沖縄電力。これらの時価総額合計が6.9兆円。エネルギー庁の2022年データから、これら10電力会社の発電実績は日本全体の67%。発電量で外挿すると、全電力会社の時価総額は6.9兆円÷67%=10.2兆円&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;meta社と全発電企業金銭価値と社会価値&quot;],&quot;text&quot;:[0,&quot;Meta社と全発電企業、金銭価値と社会価値#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;meta社と全発電企業の社会価値を比較する&quot;],&quot;text&quot;:[0,&quot;Meta社と全発電企業の社会価値を比較する#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;備考&quot;],&quot;text&quot;:[0,&quot;備考#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;金銭価値と社会価値の相関が下がり過ぎではないか？（前編）&quot;],&quot;slug&quot;:[0,&quot;monetary-and-social-value-correlation-too-low&quot;],&quot;published&quot;:[3,&quot;2024-01-26T13:16:07.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/02/monetary-and-social-value-correlation-too-low.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,9],&quot;words&quot;:[0,1884],&quot;excerpt&quot;:[0,&quot;時価総額などで測られる金銭価値と、「人類にとって有意義」と感じる度合いとしての社会価値に、大きなギャップが生じてはないだろうか。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;monetary-and-social-value-correlation-too-low&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;is-making-admin-departments-internal-profit-centers-possible.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;コーポレート部門にアメーバ経営のような独立採算性は導入可能か？&quot;],&quot;published&quot;:[3,&quot;2024-01-26T09:14:28.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/is-making-admin-departments-internal-profit-centers-possible.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;Are individual investors increasing in Japan?&quot;],&quot;prevSlug&quot;:[0,&quot;are-individual-investors-increasing-in-japan-en&quot;],&quot;nextTitle&quot;:[0,&quot;金銭価値と社会価値の相関が下がり過ぎではないか？（前編）&quot;],&quot;nextSlug&quot;:[0,&quot;monetary-and-social-value-correlation-too-low&quot;],&quot;editorId&quot;:[0,&quot;is-making-admin-departments-internal-profit-centers-possible&quot;]}],&quot;body&quot;:[0,&quot;表題の件、**直感的には難しそうと思った**のだが、実際どうなのか調査するため、以下の本を読んだ：  \r\n[稲盛和夫の実践アメーバ経営　全社員が自ら採算をつくる (日本経済新聞出版) Kindle Edition](https://amzn.asia/d/gpMibNc)\r\n\r\n結論から言えば、**やめたほうが良い**とのこと。  \r\n以下引用：\r\n\r\n&gt; 管理部門は「非採算部門」とする  \r\n&gt; 一般的に管理部門の役割は、会社の発展を目指してすべての部門や社員を支援し、そのために必要なルールや制度を全社に浸透させることである。アメーバ経営でもこうした役割は基本的に変わらない。  \r\n&gt; もしアメーバ経営を導入し、できるだけ多くの採算部門をつくろうとして管理部門も採算部門としたらどうなるだろうか。管理部門が提供するサービスは社内売買をおこなうために有償化されるが、それを受けようとしない部門が出てくる恐れもある。これでは、全社員に平等かつ均質なサービスを提供することができない。こうした観点から管理部門は非採算部門とする。  \r\n&gt; ただし、管理部門には、提供するサービスの質を維持しつつも、経費最小を追求することが求められる。管理部門も他の採算部門と同様、細かな経費項目を設けて厳しく月次で管理していくことで、低コストで質の高いサービスの提供が可能となる。 非採算部門であっても「経費最小」を徹底することで管理部門の社員は採算意識や経営者感覚を高めていくのである。\r\n&gt;\r\n&gt; [稲盛和夫の実践アメーバ経営　全社員が自ら採算をつくる (日本経済新聞出版) Kindle Edition](https://amzn.asia/d/gpMibNc)\r\n\r\n尚、ついでなので本を全部読んだが、思った以上に個別具体的なメソッドはなく、アメーバ経営とは以下に帰着するである：\r\n\r\n**『ライン組織を、極力細かく、社内取引をする独立再採算のチーム（アメーバ）にせよ**。**但しチームの単位や構成は、会社や市場の状況に応じて臨機応変に変更せよ**』\r\n\r\n稲盛和夫の本はいつもそうだが（[これ](https://www.amazon.co.jp/-/en/%E7%A8%B2%E7%9B%9B-%E5%92%8C%E5%A4%AB/dp/4296114980/ref=sr_1_5?crid=1DLL46YBXNQ3K&amp;keywords=%E7%A8%B2%E7%9B%9B%E5%92%8C%E5%A4%AB&amp;qid=1706259957&amp;sprefix=%E7%A8%B2%E7%9B%9B%E5%92%8C%E5%A4%AB%2Caps%2C163&amp;sr=8-5)とか）、当たり前のことしか書いておらず、ある意味**インサイトは皆無**。\r\n\r\nしかし京セラ・KDDIを巨大企業に育て上げ、JALも再建してしまったのであるから、経営とは結局、「**当たり前のことを当たり前にこなす**」ことに尽きるのかもしれない。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/is-making-admin-departments-internal-profit-centers-possible.md&quot;],&quot;digest&quot;:[0,&quot;6ddb88b85c04b762&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;表題の件、&lt;strong&gt;直感的には難しそうと思った&lt;/strong&gt;のだが、実際どうなのか調査するため、以下の本を読んだ：&lt;br&gt;\n&lt;a href=\&quot;https://amzn.asia/d/gpMibNc\&quot;&gt;稲盛和夫の実践アメーバ経営　全社員が自ら採算をつくる (日本経済新聞出版) Kindle Edition&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;結論から言えば、&lt;strong&gt;やめたほうが良い&lt;/strong&gt;とのこと。&lt;br&gt;\n以下引用：&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;管理部門は「非採算部門」とする&lt;br&gt;\n一般的に管理部門の役割は、会社の発展を目指してすべての部門や社員を支援し、そのために必要なルールや制度を全社に浸透させることである。アメーバ経営でもこうした役割は基本的に変わらない。&lt;br&gt;\nもしアメーバ経営を導入し、できるだけ多くの採算部門をつくろうとして管理部門も採算部門としたらどうなるだろうか。管理部門が提供するサービスは社内売買をおこなうために有償化されるが、それを受けようとしない部門が出てくる恐れもある。これでは、全社員に平等かつ均質なサービスを提供することができない。こうした観点から管理部門は非採算部門とする。&lt;br&gt;\nただし、管理部門には、提供するサービスの質を維持しつつも、経費最小を追求することが求められる。管理部門も他の採算部門と同様、細かな経費項目を設けて厳しく月次で管理していくことで、低コストで質の高いサービスの提供が可能となる。 非採算部門であっても「経費最小」を徹底することで管理部門の社員は採算意識や経営者感覚を高めていくのである。&lt;/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https://amzn.asia/d/gpMibNc\&quot;&gt;稲盛和夫の実践アメーバ経営　全社員が自ら採算をつくる (日本経済新聞出版) Kindle Edition&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;尚、ついでなので本を全部読んだが、思った以上に個別具体的なメソッドはなく、アメーバ経営とは以下に帰着するである：&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;『ライン組織を、極力細かく、社内取引をする独立再採算のチーム（アメーバ）にせよ&lt;/strong&gt;。&lt;strong&gt;但しチームの単位や構成は、会社や市場の状況に応じて臨機応変に変更せよ&lt;/strong&gt;』&lt;/p&gt;\n&lt;p&gt;稲盛和夫の本はいつもそうだが（&lt;a href=\&quot;https://www.amazon.co.jp/-/en/%E7%A8%B2%E7%9B%9B-%E5%92%8C%E5%A4%AB/dp/4296114980/ref=sr_1_5?crid=1DLL46YBXNQ3K&amp;#x26;keywords=%E7%A8%B2%E7%9B%9B%E5%92%8C%E5%A4%AB&amp;#x26;qid=1706259957&amp;#x26;sprefix=%E7%A8%B2%E7%9B%9B%E5%92%8C%E5%A4%AB%2Caps%2C163&amp;#x26;sr=8-5\&quot;&gt;これ&lt;/a&gt;とか）、当たり前のことしか書いておらず、ある意味&lt;strong&gt;インサイトは皆無&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;しかし京セラ・KDDIを巨大企業に育て上げ、JALも再建してしまったのであるから、経営とは結局、「&lt;strong&gt;当たり前のことを当たり前にこなす&lt;/strong&gt;」ことに尽きるのかもしれない。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;コーポレート部門にアメーバ経営のような独立採算性は導入可能か？&quot;],&quot;slug&quot;:[0,&quot;is-making-admin-departments-internal-profit-centers-possible&quot;],&quot;published&quot;:[3,&quot;2024-01-26T09:14:28.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/is-making-admin-departments-internal-profit-centers-possible.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,4],&quot;words&quot;:[0,732],&quot;excerpt&quot;:[0,&quot;表題の件、直感的には難しそうと思ったのだが、実際どうなのか調査するため、以下の本を読んだ： 稲盛和夫の実践アメーバ経営 全社員が自ら採算をつくる (日本経済新聞出版) Kindle Edition&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;is-making-admin-departments-internal-profi
