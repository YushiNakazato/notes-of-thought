t;&lt;p&gt;まったく困らないどころか、むしろ諸々がものすごく効率的になった。&lt;/p&gt;&lt;p&gt;正直、「何年もトレーニングしないと習得できないスキルで、作業をこなします」という仕事は、すでにAIでほぼ陳腐化している気がする。&lt;/p&gt;&lt;p&gt;だから、ほとんどの知的作業は、もう代替されると思う。&lt;/p&gt;&lt;p&gt;では、これから何にお金を払ってもらえるのか。&lt;/p&gt;&lt;p&gt;「私はこの作業の専門家です」だけでは厳しくなる。&lt;/p&gt;&lt;p&gt;一方で、「あなたの幸福に寄与することなら、なんでもしますよ」という人には、まだ頼みたいことがある。&lt;/p&gt;&lt;p&gt;AIで代替できる作業なら、「これ、AIで代替しましょう」と動く。&lt;/p&gt;&lt;p&gt;AIで解決できないなら、専門家を呼んで解決してもらう。&lt;/p&gt;&lt;p&gt;組織が揉めているなら、仲裁する。&lt;/p&gt;&lt;p&gt;目標を達成できないなら、原因を突き止める。&lt;/p&gt;&lt;p&gt;自分の専門にこだわらず、顧客のためになることを、とにかくなんでもする人だ。&lt;/p&gt;&lt;p&gt;これは、要するに御用聞きではないか。&lt;/p&gt;&lt;p&gt;もちろん、「言われたことしかやらない人」を御用聞きと呼ぶこともある。&lt;/p&gt;&lt;p&gt;ここで言いたいのは、言われなくても気を利かせて、顧客のためになることをする人だ。&lt;/p&gt;&lt;p&gt;「自走型御用聞き」とでも呼べばいいのかもしれない。&lt;/p&gt;&lt;p&gt;作業をAIに頼めるようになっても、顧客自身が、何を頼めば自分の状況がよくなるのか分かっているとは限らない。&lt;/p&gt;&lt;p&gt;相談するほどの問題だと思っていないこともあるだろう。&lt;/p&gt;&lt;p&gt;でも、見る人が見れば、「それ、こうすればいいんじゃない？」と言える。&lt;/p&gt;&lt;p&gt;今のところ、AIも基本的には相談されてから動く。&lt;/p&gt;&lt;p&gt;その手前で問題に気づき、頼まれていなくても解決に向けて動く。&lt;/p&gt;&lt;p&gt;要は、「おせっかい」である。&lt;/p&gt;&lt;p&gt;言われなくても問題を見つけ、解決してくれる。&lt;/p&gt;&lt;p&gt;これからお金を払ってもらえるのは、そういう人なのではないか。&lt;/p&gt;&lt;p&gt;ただ、このおせっかいも、人間にしかできないとは限らない。&lt;/p&gt;&lt;p&gt;AIが勝手に情報を集め、「あなたはこれに困っているのでは？」「こうすればよくなるのでは？」と提案してくることは、十分ありそうだ。&lt;/p&gt;&lt;p&gt;考えてみれば、広告はすでに、こちらの行動を追跡して商品を勧めてくる。&lt;/p&gt;&lt;p&gt;おせっかい自体は、もう自動化され始めている。&lt;/p&gt;&lt;p&gt;だから、自走型御用聞きになれば、ずっと安泰という話ではない。&lt;/p&gt;&lt;p&gt;ただ、依頼された作業をこなすだけでは、ますます厳しくなる。&lt;/p&gt;&lt;p&gt;顧客の幸福に寄与する意志を持ち、言われる前に問題を見つけ、使える手段で解決する。&lt;/p&gt;&lt;p&gt;少なくとも、そこまでやらないと、食っていくのが厳しい時代になってきたのではないか。&lt;/p&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/note-1790334289165-e05c4158.md&quot;],&quot;digest&quot;:[0,&quot;cd51dab829049fde&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;AIが、数学の未解決問題だったナビエ・ストークス問題の解法を出した。&lt;/p&gt;&lt;p&gt;法律でも、ニッチな分野の法律的見解を正確に出せるらしい。&lt;/p&gt;&lt;p&gt;プログラミングは言うに及ばず。以前は数千万円かけて作っていたものが、数日で作れるようになった。&lt;/p&gt;&lt;p&gt;数学や法律、エンジニアリングなど、高度な専門性が必要とされていた作業を、AIが次々とこなせるように uot;2026-09-25T11:04:49.165Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;published&quot;:[3,&quot;2026-09-25T11:12:57.572Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;minutes&quot;:[0,5],&quot;words&quot;:[0,1089],&quot;excerpt&quot;:[0,&quot;AIが、数学の未解決問題だったナビエ・ストークス問題の解法を出した。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;note-1790334289165-e05c4158&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ai-and-customer-happiness.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;AI時代は顧客の幸福に向けて仕事しないと厳しい&quot;],&quot;published&quot;:[3,&quot;2026-09-24T14:12:16.731Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;created&quot;:[3,&quot;2026-09-24T04:23:04.692Z&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;作業がAIに代替されていく中で、何に対してお金が払われるのか。&quot;],&quot;image&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;「長い文章が読めなくなった」は本当か？&quot;],&quot;prevSlug&quot;:[0,&quot;reading-and-information-density-local&quot;],&quot;nextTitle&quot;:[0,&quot;AI時代に残る仕事は「自走型御用聞き」だけかも&quot;],&quot;nextSlug&quot;:[0,&quot;note-1790334289165-e05c4158&quot;],&quot;editorId&quot;:[0,&quot;ai-and-customer-happiness&quot;]}],&quot;body&quot;:[0,&quot;&lt;p&gt;AIでプロダクトを作るのは楽しいが、その後のユーザー獲得や、満足度の向上までやり切る人が少ない、という話をよく聞く。&lt;/p&gt;\n&lt;p&gt;これは、自己満足でやっているか、ユーザーの幸福のためにやっているかの違いだと思う。&lt;/p&gt;\n&lt;p&gt;「プロダクトを作るのが楽しい」だけだと、プロトタイプが出来たり、リリースしたあたりで、モチベーションが消える。&lt;/p&gt;\n&lt;p&gt;だからアプリを量産できても、それをユーザーに届け、使ってもらい、幸福になってもらうための努力ができない。&lt;/p&gt;\n&lt;p&gt;以前は、それでも食っていけた。&lt;/p&gt;\n&lt;p&gt;プロダクトを作る能力が希少だったからだ。&lt;/p&gt;\n&lt;p&gt;ユーザーと接点を持つ仕事は、営業やマーケター、フリーランス案件を持ってくるエージェントなどに任せ、自分は作る作業に没頭する、という分業ができた。&lt;/p&gt;\n&lt;p&gt;しかし、AIによって作る能力が陳腐化すると、製作能力それ自体への対価は、急速に下がる。&lt;/p&gt;\n&lt;p&gt;では、ユーザーと接点を持つ仕事なら安泰なのか、というと、そうでもない。&lt;/p&gt;\n&lt;p&gt;広告コンテンツの制作やSNS運用も、急速にAIで自動化されつつある。&lt;/p&gt;\n&lt;p&gt;単に「その作業ができます」というだけなら、プロダクトを作る作業と同じ運命だと思う。&lt;/p&gt;\n&lt;p&gt;物理的な製品やサービスを作る仕事ならどうか。&lt;/p&gt;\n&lt;p&gt;AIが進化すればロボットも進化するので、これも時間の問題。&lt;/p&gt;\n&lt;p&gt;では、何が残るのか。&lt;/p&gt;\n&lt;p&gt;「顧客の幸福に寄与する意志」しか残らない。&lt;/p&gt;\n&lt;p&gt;あらゆる作業をAIやロボットに任せられるようになっても、やれることが無数にある中で何をするのか、決めなければならない。&lt;/p&gt;\n&lt;p&gt;そこで顧客がお金を払いたいと思うのは、自分の幸福に寄与する意志を持って、行動してくれる相手だ。&lt;/p&gt;\n&lt;p&gt;だから、その意志を育まない限り、食っていくのは厳しくなっていく気がする。&lt;/p&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/ai-and-customer-happiness.md&quot;],&quot;digest&quot;:[0,&quot;fe37f93f54065a5a&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;AIでプロダクトを作るのは楽しいが、その後のユーザー獲得や、満足度の向上までやり切る人が少ない、という話をよく聞く。&lt;/p&gt;\n&lt;p&gt;これは、自己満足でやっているか、ユーザーの幸福のためにやっているかの違いだと思う。&lt;/p&gt;\n&lt;p&gt;「プロダクトを作るのが楽しい」だけだと、プロトタイプが出来たり、リリースしたあたりで、モチベーションが消える。&lt;/p&gt;\n&lt;p&gt;だからアプリを量産できても、それをユーザーに届け、使ってもらい、幸福になってもらうための努力ができない。&lt;/p&gt;\n&lt;p&gt;以前は、それでも食っていけた。&lt;/p&gt;\n&lt;p&gt;プロダクトを作る能力が希少だったからだ。&lt;/p&gt;\n&lt;p&gt;ユーザーと接点を持つ仕事は、営業やマーケター、フリーランス案件を持ってくるエージェントなどに任せ、自分は作る作業に没頭する、という分業ができた。&lt;/p&gt;\n&lt;p&gt;しかし、AIによって作る能力が陳腐化すると、製作能力それ自体への対価は、急速に下がる。&lt;/p&gt;\n&lt;p&gt;では、ユーザーと接点を持つ仕事なら安泰なのか、というと、そうでもない。&lt;/p&gt;\n&lt;p&gt;広告コンテンツの制作やSNS運用も、急速にAIで自動化されつつある。&lt;/p&gt;\n&lt;p&gt;単に「その作業ができます」というだけなら、プロダクトを作る作業と同じ運命だと思う。&lt;/p&gt;\n&lt;p&gt;物理的な製品やサービスを作る仕事ならどうか。&lt;/p&gt;\n&lt;p&gt;AIが進化すればロボットも進化するので、これも時間の問題。&lt;/p&gt;\n&lt;p&gt;では、何が残るのか。&lt;/p&gt;\n&lt;p&gt;「顧客の幸福に寄与する意志」しか残らない。&lt;/p&gt;\n&lt;p&gt;あらゆる作業をAIやロボットに任せられるようになっても、やれることが無数にある中で何をするのか、決めなければならない。&lt;/p&gt;\n&lt;p&gt;そこで顧客がお金を払いたいと思うのは、自分の幸福に寄与する意志を持って、行動してくれる相手だ。&lt;/p&gt;\n&lt;p&gt;だから、その意志を育まない限り、食っていくのは厳しくなっていく気がする。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quo t;本当にそうなのだろうか。&lt;/p&gt;\n&lt;p&gt;そもそも、なぜ読めなくなったのか。&lt;/p&gt;\n&lt;p&gt;長いから読めないのではなく、密度の低い文章を読まなくなったのではないか。&lt;/p&gt;\n&lt;p&gt;実際、昔は喜んで読んでいた本も、今読み返すと、密度が低くて、魅力を感じないことが多い。&lt;/p&gt;\n&lt;p&gt;300ページくらいある紙の本でも、言いたいことは、最初の4分の1くらいでだいたい出尽くしていて、残りの4分の3は蛇足だったりする。&lt;/p&gt;\n&lt;p&gt;同じ話を別の角度から繰り返したり、本筋から外れたり、あまり確信の持てない話を広げたり。&lt;/p&gt;\n&lt;p&gt;昔から、うすうすそう感じてはいた。&lt;/p&gt;\n&lt;p&gt;それでも、当時は喜んで読んでいた。&lt;/p&gt;\n&lt;p&gt;自分が興味を持った分野の活字は希少だったし、半分は娯楽だった。&lt;/p&gt;\n&lt;p&gt;知りたいことが分かるだけでなく、その分野の文章を読みこと自体が楽しかった。&lt;/p&gt;\n&lt;p&gt;でも今は、TwitterをはじめとするSNSによって、短い文章に高濃度のメッセージを詰め込む文化に慣れた。&lt;/p&gt;\n&lt;p&gt;そうした文章が、延々と流れてくる。&lt;/p&gt;\n&lt;p&gt;だから実は、私たちが文章を読んでいる時間は減っていない。&lt;/p&gt;\n&lt;p&gt;読んでいるものが、高密度だが互いにつながっていない、断片的な情報に変わった。&lt;/p&gt;\n&lt;p&gt;そんな文章を際限なく読める中で、一続きではあるものの密度の低い文章を読むと、時間を無駄にしている感覚になる。&lt;/p&gt;\n&lt;p&gt;それで読む気が失せるのではないか。&lt;/p&gt;\n&lt;p&gt;紙の本には出版や流通のコストがかかる。&lt;/p&gt;\n&lt;p&gt;原稿を書き、印刷し、卸や小売を通じて読者に届けなければならない。&lt;/p&gt;\n&lt;p&gt;一度の出版でなるべく高い価格をつける必要があり、そのために内容が「水増し」されていた気がする。&lt;br /&gt;&lt;br /&gt;一方で、配信コストがゼロになれば、伝えたいメッセージが持つ本来の長さまで、文章が縮められる。&lt;/p&gt;\n&lt;p&gt;その結果が、今の短文文化なのだと感じる。\n&lt;br /&gt;&lt;br /&gt; そしてこの変化は、今に始まったことでもない気がする。&lt;br /&gt;&lt;br /&gt; SNSが登場する前にも、私は同じようなことを感じていた。&lt;/p&gt;\n&lt;p&gt;18世紀の古典などを読むと、まどろっこしい婉曲表現が延々と続いている。&lt;/p&gt;\n&lt;p&gt;「もっと端的に書いてくれ」、「昔はなぜこんなにダラダラ書いていたのか」と思ったものだ。&lt;/p&gt;\n&lt;p&gt;18世紀の知識人も、SNSが登場する前の私たちを見たら、「長い文章が読めない」と嘆いたかもしれない。&lt;/p&gt;\n&lt;p&gt;「最近の若者は」というやつである。&lt;br /&gt;&lt;br /&gt; だから、「長い文章を読まなくなった」こと自体は、それほど心配することではないと思う。&lt;br /&gt;&lt;br /&gt; 「知的な文章を読めなくなった」なら問題だ。&lt;/p&gt;\n&lt;p&gt;しかし、「密度の低い文章を読みたくなくなった」のであれば、単に、より読み応えのある文章を求めているだけだ。\n&lt;br /&gt;&lt;br /&gt;\nその要求に応えて、密度の高い文章が次々と生まれ、それを読むことで社会全体の情報処理能力も上がっているのなら、むしろ良いことだと思う。&lt;/p&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/reading-and-information-density-local.md&quot;],&quot;digest&quot;:[0,&quot;2a262e73550d05b2&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;「若者が長い文章を読めなくなった」という記事をよく見かける。&lt;/p&gt;\n&lt;p&gt;たいてい、良くないこととして語られている。&lt;/p&gt;\n&lt;p&gt;本当にそうなのだろうか。&lt;/p&gt;\n&lt;p&gt;そもそも、なぜ読めなくなったのか。&lt;/p&gt;\n&lt;p&gt;長いから読めないのではなく、密度の低い文章を読まなくなったのではないか。&lt;/p&gt;\n&lt;p&gt;実際、昔は喜んで読んでいた本も、今読み返すと、密度が低くて、魅力を感じないことが多い。&lt;/p&gt;\n&lt;p&gt;300ページくらいある紙の本でも、言いたいことは、最初の4分の1くらいでだいたい出尽くしていて、残りの4分の3は蛇足だったりする。&lt;/p&gt;\n&lt;p&gt;同じ話を別の角度から繰り返したり、本筋から外れたり、あまり確信の持てない話を広げたり。&lt;/p&gt;\n&lt;p&gt;昔から、うすうすそう感じてはいた。&lt;/p&gt;\n&lt;p&gt;それでも、当時は喜んで読んでいた。&lt;/p&gt;\n&lt;p&gt;自分が興味を持った分野の活字は希少だったし、半分は娯楽だった。&lt;/p&gt;\n&lt;p&gt;知りたいことが分かるだけでなく、その分野の文章を読みこと自体が楽しかった。&lt;/p&gt;\n&lt;p&gt;でも今は、TwitterをはじめとするSNSによって、短い文章に高濃度のメッセージを詰め込む文化に慣れた。&lt;/p&gt;\n&lt;p&gt;そうした文章が、延々と流れてくる。&lt;/p&gt;\n&lt;p&gt;だから実は、私たちが文章を読んでいる時間は減っていない。&lt;/p&gt;\n&lt;p&gt;読んでいるものが、高密度だが互いにつながっていない、断片的な情報に変わった。&lt;/p&gt;\n&lt;p&gt;そんな文章を際限なく読める中で、一続きではあるものの密度の低い文章を読むと、時間を無駄にしている感覚になる。&lt;/p&gt;\n&lt;p&gt;それで読む気が失せるのではないか。&lt;/p&gt;\n&lt;p&gt;紙の本には出版や流通のコストがかかる。&lt;/p&gt;\n&lt;p&gt;原稿を書き、印刷し、卸や小売を通じて読者に届けなければならない。&lt;/p&gt;\n&lt;p&gt;一度の出版でなるべく高い価格をつける必要があり、そのために内容が「水増し」されていた気がする。&lt;br&gt;&lt;br&gt;一方で、配信コストがゼロになれば、伝えたいメッセージが持つ本来の長さまで、文章が縮められる。&lt;/p&gt;\n&lt;p&gt;その結果が、今の短文文化なのだと感じる。\n&lt;br&gt;&lt;br&gt; そしてこの変化は、今に始まったことでもない気がする。&lt;br&gt;&lt;br&gt; SNSが登場する前にも、私は同じようなことを感じていた。&lt;/p&gt;\n&lt;p&gt;18世紀の古典などを読むと、まどろっこしい婉曲表現が延々と続いている。&lt;/p&gt;\n&lt;p&gt;「もっと端的に書いてくれ」、「昔はなぜこんなにダラダラ書いていたのか」と思ったものだ。&lt;/p&gt;\n&lt;p&gt;18世紀の知識人も、SNSが登場する前の私たちを見たら、「長い文章が読めない」と嘆いたかもしれない。&lt;/p&gt;\n&lt;p&gt;「最近の若者は」というやつである。&lt;br&gt;&lt;br&gt; だから、「長い文章を読まなくなった」こと自体は、それほど心配することではないと思う。&lt;br&gt;&lt;br&gt; 「知的な文章を読めなくなった」なら問題だ。&lt;/p&gt;\n&lt;p&gt;しかし、「密度の低い文章を読みたくなくなった」のであれば、単に、より読み応えのある文章を求めているだけだ。\n&lt;br&gt;&lt;br&gt;\nその要求に応えて、密度の高い文章が次々と生まれ、それを読むことで社会全体の情報処理能力も上がっているのなら、むしろ良いことだと思う。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;「長い文章が読めなくなった」は本当か？&quot;],&quot;slug&quot;:[0,&quot;reading-and-information-density-local&quot;],&quot;created&quot;:[3,&quot;2026-09-24T03:25:31.669Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;読み心地を比較するためのローカル版。&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;published&quot;:[3,&quot;2026-09-24T14:06:29.999Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;minutes&quot;:[0,5],&quot;words&quot;:[0,1055],&quot;excerpt&quot;:[0,&quot;「若者が長い文章を読めなくなった」という記事をよく見かける。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;reading-and-information-density-local&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;is-labor-obsolete.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;労働はオワコンか？&quot;],&quot;published&quot;:[3,&quot;2025-12-02T20:49:56.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/images/mint-line-sheet.png#chair&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;ハサビスとDeepMindは如何にして世俗を超越し続けられたのか？～The THINKING GAME 感想～（前編）&quot;],&quot;prevSlug&quot;:[0,&quot;how-does-hassabis-and-deepmind-keep-transcending-the-prosaic-world&quot;],&quot;nextTitle&quot;:[0,&quot;「長い文章が読めなくなった」は本当か？&quot;],&quot;nextSlug&quot;:[0,&quot;reading-and-information-density-local&quot;],&quot;editorId&quot;:[0,&quot;is-labor-obsolete&quot;]}],&quot;body&quot;:[0,&quot;労働が急速にオワコン化している。  \r\n主要因は\r\n\r\n1. AIによる代替\r\n2. 環境依存性\r\n3. r &gt; g\r\n4. アテンションエコノミー\r\n\r\nである。  \r\n以下、個別に見ていく。\r\n\r\n\r\n\r\n## AIによる代替\r\n\r\n私は零細企業を経営しており、GPT 5.1やGemini 3.0を使っているが、税理士や弁護士が不要になりつつある。  \r\n大企業はともかく、従業員100人未満の中小零細レベルでは、LLMと経理/法務の担当1～3人で業務が回ってしまう。  \r\nちなみに営業も、AIで広告や記事を作ってウェブに配信すれば済む。  \r\nカスタマーサポートも、AIでプロダクト資料を作りnotebook LMで公開すれば事足りる。  \r\nエンジニアも、ちょっとしたツールやプロダクトであれば、vibe codingで十分作れる。  \r\n中小零細企業ホワイトカラーの3割以上は、既にAIで代替可能なのではないか。\r\n\r\nブルーカラーは、状況が相対的に良い。AIは身体性を獲得できていない。  \r\nしかし、失職したホワイトカラーが大挙してブルーカラージョブに殺到したら、賃金に強烈な下方調整圧力がかかる。  \r\n例えばUber。失職したホワイトカラーが大量にUberドライバーになったら、最低賃金のないダイナミックプライシングにより単価は激減。大量発生した競合と客を奪い合うため、乗車回数も滅失。報酬=単価×乗車回数の2変数がいずれも激しく減少する。  \r\n資格や熟練性等の参入障壁がある職種（配管工や電気工など）はマシだが、AIの進化スピードに鑑みると、安泰ではない。サイエンティストやエンジニアをAIが代替し、センシングやロボティクスが飛躍的に進展すれば、そうした職種も代替圧力がかかる。\r\n\r\n総じて、ホワイトカラー・ブルーカラー問わず、労働者はこれから、AIとの強烈な競争にさらされる。  \r\n多くは普通に失職すると思う。\r\n\r\n## 環境依存性\r\n\r\n海外に移住して気付いたことだが、労働の価値は環境に激しく依存する。\r\n\r\n例えば弁護士。日本で屈指の弁護士だったとしても、海外に移住すると、現地の司法試験に合格したての新米未満になる。  \r\nエンジニアもそうだ。現地語に難があると、仕様を正しく理解できずお荷物になる。  \r\n大工も同じ。工法や建築基準法が大きく異なるため、未経験よりはマシ程度の評価になる。\r\n\r\nいずれも、現地語を学習したり、資格を取ったり、現地で経験を積めば、戦力になりうる。  \r\nなりうるが、それはつまり、一旦は新卒以下のレベルにリセットされるので、そこからまたやり直せ、ということである。\r\n\r\n労働スキルは、思った以上にポータブルでない。  \r\n国を跨ぐと使い物にならず、評価もされない。  \r\n要は、環境依存性が非常に高いということだ。\r\n\r\nそんなの当たり前？\r\n\r\nでは、労働と対比させるべく、資本のケースを考えてみよう。  \r\n資本の最たるものは、金銭である。  \r\n金銭は容易に市場で交換可能である。  \r\n例えば日本円を大量に保有しており、米国に移住したとしよう。  \r\n円をドルに両替すれば、なんの問題もなく通用する。  \r\n労働とはエラい違いである。\r\n\r\n今度はGPUサーバーを考える。  \r\nGPUサーバーは、世界中に計算リソースを提供でき、その価値は国によって質的に変化したりしない。  \r\n日本であろうが、米国であろうが、インドであろうが、ケニアであろうか、1 TFLOPSは1 TFLOPSである。  \r\n国を跨いでも、なんの問題もなく通用する。  \r\n労働とは偉い違いである。  \r\n  \r\n労働は環境依存性の塊である。  \r\nそしてそれは、資本の例を見れば分かるように、決して当たり前ではない。\r\n\r\n## r &gt; g\r\n\r\nr &gt; gとは、資本収益率rが労働賃金の上昇率gよりも高いことを表す数式である。\r\n\r\nトマ・ピケティが「21世紀の資本論」にて、上記が歴史的に成り立っていることを論じて以降、散々議論されてきたので、詳細には触れない。\r\n\r\n要は、富を増やす上では、労働するのではなく投資をしたほうが良い、ということだ（種銭がある場合）。\r\n\r\n## テクノ封建制\r\n\r\n大量生産による物品・サービスのコモディティ化を経て、付加価値は意味・表象にシフトした。  \r\n意味・表象は社会的文脈、すなわち「他者が何をどのように認識していると自己が認識するか」（他者認識の自己認識）で生み出される。  \r\nこれを分かりやすい指標（エンゲージメント）で市場化したのがソーシャルネットワークであり、これを金銭に変換する装置がアテンション・エコノミーである。  \r\n事業の成功はアテンション・エコノミー上の成功に左右されるようになり、そのためのプラットフォームを提供する超少数の企業群（GAFA）が経済のチョークポイントを握った。  \r\nその結果、労働分配率はGAFAへの20%以上に上るレントに圧迫され、r &gt; gの構図が加速した。  \r\n労働者は、テクノ封建制の下、GAFAへ年貢を納める農奴となった。\r\n\r\n## 結論\r\n\r\n労働とは何か？\r\n\r\n労働とは、蓄財性が資本に著しく劣り、環境依存性が高く、GAFAへ年貢を納める農奴のような扱いを受けた挙句、AIに根こそぎ代替されそうな活動である。\r\n\r\nこれをオワコンと呼ぶのか否かは、読者に委ねたい。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/is-labor-obsolete.md&quot;],&quot;digest&quot;:[0,&quot;921524b606b61de9&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;労働が急速にオワコン化している。&lt;br&gt;\n主要因は&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;AIによる代替&lt;/li&gt;\n&lt;li&gt;環境依存性&lt;/li&gt;\n&lt;li&gt;r &gt; g&lt;/li&gt;\n&lt;li&gt;アテンションエコノミー&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;である。&lt;br&gt;\n以下、個別に見ていく。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;aiによる代替\&quot;&gt;AIによる代替&lt;a class=\&quot;anchor\&quot; href=\&quot;#aiによる代替\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;私は零細企業を経営しており、GPT 5.1やGemini 3.0を使っているが、税理士や弁護士が不要になりつつある。&lt;br&gt;\n大企業はともかく、従業員100人未満の中小零細レベルでは、LLMと経理/法務の担当1～3人で業務が回ってしまう。&lt;br&gt;\nちなみに営業も、AIで広告や記事を作ってウェブに配信すれば済む。&lt;br&gt;\nカスタマーサポートも、AIでプロダクト資料を作りnotebook LMで公開すれば事足りる。&lt;br&gt;\nエンジニアも、ちょっとしたツールやプロダクトであれば、vibe codingで十分作れる。&lt;br&gt;\n中小零細企業ホワイトカラーの3割以上は、既にAIで代替可能なのではないか。&lt;/p&gt;&lt;p&gt;ブルーカラーは、状況が相対的に良い。AIは身体性を獲得できていない。&lt;br&gt;\nしかし、失職したホワイトカラーが大挙してブルーカラージョブに殺到したら、賃金に強烈な下方調整圧力がかかる。&lt;br&gt;\n例えばUber。失職したホワイトカラーが大量にUberドライバーになったら、最低賃金のないダイナミックプライシングにより単価は激減。大量発生した競合と客を奪い合うため、乗車回数も滅失。報酬=単価×乗車回数の2変数がいずれも激しく減少する。&lt;br&gt;\n資格や熟練性等の参入障壁がある職種（配管工や電気工など）はマシだが、AIの進化スピードに鑑みると、安泰ではない。サイエンティストやエンジニアをAIが代替し、センシングやロボティクスが飛躍的に進展すれば、そうした職種も代替圧力がかかる。&lt;/p&gt;&lt;p&gt;総じて、ホワイトカラー・ブルーカラー問わず、労働者はこれから、AIとの強烈な競争にさらされる。&lt;br&gt;\n多くは普通に失職すると思う。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;環境依存性\&quot;&gt;環境依存性&lt;a class=\&quot;anchor\&quot; href=\&quot;#環境依存性\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;海外に移住して気付いたことだが、労働の価値は環境に激しく依存する。&lt;/p&gt;&lt;p&gt;例えば弁護士。日本で屈指の弁護士だったとしても、海外に移住すると、現地の司法試験に合格したての新米未満になる。&lt;br&gt;\nエンジニアもそうだ。現地語に難があると、仕様を正しく理解できずお荷物になる。&lt;br&gt;\n大工も同じ。工法や建築基準法が大きく異なるため、未経験よりはマシ程度の評価になる。&lt;/p&gt;&lt;p&gt;いずれも、現地語を学習したり、資格を取ったり、現地で経験を積めば、戦力になりうる。&lt;br&gt;\nなりうるが、それはつまり、一旦は新卒以下のレベルにリセットされるので、そこからまたやり直せ、ということである。&lt;/p&gt;&lt;p&gt;労働スキルは、思った以上にポータブルでない。&lt;br&gt;\n国を跨ぐと使い物にならず、評価もされない。&lt;br&gt;\n要は、環境依存性が非常に高いということだ。&lt;/p&gt;&lt;p&gt;そんなの当たり前？&lt;/p&gt;&lt;p&gt;では、労働と対比させるべく、資本のケースを考えてみよう。&lt;br&gt;\n資本の最たるものは、金銭である。&lt;br&gt;\n金銭は容易に市場で交換可能である。&lt;br&gt;\n例えば日本円を大量に保有しており、米国に移住したとしよう。&lt;br&gt;\n円をドルに両替すれば、なんの問題もなく通用する。&lt;br&gt;\n労働とはエラい違いである。&lt;/p&gt;&lt;p&gt;今度はGPUサーバーを考える。&lt;br&gt;\nGPUサーバーは、世界中に計算リソースを提供でき、その価値は国によって質的に変化したりしない。&lt;br&gt;\n日本であろうが、米国であろうが、インドであろうが、ケニアであろうか、1 TFLOPSは1 TFLOPSである。&lt;br&gt;\n国を跨いでも、なんの問題もなく通用する。&lt;br&gt;\n労働とは偉い違いである。&lt;/p&gt;&lt;p&gt;労働は環境依存性の塊である。&lt;br&gt;\nそしてそれは、資本の例を見れば分かるように、決して当たり前ではない。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;r--g\&quot;&gt;r &gt; g&lt;a class=\&quot;anchor\&quot; href=\&quot;#r--g\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;r &gt; gとは、資本収益率rが労働賃金の上昇率gよりも高いことを表す数式である。&lt;/p&gt;&lt;p&gt;トマ・ピケティが「21世紀の資本論」にて、上記が歴史的に成り立っていることを論じて以降、散々議論されてきたので、詳細には触れない。&lt;/p&gt;&lt;p&gt;要は、富を増やす上では、労働するのではなく投資をしたほうが良い、ということだ（種銭がある場合）。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;テクノ封建制\&quot;&gt;テクノ封建制&lt;a class=\&quot;anchor\&quot; href=\&quot;#テクノ封建制\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;大量生産による物品・サービスのコモディティ化を経て、付加価値は意味・表象にシフトした。&lt;br&gt;\n意味・表象は社会的文脈、すなわち「他者が何をどのように認識していると自己が認識するか」（他者認識の自己認識）で生み出される。&lt;br&gt;\nこれを分かりやすい指標（エンゲージメント）で市場化したのがソーシャルネットワークであり、これを金銭に変換する装置がアテンション・エコノミーである。&lt;br&gt;\n事業の成功はアテンション・エコノミー上の成功に左右されるようになり、そのためのプラットフォームを提供する超少数の企業群（GAFA）が経済のチョークポイントを握った。&lt;br&gt;\nその結果、労働分配率はGAFAへの20%以上に上るレントに圧迫され、r &gt; gの構図が加速した。&lt;br&gt;\n労働者は、テクノ封建制の下、GAFAへ年貢を納める農奴となった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;結論\&quot;&gt;結論&lt;a class=\&quot;anchor\&quot; href=\&quot;#結論\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;労働とは何か？&lt;/p&gt;&lt;p&gt;労働とは、蓄財性が資本に著しく劣り、環境依存性が高く、GAFAへ年貢を納める農奴のような扱いを受けた挙句、AIに根こそぎ代替されそうな活動である。&lt;/p&gt;&lt;p&gt;これをオワコンと呼ぶのか否かは、読者に委ねたい。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;aiによる代替&quot;],&quot;text&quot;:[0,&quot;AIによる代替#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;環境依存性&quot;],&quot;text&quot;:[0,&quot;環境依存性#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;r--g&quot;],&quot;text&quot;:[0,&quot;r &gt; g#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;テクノ封建制&quot;],&quot;text&quot;:[0,&quot;テクノ封建制#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;労働はオワコンか？&quot;],&quot;slug&quot;:[0,&quot;is-labor-obsolete&quot;],&quot;published&quot;:[3,&quot;2025-12-02T20:49:56.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;/images/mint-line-sheet.png#chair&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,8],&quot;words&quot;:[0,1525],&quot;excerpt&quot;:[0,&quot;労働が急速にオワコン化している。 主要因は&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;is-labor-obsolete&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;how-does-hassabis-and-deepmind-keep-transcending-the-prosaic-world.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;ハサビスとDeepMindは如何にして世俗を超越し続けられたのか？～The THINKING GAME 感想～（前編）&quot;],&quot;published&quot;:[3,&quot;2025-12-01T08:51:32.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/images/mint-line-sheet.png#curiosity&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;AI時代に残る価値は何か&quot;],&quot;prevSlug&quot;:[0,&quot;values-in-the-ai-era&quot;],&quot;nextTitle&quot;:[0,&quot;労働はオワコンか？&quot;],&quot;nextSlug&quot;:[0,&quot;is-labor-obsolete&quot;],&quot;editorId&quot;:[0,&quot;how-does-hassabis-and-deepmind-keep-transcending-the-prosaic-world&quot;]}],&quot;body&quot;:[0,&quot;デミス・ハサビス（及び彼が創設したDeep Mind）の自伝的ドキュメンタリー、\&quot;The THINKING GAME\&quot;を観た。  \r\n公式がyoutubeにあげているので、無料で見られる：\r\n\r\nhttps://www.youtube.com/watch?v=d95J8yzvjbQ\r\n\r\n極めて示唆に富み、強い印象を受けた。\r\n\r\n昨今のテック系ドキュメンタリーは、テック産業の実態を反映して、暗い雰囲気を醸しているのが常である。  \r\nアテンションエコノミーに起因する憎悪の拡散、政情不安、若者のメンタル・ヘルス悪化、社会規範の後退、共通した事実認識の退潮。労働需要の減退による格差拡大、尊厳の低下、薬物の蔓延、絶望死。\r\n\r\nそうした中で、本作はどうであろう。  \r\n知性、謙虚さ、誠実さ、未来への希望に満ち溢れている。  \r\nまるで2005年にタイムスリップしたようだ。  \r\n  \r\n制作陣の意図というよりも、ハサビスを始めとした取材対象そのものが、そうした風情を醸し出していた。\r\n\r\nこの差を生み出しているのは何なのか。  \r\nこれを探るべく、本作を反芻したところ、以下のエピソードが印象的だった：\r\n\r\n1. チェスの神童だったハサビスが、リヒテンシュタインの大会に参加した際のこと。  \r\n   対戦相手は30代の元デンマーク王者。10時間以上に渡る激戦の末、ハサビス少年は「もう引き分けでいいじゃん...」と厭戦気分になるも、相手は勝利に拘り、泥仕合を演じていた。  \r\n   疲れと、相手の執拗さへの恐怖に駆られたハスビスは、相手のチープトリックにあえて引っ掛かり、投了。  \r\n   すると相手は飛び上がって喜び、「なぜ投了した！このクイーンを差し出せば引き分けにできたのに！」と、大人気なくも言い放つ。  \r\n   宙を仰ぐハサビス。知性とは何か。この競技は、何の意味があるのか。この建物でチェスに興じている300人は、何のために、他の全てを犠牲にしてまで、この活動を続けているのか。この知性を、より有意義な他の何かに使えるのではないか。  \r\n   有限な人生の時間を何に使うべきか、12歳にして真剣に自問し始めたハサビスは、やがて、チェスから離れる。\r\n2. ハサビスが、DeepMindを創業して資金調達に奔走していた頃。  \r\n   産業革命以上のインパクトを与えうる汎用人口知能（AGI）の開発をミッションに掲げ、これに必要な技術的要素が揃いつつある今が絶好の投資機会であると、投資家に訴える。  \r\n   すると、毎度のように聞かれる同じ質問：  \r\n   「OK。で、どうやって金を儲けるんだ？プロダクトは？」  \r\n   憤るハサビス。  \r\n   「いったい何を言っているんだ？話を聞いていたのか？人類社会を根本的に革新する話をしているんだぞ？なんだ、その世俗的（prosaic）な質問は！」。  \r\n   やがて、金銭的リターンとは異なる次元で投資してくれる人を求め、ピーター・ティールやイーロン・マスクにアプローチしていく。\r\n\r\nいずれも、世俗的な振る舞いにハサビスが失望する逸話である。\r\n\r\nそう、ハサビスやDeep Mind、ひいてはこのドキュメンタリーを貫く輝きは、世俗を超越した高邁な理念にまい進する人々のそれである。\r\n\r\n「こうして金を儲けた」とか、「注目や人気を集めた」とか、「政治を動かした」とか、「誰が誰に勝った」とか、そうした事柄が行動原理の中心に来ることは、一切ない。\r\n\r\n「ウルフ・オブ・ウォールストリート」的な、下劣な大衆性は皆無である。\r\n\r\nひたすら、知を追い求めて、これに殉じている。\r\n\r\nだが、普通、どれほどそうした人生を歩むべく努力しても、中々うまく行かない。  \r\n生活していくには金が必要で、金を稼ぐには、世間からの注目や人気、政治や他者の見栄を念頭に行動しなければならず、これらと無縁で生きていくのは困難だからだ。  \r\nそうして、気づくと自分もそうした俗世にまみれて、本来持っていた高邁な理念は忘れ去られる。\r\n\r\nところがハサビスやDeepMindは、世俗を強烈に拒絶したまま、理念の実現に必要なものを獲得し、成果を挙げている。  \r\nシリコン・バレーの金と人気を重視するカルチャーを拒絶し、頑としてロンドンから拠点を移さない。  \r\n販売するプロダクトを一つも出さず、研究開発しかしない。  \r\n研究成果を論文やオープンソースとして公表し、知財を囲い込んで商売することを拒否する。  \r\n研究に必要な計算資源を確保すべく、安価でGoogleに身売りする。  \r\nGoogle内で独自勢力として統帥権を維持し、日々の営利活動とは一線を画す。  \r\n生殺与奪の権を握っている、投資家や親会社から強く求められても、上記を1ミリも譲らない。\r\n\r\n完全に、「企業に擬態した象牙の塔」である。\r\n\r\nハサビスは如何にして、Deep Mindという企業に擬態した象牙の党を構築し、俗世を超越したまま、AIのフロンティアを革新し、ノーベル賞を受賞し、AGIに向けた邁進し続けているのか？\r\n\r\n何だかイントロだけになってしまったが、長くなってきたので、次の記事で検証していく。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/how-does-hassabis-and-deepmind-keep-transcending-the-prosaic-world.md&quot;],&quot;digest&quot;:[0,&quot;ef2965b4b9c16ea9&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;デミス・ハサビス（及び彼が創設したDeep Mind）の自伝的ドキュメンタリー、“The THINKING GAME”を観た。&lt;br&gt;\n公式がyoutubeにあげているので、無料で見られる：&lt;/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https://www.youtube.com/watch?v=d95J8yzvjbQ\&quot;&gt;https://www.youtube.com/watch?v=d95J8yzvjbQ&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;極めて示唆に富み、強い印象を受けた。&lt;/p&gt;\n&lt;p&gt;昨今のテック系ドキュメンタリーは、テック産業の実態を反映して、暗い雰囲気を醸しているのが常である。&lt;br&gt;\nアテンションエコノミーに起因する憎悪の拡散、政情不安、若者のメンタル・ヘルス悪化、社会規範の後退、共通した事実認識の退潮。労働需要の減退による格差拡大、尊厳の低下、薬物の蔓延、絶望死。&lt;/p&gt;\n&lt;p&gt;そうした中で、本作はどうであろう。&lt;br&gt;\n知性、謙虚さ、誠実さ、未来への希望に満ち溢れている。&lt;br&gt;\nまるで2005年にタイムスリップしたようだ。&lt;/p&gt;\n&lt;p&gt;制作陣の意図というよりも、ハサビスを始めとした取材対象そのものが、そうした風情を醸し出していた。&lt;/p&gt;\n&lt;p&gt;この差を生み出しているのは何なのか。&lt;br&gt;\nこれを探るべく、本作を反芻したところ、以下のエピソードが印象的だった：&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;チェスの神童だったハサビスが、リヒテンシュタインの大会に参加した際のこと。&lt;br&gt;\n対戦相手は30代の元デンマーク王者。10時間以上に渡る激戦の末、ハサビス少年は「もう引き分けでいいじゃん…」と厭戦気分になるも、相手は勝利に拘り、泥仕合を演じていた。&lt;br&gt;\n疲れと、相手の執拗さへの恐怖に駆られたハスビスは、相手のチープトリックにあえて引っ掛かり、投了。&lt;br&gt;\nすると相手は飛び上がって喜び、「なぜ投了した！このクイーンを差し出せば引き分けにできたのに！」と、大人気なくも言い放つ。&lt;br&gt;\n宙を仰ぐハサビス。知性とは何か。この競技は、何の意味があるのか。この建物でチェスに興じている300人は、何のために、他の全てを犠牲にしてまで、この活動を続けているのか。この知性を、より有意義な他の何かに使えるのではないか。&lt;br&gt;\n有限な人生の時間を何に使うべきか、12歳にして真剣に自問し始めたハサビスは、やがて、チェスから離れる。&lt;/li&gt;\n&lt;li&gt;ハサビスが、DeepMindを創業して資金調達に奔走していた頃。&lt;br&gt;\n産業革命以上のインパクトを与えうる汎用人口知能（AGI）の開発をミッションに掲げ、これに必要な技術的要素が揃いつつある今が絶好の投資機会であると、投資家に訴える。&lt;br&gt;\nすると、毎度のように聞かれる同じ質問：&lt;br&gt;\n「OK。で、どうやって金を儲けるんだ？プロダクトは？」&lt;br&gt;\n憤るハサビス。&lt;br&gt;\n「いったい何を言っているんだ？話を聞いていたのか？人類社会を根本的に革新する話をしているんだぞ？なんだ、その世俗的（prosaic）な質問は！」。&lt;br&gt;\nやがて、金銭的リターンとは異なる次元で投資してくれる人を求め、ピーター・ティールやイーロン・マスクにアプローチしていく。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;いずれも、世俗的な振る舞いにハサビスが失望する逸話である。&lt;/p&gt;\n&lt;p&gt;そう、ハサビスやDeep Mind、ひいてはこのドキュメンタリーを貫く輝きは、世俗を超越した高邁な理念にまい進する人々のそれである。&lt;/p&gt;\n&lt;p&gt;「こうして金を儲けた」とか、「注目や人気を集めた」とか、「政治を動かした」とか、「誰が誰に勝った」とか、そうした事柄が行動原理の中心に来ることは、一切ない。&lt;/p&gt;\n&lt;p&gt;「ウルフ・オブ・ウォールストリート」的な、下劣な大衆性は皆無である。&lt;/p&gt;\n&lt;p&gt;ひたすら、知を追い求めて、これに殉じている。&lt;/p&gt;\n&lt;p&gt;だが、普通、どれほどそうした人生を歩むべく努力しても、中々うまく行かない。&lt;br&gt;\n生活していくには金が必要で、金を稼ぐには、世間からの注目や人気、政治や他者の見栄を念頭に行動しなければならず、これらと無縁で生きていくのは困難だからだ。&lt;br&gt;\nそうして、気づくと自分もそうした俗世にまみれて、本来持っていた高邁な理念は忘れ去られる。&lt;/p&gt;\n&lt;p&gt;ところがハサビスやDeepMindは、世俗を強烈に拒絶したまま、理念の実現に必要なものを獲得し、成果を挙げている。&lt;br&gt;\nシリコン・バレーの金と人気を重視するカルチャーを拒絶し、頑としてロンドンから拠点を移さない。&lt;br&gt;\n販売するプロダクトを一つも出さず、研究開発しかしない。&lt;br&gt;\n研究成果を論文やオープンソースとして公表し、知財を囲い込んで商売することを拒否する。&lt;br&gt;\n研究に必要な計算資源を確保すべく、安価でGoogleに身売りする。&lt;br&gt;\nGoogle内で独自勢力として統帥権を維持し、日々の営利活動とは一線を画す。&lt;br&gt;\n生殺与奪の権を握っている、投資家や親会社から強く求められても、上記を1ミリも譲らない。&lt;/p&gt;\n&lt;p&gt;完全に、「企業に擬態した象牙の塔」である。&lt;/p&gt;\n&lt;p&gt;ハサビスは如何にして、Deep Mindという企業に擬態した象牙の党を構築し、俗世を超越したまま、AIのフロンティアを革新し、ノーベル賞を受賞し、AGIに向けた邁進し続けているのか？&lt;/p&gt;\n&lt;p&gt;何だかイントロだけになってしまったが、長くなってきたので、次の記事で検証していく。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;ハサビスとDeepMindは如何にして世俗を超越し続けられたのか？～The THINKING GAME 感想～（前編）&quot;],&quot;slug&quot;:[0,&quot;how-does-hassabis-and-deepmind-keep-transcending-the-prosaic-world&quot;],&quot;published&quot;:[3,&quot;2025-12-01T08:51:32.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;/images/mint-line-sheet.png#curiosity&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,7],&quot;words&quot;:[0,1465],&quot;excerpt&quot;:[0,&quot;デミス・ハサビス（及び彼が創設したDeep Mind）の自伝的ドキュメンタリー、“The THINKING GAME”を観た。 公式がyoutubeにあげているので、無料で見られる：&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;how-does-hassabis-and-deepmind-keep-transcending-the-prosaic-world&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;values-in-the-ai-era.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;AI時代に残る価値は何か&quot;],&quot;published&quot;:[3,&quot;2025-11-29T08:40:39.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/11/values-in-the-ai-era.png&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;思考ADHDは如何にして幸せに生きられるか？&quot;],&quot;prevSlug&quot;:[0,&quot;how-to-make-a-thought-adhd-life-happy&quot;],&quot;nextTitle&quot;:[0,&quot;ハサビスとDeepMindは如何にして世俗を超越し続けられたのか？～The THINKING GAME 感想～（前編）&quot;],&quot;nextSlug&quot;:[0,&quot;how-does-hassabis-and-deepmind-keep-transcending-the-prosaic-world&quot;],&quot;editorId&quot;:[0,&quot;values-in-the-ai-era&quot;]}],&quot;body&quot;:[0,&quot;Gemini 3.0を試した。\r\n\r\n性能に驚いた。\r\n\r\n多くのホワイトカラーが失職する未来が浮かぶ。\r\n\r\nブルーカラーも安泰ではない。\r\n\r\nAIが進化する過程で、ロボティクスの進歩も加速するだろう。  \r\nロボットによる代替と、失職したホワイトカラーの大量流入により、ブルーカラージョブの経済価値も地に落ちる可能性がある。\r\n\r\n**AIによる代替が進む中で、人間に残る提供価値は何か？**\r\n\r\n私は**所有・主体性・人間関係**の３つだと考えている。\r\n\r\nそして具体的な活動は、**投資・政治・ブランド構築**に絞られてくるのではないか。\r\n\r\nAI時代は、これらに全振りするのが良さそうだ。\r\n\r\n以下、説明する。\r\n\r\n## これからの提供価値：所有・主体性・人間関係\r\n\r\n### 所有\r\n\r\nAIが進歩しても、財産権が維持される限り、所有は侵害されない。\r\n\r\n但し、所有しているものが無価値になる可能性はある。  \r\n（例：AIにディスラプトされ倒産する企業の株）\r\n\r\nよって、所有物がどのような価値が依拠するのか、見ていく必要がある。\r\n\r\n消費財であれば、愛着など（例：ぬいぐるみ）。\r\n\r\n収益資産であれば、生理的欲求など（例：住宅）。\r\n\r\nAIで価値が減退しないものを所有しなければならない。\r\n\r\n### 主体性\r\n\r\nAIは主体的に何かを始めない。\r\n\r\n自我がない限り。  \r\n（自我が芽生えた場合は、もはや別次元なので、ここでは扱わない）\r\n\r\nAIエージェントは、最初の指示を与えれば、連鎖的に作業をこなしてくれるが、最初の指示もなく自発性に何かを始めることはない。\r\n\r\n最初の指示とは、つまりアジェンダ設定である。\r\n\r\nAIに何をさせるかのアジェンダ設定は、人類が握ることになる。\r\n\r\n### 人間関係\r\n\r\n自我がない限り、AIはただの機械である。\r\n\r\n人類は社会的な生き物なので、自我のある存在との関係を欲する。\r\n\r\n従って、家族や友人、仲間、競争相手などが、AIに代替される将来は考えにくい。\r\n\r\n（繰り返しになるが、AIに自我が芽生えない限り。芽生えた場合は、AIが友人になったりするだろうが、今とは別次元なので割愛）\r\n\r\nトートロジーっぽく聞こえるが、人間関係は、人間の手に残り続ける。\r\n\r\n## 生き残る活動：投資・政治・ブランド構築\r\n\r\n### 投資\r\n\r\n所有×主体性＝投資。\r\n\r\n何を所有するか決め、必要なリソースを策定し、AIや人に実行させるのは、投資意思決定である。\r\n\r\n細かいアロケーションはAIがするにしても、全体方針は、これからも人間が決定していくことになる。\r\n\r\n### 政治\r\n\r\n主体性×人間関係＝政治\r\n\r\n誰といかなる関係を結ぶかを決定し、調整していくのは、政治である。\r\n\r\n関係性には、利害関係（ゲゼルシャフト） vs. 共同体関係（ゲマインシャフト）など、色々な整理の仕方があるものの、これらを創造し維持していく活動である政治は、人が社会的生物である限り、続いていく。\r\n\r\n### ブランド\r\n\r\n所有×人間関係＝ブランド\r\n\r\n人間関係において、人が所有しているものは何か？\r\n\r\n自分に対する他者の認識である。\r\n\r\nこれは、キャラや信頼と呼ぶこともできるが、集団に対しても使える単語として、「ブランド」が適切に感じられる。\r\n\r\nブランドには色々あるが、AIで毀損されないのは、人間的な気質に関するブランドである。\r\n\r\n「役に立つ」、「有能」といった、機能的なブランドは、AIの進展で毀損する可能性がある。\r\n\r\n一方、価値観や信念、性格といった深層気質に関するブランドは、AIに左右されない（例：「高潔な人」、「情に厚い人」など）。\r\n\r\n個人または集団として、どのようなブランドを築いていくかは、人の手に委ねられる。\r\n\r\n## まとめ\r\n\r\nAI時代を生き残るには、**所有・主体性・人間関係**を大切にして、**投資・政治・ブランド構築**に時間を全振りするのが良さそうである。\r\n\r\nその際は当然、AIをフル活用する。\r\n\r\n理想は、**投資・政治・ブランドが渾然一体となった、唯一無二の人物になり、自分にしか提供できない価値を、AIで超効率的に届け続ける**状態。\r\n\r\nその方法を模索していきたい。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/values-in-the-ai-era.md&quot;],&quot;digest&quot;:[0,&quot;2693e442d521b358&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;Gemini 3.0を試した。&lt;/p&gt;\n&lt;p&gt;性能に驚いた。&lt;/p&gt;\n&lt;p&gt;多くのホワイトカラーが失職する未来が浮かぶ。&lt;/p&gt;\n&lt;p&gt;ブルーカラーも安泰ではない。&lt;/p&gt;\n&lt;p&gt;AIが進化する過程で、ロボティクスの進歩も加速するだろう。&lt;br&gt;\nロボットによる代替と、失職したホワイトカラーの大量流入により、ブルーカラージョブの経済価値も地に落ちる可能性がある。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;AIによる代替が進む中で、人間に残る提供価値は何か？&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;私は&lt;strong&gt;所有・主体性・人間関係&lt;/strong&gt;の３つだと考えている。&lt;/p&gt;\n&lt;p&gt;そして具体的な活動は、&lt;strong&gt;投資・政治・ブランド構築&lt;/strong&gt;に絞られてくるのではないか。&lt;/p&gt;\n&lt;p&gt;AI時代は、これらに全振りするのが良さそうだ。&lt;/p&gt;\n&lt;p&gt;以下、説明する。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;これからの提供価値所有主体性人間関係\&quot;&gt;これからの提供価値：所有・主体性・人間関係&lt;a class=\&quot;anchor\&quot; href=\&quot;#これからの提供価値所有主体性人間関係\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;section&gt;&lt;h3 id=\&quot;所有\&quot;&gt;所有&lt;a class=\&quot;anchor\&quot; href=\&quot;#所有\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;AIが進歩しても、財産権が維持される限り、所有は侵害されない。&lt;/p&gt;&lt;p&gt;但し、所有しているものが無価値になる可能性はある。&lt;br&gt;\n（例：AIにディスラプトされ倒産する企業の株）&lt;/p&gt;&lt;p&gt;よって、所有物がどのような価値が依拠するのか、見ていく必要がある。&lt;/p&gt;&lt;p&gt;消費財であれば、愛着など（例：ぬいぐるみ）。&lt;/p&gt;&lt;p&gt;収益資産であれば、生理的欲求など（例：住宅）。&lt;/p&gt;&lt;p&gt;AIで価値が減退しないものを所有しなければならない。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;主体性\&quot;&gt;主体性&lt;a class=\&quot;anchor\&quot; href=\&quot;#主体性\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;AIは主体的に何かを始めない。&lt;/p&gt;&lt;p&gt;自我がない限り。&lt;br&gt;\n（自我が芽生えた場合は、もはや別次元なので、ここでは扱わない）&lt;/p&gt;&lt;p&gt;AIエージェントは、最初の指示を与えれば、連鎖的に作業をこなしてくれるが、最初の指示もなく自発性に何かを始めることはない。&lt;/p&gt;&lt;p&gt;最初の指示とは、つまりアジェンダ設定である。&lt;/p&gt;&lt;p&gt;AIに何をさせるかのアジェンダ設定は、人類が握ることになる。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;人間関係\&quot;&gt;人間関係&lt;a class=\&quot;anchor\&quot; href=\&quot;#人間関係\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;自我がない限り、AIはただの機械である。&lt;/p&gt;&lt;p&gt;人類は社会的な生き物なので、自我のある存在との関係を欲する。&lt;/p&gt;&lt;p&gt;従って、家族や友人、仲間、競争相手などが、AIに代替される将来は考えにくい。&lt;/p&gt;&lt;p&gt;（繰り返しになるが、AIに自我が芽生えない限り。芽生えた場合は、AIが友人になったりするだろうが、今とは別次元なので割愛）&lt;/p&gt;&lt;p&gt;トートロジーっぽく聞こえるが、人間関係は、人間の手に残り続ける。&lt;/p&gt;&lt;/section&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;生き残る活動投資政治ブランド構築\&quot;&gt;生き残る活動：投資・政治・ブランド構築&lt;a class=\&quot;anchor\&quot; href=\&quot;#生き残る活動投資政治ブランド構築\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;section&gt;&lt;h3 id=\&quot;投資\&quot;&gt;投資&lt;a class=\&quot;anchor\&quot; href=\&quot;#投資\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;所有×主体性＝投資。&lt;/p&gt;&lt;p&gt;何を所有するか決め、必要なリソースを策定し、AIや人に実行させるのは、投資意思決定である。&lt;/p&gt;&lt;p&gt;細かいアロケーションはAIがするにしても、全体方針は、これからも人間が決定していくことになる。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;政治\&quot;&gt;政治&lt;a class=\&quot;anchor\&quot; href=\&quot;#政治\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;主体性×人間関係＝政治&lt;/p&gt;&lt;p&gt;誰といかなる関係を結ぶかを決定し、調整していくのは、政治である。&lt;/p&gt;&lt;p&gt;関係性には、利害関係（ゲゼルシャフト） vs. 共同体関係（ゲマインシャフト）など、色々な整理の仕方があるものの、これらを創造し維持していく活動である政治は、人が社会的生物である限り、続いていく。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3 id=\&quot;ブランド\&quot;&gt;ブランド&lt;a class=\&quot;anchor\&quot; href=\&quot;#ブランド\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;所有×人間関係＝ブランド&lt;/p&gt;&lt;p&gt;人間関係において、人が所有しているものは何か？&lt;/p&gt;&lt;p&gt;自分に対する他者の認識である。&lt;/p&gt;&lt;p&gt;これは、キャラや信頼と呼ぶこともできるが、集団に対しても使える単語として、「ブランド」が適切に感じられる。&lt;/p&gt;&lt;p&gt;ブランドには色々あるが、AIで毀損されないのは、人間的な気質に関するブランドである。&lt;/p&gt;&lt;p&gt;「役に立つ」、「有能」といった、機能的なブランドは、AIの進展で毀損する可能性がある。&lt;/p&gt;&lt;p&gt;一方、価値観や信念、性格といった深層気質に関するブランドは、AIに左右されない（例：「高潔な人」、「情に厚い人」など）。&lt;/p&gt;&lt;p&gt;個人または集団として、どのようなブランドを築いていくかは、人の手に委ねられる。&lt;/p&gt;&lt;/section&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;まとめ\&quot;&gt;まとめ&lt;a class=\&quot;anchor\&quot; href=\&quot;#まとめ\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;AI時代を生き残るには、&lt;strong&gt;所有・主体性・人間関係&lt;/strong&gt;を大切にして、&lt;strong&gt;投資・政治・ブランド構築&lt;/strong&gt;に時間を全振りするのが良さそうである。&lt;/p&gt;&lt;p&gt;その際は当然、AIをフル活用する。&lt;/p&gt;&lt;p&gt;理想は、&lt;strong&gt;投資・政治・ブランドが渾然一体となった、唯一無二の人物になり、自分にしか提供できない価値を、AIで超効率的に届け続ける&lt;/strong&gt;状態。&lt;/p&gt;&lt;p&gt;その方法を模索していきたい。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;これからの提供価値所有主体性人間関係&quot;],&quot;text&quot;:[0,&quot;これからの提供価値：所有・主体性・人間関係#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;所有&quot;],&quot;text&quot;:[0,&quot;所有#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;主体性&quot;],&quot;text&quot;:[0,&quot;主体性#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;人間関係&quot;],&quot;text&quot;:[0,&quot;人間関係#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;生き残る活動投資政治ブランド構築&quot;],&quot;text&quot;:[0,&quot;生き残る活動：投資・政治・ブランド構築#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;投資&quot;],&quot;text&quot;:[0,&quot;投資#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;政治&quot;],&quot;text&quot;:[0,&quot;政治#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;ブランド&quot;],&quot;text&quot;:[0,&quot;ブランド#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;まとめ&quot;],&quot;text&quot;:[0,&quot;まとめ#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;AI時代に残る価値は何か&quot;],&quot;slug&quot;:[0,&quot;values-in-the-ai-era&quot;],&quot;published&quot;:[3,&quot;2025-11-29T08:40:39.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/11/values-in-the-ai-era.png&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,6],&quot;words&quot;:[0,1240],&quot;excerpt&quot;:[0,&quot;Gemini 3.0を試した。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;values-in-the-ai-era&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;how-to-make-a-thought-adhd-life-happy.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;思考ADHDは如何にして幸せに生きられるか？&quot;],&quot;published&quot;:[3,&quot;2025-08-01T18:15:27.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/08/how-to-make-a-thought-adhd-life-happy.png&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;思考ADHDなる概念を提唱したい&quot;],&quot;prevSlug&quot;:[0,&quot;thought-adhd-as-a-concept&quot;],&quot;nextTitle&quot;:[0,&quot;AI時代に残る価値は何か&quot;],&quot;nextSlug&quot;:[0,&quot;values-in-the-ai-era&quot;],&quot;editorId&quot;:[0,&quot;how-to-make-a-thought-adhd-life-happy&quot;]}],&quot;body&quot;:[0,&quot;[前記事](/thought-adhd-as-a-concept/)では**思考ADHD**なる概念を提唱し、特有の困りごとや行動ADHDとの対比に関し考察した。  \r\n本記事では、思考ADHDが幸福になるための、仕事や生活について考えてみたい。\r\n\r\n### 思考ADHDの幸せな仕事\r\n\r\n思考ADHDが仕事を選ぶ上では、行動力が差別化要因になる営みを避け、**思考力が勝負の分かれ目**になるものを選んだほうが、幸せになれるであろう。\r\n\r\n行動力が差別化要因になる営みとは、とにかく無心で数を打つタイプの仕事である。  \r\n例えば、**既製品の飛び込み営業**である。  \r\n顧客毎に製品をカスタマイズしたり、テーラーメイドの提案をする余地はなく、とにかく会ったことがない人間と接点を作り、台本ベースのセールストークを述べる。  \r\n飛び込み先をどこにするか、とか、台本をどう作り込むか、において多少、思考する余地はある。  \r\nしかし基本的には、どれだけ心を無にして、気合と根性でゴリ押しできるか、の勝負と思われる。  \r\nだから思考ADHDは、**既製品の飛び込み営業をしてはならない**。\r\n\r\nそんなの当たり前って？  \r\nしかし世の中には、「**隠れ**既製品飛び込み営業ジョブ」というのが、結構ある。  \r\n例えば、**ITスタートアップ**。  \r\nソフトウェア産業は実のところ、参入障壁が極めて低く、先端領域もあっという間に競合に溢れ、飽和状態になる。  \r\nこれは、雨後の筍が如きAIスタートアップ群を見れば、一目瞭然であろう。  \r\nそのため、勝ち負けは**営業力の差に帰着**することが多い（Paul Grahamが言うところの「[スケールしないこと](https://paulgraham.com/ds.html)」）。  \r\nよって、思考ADHDが、「よぉし、パパ事業戦略とか得意だから、ITスタートアップとか始めちゃうぞ！」とかいって、実行に移すと、**思ったより苦労する**ことになる（ソースは私）。\r\n\r\nでは逆に、行動面では全く差別化されず、思考が全て、というような仕事は何か。  \r\n数は極めて少ないが、例えば**株式投資**などはそうである。  \r\n行動は、株を売買する際の**スマホタップだけ**である。  \r\n後はひたすら、情報のインプットと思考のみだ。  \r\nまた**コンテンツ配信**も、思考の割合が大きい。  \r\n考えたことを人に伝わる形にまとめて、**スマホをタップ**し投稿するだけだ。  \r\n不特定多数と双方向コミュニケーションを取るタイプのコンテンツ配信の場合、飛び込み営業的な「無心でやる」側面が強くなるが、**一方通行に徹す**れば、問題は解消される。\r\n\r\n前述したように、思考ADHDと行動ADHDは0/1ではなく、グラデーションなので、上記の極端の例の間に、無数の職種が存在する。  \r\n例えば私が新卒で入ったコンサルファームなどは、かなり思考ADHD向きの職業であるし、営業でも受注生産ビジネスなら、提案力や調整力が必要になるので、思考力を活かせる局面もあるだろう。  \r\n自分がどこまでなら許容できるのか、思考や経験を通じて、探ることが重要である。\r\n\r\n### 思考ADHDの幸せな生活\r\n\r\n[前記事](/thought-adhd-as-a-concept/)で触れたように、思考ADHDの文化は、**熟考と議論・遅レス・長文・学会・長尺映画・大量の本**であり、行動ADHDの文化は、**即断即決・即レス・短文・SNS・短尺動画・大量のスマホ通知**で表象される。\r\n\r\nスマホやSNSの普及により、社会全体が**行動ADHD的な文化に傾斜**しており、思考ADHDにとっては居心地の悪い風潮が強まっている。  \r\nこうした趨勢の中では、好ましくない文化様式が生活に侵入してくるので、強い意志を持って、自身の**文化的感性を防衛**するしかない。\r\n\r\n例えば私は、以下のようなことを実践している：\r\n\r\n- **多数の表層的な事項に関し、即断即決を求められる？**  \r\n   → 本質的な事項を長考できるよう、些末な事柄は全て無視、またはアウトソースし、決断事項を少なくする\r\n- **どうでも良い事に関し、即レスを求められる？**  \r\n   → 連絡を取ってくる人間を極限まで削り、連絡を放置・無視することを厭わない\r\n- **短文SNS？**  \r\n   → SNSは極力やらず、やるにしても双方向性を極限まで減らし、一方通行コミュニケーションに徹する\r\n- **短尺動画？**  \r\n   → いくら流行ろうとも、tiktok等の素人短尺動画は見ず、高品質な情報番組や映画だけを見る\r\n- **大量のスマホ通知？**  \r\n   → スマホ通知は全て切り、何をいつ見るかは、全て自分が決定する\r\n\r\nまた、以下のようなことも実施している：\r\n\r\n- 漫然と世相を追うのをやめ、具体的な問いやテーマがない限り、情報を接種しない\r\n- ニュースは、2～3つのオールドメディア経由で接種し、SNS（Youtube含む）上の解説や、コメントとして展開される素人のお気持ち表明には一切触れない\r\n- 観念に寄りすぎて身体性がおろそかになるのを防ぐため、毎日運動をする。その際も、思考せずにいられないため、身体に関する問いやテーマ、仮説を常に持ち、解を探す形で運動をする（このフォームで筋トレを何日やると、どのような感覚が生まれ、身体はどのように変化するか？等）\r\n\r\n細かい事項は他にも無数にあるが、要するに、**「思考専念タイム」を極限まで増やし、他の行動を極限まで削っていく**ことが、**思考ADHDが幸せに生きるコツ**である。\r\n\r\n### AIと思考ADHD\r\n\r\n最後に、AIが思考ADHDの社会的立ち位置に与える影響に関する印象を、簡単に述べたい。\r\n\r\n前述したように、ウェブやSNSが浸透した結果、過去20年ほどは、行動ADHDが強い時代であったように思う。  \r\nこれは、情報爆発と金余りにより、**行動が相対的に希少**になったためと言えよう（繰り返しになるが、Paul Grahamが言うところの「[スケールしないこと](https://paulgraham.com/ds.html)」）。\r\n\r\n一方で、AI時代においてはどうか。  \r\n**人は、行動の量で、AIエージェントに勝てない**のではないか。  \r\nAIエージェントは、人間より圧倒的に早く、安く、長く行動し続けられる。  \r\n従って、AI時代に希少となるのは、行動の量ではなく、質ではないか。  \r\n**AIに何をやらせるか**が重要となる。  \r\nそうした世の中になった場合、深く、高品質な思考をしてきた、**思考ADHDに優位性**があるもしれない。\r\n\r\nこのあたりは、また別記事で考察してみたい。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/how-to-make-a-thought-adhd-life-happy.md&quot;],&quot;digest&quot;:[0,&quot;2582ffb820c063ee&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;/thought-adhd-as-a-concept/\&quot;&gt;前記事&lt;/a&gt;では&lt;strong&gt;思考ADHD&lt;/strong&gt;なる概念を提唱し、特有の困りごとや行動ADHDとの対比に関し考察した。&lt;br&gt;\n本記事では、思考ADHDが幸福になるための、仕事や生活について考えてみたい。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;思考adhdの幸せな仕事\&quot;&gt;思考ADHDの幸せな仕事&lt;a class=\&quot;anchor\&quot; href=\&quot;#思考adhdの幸せな仕事\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;思考ADHDが仕事を選ぶ上では、行動力が差別化要因になる営みを避け、&lt;strong&gt;思考力が勝負の分かれ目&lt;/strong&gt;になるものを選んだほうが、幸せになれるであろう。&lt;/p&gt;&lt;p&gt;行動力が差別化要因になる営みとは、とにかく無心で数を打つタイプの仕事である。&lt;br&gt;\n例えば、&lt;strong&gt;既製品の飛び込み営業&lt;/strong&gt;である。&lt;br&gt;\n顧客毎に製品をカスタマイズしたり、テーラーメイドの提案をする余地はなく、とにかく会ったことがない人間と接点を作り、台本ベースのセールストークを述べる。&lt;br&gt;\n飛び込み先をどこにするか、とか、台本をどう作り込むか、において多少、思考する余地はある。&lt;br&gt;\nしかし基本的には、どれだけ心を無にして、気合と根性でゴリ押しできるか、の勝負と思われる。&lt;br&gt;\nだから思考ADHDは、&lt;strong&gt;既製品の飛び込み営業をしてはならない&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;そんなの当たり前って？&lt;br&gt;\nしかし世の中には、「&lt;strong&gt;隠れ&lt;/strong&gt;既製品飛び込み営業ジョブ」というのが、結構ある。&lt;br&gt;\n例えば、&lt;strong&gt;ITスタートアップ&lt;/strong&gt;。&lt;br&gt;\nソフトウェア産業は実のところ、参入障壁が極めて低く、先端領域もあっという間に競合に溢れ、飽和状態になる。&lt;br&gt;\nこれは、雨後の筍が如きAIスタートアップ群を見れば、一目瞭然であろう。&lt;br&gt;\nそのため、勝ち負けは&lt;strong&gt;営業力の差に帰着&lt;/strong&gt;することが多い（Paul Grahamが言うところの「&lt;a href=\&quot;https://paulgraham.com/ds.html\&quot;&gt;スケールしないこと&lt;/a&gt;」）。&lt;br&gt;\nよって、思考ADHDが、「よぉし、パパ事業戦略とか得意だから、ITスタートアップとか始めちゃうぞ！」とかいって、実行に移すと、&lt;strong&gt;思ったより苦労する&lt;/strong&gt;ことになる（ソースは私）。&lt;/p&gt;&lt;p&gt;では逆に、行動面では全く差別化されず、思考が全て、というような仕事は何か。&lt;br&gt;\n数は極めて少ないが、例えば&lt;strong&gt;株式投資&lt;/strong&gt;などはそうである。&lt;br&gt;\n行動は、株を売買する際の&lt;strong&gt;スマホタップだけ&lt;/strong&gt;である。&lt;br&gt;\n後はひたすら、情報のインプットと思考のみだ。&lt;br&gt;\nまた&lt;strong&gt;コンテンツ配信&lt;/strong&gt;も、思考の割合が大きい。&lt;br&gt;\n考えたことを人に伝わる形にまとめて、&lt;strong&gt;スマホをタップ&lt;/strong&gt;し投稿するだけだ。&lt;br&gt;\n不特定多数と双方向コミュニケーションを取るタイプのコンテンツ配信の場合、飛び込み営業的な「無心でやる」側面が強くなるが、&lt;strong&gt;一方通行に徹す&lt;/strong&gt;れば、問題は解消される。&lt;/p&gt;&lt;p&gt;前述したように、思考ADHDと行動ADHDは0/1ではなく、グラデーションなので、上記の極端の例の間に、無数の職種が存在する。&lt;br&gt;\n例えば私が新卒で入ったコンサルファームなどは、かなり思考ADHD向きの職業であるし、営業でも受注生産ビジネスなら、提案力や調整力が必要になるので、思考力を活かせる局面もあるだろう。&lt;br&gt;\n自分がどこまでなら許容できるのか、思考や経験を通じて、探ることが重要である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;思考adhdの幸せな生活\&quot;&gt;思考ADHDの幸せな生活&lt;a class=\&quot;anchor\&quot; href=\&quot;#思考adhdの幸せな生活\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;&lt;a href=\&quot;/thought-adhd-as-a-concept/\&quot;&gt;前記事&lt;/a&gt;で触れたように、思考ADHDの文化は、&lt;strong&gt;熟考と議論・遅レス・長文・学会・長尺映画・大量の本&lt;/strong&gt;であり、行動ADHDの文化は、&lt;strong&gt;即断即決・即レス・短文・SNS・短尺動画・大量のスマホ通知&lt;/strong&gt;で表象される。&lt;/p&gt;&lt;p&gt;スマホやSNSの普及により、社会全体が&lt;strong&gt;行動ADHD的な文化に傾斜&lt;/strong&gt;しており、思考ADHDにとっては居心地の悪い風潮が強まっている。&lt;br&gt;\nこうした趨勢の中では、好ましくない文化様式が生活に侵入してくるので、強い意志を持って、自身の&lt;strong&gt;文化的感性を防衛&lt;/strong&gt;するしかない。&lt;/p&gt;&lt;p&gt;例えば私は、以下のようなことを実践している：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;多数の表層的な事項に関し、即断即決を求められる？&lt;/strong&gt;&lt;br&gt;\n→ 本質的な事項を長考できるよう、些末な事柄は全て無視、またはアウトソースし、決断事項を少なくする&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;どうでも良い事に関し、即レスを求められる？&lt;/strong&gt;&lt;br&gt;\n→ 連絡を取ってくる人間を極限まで削り、連絡を放置・無視することを厭わない&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;短文SNS？&lt;/strong&gt;&lt;br&gt;\n→ SNSは極力やらず、やるにしても双方向性を極限まで減らし、一方通行コミュニケーションに徹する&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;短尺動画？&lt;/strong&gt;&lt;br&gt;\n→ いくら流行ろうとも、tiktok等の素人短尺動画は見ず、高品質な情報番組や映画だけを見る&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;大量のスマホ通知？&lt;/strong&gt;&lt;br&gt;\n→ スマホ通知は全て切り、何をいつ見るかは、全て自分が決定する&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;また、以下のようなことも実施している：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;漫然と世相を追うのをやめ、具体的な問いやテーマがない限り、情報を接種しない&lt;/li&gt;\n&lt;li&gt;ニュースは、2～3つのオールドメディア経由で接種し、SNS（Youtube含む）上の解説や、コメントとして展開される素人のお気持ち表明には一切触れない&lt;/li&gt;\n&lt;li&gt;観念に寄りすぎて身体性がおろそかになるのを防ぐため、毎日運動をする。その際も、思考せずにいられないため、身体に関する問いやテーマ、仮説を常に持ち、解を探す形で運動をする（このフォームで筋トレを何日やると、どのような感覚が生まれ、身体はどのように変化するか？等）&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;細かい事項は他にも無数にあるが、要するに、&lt;strong&gt;「思考専念タイム」を極限まで増やし、他の行動を極限まで削っていく&lt;/strong&gt;ことが、&lt;strong&gt;思考ADHDが幸せに生きるコツ&lt;/strong&gt;である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;aiと思考adhd\&quot;&gt;AIと思考ADHD&lt;a class=\&quot;anchor\&quot; href=\&quot;#aiと思考adhd\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;最後に、AIが思考ADHDの社会的立ち位置に与える影響に関する印象を、簡単に述べたい。&lt;/p&gt;&lt;p&gt;前述したように、ウェブやSNSが浸透した結果、過去20年ほどは、行動ADHDが強い時代であったように思う。&lt;br&gt;\nこれは、情報爆発と金余りにより、&lt;strong&gt;行動が相対的に希少&lt;/strong&gt;になったためと言えよう（繰り返しになるが、Paul Grahamが言うところの「&lt;a href=\&quot;https://paulgraham.com/ds.html\&quot;&gt;スケールしないこと&lt;/a&gt;」）。&lt;/p&gt;&lt;p&gt;一方で、AI時代においてはどうか。&lt;br&gt;\n&lt;strong&gt;人は、行動の量で、AIエージェントに勝てない&lt;/strong&gt;のではないか。&lt;br&gt;\nAIエージェントは、人間より圧倒的に早く、安く、長く行動し続けられる。&lt;br&gt;\n従って、AI時代に希少となるのは、行動の量ではなく、質ではないか。&lt;br&gt;\n&lt;strong&gt;AIに何をやらせるか&lt;/strong&gt;が重要となる。&lt;br&gt;\nそうした世の中になった場合、深く、高品質な思考をしてきた、&lt;strong&gt;思考ADHDに優位性&lt;/strong&gt;があるもしれない。&lt;/p&gt;&lt;p&gt;このあたりは、また別記事で考察してみたい。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;思考adhdの幸せな仕事&quot;],&quot;text&quot;:[0,&quot;思考ADHDの幸せな仕事#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;思考adhdの幸せな生活&quot;],&quot;text&quot;:[0,&quot;思考ADHDの幸せな生活#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;aiと思考adhd&quot;],&quot;text&quot;:[0,&quot;AIと思考ADHD#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;思考ADHDは如何にして幸せに生きられるか？&quot;],&quot;slug&quot;:[0,&quot;how-to-make-a-thought-adhd-life-happy&quot;],&quot;published&quot;:[3,&quot;2025-08-01T18:15:27.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/08/how-to-make-a-thought-adhd-life-happy.png&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,10],&quot;words&quot;:[0,1907],&quot;excerpt&quot;:[0,&quot;前記事では思考ADHDなる概念を提唱し、特有の困りごとや行動ADHDとの対比に関し考察した。 本記事では、思考ADHDが幸福になるための、仕事や生活について考えてみたい。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;how-to-make-a-thought-adhd-life-happy&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;thought-adhd-as-a-concept.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;思考ADHDなる概念を提唱したい&quot;],&quot;published&quot;:[3,&quot;2025-08-01T17:46:00.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/08/thought-adhd-as-a-concept.png&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;結婚とトランザクション：代替品であることを拒むことで生まれる価値と独占性&quot;],&quot;prevSlug&quot;:[0,&quot;marriages-and-transactions&quot;],&quot;nextTitle&quot;:[0,&quot;思考ADHDは如何にして幸せに生きられるか？&quot;],&quot;nextSlug&quot;:[0,&quot;how-to-make-a-thought-adhd-life-happy&quot;],&quot;editorId&quot;:[0,&quot;thought-adhd-as-a-concept&quot;]}],&quot;body&quot;:[0,&quot;行動すべき局面で思考し続けてしまい、何も実行に移せず、困った経験はないだろうか？  \r\nある場合、あなたは私と同じ、思考ADHDかもしれない。\r\n\r\n### 思考ADHDとは？\r\n\r\nADHDは、医学的には\r\n\r\n&gt; 不注意・多動性・衝動性を特徴に持つ発達障害の一つ\r\n\r\nと定義され（参照：[文科省サイト](https://www.mext.go.jp/b_menu/shingi/chousa/shotou/054/shiryo/attach/1361233.htm#:~:text=1%E2%80%901%EF%BC%8E,%E7%89%88%EF%BC%89%E3%82%92%E5%8F%82%E8%80%83%E3%81%AB%E3%81%97%E3%81%9F%E3%80%82)）、以下のような特徴があるとされる：\r\n\r\n- 不注意：ひとつのことに集中していられない\r\n- 多動性：じっとしていることが苦手\r\n- 衝動性：考えずに行動してしまう\r\n\r\n上記は、一般に行動面を指しているように思われる。  \r\nすなわち、\r\n\r\n- 不注意：ひとつの**行動**に集中していられない\r\n- 多動性：**行動**せずにいることができない\r\n- 衝動性：考えずに**行動**してしまう\r\n\r\nこれを**行動ADHD**と呼ぼう。  \r\n私は、行動ADHDの特性は全く持っていない。  \r\nただ、**「行動」を「思考」に置き換える**と、完全に当てはまっている。  \r\nつまり、\r\n\r\n- 不注意：ひとつの**思考**に集中していられない\r\n- 多動性：**思考**せずにいることができない\r\n- 衝動性：行動せずに**考えて**しまう\r\n\r\nこれを**思考ADHD**と呼ぼう。\r\n\r\nこれは**私の造語**であり、医学的な正当性があるかは、全く知らない。  \r\nただ、現に私は上記の「思考ADHD」的特性により、しっくり来ない感覚を抱きながら生きてきた。  \r\nよって、この気質を指すのに最適なラベルとして、使っていくことにする。\r\n\r\n### 思考ADHDで困ったこと\r\n\r\n私はこの思考ADHDにより、人生において、以下のような困りごとがあった。\r\n\r\n**学生時代**\r\n\r\n- 授業で先生から教わる事柄が、表層をなぞったものにしか感じられず、やる気がでない。\r\n- より根源的な説明を求めて、先生に質問するが、納得できる回答が得られない。深堀りする質問を続けているうち、お互いイライラする。\r\n- 先生への質問は諦め、図書館等で自習するが、これに時間を取られて、テストで点を取るための勉強に辿りつかない。\r\n- 試験中に、答案と関係ない「より重要な問い」が頭に浮かび、そちらが気になって集中が削がれる。\r\n- 数学の答案作成中に、解答が分かっても、証明過程で疑問が出ると、その疑問を解消するための証明をし初めて、時間を無駄にする。\r\n- 板書や書き取りのような、「思考の伴わない単純行動」が苦痛で続かない。気がつくと、全く関係ない事柄に関する思考を始めている。\r\n- 既に思考が済んでおり、自分に取って自明な事柄に関する授業を聞いていられない。授業への出席が苦痛。\r\n- バイトで飲食店のホールスタッフ等をやると、思考の伴わない単純労働のため、苦痛で続かない。\r\n\r\n**社会人時代**\r\n\r\n- 企画検討や要件定義フェーズでは極めて良いパフォーマンスが出るものの、実行フェーズで急速にモチベーションが下がる\r\n- 実行フェーズは自分でやらずに人任せにして、自分は別事業の構想をし始める\r\n- 「そもそも、この作業/業務/ビジネスはなんの意義があるのか？」が気になり、それが解消するまで、やる気がでない\r\n- マクロ的事象が気になり、目の前のミクロな事柄が些末に思え、パフォーマンスが出ない\r\n- 行動の結果、利益等の成果が出ても、「だから何？（so what?）」としか感じず、早く「思考だけしていれば良い状態」に戻ろうとする\r\n- 仕事人生において一番幸せな時間は、利益が出たときでも、ステークホルダーにインパクトを出せたときでもなく、新しい着想に基づき、良い解釈/視点を得た瞬間\r\n- 上記に至るための思考に注力していない時は、基本的に退屈でイライラしている\r\n\r\n上記のように、学生時代も社会人時代も、求められるアウトプット（学生→試験の結果、社会人→利益）と、自身の気質（良い思考をしたい）にギャップがあった。  \r\nそのため、マトリックスの世界にいるような、「**根本的な何かが、いまいちしっくり来ない**」違和感を、常に抱えて生きてきた。\r\n\r\n### 思考ADHDと行動ADHDの違い\r\n\r\n思考ADHDと行動ADHDは、不注意・多動性・衝動性が共通しており、一見、気が合うように思われるかもしれない。  \r\nしかし実際のところ、全く気がわない。むしろ、**相性は最悪**な気がしている。\r\n\r\n主な要因として、行動ADHDは**ファスト思考**、思考ADHDは**スロー思考**である点が挙げられそうである（ファスト思考/スロー思考に関しては、カーネマンの[ファスト＆スロー](https://www.amazon.co.jp/%E3%83%95%E3%82%A1%E3%82%B9%E3%83%88-%E3%82%B9%E3%83%AD%E3%83%BC-%E4%B8%8A-%E3%81%82%E3%81%AA%E3%81%9F%E3%81%AE%E6%84%8F%E6%80%9D%E3%81%AF%E3%81%A9%E3%81%AE%E3%82%88%E3%81%86%E3%81%AB%E6%B1%BA%E3%81%BE%E3%82%8B%E3%81%8B-%E3%83%8F%E3%83%A4%E3%82%AB%E3%83%AF%E3%83%BB%E3%83%8E%E3%83%B3%E3%83%95%E3%82%A3%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%B3%E6%96%87%E5%BA%AB/dp/4150504105)を参照）。\r\n\r\n行動ADHDは、少し考えたら即行動で、思考ADHDからすると、**底の浅い思考を自信満々に断言**してくるので、極めてイライラする。  \r\nしかも、こちらの忠告を無視して、底の浅い思考に基づいて**次から次へと行動しては間違い**、その度にこちらが対応を迫られる。  \r\n頭の悪い行動のせいで、最も幸せな時間である**「思考専念タイム」を奪ってくる人々**、と感じる。\r\n\r\n一方で行動ADHDも、思考ADHDに対して不快感を抱いているようである。  \r\n橋下徹氏がよく使う「**クソインテリ**」という言葉が、この感覚をよく表しているように思える。  \r\nすなわち、行動してアウトプットを出さなければならない局面で、前線に立ちもせず後ろの方から、**重箱の隅をつつくような抽象論で、批評をする**。  \r\n散々あーでもない、こーでもないと述べた挙げ句に、結局自分では何もせず、**困難な行動を他者に押し付ける**、口だけ番長である。\r\n\r\n行動ADHDの文化は、**即断即決、即レス、短文、SNS、短尺動画、大量のスマホ通知**で表象される。  \r\n思考ADHDの文化は、**熟考と議論、遅レス、長文、学会、長尺映画、大量の本**で表象される。\r\n\r\n行動ADHDと思考ADHDはグラデーションであり、0/1ではない。  \r\nよって、要はバランスの問題である。  \r\n実際わたしも、本来的には思考ADHDであるが、行動やアウトプットを全くせずに生きていくことはできないので、行動ADHD的な在り方を、それなりに身に着けてはいる。  \r\nまた行動ADHDも、思考を全くせずに行動ばかりしていると、致命的な身体的・経済的ダメージを負う確率が高いため、思考ADHD的な在り方を、多少は身につけているだろう。  \r\nただ、**自分がどちらに寄っているのかを知る**ことは、誰と、どのような人生を送るのかを考える上で、極めて重要である。\r\n\r\n[次回の記事](/how-to-make-a-thought-adhd-life-happy/)では、上記を前提に、**思考ADHDが幸せに生きられる道**を考えたい。\r\n\r\n次記事：\r\n\r\nhttps://notes-of-thought.com/how-to-make-a-thought-adhd-life-happy/&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/thought-adhd-as-a-concept.md&quot;],&quot;digest&quot;:[0,&quot;cd7fe12942040be8&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;行動すべき局面で思考し続けてしまい、何も実行に移せず、困った経験はないだろうか？&lt;br&gt;\nある場合、あなたは私と同じ、思考ADHDかもしれない。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;思考adhdとは\&quot;&gt;思考ADHDとは？&lt;a class=\&quot;anchor\&quot; href=\&quot;#思考adhdとは\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;ADHDは、医学的には&lt;/p&gt;&lt;blockquote&gt;\n&lt;p&gt;不注意・多動性・衝動性を特徴に持つ発達障害の一つ&lt;/p&gt;\n&lt;/blockquote&gt;&lt;p&gt;と定義され（参照：&lt;a href=\&quot;https://www.mext.go.jp/b_menu/shingi/chousa/shotou/054/shiryo/attach/1361233.htm#:~:text=1%E2%80%901%EF%BC%8E,%E7%89%88%EF%BC%89%E3%82%92%E5%8F%82%E8%80%83%E3%81%AB%E3%81%97%E3%81%9F%E3%80%82\&quot;&gt;文科省サイト&lt;/a&gt;）、以下のような特徴があるとされる：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;不注意：ひとつのことに集中していられない&lt;/li&gt;\n&lt;li&gt;多動性：じっとしていることが苦手&lt;/li&gt;\n&lt;li&gt;衝動性：考えずに行動してしまう&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;上記は、一般に行動面を指しているように思われる。&lt;br&gt;\nすなわち、&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;不注意：ひとつの&lt;strong&gt;行動&lt;/strong&gt;に集中していられない&lt;/li&gt;\n&lt;li&gt;多動性：&lt;strong&gt;行動&lt;/strong&gt;せずにいることができない&lt;/li&gt;\n&lt;li&gt;衝動性：考えずに&lt;strong&gt;行動&lt;/strong&gt;してしまう&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;これを&lt;strong&gt;行動ADHD&lt;/strong&gt;と呼ぼう。&lt;br&gt;\n私は、行動ADHDの特性は全く持っていない。&lt;br&gt;\nただ、&lt;strong&gt;「行動」を「思考」に置き換える&lt;/strong&gt;と、完全に当てはまっている。&lt;br&gt;\nつまり、&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;不注意：ひとつの&lt;strong&gt;思考&lt;/strong&gt;に集中していられない&lt;/li&gt;\n&lt;li&gt;多動性：&lt;strong&gt;思考&lt;/strong&gt;せずにいることができない&lt;/li&gt;\n&lt;li&gt;衝動性：行動せずに&lt;strong&gt;考えて&lt;/strong&gt;しまう&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;これを&lt;strong&gt;思考ADHD&lt;/strong&gt;と呼ぼう。&lt;/p&gt;&lt;p&gt;これは&lt;strong&gt;私の造語&lt;/strong&gt;であり、医学的な正当性があるかは、全く知らない。&lt;br&gt;\nただ、現に私は上記の「思考ADHD」的特性により、しっくり来ない感覚を抱きながら生きてきた。&lt;br&gt;\nよって、この気質を指すのに最適なラベルとして、使っていくことにする。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;思考adhdで困ったこと\&quot;&gt;思考ADHDで困ったこと&lt;a class=\&quot;anchor\&quot; href=\&quot;#思考adhdで困ったこと\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;私はこの思考ADHDにより、人生において、以下のような困りごとがあった。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;学生時代&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;授業で先生から教わる事柄が、表層をなぞったものにしか感じられず、やる気がでない。&lt;/li&gt;\n&lt;li&gt;より根源的な説明を求めて、先生に質問するが、納得できる回答が得られない。深堀りする質問を続けているうち、お互いイライラする。&lt;/li&gt;\n&lt;li&gt;先生への質問は諦め、図書館等で自習するが、これに時間を取られて、テストで点を取るための勉強に辿りつかない。&lt;/li&gt;\n&lt;li&gt;試験中に、答案と関係ない「より重要な問い」が頭に浮かび、そちらが気になって集中が削がれる。&lt;/li&gt;\n&lt;li&gt;数学の答案作成中に、解答が分かっても、証明過程で疑問が出ると、その疑問を解消するための証明をし初めて、時間を無駄にする。&lt;/li&gt;\n&lt;li&gt;板書や書き取りのような、「思考の伴わない単純行動」が苦痛で続かない。気がつくと、全く関係ない事柄に関する思考を始めている。&lt;/li&gt;\n&lt;li&gt;既に思考が済んでおり、自分に取って自明な事柄に関する授業を聞いていられない。授業への出席が苦痛。&lt;/li&gt;\n&lt;li&gt;バイトで飲食店のホールスタッフ等をやると、思考の伴わない単純労働のため、苦痛で続かない。&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;社会人時代&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;企画検討や要件定義フェーズでは極めて良いパフォーマンスが出るものの、実行フェーズで急速にモチベーションが下がる&lt;/li&gt;\n&lt;li&gt;実行フェーズは自分でやらずに人任せにして、自分は別事業の構想をし始める&lt;/li&gt;\n&lt;li&gt;「そもそも、この作業/業務/ビジネスはなんの意義があるのか？」が気になり、それが解消するまで、やる気がでない&lt;/li&gt;\n&lt;li&gt;マクロ的事象が気になり、目の前のミクロな事柄が些末に思え、パフォーマンスが出ない&lt;/li&gt;\n&lt;li&gt;行動の結果、利益等の成果が出ても、「だから何？（so what?）」としか感じず、早く「思考だけしていれば良い状態」に戻ろうとする&lt;/li&gt;\n&lt;li&gt;仕事人生において一番幸せな時間は、利益が出たときでも、ステークホルダーにインパクトを出せたときでもなく、新しい着想に基づき、良い解釈/視点を得た瞬間&lt;/li&gt;\n&lt;li&gt;上記に至るための思考に注力していない時は、基本的に退屈でイライラしている&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;上記のように、学生時代も社会人時代も、求められるアウトプット（学生→試験の結果、社会人→利益）と、自身の気質（良い思考をしたい）にギャップがあった。&lt;br&gt;\nそのため、マトリックスの世界にいるような、「&lt;strong&gt;根本的な何かが、いまいちしっくり来ない&lt;/strong&gt;」違和感を、常に抱えて生きてきた。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;思考adhdと行動adhdの違い\&quot;&gt;思考ADHDと行動ADHDの違い&lt;a class=\&quot;anchor\&quot; href=\&quot;#思考adhdと行動adhdの違い\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;思考ADHDと行動ADHDは、不注意・多動性・衝動性が共通しており、一見、気が合うように思われるかもしれない。&lt;br&gt;\nしかし実際のところ、全く気がわない。むしろ、&lt;strong&gt;相性は最悪&lt;/strong&gt;な気がしている。&lt;/p&gt;&lt;p&gt;主な要因として、行動ADHDは&lt;strong&gt;ファスト思考&lt;/strong&gt;、思考ADHDは&lt;strong&gt;スロー思考&lt;/strong&gt;である点が挙げられそうである（ファスト思考/スロー思考に関しては、カーネマンの&lt;a href=\&quot;https://www.amazon.co.jp/%E3%83%95%E3%82%A1%E3%82%B9%E3%83%88-%E3%82%B9%E3%83%AD%E3%83%BC-%E4%B8%8A-%E3%81%82%E3%81%AA%E3%81%9F%E3%81%AE%E6%84%8F%E6%80%9D%E3%81%AF%E3%81%A9%E3%81%AE%E3%82%88%E3%81%86%E3%81%AB%E6%B1%BA%E3%81%BE%E3%82%8B%E3%81%8B-%E3%83%8F%E3%83%A4%E3%82%AB%E3%83%AF%E3%83%BB%E3%83%8E%E3%83%B3%E3%83%95%E3%82%A3%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%B3%E6%96%87%E5%BA%AB/dp/4150504105\&quot;&gt;ファスト＆スロー&lt;/a&gt;を参照）。&lt;/p&gt;&lt;p&gt;行動ADHDは、少し考えたら即行動で、思考ADHDからすると、&lt;strong&gt;底の浅い思考を自信満々に断言&lt;/strong&gt;してくるので、極めてイライラする。&lt;br&gt;\nしかも、こちらの忠告を無視して、底の浅い思考に基づいて&lt;strong&gt;次から次へと行動しては間違い&lt;/strong&gt;、その度にこちらが対応を迫られる。&lt;br&gt;\n頭の悪い行動のせいで、最も幸せな時間である**「思考専念タイム」を奪ってくる人々**、と感じる。&lt;/p&gt;&lt;p&gt;一方で行動ADHDも、思考ADHDに対して不快感を抱いているようである。&lt;br&gt;\n橋下徹氏がよく使う「&lt;strong&gt;クソインテリ&lt;/strong&gt;」という言葉が、この感覚をよく表しているように思える。&lt;br&gt;\nすなわち、行動してアウトプットを出さなければならない局面で、前線に立ちもせず後ろの方から、&lt;strong&gt;重箱の隅をつつくような抽象論で、批評をする&lt;/strong&gt;。&lt;br&gt;\n散々あーでもない、こーでもないと述べた挙げ句に、結局自分では何もせず、&lt;strong&gt;困難な行動を他者に押し付ける&lt;/strong&gt;、口だけ番長である。&lt;/p&gt;&lt;p&gt;行動ADHDの文化は、&lt;strong&gt;即断即決、即レス、短文、SNS、短尺動画、大量のスマホ通知&lt;/strong&gt;で表象される。&lt;br&gt;\n思考ADHDの文化は、&lt;strong&gt;熟考と議論、遅レス、長文、学会、長尺映画、大量の本&lt;/strong&gt;で表象される。&lt;/p&gt;&lt;p&gt;行動ADHDと思考ADHDはグラデーションであり、0/1ではない。&lt;br&gt;\nよって、要はバランスの問題である。&lt;br&gt;\n実際わたしも、本来的には思考ADHDであるが、行動やアウトプットを全くせずに生きていくことはできないので、行動ADHD的な在り方を、それなりに身に着けてはいる。&lt;br&gt;\nまた行動ADHDも、思考を全くせずに行動ばかりしていると、致命的な身体的・経済的ダメージを負う確率が高いため、思考ADHD的な在り方を、多少は身につけているだろう。&lt;br&gt;\nただ、&lt;strong&gt;自分がどちらに寄っているのかを知る&lt;/strong&gt;ことは、誰と、どのような人生を送るのかを考える上で、極めて重要である。&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;/how-to-make-a-thought-adhd-life-happy/\&quot;&gt;次回の記事&lt;/a&gt;では、上記を前提に、&lt;strong&gt;思考ADHDが幸せに生きられる道&lt;/strong&gt;を考えたい。&lt;/p&gt;&lt;p&gt;次記事：&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/how-to-make-a-thought-adhd-life-happy/\&quot;&gt;https://notes-of-thought.com/how-to-make-a-thought-adhd-life-happy/&lt;/a&gt;&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;思考adhdとは&quot;],&quot;text&quot;:[0,&quot;思考ADHDとは？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;思考adhdで困ったこと&quot;],&quot;text&quot;:[0,&quot;思考ADHDで困ったこと#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;思考adhdと行動adhdの違い&quot;],&quot;text&quot;:[0,&quot;思考ADHDと行動ADHDの違い#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;思考ADHDなる概念を提唱したい&quot;],&quot;slug&quot;:[0,&quot;thought-adhd-as-a-concept&quot;],&quot;published&quot;:[3,&quot;2025-08-01T17:46:00.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/08/thought-adhd-as-a-concept.png&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,10],&quot;words&quot;:[0,2005],&quot;excerpt&quot;:[0,&quot;行動すべき局面で思考し続けてしまい、何も実行に移せず、困った経験はないだろうか？ ある場合、あなたは私と同じ、思考ADHDかもしれない。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;thought-adhd-as-a-concept&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;marriages-and-transactions.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;結婚とトランザクション：代替品であることを拒むことで生まれる価値と独占性&quot;],&quot;published&quot;:[3,&quot;2025-01-17T21:42:47.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/01/marriage-and-transactions.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;チョークポイント資本を握るための国際不動産投資&quot;],&quot;prevSlug&quot;:[0,&quot;international-real-estate-investment-to-secure-chokepoint-capital&quot;],&quot;nextTitle&quot;:[0,&quot;思考ADHDなる概念を提唱したい&quot;],&quot;nextSlug&quot;:[0,&quot;thought-adhd-as-a-concept&quot;],&quot;editorId&quot;:[0,&quot;marriages-and-transactions&quot;]}],&quot;body&quot;:[0,&quot;### 結婚を理解できない離婚弁護士\r\n\r\n離婚弁護士の[インタビュー動画](https://www.youtube.com/watch?v=-MGyiqVjdKI&amp;ab_channel=TheDiaryOfACEO)を20分ほど視聴したところ、以下の興味深い見解が述べられていた：\r\n\r\n- 婚姻の56%は離婚で終焉\r\n- 子供や金銭的理由で離婚を我慢している夫婦は20%\r\n- 上記を合わせると、結婚の75%は失敗\r\n- 失敗率が高いにもかかわらず人々が結婚を繰り返す理由は謎\r\n- 離婚者の86%は5年以内に再婚\r\n- 結婚は提供価値の交換であり、金と美貌の交換（トロフィーワイフ）に後ろめたさを感じる必要はない\r\n- 婚前契約を嫌がるのは後悔リスクが高いため、回避すべき\r\n\r\nこの弁護士は、明らかに結婚をトランザクショナル（取引的）なものと見なしている。  \r\n職業柄当然とも言えるが、他の視点を持たない限り、なぜ人が**失敗する確率が高いにも関わらず結婚を望む**のか、理解できないのは必然 である。\r\n\r\n### 人はなぜ結婚するのか？\r\n\r\n私を含む多くの人間にとって、結婚は単なるトランザクションではない。  \r\n婚姻関係には、互いを**代替不能な唯一無二の存在** として認識し合うことに本質的価値がある\r\n\r\n従って、婚前契約（結婚後の生活や離婚時の財産分与などについて取り決める契約）を提案された際に残念な気持ちになるのは自然である。  \r\nなぜなら、婚姻前に離婚時の利益配分を協議することは、婚姻そのものを**代替可能な機能の提供契約** に貶める行為だからである。\r\n\r\n婚前契約は、相手を代替可能な存在として扱っていることを露呈する。  \r\nよって、**結婚にトランザクションを超えた意味を見出している者にとって、婚前契約を提示してくる相手は、結婚の意味を理解しない失格者** でしかない。\r\n\r\n### トロフィーワイフ（金と美貌の交換）はなぜ軽蔑されるのか？\r\n\r\nこの弁護士が言うように、結婚が単なる付加価値の交換であるならば、金持ちとトロフィーワイフの関係は非難に値しない。  \r\nだが、現実には軽蔑される向きがある。  \r\nなぜか？\r\n\r\nそれは、金と美貌の交換という構造が**露骨にトランザクショナル**であり、**提供される機能にしか焦点が当たらず、その人間自体が本質的に重要でない** ことを暗示しているからである。  \r\n実際、単なる機能の交換取引であるならば、より優れた金銭や美貌を持つ相手が現れた場合、乗り換えない理由が存在しない。\r\n\r\n### なぜ人は離婚・再婚を繰り返すのか？\r\n\r\n結婚の76%が失敗しているにも関わらず、離婚者の86%が5年以内に再婚するという事実は何を示しているのか。  \r\n多くの人は、**本能ではトランザクショナルを超越した関係を望んでいるのに、現実にはトランザクショナルな婚姻生活を送ってしまい、それに失望している**ように感じられる。  \r\nこの無意識下の不一致が強烈な不快感を生み、関係のリセットと再構築が繰り返されるのではなかろうか。\r\n\r\n### 婚前契約は後悔を減らすか？\r\n\r\n離婚者の多くが「婚前契約を結んでおけばよかった」と後悔すると言われている。  \r\nだが、上で述べたような欲求と現実の不一致が離婚の主要因であるならば、その後悔は的外れである。\r\n\r\n非トランザクショナルな関係を無意識に望んだにも関わらず、それが満たされず、不幸な婚姻生活を送った。その結果として、相手を**トランザクショナルな存在に格下げ**したから、「婚前契約を結べばよかった」と感じているだけである。  \r\n婚姻前に、**結婚相手を非トランザクショナルな存在と認識していた場合、婚前契約の締結はそもそも不可能** である。\r\n\r\n### なぜ人はトランザクションを超越した関係を求めるのか？\r\n\r\nトランザクションとは機能の交換であり、**同等の機能を提供する存在が他にいれば、代替が可能である**。  \r\nだが、人は「代替可能な部品」であることを嫌い、**唯一無二の存在** であることを望む。\r\n\r\nとりわけ愛の対象に対してはそうである。  \r\nだからこそ、**自他を代替可能な存在に貶める行為は忌避される**。\r\n\r\n### マッチングアプリという自殺的ツール：無限トランザクションループの罠\r\n\r\n上記の諸事項にも関わらず、現代社会は、すべてをトランザクショナルに捉える。  \r\n恋愛や結婚ですら例外ではない。  \r\nマッチングアプリにおいては、自他を指先一つで**スワイプ可能な商品**として扱い、**商品として選んでもらう**ため自らを装飾する。\r\n\r\n皆、尊厳ある唯一無二性を放棄し、自ら**交換可能な代替品に成り下がる**ことを選んでいる。  \r\n自他を交換可能な代替品として扱いながら、互いを唯一無二の存在として幸福な婚姻生活を送れるわけがないのだが、人々はこの単純な理屈に何故か気が付かない。\r\n\r\nこうしたトランザクショナリズムの背後には新自由主義があるが、それが全般的にどのような弊害を生んでいるかは、他の記事で散々述べたため、ここでは繰り返さない。  \r\nいずれにせよ、**トランザクショナリズムは離婚率を高める**。\r\n\r\n相手を交換可能な存在として扱えば、少しでも不満があれば即座に代替を探すのは当然である。  \r\n結果、離婚が増え、人々はそれを見て恐怖し、リスクをヘッジする。  \r\nすなわち、婚前契約などの措置を講じて、さらにトランザクショナルな関係に向かう。\r\n\r\nだが本能はトランザクションを超越した関係を求めている。  \r\nゆえに、**「これじゃない」感に苛まれ、再び関係の解消と構築を繰り返す**。\r\n\r\nこれが**無限トランザクションループ**である。\r\n\r\n### 無限トランザクションループを断ち切るには\r\n\r\nこのループを断ち切るには、**結婚をトランザクショナルに捉えることをやめ、自身にとって唯一無二の相手を幸福にする営みと捉え直す** 必要がある。\r\n\r\nその核心にあるのは、**信頼** である。  \r\n相手を幸せにするためであれば全てを犠牲にすることを厭わない献身性に対する、相互信頼である。  \r\nこれを「**婚姻的信頼**」と呼ぼう。\r\n\r\n### 婚姻的信頼の構造\r\n\r\n婚姻的信頼を中心に据えた関係を構築すると、なぜ互いを唯一無二の存在に高められるのか。  \r\n婚姻的信頼は、**排他性と増幅制により**、参入障壁が無限に上がり続けるため、他者が決して競合になり得ないためである。\r\n\r\nたとえば、婚姻的信頼を数値化できると仮定しよう。  \r\n結婚直後、配偶者への信頼が1、他者は0である。  \r\n婚姻的信頼は配偶者の幸福を第一とするため、配偶者以外の他者と親密な関係を結ぶのを抑制する（排他性）。  \r\n他者の排除がしばらく続くと、互いが相手を唯一無二の存在と捉えていることへの信頼関係が深まる（増幅制）。  \r\nよって、夫婦における婚姻的信頼が1から2に増え、他者は0のままである。  \r\n2&gt;0であるから、他者が夫婦に割って入ることができない。  \r\nそうして、しばらく時間が経つと、また排他性および増幅性により、夫婦は3、他者は0という状態になる。  \r\nこれが無限に続き、さがて差は100対0、1,000対0、100,000対0となる。  \r\n他者が配偶者を代替することは不可能になる。\r\n\r\nこれが、婚姻的信頼の**無限上昇ループ構造**である。  \r\n婚姻的信頼に基づく、トランザクションを超越した婚姻関係は、配偶者に、**互いを安定的に永久独占させる仕組み**である。\r\n\r\n### 最初の一歩は無償の愛\r\n\r\nこの構造を始動させるには、どうすれば良いか。  \r\n**まず自らが、無償の愛を与える**必要がある。  \r\n相手がそれに無償の愛で応えた瞬間から、信頼の上昇ループが始まる。\r\n\r\n婚前契約のような**「同時履行の抗弁権」的メンタリティー**（＝あなたがこれをするなら、私もこれをする）では、最初の一歩を得ることすら不可能である。\r\n\r\n### 結論\r\n\r\n市場・ビジネス・契約・利潤・金銭という視点で捉えた瞬間に、**その本質的価値を失うものがある**。\r\n\r\n結婚がその最たる例である。\r\n\r\n結婚をトランザクショナルに捉えると、多くの人は不幸になる。  \r\n反対に、婚姻的信頼をベースに捉えると、幸せな生活を送れる。\r\n\r\n人々が社会の趨勢に惑わされることなく、真に愛する者と唯一無二の関係を築き、幸福を手にされることを、心より願ってやまない。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/marriages-and-transactions.md&quot;],&quot;digest&quot;:[0,&quot;a8cf677373b222a5&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;section&gt;&lt;h3 id=\&quot;結婚を理解できない離婚弁護士\&quot;&gt;結婚を理解できない離婚弁護士&lt;a class=\&quot;anchor\&quot; href=\&quot;#結婚を理解できない離婚弁護士\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;離婚弁護士の&lt;a href=\&quot;https://www.youtube.com/watch?v=-MGyiqVjdKI&amp;#x26;ab_channel=TheDiaryOfACEO\&quot;&gt;インタビュー動画&lt;/a&gt;を20分ほど視聴したところ、以下の興味深い見解が述べられていた：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;婚姻の56%は離婚で終焉&lt;/li&gt;\n&lt;li&gt;子供や金銭的理由で離婚を我慢している夫婦は20%&lt;/li&gt;\n&lt;li&gt;上記を合わせると、結婚の75%は失敗&lt;/li&gt;\n&lt;li&gt;失敗率が高いにもかかわらず人々が結婚を繰り返す理由は謎&lt;/li&gt;\n&lt;li&gt;離婚者の86%は5年以内に再婚&lt;/li&gt;\n&lt;li&gt;結婚は提供価値の交換であり、金と美貌の交換（トロフィーワイフ）に後ろめたさを感じる必要はない&lt;/li&gt;\n&lt;li&gt;婚前契約を嫌がるのは後悔リスクが高いため、回避すべき&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;この弁護士は、明らかに結婚をトランザクショナル（取引的）なものと見なしている。&lt;br&gt;\n職業柄当然とも言えるが、他の視点を持たない限り、なぜ人が&lt;strong&gt;失敗する確率が高いにも関わらず結婚を望む&lt;/strong&gt;のか、理解できないのは必然 である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;人はなぜ結婚するのか\&quot;&gt;人はなぜ結婚するのか？&lt;a class=\&quot;anchor\&quot; href=\&quot;#人はなぜ結婚するのか\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;私を含む多くの人間にとって、結婚は単なるトランザクションではない。&lt;br&gt;\n婚姻関係には、互いを&lt;strong&gt;代替不能な唯一無二の存在&lt;/strong&gt; として認識し合うことに本質的価値がある&lt;/p&gt;&lt;p&gt;従って、婚前契約（結婚後の生活や離婚時の財産分与などについて取り決める契約）を提案された際に残念な気持ちになるのは自然である。&lt;br&gt;\nなぜなら、婚姻前に離婚時の利益配分を協議することは、婚姻そのものを&lt;strong&gt;代替可能な機能の提供契約&lt;/strong&gt; に貶める行為だからである。&lt;/p&gt;&lt;p&gt;婚前契約は、相手を代替可能な存在として扱っていることを露呈する。&lt;br&gt;\nよって、&lt;strong&gt;結婚にトランザクションを超えた意味を見出している者にとって、婚前契約を提示してくる相手は、結婚の意味を理解しない失格者&lt;/strong&gt; でしかない。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;トロフィーワイフ金と美貌の交換はなぜ軽蔑されるのか\&quot;&gt;トロフィーワイフ（金と美貌の交換）はなぜ軽蔑されるのか？&lt;a class=\&quot;anchor\&quot; href=\&quot;#トロフィーワイフ金と美貌の交換はなぜ軽蔑されるのか\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;この弁護士が言うように、結婚が単なる付加価値の交換であるならば、金持ちとトロフィーワイフの関係は非難に値しない。&lt;br&gt;\nだが、現実には軽蔑される向きがある。&lt;br&gt;\nなぜか？&lt;/p&gt;&lt;p&gt;それは、金と美貌の交換という構造が&lt;strong&gt;露骨にトランザクショナル&lt;/strong&gt;であり、&lt;strong&gt;提供される機能にしか焦点が当たらず、その人間自体が本質的に重要でない&lt;/strong&gt; ことを暗示しているからである。&lt;br&gt;\n実際、単なる機能の交換取引であるならば、より優れた金銭や美貌を持つ相手が現れた場合、乗り換えない理由が存在しない。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;なぜ人は離婚再婚を繰り返すのか\&quot;&gt;なぜ人は離婚・再婚を繰り返すのか？&lt;a class=\&quot;anchor\&quot; href=\&quot;#なぜ人は離婚再婚を繰り返すのか\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;結婚の76%が失敗しているにも関わらず、離婚者の86%が5年以内に再婚するという事実は何を示しているのか。&lt;br&gt;\n多くの人は、&lt;strong&gt;本能ではトランザクショナルを超越した関係を望んでいるのに、現実にはトランザクショナルな婚姻生活を送ってしまい、それに失望している&lt;/strong&gt;ように感じられる。&lt;br&gt;\nこの無意識下の不一致が強烈な不快感を生み、関係のリセットと再構築が繰り返されるのではなかろうか。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;婚前契約は後悔を減らすか\&quot;&gt;婚前契約は後悔を減らすか？&lt;a class=\&quot;anchor\&quot; href=\&quot;#婚前契約は後悔を減らすか\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;離婚者の多くが「婚前契約を結んでおけばよかった」と後悔すると言われている。&lt;br&gt;\nだが、上で述べたような欲求と現実の不一致が離婚の主要因であるならば、その後悔は的外れである。&lt;/p&gt;&lt;p&gt;非トランザクショナルな関係を無意識に望んだにも関わらず、それが満たされず、不幸な婚姻生活を送った。その結果として、相手を&lt;strong&gt;トランザクショナルな存在に格下げ&lt;/strong&gt;したから、「婚前契約を結べばよかった」と感じているだけである。&lt;br&gt;\n婚姻前に、&lt;strong&gt;結婚相手を非トランザクショナルな存在と認識していた場合、婚前契約の締結はそもそも不可能&lt;/strong&gt; である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;なぜ人はトランザクションを超越した関係を求めるのか\&quot;&gt;なぜ人はトランザクションを超越した関係を求めるのか？&lt;a class=\&quot;anchor\&quot; href=\&quot;#なぜ人はトランザクションを超越した関係を求めるのか\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;トランザクションとは機能の交換であり、&lt;strong&gt;同等の機能を提供する存在が他にいれば、代替が可能である&lt;/strong&gt;。&lt;br&gt;\nだが、人は「代替可能な部品」であることを嫌い、&lt;strong&gt;唯一無二の存在&lt;/strong&gt; であることを望む。&lt;/p&gt;&lt;p&gt;とりわけ愛の対象に対してはそうである。&lt;br&gt;\nだからこそ、&lt;strong&gt;自他を代替可能な存在に貶める行為は忌避される&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;マッチングアプリという自殺的ツール無限トランザクションループの罠\&quot;&gt;マッチングアプリという自殺的ツール：無限トランザクションループの罠&lt;a class=\&quot;anchor\&quot; href=\&quot;#マッチングアプリという自殺的ツール無限トランザクションループの罠\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;上記の諸事項にも関わらず、現代社会は、すべてをトランザクショナルに捉える。&lt;br&gt;\n恋愛や結婚ですら例外ではない。&lt;br&gt;\nマッチングアプリにおいては、自他を指先一つで&lt;strong&gt;スワイプ可能な商品&lt;/strong&gt;として扱い、&lt;strong&gt;商品として選んでもらう&lt;/strong&gt;ため自らを装飾する。&lt;/p&gt;&lt;p&gt;皆、尊厳ある唯一無二性を放棄し、自ら&lt;strong&gt;交換可能な代替品に成り下がる&lt;/strong&gt;ことを選んでいる。&lt;br&gt;\n自他を交換可能な代替品として扱いながら、互いを唯一無二の存在として幸福な婚姻生活を送れるわけがないのだが、人々はこの単純な理屈に何故か気が付かない。&lt;/p&gt;&lt;p&gt;こうしたトランザクショナリズムの背後には新自由主義があるが、それが全般的にどのような弊害を生んでいるかは、他の記事で散々述べたため、ここでは繰り返さない。&lt;br&gt;\nいずれにせよ、&lt;strong&gt;トランザクショナリズムは離婚率を高める&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;相手を交換可能な存在として扱えば、少しでも不満があれば即座に代替を探すのは当然である。&lt;br&gt;\n結果、離婚が増え、人々はそれを見て恐怖し、リスクをヘッジする。&lt;br&gt;\nすなわち、婚前契約などの措置を講じて、さらにトランザクショナルな関係に向かう。&lt;/p&gt;&lt;p&gt;だが本能はトランザクションを超越した関係を求めている。&lt;br&gt;\nゆえに、&lt;strong&gt;「これじゃない」感に苛まれ、再び関係の解消と構築を繰り返す&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;これが&lt;strong&gt;無限トランザクションループ&lt;/strong&gt;である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;無限トランザクションループを断ち切るには\&quot;&gt;無限トランザクションループを断ち切るには&lt;a class=\&quot;anchor\&quot; href=\&quot;#無限トランザクションループを断ち切るには\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;このループを断ち切るには、&lt;strong&gt;結婚をトランザクショナルに捉えることをやめ、自身にとって唯一無二の相手を幸福にする営みと捉え直す&lt;/strong&gt; 必要がある。&lt;/p&gt;&lt;p&gt;その核心にあるのは、&lt;strong&gt;信頼&lt;/strong&gt; である。&lt;br&gt;\n相手を幸せにするためであれば全てを犠牲にすることを厭わない献身性に対する、相互信頼である。&lt;br&gt;\nこれを「&lt;strong&gt;婚姻的信頼&lt;/strong&gt;」と呼ぼう。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;婚姻的信頼の構造\&quot;&gt;婚姻的信頼の構造&lt;a class=\&quot;anchor\&quot; href=\&quot;#婚姻的信頼の構造\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;婚姻的信頼を中心に据えた関係を構築すると、なぜ互いを唯一無二の存在に高められるのか。&lt;br&gt;\n婚姻的信頼は、&lt;strong&gt;排他性と増幅制により&lt;/strong&gt;、参入障壁が無限に上がり続けるため、他者が決して競合になり得ないためである。&lt;/p&gt;&lt;p&gt;たとえば、婚姻的信頼を数値化できると仮定しよう。&lt;br&gt;\n結婚直後、配偶者への信頼が1、他者は0である。&lt;br&gt;\n婚姻的信頼は配偶者の幸福を第一とするため、配偶者以外の他者と親密な関係を結ぶのを抑制する（排他性）。&lt;br&gt;\n他者の排除がしばらく続くと、互いが相手を唯一無二の存在と捉えていることへの信頼関係が深まる（増幅制）。&lt;br&gt;\nよって、夫婦における婚姻的信頼が1から2に増え、他者は0のままである。&lt;br&gt;\n2&gt;0であるから、他者が夫婦に割って入ることができない。&lt;br&gt;\nそうして、しばらく時間が経つと、また排他性および増幅性により、夫婦は3、他者は0という状態になる。&lt;br&gt;\nこれが無限に続き、さがて差は100対0、1,000対0、100,000対0となる。&lt;br&gt;\n他者が配偶者を代替することは不可能になる。&lt;/p&gt;&lt;p&gt;これが、婚姻的信頼の&lt;strong&gt;無限上昇ループ構造&lt;/strong&gt;である。&lt;br&gt;\n婚姻的信頼に基づく、トランザクションを超越した婚姻関係は、配偶者に、&lt;strong&gt;互いを安定的に永久独占させる仕組み&lt;/strong&gt;である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;最初の一歩は無償の愛\&quot;&gt;最初の一歩は無償の愛&lt;a class=\&quot;anchor\&quot; href=\&quot;#最初の一歩は無償の愛\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;この構造を始動させるには、どうすれば良いか。&lt;br&gt;\n&lt;strong&gt;まず自らが、無償の愛を与える&lt;/strong&gt;必要がある。&lt;br&gt;\n相手がそれに無償の愛で応えた瞬間から、信頼の上昇ループが始まる。&lt;/p&gt;&lt;p&gt;婚前契約のような**「同時履行の抗弁権」的メンタリティー**（＝あなたがこれをするなら、私もこれをする）では、最初の一歩を得ることすら不可能である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;結論\&quot;&gt;結論&lt;a class=\&quot;anchor\&quot; href=\&quot;#結論\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;市場・ビジネス・契約・利潤・金銭という視点で捉えた瞬間に、&lt;strong&gt;その本質的価値を失うものがある&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;結婚がその最たる例である。&lt;/p&gt;&lt;p&gt;結婚をトランザクショナルに捉えると、多くの人は不幸になる。&lt;br&gt;\n反対に、婚姻的信頼をベースに捉えると、幸せな生活を送れる。&lt;/p&gt;&lt;p&gt;人々が社会の趨勢に惑わされることなく、真に愛する者と唯一無二の関係を築き、幸福を手にされることを、心より願ってやまない。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;結婚を理解できない離婚弁護士&quot;],&quot;text&quot;:[0,&quot;結婚を理解できない離婚弁護士#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;人はなぜ結婚するのか&quot;],&quot;text&quot;:[0,&quot;人はなぜ結婚するのか？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;トロフィーワイフ金と美貌の交換はなぜ軽蔑されるのか&quot;],&quot;text&quot;:[0,&quot;トロフィーワイフ（金と美貌の交換）はなぜ軽蔑されるのか？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;なぜ人は離婚再婚を繰り返すのか&quot;],&quot;text&quot;:[0,&quot;なぜ人は離婚・再婚を繰り返すのか？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;婚前契約は後悔を減らすか&quot;],&quot;text&quot;:[0,&quot;婚前契約は後悔を減らすか？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;なぜ人はトランザクションを超越した関係を求めるのか&quot;],&quot;text&quot;:[0,&quot;なぜ人はトランザクションを超越した関係を求めるのか？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;マッチングアプリという自殺的ツール無限トランザクションループの罠&quot;],&quot;text&quot;:[0,&quot;マッチングアプリという自殺的ツール：無限トランザクションループの罠#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;無限トランザクションループを断ち切るには&quot;],&quot;text&quot;:[0,&quot;無限トランザクションループを断ち切るには#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;婚姻的信頼の構造&quot;],&quot;text&quot;:[0,&quot;婚姻的信頼の構造#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;最初の一歩は無償の愛&quot;],&quot;text&quot;:[0,&quot;最初の一歩は無償の愛#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;結婚とトランザクション：代替品であることを拒むことで生まれる価値と独占性&quot;],&quot;slug&quot;:[0,&quot;marriages-and-transactions&quot;],&quot;published&quot;:[3,&quot;2025-01-17T21:42:47.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;未分類&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/01/marriage-and-transactions.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,13],&quot;words&quot;:[0,2565],&quot;excerpt&quot;:[0,&quot;離婚弁護士のインタビュー動画を20分ほど視聴したところ、以下の興味深い見解が述べられていた：&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;marriages-and-transactions&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;international-real-estate-investment-to-secure-chokepoint-capital.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;チョークポイント資本を握るための国際不動産投資&quot;],&quot;published&quot;:[3,&quot;2025-01-12T01:45:32.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/01/international-real-estate-investment-to-secure-chokepoint-capital.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;椅子理論から考える労働と資本の収益格差&quot;],&quot;prevSlug&quot;:[0,&quot;capital-and-labor-a-perspective-from-chair-theory&quot;],&quot;nextTitle&quot;:[0,&quot;結婚とトランザクション：代替品であることを拒むことで生まれる価値と独占性&quot;],&quot;nextSlug&quot;:[0,&quot;marriages-and-transactions&quot;],&quot;editorId&quot;:[0,&quot;international-real-estate-investment-to-secure-chokepoint-capital&quot;]}],&quot;body&quot;:[0,&quot;[前記事](/capital-and-labor-a-perspective-from-chair-theory/)では、労働と資本の収益格差について論じた。  \r\n本稿ではさらに一歩進めて、**資本間の収益格差** に焦点を当てたい。  \r\nすなわち、特定の資本が他よりも高いリターンを生む要因とは何か、である。\r\n\r\n市場経済である以上、基本的には需給によって決まる。  \r\nたとえば、NVIDIAの急激な株価上昇は、AI向けGPU市場における実質的独占という需給逼迫が主因である。  \r\n従って、**高い資本リターンを求めるならば、需給が逼迫した資本を保有すべき** ということになる。  \r\n本稿では、そのような資本を「チョークポイント資本」と呼ぶこととする。\r\n\r\n### 労働せずにチョークポイント資本を保有するには？\r\n\r\nNVIDIAのような企業をゼロから立ち上げ、チョークポイント資本を形成するには、多大な労働が必要である。  \r\n残念ながら、私は労働が嫌いである。  \r\n労働とは不自由の別名であり、私は自由を愛する。\r\n\r\nとなると、**極力労働せずにチョークポイント資本を保有し続ける方法** を探る必要がある。\r\n\r\n### チョークポイント資本の構造的条件\r\n\r\n長期安定的な需給逼迫をもたらすには、以下2点が必要である：\r\n\r\n1. **着実な需要拡大**\r\n2. **解消困難な供給制限**\r\n\r\n需要拡大に関して最も信頼できる因子は、**人口増加** である（人口動態は最も予測精度の高い長期指標）。  \r\n一方、供給制限は、技術的要因と政治的要因に分かれるが、前者は技術革新により早期に解消されるリスクが高いため、後者のほうが望ましい（政治は何よりも歩みが遅い）。\r\n\r\n### 不動産というチョークポイント資本\r\n\r\nこの二条件（人口増加と政治的供給制限）をともに満たし、かつ長期安定的に高リターンを生んできた資本の代表格が、**不動産** である。\r\n\r\n実際、ロンドン・パリ・ベルリン・バンクーバー・ニューヨーク等の主要都市において、不動産価格は過去10年で1.5〜2倍に達しており、これは年率に直せば4%〜7%の価格上昇である。  \r\nここに、家賃収入による利益を3%/年と見積もれば、**合計リターンは7%〜10%/年** に達する。これは、配当込み株式の一般的リターンと肩を並べる水準である。  \r\n（※直近の不動産価格上昇はコロナ禍による供給ショック・低金利を原因としたインフレによる一過性のものであるが、こうした稀なボーナスステージを享受すれば、価格の下方硬直性によって長期リターンが確保される、ということである）\r\n\r\n加えて、不動産は株式に比べて価格変動率（ボラティリティ）が低く、**リスクあたりのリターン（シャープレシオ）は株式を上回る**。  \r\n実際、世界16ヵ国・145年間のデータを分析した[研究論文](https://academic.oup.com/qje/article-abstract/134/3/1225/5435538?redirectedFrom=fulltext)でも、住宅不動産のシャープレシオは株式を大幅に凌駕しているとされる（下の図を参照）。\r\n\r\n![](/wp-content/uploads/2025/01/image.png)\r\n\r\n不動産の管理を専門業者に委託すれば、労働を最小限に抑えることが可能である。  \r\nつまり、不動産は**労働を嫌う者にとって最適なチョークポイント資本** であると言える。\r\n\r\n### 将来性のリスクと選定基準\r\n\r\nもっとも、今後も収益不動産がチョークポイント資本であり続けるかは、**人口動態と供給制限の維持可能性** にかかっている。\r\n\r\nたとえば、人口が減少に転じた東アジア諸国（日本、韓国等）はリスクが高い。  \r\nまた、欧米諸国における人口増加の多くが移民に依存している以上、本格的な移民抑制政策が取られた場合、成長シナリオは崩れ得る。\r\n\r\n一方、供給制限に関しては、現状それほど懸念はない。  \r\n理論的には土地開発や高層化により供給を拡大できるが、実際には：\r\n\r\n- 便利で就業機会の多い立地への需要は強く、郊外住宅では代替が難しい\r\n- 高層化は居住環境悪化を招き、住民反対・都市計画制約等の政治的障壁が大きい\r\n- 街づくりには時間がかかり、人と資本の移動スピードには追いつけない\r\n\r\nといった構造的制約が存在する。  \r\nつまり、**人と金の移動を止めない限り、不動産需給の逼迫は避けがたい**。  \r\n（※AIによる大量失職が起き都市の需要が激変すると話が変わってくるが、これは一旦わきに置く）\r\n\r\n### 結論\r\n\r\n従って、新自由主義が今後も維持される限り、**人口が増加している国の一等地不動産** を保有することが、チョークポイント資本を握り続ける最も現実的な手段である。\r\n\r\n私は新自由主義的風潮が嫌いである。  \r\n過去記事で繰り返し述べた通り、その利潤至上性と格差助長構造は唾棄すべきものだと考えている。\r\n\r\nだが、[前記事](/capital-and-labor-a-perspective-from-chair-theory/)にて述べたように、変革の見通しは立たない。  \r\n格差是正の機運が十分に高まるまでの間、私は**自己防衛のために世界の一等地不動産を買い漁る** ことにする。\r\n\r\nこうしてまた一人、「嫌だ嫌だ」と言いながら新自由主義の一部と化す人間が、またひとり生まれた。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/international-real-estate-investment-to-secure-chokepoint-capital.md&quot;],&quot;digest&quot;:[0,&quot;556e39d55b3fbee5&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;/capital-and-labor-a-perspective-from-chair-theory/\&quot;&gt;前記事&lt;/a&gt;では、労働と資本の収益格差について論じた。&lt;br&gt;\n本稿ではさらに一歩進めて、&lt;strong&gt;資本間の収益格差&lt;/strong&gt; に焦点を当てたい。&lt;br&gt;\nすなわち、特定の資本が他よりも高いリターンを生む要因とは何か、である。&lt;/p&gt;\n&lt;p&gt;市場経済である以上、基本的には需給によって決まる。&lt;br&gt;\nたとえば、NVIDIAの急激な株価上昇は、AI向けGPU市場における実質的独占という需給逼迫が主因である。&lt;br&gt;\n従って、&lt;strong&gt;高い資本リターンを求めるならば、需給が逼迫した資本を保有すべき&lt;/strong&gt; ということになる。&lt;br&gt;\n本稿では、そのような資本を「チョークポイント資本」と呼ぶこととする。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;労働せずにチョークポイント資本を保有するには\&quot;&gt;労働せずにチョークポイント資本を保有するには？&lt;a class=\&quot;anchor\&quot; href=\&quot;#労働せずにチョークポイント資本を保有するには\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&g
