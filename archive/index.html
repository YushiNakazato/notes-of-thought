uot;slug&quot;:[0,&quot;労働せずにチョークポイント資本を保有するには&quot;],&quot;text&quot;:[0,&quot;労働せずにチョークポイント資本を保有するには？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;チョークポイント資本の構造的条件&quot;],&quot;text&quot;:[0,&quot;チョークポイント資本の構造的条件#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;不動産というチョークポイント資本&quot;],&quot;text&quot;:[0,&quot;不動産というチョークポイント資本#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;将来性のリスクと選定基準&quot;],&quot;text&quot;:[0,&quot;将来性のリスクと選定基準#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;チョークポイント資本を握るための国際不動産投資&quot;],&quot;slug&quot;:[0,&quot;international-real-estate-investment-to-secure-chokepoint-capital&quot;],&quot;published&quot;:[3,&quot;2025-01-12T01:45:32.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/01/international-real-estate-investment-to-secure-chokepoint-capital.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,7],&quot;words&quot;:[0,1497],&quot;excerpt&quot;:[0,&quot;前記事では、労働と資本の収益格差について論じた。 本稿ではさらに一歩進めて、資本間の収益格差 に焦点を当てたい。 すなわち、特定の資本が他よりも高いリターンを生む要因とは何か、である。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;international-real-estate-investment-to-secure-chokepoint-capital&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;capital-and-labor-a-perspective-from-chair-theory.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;椅子理論から考える労働と資本の収益格差&quot;],&quot;published&quot;:[3,&quot;2025-01-11T05:22:33.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/01/capital-and-labor-a-perspective-from-chair-theory.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;金銭および国家への隷属から逃れる手段としての超国家投資家&quot;],&quot;prevSlug&quot;:[0,&quot;liberation-from-servitude-to-money-and-state&quot;],&quot;nextTitle&quot;:[0,&quot;チョークポイント資本を握るための国際不動産投資&quot;],&quot;nextSlug&quot;:[0,&quot;international-real-estate-investment-to-secure-chokepoint-capital&quot;],&quot;editorId&quot;:[0,&quot;capital-and-labor-a-perspective-from-chair-theory&quot;]}],&quot;body&quot;:[0,&quot;新自由主義の浸透に伴い、経済格差の拡大が顕著になっている。  \r\nその主因として、資本家／投資家と労働者では、蓄財速度が大きく異なる点が挙げられる。  \r\nこれは一部、労働がスケールしない一方で、資本は複利により指数的に増殖可能であるという構造に起因するが、もう一つ重要な視点として、**競争構造の非対称性** が存在するのではないかと考えるに至った。\r\n\r\nすなわち、定性的構造として、資本の提供行為は労働の提供行為よりも競争が少ない。  \r\nそのため、需給が資本の側で相対的に逼迫しやすく、市場経済におけるリターンも高くなる傾向がある。\r\n\r\n### 「椅子理論」による労働の構造分析\r\n\r\nこの競争構造の非対称性を理解するために、まずは労働側の構造を整理する必要がある。  \r\n（※[白鳥的椅子理論](https://togetter.com/li/2403730)から着想を得ており、結論は同等であるものの、基礎づけが異なる）。\r\n\r\n労働者（被用者）の年収は、単にスキルに依存して決まるのではない。  \r\nたとえば、同一スキルを持つ経理担当者が、潰れかけの中小企業と財閥系商社に所属する場合、その報酬水準は大きく異なる。\r\n\r\nこれは企業の収益性の差が、報酬プールに直結するため当然とも思えるが、実際には自明ではない。  \r\nなぜなら、高収益企業が低収益企業から安価に優秀な人材を引き抜けるなら、労働市場においてスキル価格は一つの均衡点に収束するはずだからである。  \r\n現実がそうなっていないのは、スキル以外の要因が報酬決定に作用しているからである。\r\n\r\nその主要因は、**組織内での報酬平準化圧力** である。  \r\nたとえば、営業部員の年収が3,000万円、経理部員が300万円の組織では、組織内の協調維持は困難である。国家における経済格差が社会分断を招くのと同様である。\r\n\r\nその結果、企業はスキルに対して報酬を払うというより、企業の平均的報酬水準に従って人材を処遇する傾向が強まる。  \r\n業界内でも、競合企業の報酬水準が人材確保における参照点となるため、結果として企業間、業界間での「椅子の価値」に格差が生まれる。\r\n\r\nしたがって、労働リターンは「どのスキルを持っているか」ではなく、「どの業界の、どの企業に所属するか」、すなわち「どの椅子に座るか」に大きく依存する。これを「椅子理論」と呼ぶこととする。\r\n\r\n### 労働における三重の競争\r\n\r\n椅子理論を前提にすると、労働には以下3つの競争が存在する：\r\n\r\n1. **椅子を見極める競争**（職の探索）\r\n2. **椅子に座る競争**（職の獲得）\r\n3. **椅子に座り続ける競争**（職の維持）\r\n\r\nすなわち、労働者は常に探索・獲得・維持という三重の競争に晒されている。\r\n\r\n### 資本家／投資家における競争の構造\r\n\r\n対して、資本家／投資家はどうか。  \r\nここでは典型例として、二次流通市場の株式投資家を想定する。\r\n\r\n株式投資における「椅子」とは株式そのものである。  \r\nだが、投資家は椅子を選定する競争（企業を見極める）には晒されているが、**椅子に座る（購入する）ことと座り続ける（保有する）ことには競争が存在しない**。  \r\nクリック一つで買え、私的所有権により保有が保証されるためである。\r\n\r\n賃貸不動産の所有者やオーナー経営者も、株式投資家ほどではないにせよ、労働者よりは競争の少ない構造に身を置いている。\r\n\r\n### 非対称な競争構造が生む格差拡大のループ\r\n\r\nこのような非対称性は何をもたらすか。\r\n\r\n資本側は、競争の緩さから労働よりも高リターンを享受しやすく、資本を蓄積しやすい。  \r\n蓄積された資本は、規模の経済と希少性によりさらに高リターンを得る機会を増やし、自己強化ループに入る。  \r\nこのループが高速で回転することで、指数的な資本成長が実現される（例：米国の大手VCなど）。\r\n\r\n一方、労働にはこのような指数的成長ループは存在せず、結果として格差は拡大の一途をたどる。\r\n\r\n### 政策的含意と現実の困難\r\n\r\nこの競争構造の非対称性に起因する格差は、競争政策では是正できない。  \r\n唯一の現実的対処策は、**金融資本への増税** である。\r\n\r\nしかし、多くの国では、資本所得は労働所得よりも税制上優遇されており、この格差構造を悪化させている。  \r\nまた、単独国家での増税は資本逃避を招くため、労働者こそが損をする可能性が高く、**国際的協調の下での制度設計（例：グローバル・ミニマムタックス）** が必要不可欠である。\r\n\r\nだが、それすら困難である。  \r\nというのも、格差是正を掲げるリベラル政党が努力を重ねて制度設計を進めてきたにも関わらず、当の労働者たちが、格差是正政策を破壊するトランプのような人物を当選させてしまうからである（大衆はプラトンの時代から愚かなままである。愚かだからエリートになれず大衆でいるわけだから、必然ではあるが）。\r\n\r\n### 結論\r\n\r\nこのように現代社会は、**労働ではなく資本リターンで生きていくことを推奨する構造** を内包しており、当面の間この構造が変わる兆しはない。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/capital-and-labor-a-perspective-from-chair-theory.md&quot;],&quot;digest&quot;:[0,&quot;d9dee120db745011&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;新自由主義の浸透に伴い、経済格差の拡大が顕著になっている。&lt;br&gt;\nその主因として、資本家／投資家と労働者では、蓄財速度が大きく異なる点が挙げられる。&lt;br&gt;\nこれは一部、労働がスケールしない一方で、資本は複利により指数的に増殖可能であるという構造に起因するが、もう一つ重要な視点として、&lt;strong&gt;競争構造の非対称性&lt;/strong&gt; が存在するのではないかと考えるに至った。&lt;/p&gt;\n&lt;p&gt;すなわち、定性的構造として、資本の提供行為は労働の提供行為よりも競争が少ない。&lt;br&gt;\nそのため、需給が資本の側で相対的に逼迫しやすく、市場経済におけるリターンも高くなる傾向がある。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;椅子理論による労働の構造分析\&quot;&gt;「椅子理論」による労働の構造分析&lt;a class=\&quot;anchor\&quot; href=\&quot;#椅子理論による労働の構造分析\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;この競争構造の非対称性を理解するために、まずは労働側の構造を整理する必要がある。&lt;br&gt;\n（※&lt;a href=\&quot;https://togetter.com/li/2403730\&quot;&gt;白鳥的椅子理論&lt;/a&gt;から着想を得ており、結論は同等であるものの、基礎づけが異なる）。&lt;/p&gt;&lt;p&gt;労働者（被用者）の年収は、単にスキルに依存して決まるのではない。&lt;br&gt;\nたとえば、同一スキルを持つ経理担当者が、潰れかけの中小企業と財閥系商社に所属する場合、その報酬水準は大きく異なる。&lt;/p&gt;&lt;p&gt;これは企業の収益性の差が、報酬プールに直結するため当然とも思えるが、実際には自明ではない。&lt;br&gt;\nなぜなら、高収益企業が低収益企業から安価に優秀な人材を引き抜けるなら、労働市場においてスキル価格は一つの均衡点に収束するはずだからである。&lt;br&gt;\n現実がそうなっていないのは、スキル以外の要因が報酬決定に作用しているからである。&lt;/p&gt;&lt;p&gt;その主要因は、&lt;strong&gt;組織内での報酬平準化圧力&lt;/strong&gt; である。&lt;br&gt;\nたとえば、営業部員の年収が3,000万円、経理部員が300万円の組織では、組織内の協調維持は困難である。国家における経済格差が社会分断を招くのと同様である。&lt;/p&gt;&lt;p&gt;その結果、企業はスキルに対して報酬を払うというより、企業の平均的報酬水準に従って人材を処遇する傾向が強まる。&lt;br&gt;\n業界内でも、競合企業の報酬水準が人材確保における参照点となるため、結果として企業間、業界間での「椅子の価値」に格差が生まれる。&lt;/p&gt;&lt;p&gt;したがって、労働リターンは「どのスキルを持っているか」ではなく、「どの業界の、どの企業に所属するか」、すなわち「どの椅子に座るか」に大きく依存する。これを「椅子理論」と呼ぶこととする。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;労働における三重の競争\&quot;&gt;労働における三重の競争&lt;a class=\&quot;anchor\&quot; href=\&quot;#労働における三重の競争\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;椅子理論を前提にすると、労働には以下3つの競争が存在する：&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;椅子を見極める競争&lt;/strong&gt;（職の探索）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;椅子に座る競争&lt;/strong&gt;（職の獲得）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;椅子に座り続ける競争&lt;/strong&gt;（職の維持）&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;すなわち、労働者は常に探索・獲得・維持という三重の競争に晒されている。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;資本家投資家における競争の構造\&quot;&gt;資本家／投資家における競争の構造&lt;a class=\&quot;anchor\&quot; href=\&quot;#資本家投資家における競争の構造\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;対して、資本家／投資家はどうか。&lt;br&gt;\nここでは典型例として、二次流通市場の株式投資家を想定する。&lt;/p&gt;&lt;p&gt;株式投資における「椅子」とは株式そのものである。&lt;br&gt;\nだが、投資家は椅子を選定する競争（企業を見極める）には晒されているが、&lt;strong&gt;椅子に座る（購入する）ことと座り続ける（保有する）ことには競争が存在しない&lt;/strong&gt;。&lt;br&gt;\nクリック一つで買え、私的所有権により保有が保証されるためである。&lt;/p&gt;&lt;p&gt;賃貸不動産の所有者やオーナー経営者も、株式投資家ほどではないにせよ、労働者よりは競争の少ない構造に身を置いている。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;非対称な競争構造が生む格差拡大のループ\&quot;&gt;非対称な競争構造が生む格差拡大のループ&lt;a class=\&quot;anchor\&quot; href=\&quot;#非対称な競争構造が生む格差拡大のループ\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;このような非対称性は何をもたらすか。&lt;/p&gt;&lt;p&gt;資本側は、競争の緩さから労働よりも高リターンを享受しやすく、資本を蓄積しやすい。&lt;br&gt;\n蓄積された資本は、規模の経済と希少性によりさらに高リターンを得る機会を増やし、自己強化ループに入る。&lt;br&gt;\nこのループが高速で回転することで、指数的な資本成長が実現される（例：米国の大手VCなど）。&lt;/p&gt;&lt;p&gt;一方、労働にはこのような指数的成長ループは存在せず、結果として格差は拡大の一途をたどる。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;政策的含意と現実の困難\&quot;&gt;政策的含意と現実の困難&lt;a class=\&quot;anchor\&quot; href=\&quot;#政策的含意と現実の困難\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;この競争構造の非対称性に起因する格差は、競争政策では是正できない。&lt;br&gt;\n唯一の現実的対処策は、&lt;strong&gt;金融資本への増税&lt;/strong&gt; である。&lt;/p&gt;&lt;p&gt;しかし、多くの国では、資本所得は労働所得よりも税制上優遇されており、この格差構造を悪化させている。&lt;br&gt;\nまた、単独国家での増税は資本逃避を招くため、労働者こそが損をする可能性が高く、&lt;strong&gt;国際的協調の下での制度設計（例：グローバル・ミニマムタックス）&lt;/strong&gt; が必要不可欠である。&lt;/p&gt;&lt;p&gt;だが、それすら困難である。&lt;br&gt;\nというのも、格差是正を掲げるリベラル政党が努力を重ねて制度設計を進めてきたにも関わらず、当の労働者たちが、格差是正政策を破壊するトランプのような人物を当選させてしまうからである（大衆はプラトンの時代から愚かなままである。愚かだからエリートになれず大衆でいるわけだから、必然ではあるが）。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;結論\&quot;&gt;結論&lt;a class=\&quot;anchor\&quot; href=\&quot;#結論\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;このように現代社会は、&lt;strong&gt;労働ではなく資本リターンで生きていくことを推奨する構造&lt;/strong&gt; を内包しており、当面の間この構造が変わる兆しはない。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;椅子理論による労働の構造分析&quot;],&quot;text&quot;:[0,&quot;「椅子理論」による労働の構造分析#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;労働における三重の競争&quot;],&quot;text&quot;:[0,&quot;労働における三重の競争#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;資本家投資家における競争の構造&quot;],&quot;text&quot;:[0,&quot;資本家／投資家における競争の構造#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;非対称な競争構造が生む格差拡大のループ&quot;],&quot;text&quot;:[0,&quot;非対称な競争構造が生む格差拡大のループ#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;政策的含意と現実の困難&quot;],&quot;text&quot;:[0,&quot;政策的含意と現実の困難#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;椅子理論から考える労働と資本の収益格差&quot;],&quot;slug&quot;:[0,&quot;capital-and-labor-a-perspective-from-chair-theory&quot;],&quot;published&quot;:[3,&quot;2025-01-11T05:22:33.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2025/01/capital-and-labor-a-perspective-from-chair-theory.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,8],&quot;words&quot;:[0,1673],&quot;excerpt&quot;:[0,&quot;新自由主義の浸透に伴い、経済格差の拡大が顕著になっている。 その主因として、資本家／投資家と労働者では、蓄財速度が大きく異なる点が挙げられる。 これは一部、労働がスケールしない一方で、資本は複利により指数的に増殖可能であるという構造に起因するが、もう一つ重要な視点として、競争構造の非対称性 が存在するのではないかと考えるに至った。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;capital-and-labor-a-perspective-from-chair-theory&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;liberation-from-servitude-to-money-and-state.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;金銭および国家への隷属から逃れる手段としての超国家投資家&quot;],&quot;published&quot;:[3,&quot;2024-12-31T02:26:39.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/liberation-from-servitude-to-money-and-state.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;確信的価値感覚に基づく国家再編：価値観ベースド移民の促進&quot;],&quot;prevSlug&quot;:[0,&quot;values-based-immigration-to-save-democracy&quot;],&quot;nextTitle&quot;:[0,&quot;椅子理論から考える労働と資本の収益格差&quot;],&quot;nextSlug&quot;:[0,&quot;capital-and-labor-a-perspective-from-chair-theory&quot;],&quot;editorId&quot;:[0,&quot;liberation-from-servitude-to-money-and-state&quot;]}],&quot;body&quot;:[0,&quot;**私は自由を愛する。**  \r\n自由とは、いつ、どこで、何をするかに関し、外部から圧力を感じずに選択できることであろう。\r\n\r\n然るに昨今の**新自由主義的な風潮は、個人に金銭的圧力をかける**。\r\n\r\n自由市場経済に立脚した政治経済体制は、他者の需要を満たさなければ生活が困窮する仕組みを通じて、個人に互いを支え合わせる良いメカニズムであるが（神の見えざる手）、私は**己がこの機構の部品と化すことを本能的に拒絶する**。\r\n\r\nまた新自由主義の蔓延による民主政の退潮から、専制的な風潮が強まるのも当然ながら好まない。専制的政治は、その定義からして自明に、自由を破壊するからである。\r\n\r\n過去の政治関連記事では、そうした世相に対するマクロな処方箋を書いたが、**本記事では個人すなわちミクロな対処法を考えたい**。\r\n\r\nとはいえ結論は至極単純である：  \r\n**個人投資家として十分な資産を築き、複数の国で安定的なビザ及び拠点を持つこと**である。\r\n\r\nすなわち、**資本（=企業）や国家に選ばれるのではなく、選ぶ側に立てば良い**。\r\n\r\n実際、金銭への隷属とは、収入を提供する存在（雇用者や顧客）に服従することである。被用者は雇用者に、雇用者は顧客に従属する。従って自由の身となるには、雇用者や顧客を持たずして収入を確保する手段を得る他ない。そのためには、**現代経済社会における指揮命令系統の最上位、すなわち株主（＝資本家）になる他ない**。\r\n\r\nなお株主といえばファンドマネージャーを思い浮かべるかもしれないが、彼らは資金提供者たる顧客に従属する被用者にすぎないわけであるから、全くもって自由ではない。従って真に自由な存在となるには、自身の資産を自由に差配する**個人投資家**（外部出資者のいないオーナー経営者含む）となる他にない。\r\n\r\n次に、国家に対する隷属は、特定の国にロックインしているために発生する。**気に入らない国からはさっさと移動し、ライフステージに応じて、様々な国の良いところだけをつまみ食い**できれば言うことはない。これを実現するには、それぞれの国で、様々な制約を気にせずに済むよう、長期滞在可能なビザを持つ必要がある。\r\n\r\n**国籍や永住権に基づく市民権**がこれにあたるが、厳しい維持条件があり、3つ程度であればともかく、**5つ以上保持し続けるのは現実的ではない**（特に滞在期間に関する条件は、体が一つしかない以上、解決が事実上不可能である）。\r\n\r\n一方で維持条件が緩い投資家/起業家ビザ等に関しては、制度の目まぐるしい変更に鑑みると、長期安定性に欠けると言わざるを得ない。  \r\n実際に欧州各国では、不動産価格の高騰を受けて、[不動産購入に基づく投資家ビザが立て続けに廃止](https://forbesjapan.com/articles/detail/61071)された。\r\n\r\n従って、**国籍または永住権により2～3ヵ国の長期安定地帯を保ちつつ、維持条件の緩い投資家/起業家ビザを1～2つ追加するのが**望ましい。\r\n\r\nこのようなわけであるから、上記のような生き方を超国家投資家と呼ぶならば、**金銭及び国家への隷属から逃れる方法は、超国家投資家となる他にはない**のである。\r\n\r\nそこで私は、**日本国籍を保持しすつつ、欧米某国の永住権を取得し、家族で移住**した。\r\n\r\n一方の国が腐ってしまっても、もう一方の国で生活すれば良いという状態は、**大いなる心の平穏**をもたらしてくれた。\r\n\r\n本記事の読者もぜひ、実践してもらえればと思う。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/liberation-from-servitude-to-money-and-state.md&quot;],&quot;digest&quot;:[0,&quot;d9a04e6b8e8c0a51&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;私は自由を愛する。&lt;/strong&gt;&lt;br&gt;\n自由とは、いつ、どこで、何をするかに関し、外部から圧力を感じずに選択できることであろう。&lt;/p&gt;\n&lt;p&gt;然るに昨今の&lt;strong&gt;新自由主義的な風潮は、個人に金銭的圧力をかける&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;自由市場経済に立脚した政治経済体制は、他者の需要を満たさなければ生活が困窮する仕組みを通じて、個人に互いを支え合わせる良いメカニズムであるが（神の見えざる手）、私は&lt;strong&gt;己がこの機構の部品と化すことを本能的に拒絶する&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;また新自由主義の蔓延による民主政の退潮から、専制的な風潮が強まるのも当然ながら好まない。専制的政治は、その定義からして自明に、自由を破壊するからである。&lt;/p&gt;\n&lt;p&gt;過去の政治関連記事では、そうした世相に対するマクロな処方箋を書いたが、&lt;strong&gt;本記事では個人すなわちミクロな対処法を考えたい&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;とはいえ結論は至極単純である：&lt;br&gt;\n&lt;strong&gt;個人投資家として十分な資産を築き、複数の国で安定的なビザ及び拠点を持つこと&lt;/strong&gt;である。&lt;/p&gt;\n&lt;p&gt;すなわち、&lt;strong&gt;資本（=企業）や国家に選ばれるのではなく、選ぶ側に立てば良い&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;実際、金銭への隷属とは、収入を提供する存在（雇用者や顧客）に服従することである。被用者は雇用者に、雇用者は顧客に従属する。従って自由の身となるには、雇用者や顧客を持たずして収入を確保する手段を得る他ない。そのためには、&lt;strong&gt;現代経済社会における指揮命令系統の最上位、すなわち株主（＝資本家）になる他ない&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;なお株主といえばファンドマネージャーを思い浮かべるかもしれないが、彼らは資金提供者たる顧客に従属する被用者にすぎないわけであるから、全くもって自由ではない。従って真に自由な存在となるには、自身の資産を自由に差配する&lt;strong&gt;個人投資家&lt;/strong&gt;（外部出資者のいないオーナー経営者含む）となる他にない。&lt;/p&gt;\n&lt;p&gt;次に、国家に対する隷属は、特定の国にロックインしているために発生する。&lt;strong&gt;気に入らない国からはさっさと移動し、ライフステージに応じて、様々な国の良いところだけをつまみ食い&lt;/strong&gt;できれば言うことはない。これを実現するには、それぞれの国で、様々な制約を気にせずに済むよう、長期滞在可能なビザを持つ必要がある。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;国籍や永住権に基づく市民権&lt;/strong&gt;がこれにあたるが、厳しい維持条件があり、3つ程度であればともかく、&lt;strong&gt;5つ以上保持し続けるのは現実的ではない&lt;/strong&gt;（特に滞在期間に関する条件は、体が一つしかない以上、解決が事実上不可能である）。&lt;/p&gt;\n&lt;p&gt;一方で維持条件が緩い投資家/起業家ビザ等に関しては、制度の目まぐるしい変更に鑑みると、長期安定性に欠けると言わざるを得ない。&lt;br&gt;\n実際に欧州各国では、不動産価格の高騰を受けて、&lt;a href=\&quot;https://forbesjapan.com/articles/detail/61071\&quot;&gt;不動産購入に基づく投資家ビザが立て続けに廃止&lt;/a&gt;された。&lt;/p&gt;\n&lt;p&gt;従って、&lt;strong&gt;国籍または永住権により2～3ヵ国の長期安定地帯を保ちつつ、維持条件の緩い投資家/起業家ビザを1～2つ追加するのが&lt;/strong&gt;望ましい。&lt;/p&gt;\n&lt;p&gt;このようなわけであるから、上記のような生き方を超国家投資家と呼ぶならば、&lt;strong&gt;金銭及び国家への隷属から逃れる方法は、超国家投資家となる他にはない&lt;/strong&gt;のである。&lt;/p&gt;\n&lt;p&gt;そこで私は、&lt;strong&gt;日本国籍を保持しすつつ、欧米某国の永住権を取得し、家族で移住&lt;/strong&gt;した。&lt;/p&gt;\n&lt;p&gt;一方の国が腐ってしまっても、もう一方の国で生活すれば良いという状態は、&lt;strong&gt;大いなる心の平穏&lt;/strong&gt;をもたらしてくれた。&lt;/p&gt;\n&lt;p&gt;本記事の読者もぜひ、実践してもらえればと思う。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;金銭および国家への隷属から逃れる手段としての超国家投資家&quot;],&quot;slug&quot;:[0,&quot;liberation-from-servitude-to-money-and-state&quot;],&quot;published&quot;:[3,&quot;2024-12-31T02:26:39.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/liberation-from-servitude-to-money-and-state.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,6],&quot;words&quot;:[0,1185],&quot;excerpt&quot;:[0,&quot;私は自由を愛する。 自由とは、いつ、どこで、何をするかに関し、外部から圧力を感じずに選択できることであろう。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;liberation-from-servitude-to-money-and-state&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;values-based-immigration-to-save-democracy.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;確信的価値感覚に基づく国家再編：価値観ベースド移民の促進&quot;],&quot;published&quot;:[3,&quot;2024-12-31T01:21:29.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/values-based-immigration-to-save-democracy.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;事業的成功と確信的価値感覚&quot;],&quot;prevSlug&quot;:[0,&quot;entrepreneurial-success-conviced-sense-of-value&quot;],&quot;nextTitle&quot;:[0,&quot;金銭および国家への隷属から逃れる手段としての超国家投資家&quot;],&quot;nextSlug&quot;:[0,&quot;liberation-from-servitude-to-money-and-state&quot;],&quot;editorId&quot;:[0,&quot;values-based-immigration-to-save-democracy&quot;]}],&quot;body&quot;:[0,&quot;### 国家再編の必要性\r\n\r\n2〜5つ前の記事（[記事1](/democratization-intellectualism-stupidity-1/)、[記事2](/democratization-intellectualism-stupidity-2/)、[記事3](/democratization-intellectualism-stupidity-3/)。民主政関連記事と呼ぶ）では、阿呆共鳴現象による民主政の自壊を防ぐ方法を提示した。  \r\nまた、直近の[直近の記事](/entrepreneurial-success-conviced-sense-of-value/)では、事業的成功には「確信的価値感覚」が不可欠であることを示した。\r\n\r\nこの両者を接続的に捉えると、一つの示唆が浮かび上がる。  \r\nすなわち、**そもそも主権国家を「確信的価値感覚」に基づいて再編すべきではないか？** という問題意識である。\r\n\r\nたとえば民主政関連記事では、知性主義者たる私の確信的価値感覚に基づき、民主政を制限し、官僚機構を強化することが必要だと論じた。  \r\nしかし、仮にテクノリバタリアンのような別種の確信的価値感覚を持つ者からすれば、こうした提言は到底受け入れられないであろう。そもそも目指すべき社会像そのものが異なるからである。\r\n\r\nSNS上の政治的レスバが常に平行線を辿るのも、この「理想社会の非共有性」が原因である。  \r\nつまり、事実認識の差異以前に、「どんな社会が望ましいか」という価値観の前提が異なっており、そこに議論の収束点など存在しない。  \r\n現実の政治もまた、このSNS上のレスバ、すなわち「国家の正当ナラティブ」を巡る争いの延長線上にある。  \r\nゆえに、確信的価値感覚が著しく異なる者同士が一つの主権国家に共存する場合、「あるべき社会像」を巡って必然的に衝突する。\r\n\r\nそう捉えると、民主政関連記事で論じた阿呆共鳴プラットフォームの批判や対処も、突き詰めれば「ある確信的価値感覚が、他の価値感覚を打ち倒す手段」を論じたに過ぎないことになる。  \r\nより広い視野で見れば、SNSの隆盛により国民が自らの確信的価値感覚を発信するようになり、価値感覚のクラスタリングが発生したが、主権国家はそのいずれか一つの様態しか体現できない。  \r\n結果、各クラスタは国家を自らの価値感覚に寄せるべく、政治的な主導権争いを繰り広げる。  \r\nこれこそが、現代における政治的分断の主要因であると考えられる。\r\n\r\nこの状況下で、個人が自由に情報を発信できる技術（＝SNS等）が存在する限り、確信的価値感覚の異なる集団が一つの国家内に共存し続けることは、深い政治的分断を不可避とする。  \r\n政治的分断は憎しみを呼び、やがて殺し合いへと至る。現に20世紀がそれを証明している。\r\n\r\nこれを防ぐには、国家内における確信的価値感覚を統一する他ない。  \r\nしかし、確信的価値感覚は説得により変化するようなものではない。  \r\n（もし変化するなら、それは感覚ではなく、単なる仮説である。詳細は[当該記事](/entrepreneurial-success-conviced-sense-of-value/)を参照）\r\n\r\nとなると、答えは一つしかない。  \r\n**確信的価値感覚に基づいて主権国家を再編する** ことである。  \r\nそれにより、国内の価値観がある程度一様になり、国内対立を劇的に減らすことができる。\r\n\r\n### 国家再編はどのように可能か？\r\n\r\n現行の国際秩序においては、国家は領土によって定義され、その領土内では国内法が排他的に適用される。そして他国は干渉しない。  \r\n従って、価値感覚の一様な国家を新たに樹立する直感的な方法は、**どの国家にも属さない土地で新国家を建てる** ことである。\r\n\r\n現実的には、人工島を建設し国家を宣言する形になるだろう。  \r\nこのアプローチは、テクノリバタリアン等が既に複数回試みている（[例](https://gendai.media/articles/-/72758?page=4)）。しかし、建設コスト・インフラ維持・国際的承認の獲得など、現実的ハードルは極めて高い。\r\n\r\n次に考え得るのは、**既存国家からの分離独立** である。  \r\nこれは旧ユーゴスラビアのコソボや、21世紀初頭の東ティモールに見られるように、実現可能性はある。  \r\nただし、コソボ紛争のように武力衝突が伴う可能性が高く、それを回避する限り、カタルーニャやケベックのような「限定的自治」しか得られないであろう。\r\n\r\n最後に残る現実的な手段は、**国家の枠組みは維持したまま、住民構成を入れ替える** ことである。\r\n\r\n### 確信的価値感覚に基づく移民の意義\r\n\r\nたとえば民主国家AとBが存在し、それぞれ以下の構成を持つとする：\r\n\r\n- A：社会主義者60%、新自由主義者40%\r\n- B：社会主義者40%、新自由主義者60%\r\n\r\nこの場合、Aは社会主義的に、Bは新自由主義的に運営されているだろうが、それぞれ国内に価値観の異なる少数派を抱えており、政治的対立が存在する。\r\n\r\nこのとき、Aの新自由主義者がBへ、Bの社会主義者がAへと相互に移住すれば、両国とも価値観がほぼ一様化され、国内の政治的分断は消滅する。  \r\nこれは単なる理論上の仮説ではなく、移住を受け入れる多数派にとっても利益がある。\r\n\r\n確信的価値感覚が根本的に異なる「忌むべき他者」がいなくなり、同じ価値観を持つ者に置き換わるのである。  \r\nたとえば、米国の白人至上主義者に対し、「国内の有色人種と国外の白人を入れ替える移民政策をどう思うか？」と問えば、彼らが歓迎するであろうことは想像に難くない。\r\n\r\nさらに、政策実行においても、異なる価値観を持つ者との説得・調整が不要となり、意思決定がスムーズになる。  \r\n試験的な政策も通しやすくなり、エビデンスに基づく政策運用（EBPM）も加速する。\r\n\r\n### 結論\r\n\r\n以上より、現代民主政の病理を解消する最良の方策は、**確信的価値感覚に基づく国家再編** にある。  \r\nそしてそれを最も現実的かつ効率的に達成する手段が、**確信的価値感覚に基づいた移民の促進** である。\r\n\r\n社会の分断は「分けること」によってしか根本的には解消し得ない。  \r\n確信的価値感覚の単位で世界を再編すれば、人類は再び「自らの信ずる理想社会」を現実化する可能性を取り戻せる。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/values-based-immigration-to-save-democracy.md&quot;],&quot;digest&quot;:[0,&quot;4577b18b83ae08e2&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;section&gt;&lt;h3 id=\&quot;国家再編の必要性\&quot;&gt;国家再編の必要性&lt;a class=\&quot;anchor\&quot; href=\&quot;#国家再編の必要性\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;2〜5つ前の記事（&lt;a href=\&quot;/democratization-intellectualism-stupidity-1/\&quot;&gt;記事1&lt;/a&gt;、&lt;a href=\&quot;/democratization-intellectualism-stupidity-2/\&quot;&gt;記事2&lt;/a&gt;、&lt;a href=\&quot;/democratization-intellectualism-stupidity-3/\&quot;&gt;記事3&lt;/a&gt;。民主政関連記事と呼ぶ）では、阿呆共鳴現象による民主政の自壊を防ぐ方法を提示した。&lt;br&gt;\nまた、直近の&lt;a href=\&quot;/entrepreneurial-success-conviced-sense-of-value/\&quot;&gt;直近の記事&lt;/a&gt;では、事業的成功には「確信的価値感覚」が不可欠であることを示した。&lt;/p&gt;&lt;p&gt;この両者を接続的に捉えると、一つの示唆が浮かび上がる。&lt;br&gt;\nすなわち、&lt;strong&gt;そもそも主権国家を「確信的価値感覚」に基づいて再編すべきではないか？&lt;/strong&gt; という問題意識である。&lt;/p&gt;&lt;p&gt;たとえば民主政関連記事では、知性主義者たる私の確信的価値感覚に基づき、民主政を制限し、官僚機構を強化することが必要だと論じた。&lt;br&gt;\nしかし、仮にテクノリバタリアンのような別種の確信的価値感覚を持つ者からすれば、こうした提言は到底受け入れられないであろう。そもそも目指すべき社会像そのものが異なるからである。&lt;/p&gt;&lt;p&gt;SNS上の政治的レスバが常に平行線を辿るのも、この「理想社会の非共有性」が原因である。&lt;br&gt;\nつまり、事実認識の差異以前に、「どんな社会が望ましいか」という価値観の前提が異なっており、そこに議論の収束点など存在しない。&lt;br&gt;\n現実の政治もまた、このSNS上のレスバ、すなわち「国家の正当ナラティブ」を巡る争いの延長線上にある。&lt;br&gt;\nゆえに、確信的価値感覚が著しく異なる者同士が一つの主権国家に共存する場合、「あるべき社会像」を巡って必然的に衝突する。&lt;/p&gt;&lt;p&gt;そう捉えると、民主政関連記事で論じた阿呆共鳴プラットフォームの批判や対処も、突き詰めれば「ある確信的価値感覚が、他の価値感覚を打ち倒す手段」を論じたに過ぎないことになる。&lt;br&gt;\nより広い視野で見れば、SNSの隆盛により国民が自らの確信的価値感覚を発信するようになり、価値感覚のクラスタリングが発生したが、主権国家はそのいずれか一つの様態しか体現できない。&lt;br&gt;\n結果、各クラスタは国家を自らの価値感覚に寄せるべく、政治的な主導権争いを繰り広げる。&lt;br&gt;\nこれこそが、現代における政治的分断の主要因であると考えられる。&lt;/p&gt;&lt;p&gt;この状況下で、個人が自由に情報を発信できる技術（＝SNS等）が存在する限り、確信的価値感覚の異なる集団が一つの国家内に共存し続けることは、深い政治的分断を不可避とする。&lt;br&gt;\n政治的分断は憎しみを呼び、やがて殺し合いへと至る。現に20世紀がそれを証明している。&lt;/p&gt;&lt;p&gt;これを防ぐには、国家内における確信的価値感覚を統一する他ない。&lt;br&gt;\nしかし、確信的価値感覚は説得により変化するようなものではない。&lt;br&gt;\n（もし変化するなら、それは感覚ではなく、単なる仮説である。詳細は&lt;a href=\&quot;/entrepreneurial-success-conviced-sense-of-value/\&quot;&gt;当該記事&lt;/a&gt;を参照）&lt;/p&gt;&lt;p&gt;となると、答えは一つしかない。&lt;br&gt;\n&lt;strong&gt;確信的価値感覚に基づいて主権国家を再編する&lt;/strong&gt; ことである。&lt;br&gt;\nそれにより、国内の価値観がある程度一様になり、国内対立を劇的に減らすことができる。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;国家再編はどのように可能か\&quot;&gt;国家再編はどのように可能か？&lt;a class=\&quot;anchor\&quot; href=\&quot;#国家再編はどのように可能か\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;現行の国際秩序においては、国家は領土によって定義され、その領土内では国内法が排他的に適用される。そして他国は干渉しない。&lt;br&gt;\n従って、価値感覚の一様な国家を新たに樹立する直感的な方法は、&lt;strong&gt;どの国家にも属さない土地で新国家を建てる&lt;/strong&gt; ことである。&lt;/p&gt;&lt;p&gt;現実的には、人工島を建設し国家を宣言する形になるだろう。&lt;br&gt;\nこのアプローチは、テクノリバタリアン等が既に複数回試みている（&lt;a href=\&quot;https://gendai.media/articles/-/72758?page=4\&quot;&gt;例&lt;/a&gt;）。しかし、建設コスト・インフラ維持・国際的承認の獲得など、現実的ハードルは極めて高い。&lt;/p&gt;&lt;p&gt;次に考え得るのは、&lt;strong&gt;既存国家からの分離独立&lt;/strong&gt; である。&lt;br&gt;\nこれは旧ユーゴスラビアのコソボや、21世紀初頭の東ティモールに見られるように、実現可能性はある。&lt;br&gt;\nただし、コソボ紛争のように武力衝突が伴う可能性が高く、それを回避する限り、カタルーニャやケベックのような「限定的自治」しか得られないであろう。&lt;/p&gt;&lt;p&gt;最後に残る現実的な手段は、&lt;strong&gt;国家の枠組みは維持したまま、住民構成を入れ替える&lt;/strong&gt; ことである。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;確信的価値感覚に基づく移民の意義\&quot;&gt;確信的価値感覚に基づく移民の意義&lt;a class=\&quot;anchor\&quot; href=\&quot;#確信的価値感覚に基づく移民の意義\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;たとえば民主国家AとBが存在し、それぞれ以下の構成を持つとする：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;A：社会主義者60%、新自由主義者40%&lt;/li&gt;\n&lt;li&gt;B：社会主義者40%、新自由主義者60%&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;この場合、Aは社会主義的に、Bは新自由主義的に運営されているだろうが、それぞれ国内に価値観の異なる少数派を抱えており、政治的対立が存在する。&lt;/p&gt;&lt;p&gt;このとき、Aの新自由主義者がBへ、Bの社会主義者がAへと相互に移住すれば、両国とも価値観がほぼ一様化され、国内の政治的分断は消滅する。&lt;br&gt;\nこれは単なる理論上の仮説ではなく、移住を受け入れる多数派にとっても利益がある。&lt;/p&gt;&lt;p&gt;確信的価値感覚が根本的に異なる「忌むべき他者」がいなくなり、同じ価値観を持つ者に置き換わるのである。&lt;br&gt;\nたとえば、米国の白人至上主義者に対し、「国内の有色人種と国外の白人を入れ替える移民政策をどう思うか？」と問えば、彼らが歓迎するであろうことは想像に難くない。&lt;/p&gt;&lt;p&gt;さらに、政策実行においても、異なる価値観を持つ者との説得・調整が不要となり、意思決定がスムーズになる。&lt;br&gt;\n試験的な政策も通しやすくなり、エビデンスに基づく政策運用（EBPM）も加速する。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;結論\&quot;&gt;結論&lt;a class=\&quot;anchor\&quot; href=\&quot;#結論\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;以上より、現代民主政の病理を解消する最良の方策は、&lt;strong&gt;確信的価値感覚に基づく国家再編&lt;/strong&gt; にある。&lt;br&gt;\nそしてそれを最も現実的かつ効率的に達成する手段が、&lt;strong&gt;確信的価値感覚に基づいた移民の促進&lt;/strong&gt; である。&lt;/p&gt;&lt;p&gt;社会の分断は「分けること」によってしか根本的には解消し得ない。&lt;br&gt;\n確信的価値感覚の単位で世界を再編すれば、人類は再び「自らの信ずる理想社会」を現実化する可能性を取り戻せる。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;国家再編の必要性&quot;],&quot;text&quot;:[0,&quot;国家再編の必要性#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;国家再編はどのように可能か&quot;],&quot;text&quot;:[0,&quot;国家再編はどのように可能か？#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;確信的価値感覚に基づく移民の意義&quot;],&quot;text&quot;:[0,&quot;確信的価値感覚に基づく移民の意義#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;確信的価値感覚に基づく国家再編：価値観ベースド移民の促進&quot;],&quot;slug&quot;:[0,&quot;values-based-immigration-to-save-democracy&quot;],&quot;published&quot;:[3,&quot;2024-12-31T01:21:29.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/values-based-immigration-to-save-democracy.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,10],&quot;words&quot;:[0,1916],&quot;excerpt&quot;:[0,&quot;2〜5つ前の記事（記事1、記事2、記事3。民主政関連記事と呼ぶ）では、阿呆共鳴現象による民主政の自壊を防ぐ方法を提示した。 また、直近の直近の記事では、事業的成功には「確信的価値感覚」が不可欠であることを示した。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;values-based-immigration-to-save-democracy&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;entrepreneurial-success-conviced-sense-of-value.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;事業的成功と確信的価値感覚&quot;],&quot;published&quot;:[3,&quot;2024-12-09T04:30:06.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/entrepreneurial-success-conviced-sense-of-value.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（後編）&quot;],&quot;prevSlug&quot;:[0,&quot;democratization-intellectualism-stupidity-3&quot;],&quot;nextTitle&quot;:[0,&quot;確信的価値感覚に基づく国家再編：価値観ベースド移民の促進&quot;],&quot;nextSlug&quot;:[0,&quot;values-based-immigration-to-save-democracy&quot;],&quot;editorId&quot;:[0,&quot;entrepreneurial-success-conviced-sense-of-value&quot;]}],&quot;body&quot;:[0,&quot;職務上、多くの新規事業に携わってきたが、その大半が失敗している。そしてその失敗の多くは、私が「確信的価値感覚」と呼ぶものの欠如による。  \r\n本稿では、この「確信的価値感覚」なる造語の意味と、事業的成功との関係について整理したい。\r\n\r\nなお、本稿における「事業」は営利活動に限らず、NPO・ボランティア・公的機関の運営も含む。\r\n\r\n### 新規事業の失敗要因\r\n\r\n新規事業の失敗は、大きく分けて技術的要因と非技術的要因に分類できる。  \r\n技術的要因とは、「（価格等の属性を含め）提供したい財やサービスの生産が技術的に不可能だった」ケースである。たとえば、常温超伝導ケーブルの製造販売を目指したものの、常温超伝導の実現自体に失敗した、あるいは成功したがコストが高すぎて量産できなかった、といった事例である。\r\n\r\nただし、私が関与した事業のほとんどは技術的に実現可能な領域内で展開されたため、この類の失敗に遭遇することは稀だった。\r\n\r\n一方、非技術的要因には多様なものが含まれるが、私が見た失敗案件の大半が「確信的価値感覚の欠如」に起因していた。そして、この感覚を欠いたまま成功した事業には、未だ出会っていない。\r\n\r\n### 「確信的価値感覚」とは何か\r\n\r\nまず、「価値感覚」とは何か。  \r\nこれは単に「何かに価値があると感じること」だが、重要な点が二つある。\r\n\r\n第一に、「感覚」である以上、それは思考の結果ではない。つまり「複数の前提に基づいて演繹的に導かれる価値」では足りない。視覚で何かを見た際の感覚が、演繹的推論の結果ではないように、価値感覚もまた論理とは別種の知覚である。\r\n\r\n第二に、「感覚」である以上、それは自己完結している。他者の同意を必要とせず、自らにとって確かに存在していると言える。たとえば夢の中の景色は現実には存在しなくとも、その視覚的知覚は確かに存在していたと言える。同様に、価値感覚も他者が否定しようが自分にとっては確かな感覚である。\r\n\r\n以上を前提に、私は「確信的価値感覚」を以下のように定義している：\r\n\r\n- ① その価値が具現化／進展しない世界は到底受け入れ難いと感じるほど強い感覚であり、\r\n- ② その感覚が一生続くようにしか思えないもの。\r\n\r\n従って、その有無を見極めるためには次のような自問が成立する：\r\n\r\n&gt; 「世界中の誰もがその価値を認識せず、存在を疑問視したとしても、それは自分にとって否定しようがなく、これが実現しない世界は一生にわたり到底受け入れられないと感じるか？」\r\n\r\n### 革新的価値感覚はなぜ必要か\r\n\r\nでは、なぜ確信的価値感覚がないと事業の成功は難しいのか。\r\n\r\nそれは、新規事業における極端な不確実性を飛び越えるだけの「営業力」が持てないからである。\r\n\r\nここでいう営業力とは、単なる商品営業を超えた広義の「巻き込み力」であり、採用・資金調達・仕入・広報等を含む。すなわち、自身の事業に他者を関与させる力全般である。\r\n\r\n新規事業は、不確実で報酬も見えない中、従業員・銀行・投資家・取引先に、他の安定事業を差し置いて関わってもらわねばならない。そのためには、その事業の価値を強く説得するしかない。  \r\n（なお、情報弱者を騙して巻き込む類の事業はこの議論の対象外である）\r\n\r\nしかも、本当に新しい価値を生み出す事業であるならば、既存の社会的コンセンサスと必ずどこかで衝突する。つまり、ほぼ確実に否定される。\r\n\r\nこのとき、確信的価値感覚を欠いていると、否定に直面するごとに自信が揺らぎ、痛みが増し、都合の良いことを個別に言って回るようになる。結果として、活動にブレと矛盾が入り込む。\r\n\r\n事業を支える唯一の「確かなもの」は、確信的価値感覚＝大義である。これが揺らぐと、他に拠って立つものがなくなり、存在意義が曖昧になる。  \r\nステークホルダーは「なぜ自分はこんな不確実な事業に関わっているのか」と疑念を持ち始め、主導者も自信を失い、リーダーシップが瓦解し、事業は失速する。\r\n\r\n大義を失った組織には遠心力が働く。人が離れ、やがて誰もいなくなり、事業はひっそりと幕を閉じる。\r\n\r\n### 死ぬまで続ければ失敗はない\r\n\r\n一方で、確信的価値感覚がある場合、大成功するか否かは別として、事業は終わらない。  \r\n仮に営利企業を組織して失敗し、精算したとしても、その価値が一生続くようにしか感じられない以上、また別の形で再挑戦することになる。  \r\n成功する前に寿命が尽きる可能性はあるが、その場合、「失敗した自分」を知覚することはない（仮に死後の世界があるなら、そこで続ければ良い）。\r\n\r\nOpenAI創業者のSam Altmanが成功者の特徴として \&quot;force of nature\&quot; を挙げている（本人ブログ [“How to be successful”](https://blog.samaltman.com/how-to-be-successful) 参照）が、これはすなわち「宇宙が崩壊しようがこの価値だけは追い続けるし、他には何もできない人間」であれば、成功するまで続けるので、成功確率が高くなる、ということである。\r\n\r\nさらに、価値追求に終わりはないため、一度成功してもなお続ける人間は、常人を遥かに超えた成功を収める確率も高い。\r\n\r\n### 結論\r\n\r\nゆえに、事業の成否を見極める上で、最も初めに問うべきは、その発起人が確信的価値感覚を持っているか否かである。  \r\nあらゆる戦略や計画以前に、それがなければ何も始まらない。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/entrepreneurial-success-conviced-sense-of-value.md&quot;],&quot;digest&quot;:[0,&quot;001a0d765a1774da&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;職務上、多くの新規事業に携わってきたが、その大半が失敗している。そしてその失敗の多くは、私が「確信的価値感覚」と呼ぶものの欠如による。&lt;br&gt;\n本稿では、この「確信的価値感覚」なる造語の意味と、事業的成功との関係について整理したい。&lt;/p&gt;\n&lt;p&gt;なお、本稿における「事業」は営利活動に限らず、NPO・ボランティア・公的機関の運営も含む。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;新規事業の失敗要因\&quot;&gt;新規事業の失敗要因&lt;a class=\&quot;anchor\&quot; href=\&quot;#新規事業の失敗要因\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt; br&gt;\n（なお、情報弱者を騙して巻き込む類の事業はこの議論の対象外である）&lt;/p&gt;&lt;p&gt;しかも、本当に新しい価値を生み出す事業であるならば、既存の社会的コンセンサスと必ずどこかで衝突する。つまり、ほぼ確実に否定される。&lt;/p&gt;&lt;p&gt;このとき、確信的価値感覚を欠いていると、否定に直面するごとに自信が揺らぎ、痛みが増し、都合の良いことを個別に言って回るようになる。結果として、活動にブレと矛盾が入り込む。&lt;/p&gt;&lt;p&gt;事業を支える唯一の「確かなもの」は、確信的価値感覚＝大義である。これが揺らぐと、他に拠って立つものがなくなり、存在意義が曖昧になる。&lt;br&gt;\nステークホルダーは「なぜ自分はこんな不確実な事業に関わっているのか」と疑念を持ち始め、主導者も自信を失い、リーダーシップが瓦解し、事業は失速する。&lt;/p&gt;&lt;p&gt;大義を失った組織には遠心力が働く。人が離れ、やがて誰もいなくなり、事業はひっそりと幕を閉じる。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;死ぬまで続ければ失敗はない\&quot;&gt;死ぬまで続ければ失敗はない&lt;a class=\&quot;anchor\&quot; href=\&quot;#死ぬまで続ければ失敗はない\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;一方で、確信的価値感覚がある場合、大成功するか否かは別として、事業は終わらない。&lt;br&gt;\n仮に営利企業を組織して失敗し、精算したとしても、その価値が一生続くようにしか感じられない以上、また別の形で再挑戦することになる。&lt;br&gt;\n成功する前に寿命が尽きる可能性はあるが、その場合、「失敗した自分」を知覚することはない（仮に死後の世界があるなら、そこで続ければ良い）。&lt;/p&gt;&lt;p&gt;OpenAI創業者のSam Altmanが成功者の特徴として “force of nature” を挙げている（本人ブログ &lt;a href=\&quot;https://blog.samaltman.com/how-to-be-successful\&quot;&gt;“How to be successful”&lt;/a&gt; 参照）が、これはすなわち「宇宙が崩壊しようがこの価値だけは追い続けるし、他には何もできない人間」であれば、成功するまで続けるので、成功確率が高くなる、ということである。&lt;/p&gt;&lt;p&gt;さらに、価値追求に終わりはないため、一度成功してもなお続ける人間は、常人を遥かに超えた成功を収める確率も高い。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;結論\&quot;&gt;結論&lt;a class=\&quot;anchor\&quot; href=\&quot;#結論\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;ゆえに、事業の成否を見極める上で、最も初めに問うべきは、その発起人が確信的価値感覚を持っているか否かである。&lt;br&gt;\nあらゆる戦略や計画以前に、それがなければ何も始まらない。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;新規事業の失敗要因&quot;],&quot;text&quot;:[0,&quot;新規事業の失敗要因#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;確信的価値感覚とは何か&quot;],&quot;text&quot;:[0,&quot;「確信的価値感覚」とは何か#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;革新的価値感覚はなぜ必要か&quot;],&quot;text&quot;:[0,&quot;革新的価値感覚はなぜ必要か#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;死ぬまで続ければ失敗はない&quot;],&quot;text&quot;:[0,&quot;死ぬまで続ければ失敗はない#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;事業的成功と確信的価値感覚&quot;],&quot;slug&quot;:[0,&quot;entrepreneurial-success-conviced-sense-of-value&quot;],&quot;published&quot;:[3,&quot;2024-12-09T04:30:06.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/entrepreneurial-success-conviced-sense-of-value.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,9],&quot;words&quot;:[0,1840],&quot;excerpt&quot;:[0,&quot;職務上、多くの新規事業に携わってきたが、その大半が失敗している。そしてその失敗の多くは、私が「確信的価値感覚」と呼ぶものの欠如による。 本稿では、この「確信的価値感覚」なる造語の意味と、事業的成功との関係について整理したい。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;entrepreneurial-success-conviced-sense-of-value&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;democratization-intellectualism-stupidity-3.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（後編）&quot;],&quot;published&quot;:[3,&quot;2024-12-08T21:42:18.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/Democracy-Intellectualism-StupidityResonance-3.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（中編）&quot;],&quot;prevSlug&quot;:[0,&quot;democratization-intellectualism-stupidity-2&quot;],&quot;nextTitle&quot;:[0,&quot;事業的成功と確信的価値感覚&quot;],&quot;nextSlug&quot;:[0,&quot;entrepreneurial-success-conviced-sense-of-value&quot;],&quot;editorId&quot;:[0,&quot;democratization-intellectualism-stupidity-3&quot;]}],&quot;body&quot;:[0,&quot;[前々記事](/democratization-intellectualism-stupidity-1/)では、新自由主義・無料広告モデル・SNSの三位一体が阿呆共鳴現象を引き起こすこと、また、民主政の過剰推進により政治的アジェンダを民衆に委ねすぎると、この現象がファシズムを招き自滅に至ることを述べた。  \r\nこれを回避するには、新自由主義と阿呆共鳴プラットフォーム（＝無料広告モデル＋SNS）をそれぞれ抑制する必要があり、[前記事](/democratization-intellectualism-stupidity-2/)ではそのうち新自由主義への対処を論じた。\r\n\r\n本テーマの締めくくりとなる本稿では、前記事で挙げた対策を執行可能とするための官僚機構の強化と、阿呆共鳴プラットフォームの打破手段について論じる。\r\n\r\n### 官僚の権力強化\r\n\r\n先進諸国では、全般にわたり官僚機構の弱体化が進行している。  \r\nたとえば、かつての日本では「官尊民卑」という言葉が頻繁に使われたが、この20年で完全に死語となった。官僚は執拗に叩かれ続け、象徴的存在である財務省は「ザイム真理教」と揶揄されるに至り、今や「官卑民尊」とでも言うべき状況である。\r\n\r\nこの背景には、経済的・政治的両面の要因がある。  \r\n経済的には、新自由主義の浸透とともに、直接的な付加価値を生まない官僚機構は「無駄」と見なされるようになった。  \r\n政治的には、民主主義の推進と共に「選挙の洗礼を受けていない者が国家運営を主導するのは許されない」とする観念が強まった。\r\n\r\nしかし、前記事で論じた通り、新自由主義と民主主義の行き過ぎは、民衆による阿呆共鳴現象を招き、ファシズムによる自滅をもたらす。これを防ぐには、選挙から隔離された知的専門家集団、すなわち官僚機構による強固なガードレールが不可欠である。\r\n\r\nより具体的には、ド素人たる主権者（およびそれを煽動するポピュリスト政治家）が政治的アジェンダを設定するとファシズムを生むため、アジェンダ設定は必ず官僚が行い、主権者や政治家はその中で意思決定を行うべきである。\r\n\r\nこれは、20世紀後半の「官僚主導」と揶揄された日本の体制に他ならない。先進諸国はこのモデルに回帰すべきである。  \r\nそのためには、官僚の人事権を内閣から切り離し（日本は内閣人事局を廃止すべきである）、立法により権限を強化する必要がある。\r\n\r\nただし、官僚機構が強すぎれば、今度は寡頭政と化す。文民統制が崩れた戦前日本のような状態は避けなければならない。さらに、民衆との対話が欠如すれば、官僚に対する信任は維持され得ない。\r\n\r\nこれを防ぐためには、①政治経済的な意義の明確化、②行政の透明性強化、③民衆とのコミュニケーション増大が求められる。これはすなわち「官僚の政治家化」である。\r\n\r\nまず①②について、省庁ごとに実現を目指すKPI、財政支出がそれに与える影響経路と程度を簡潔な報告書に毎年まとめ、公開すべきである。現在も報告書類は存在するが、過剰に長大で分散し、官僚機構のパフォーマンスを一般民衆が把握するには適さない。民衆は省庁の活動が自分にどう役立っているのかを理解できず、「無駄ではないか」と疑念を抱くため、官僚は自ら成績表を提示すべきである。\r\n\r\n③のコミュニケーションについては、官僚が積極的にメディア露出し、政策の進捗や将来展望を語るべきである。幹部はテレビやweb動画で広報すべきであり、各省庁はSNSアカウントを通じて日常的に発信し、民衆からのフィードバック（まともなもの）には応答する体制を整えるべきである。\r\n\r\n私は知性主義者として、国民民主党およびその代表・玉木雄一郎の扇動的手法には反発するが、政策アジェンダ設定の手法には一定の関心を抱いている。  \r\n官僚出身の政治家が主導するだけあり、政策自体に誠実性は乏しいものの、①〜③の点では一定水準を満たしている。官僚機構はこれと同様の姿勢を、阿呆共鳴を利用せず、将来世代に誠実な政策立案を通じて実現すべきである。\r\n\r\nこのような改革により、主権者は官僚機構へ再び強力な権限を託すことができる。その権限をもって新自由主義の抑制策を遂行し、次に述べる阿呆共鳴プラットフォームの統制へと移行すべきである。\r\n\r\n### 阿呆共鳴プラットフォームの統制\r\n\r\n前々記事で述べた通り、阿呆共鳴現象は新自由主義的風潮に無料広告モデルとSNSが結合し、民主政の主権者に専制政を選ばせるメカニズムである。  \r\nこの現象の温床たる「阿呆共鳴プラットフォーム」（＝無料広告モデル＋SNS）を統制するにはどうすれば良いか？\r\n\r\n全面禁止は利点や私権への配慮から現実的でない。したがって、以下二点が望ましい：\r\n\r\n- MDMの違法化および厳罰化\r\n- 情報配信の免許制導入\r\n\r\nMDMとは、Misinformation（誤情報）、Disinformation（偽情報）、Malinformation（悪情報）の総称であり、SNS上で蔓延し、米大統領選や兵庫県知事選の結果すら左右した。\r\n\r\n現在、名誉毀損や信用毀損など既存の法的枠組みでは、MDMによる社会的影響を十分に取り締まることはできない。特に、明確な個人被害がない一方で政治過程を歪める情報流布に対しては、対応が困難である。\r\n\r\n言論の自由への懸念はあるが、それは既に名誉毀損やヘイトスピーチ規制の下でも一定の制限が存在する。また、司法は常に事実認定を行っており、MDMに対してもそれは可能である。\r\n\r\n併せて、政治・経済分野における一定以上の情報発信を免許制とすることも検討すべきである。金融商品に関する情報提供に助言業の登録が必要であるのと同様、政治・経済・医療等の高度な影響力を持つ情報配信にも、一定の資格制度を導入すべきである。\r\n\r\n### まとめ\r\n\r\nこれまで三回にわたり述べてきた本テーマを総括すると、以下の通りである：\r\n\r\n- 新自由主義＋無料広告モデル＋SNS＝阿呆共鳴現象（21世紀Ver.）\r\n- 阿呆共鳴現象は、民主政の主権者に専制政を選択させる（例：20世紀前半の先進諸国）\r\n- これを防ぐには、新自由主義を抑制し、阿呆共鳴プラットフォーム（無料広告モデル＋SNS）を統制しなければならない\r\n- 新自由主義の抑制には、①蓄財効率の低下（増税/規制強化/公営化）、②資本の政治的影響力抑制（政治献金の制限/禁止）、③拝金主義の抑制（教育/公共財無償化）、④技術資本の分散（競争政策）を実施\r\n- 阿呆共鳴プラットフォームの統制には、①MDMの違法化/厳罰化、②情報配信の免許制導入を実施\r\n- 上記には強力な官僚機構が必要なため、立法により、独立人事権を含めた強い権限を与える一方で、①政治経済的な意義の明確化、②行政における透明性強化、③民衆とのコミュニケーション増大を課す\r\n\r\n以下が本記事を含めた、本テーマに関する記事である。\r\n\r\nhttps://notes-of-thought.com/democratization-intellectualism-stupidity-1/\r\n\r\nhttps://notes-of-thought.com/democratization-intellectualism-stupidity-2/\r\n\r\nhttps://notes-of-thought.com/democratization-intellectualism-stupidity-3/&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/democratization-intellectualism-stupidity-3.md&quot;],&quot;digest&quot;:[0,&quot;71738244846e7db4&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;/democratization-intellectualism-stupidity-1/\&quot;&gt;前々記事&lt;/a&gt;では、新自由主義・無料広告モデル・SNSの三位一体が阿呆共鳴現象を引き起こすこと、また、民主政の過剰推進により政治的アジェンダを民衆に委ねすぎると、この現象がファシズムを招き自滅に至ることを述べた。&lt;br&gt;\nこれを回避するには、新自由主義と阿呆共鳴プラットフォーム（＝無料広告モデル＋SNS）をそれぞれ抑制する必要があり、&lt;a href=\&quot;/democratization-intellectualism-stupidity-2/\&quot;&gt;前記事&lt;/a&gt;ではそのうち新自由主義への対処を論じた。&lt;/p&gt;\n&lt;p&gt;本テーマの締めくくりとなる本稿では、前記事で挙げた対策を執行可能とするための官僚機構の強化と、阿呆共鳴プラットフォームの打破手段について論じる。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;官僚の権力強化\&quot;&gt;官僚の権力強化&lt;a class=\&quot;anchor\&quot; href=\&quot;#官僚の権力強化\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;先進諸国では、全般にわたり官僚機構の弱体化が進行している。&lt;br&gt;\nたとえば、かつての日本では「官尊民卑」という言葉が頻繁に使われたが、この20年で完全に死語となった。官僚は執拗に叩かれ続け、象徴的存在である財務省は「ザイム真理教」と揶揄されるに至り、今や「官卑民尊」とでも言うべき状況である。&lt;/p&gt;&lt;p&gt;この背景には、経済的・政治的両面の要因がある。&lt;br&gt;\n経済的には、新自由主義の浸透とともに、直接的な付加価値を生まない官僚機構は「無駄」と見なされるようになった。&lt;br&gt;\n政治的には、民主主義の推進と共に「選挙の洗礼を受けていない者が国家運営を主導するのは許されない」とする観念が強まった。&lt;/p&gt;&lt;p&gt;しかし、前記事で論じた通り、新自由主義と民主主義の行き過ぎは、民衆による阿呆共鳴現象を招き、ファシズムによる自滅をもたらす。これを防ぐには、選挙から隔離された知的専門家集団、すなわち官僚機構による強固なガードレールが不可欠である。&lt;/p&gt;&lt;p&gt;より具体的には、ド素人たる主権者（およびそれを煽動するポピュリスト政治家）が政治的アジェンダを設定するとファシズムを生むため、アジェンダ設定は必ず官僚が行い、主権者や政治家はその中で意思決定を行うべきである。&lt;/p&gt;&lt;p&gt;これは、20世紀後半の「官僚主導」と揶揄された日本の体制に他ならない。先進諸国はこのモデルに回帰すべきである。&lt;br&gt;\nそのためには、官僚の人事権を内閣から切り離し（日本は内閣人事局を廃止すべきである）、立法により権限を強化する必要がある。&lt;/p&gt;&lt;p&gt;ただし、官僚機構が強すぎれば、今度は寡頭政と化す。文民統制が崩れた戦前日本のような状態は避けなければならない。さらに、民衆との対話が欠如すれば、官僚に対する信任は維持され得ない。&lt;/p&gt;&lt;p&gt;これを防ぐためには、①政治経済的な意義の明確化、②行政の透明性強化、③民衆とのコミュニケーション増大が求められる。これはすなわち「官僚の政治家化」である。&lt;/p&gt;&lt;p&gt;まず①②について、省庁ごとに実現を目指すKPI、財政支出がそれに与える影響経路と程度を簡潔な報告書に毎年まとめ、公開すべきである。現在も報告書類は存在するが、過剰に長大で分散し、官僚機構のパフォーマンスを一般民衆が把握するには適さない。民衆は省庁の活動が自分にどう役立っているのかを理解できず、「無駄ではないか」と疑念を抱くため、官僚は自ら成績表を提示すべきである。&lt;/p&gt;&lt;p&gt;③のコミュニケーションについては、官僚が積極的にメディア露出し、政策の進捗や将来展望を語るべきである。幹部はテレビやweb動画で広報すべきであり、各省庁はSNSアカウントを通じて日常的に発信し、民衆からのフィードバック（まともなもの）には応答する体制を整えるべきである。&lt;/p&gt;&lt;p&gt;私は知性主義者として、国民民主党およびその代表・玉木雄一郎の扇動的手法には反発するが、政策アジェンダ設定の手法には一定の関心を抱いている。&lt;br&gt;\n官僚出身の政治家が主導するだけあり、政策自体に誠実性は乏しいものの、①〜③の点では一定水準を満たしている。官僚機構はこれと同様の姿勢を、阿呆共鳴を利用せず、将来世代に誠実な政策立案を通じて実現すべきである。&lt;/p&gt;&lt;p&gt;このような改革により、主権者は官僚機構へ再び強力な権限を託すことができる。その権限をもって新自由主義の抑制策を遂行し、次に述べる阿呆共鳴プラットフォームの統制へと移行すべきである。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;阿呆共鳴プラットフォームの統制\&quot;&gt;阿呆共鳴プラットフォームの統制&lt;a class=\&quot;anchor\&quot; href=\&quot;#阿呆共鳴プラットフォームの統制\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;前々記事で述べた通り、阿呆共鳴現象は新自由主義的風潮に無料広告モデルとSNSが結合し、民主政の主権者に専制政を選ばせるメカニズムである。&lt;br&gt;\nこの現象の温床たる「阿呆共鳴プラットフォーム」（＝無料広告モデル＋SNS）を統制するにはどうすれば良いか？&lt;/p&gt;&lt;p&gt;全面禁止は利点や私権への配慮から現実的でない。したがって、以下二点が望ましい：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;MDMの違法化および厳罰化&lt;/li&gt;\n&lt;li&gt;情報配信の免許制導入&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;MDMとは、Misinformation（誤情報）、Disinformation（偽情報）、Malinformation（悪情報）の総称であり、SNS上で蔓延し、米大統領選や兵庫県知事選の結果すら左右した。&lt;/p&gt;&lt;p&gt;現在、名誉毀損や信用毀損など既存の法的枠組みでは、MDMによる社会的影響を十分に取り締まることはできない。特に、明確な個人被害がない一方で政治過程を歪める情報流布に対しては、対応が困難である。&lt;/p&gt;&lt;p&gt;言論の自由への懸念はあるが、それは既に名誉毀損やヘイトスピーチ規制の下でも一定の制限が存在する。また、司法は常に事実認定を行っており、MDMに対してもそれは可能である。&lt;/p&gt;&lt;p&gt;併せて、政治・経済分野における一定以上の情報発信を免許制とすることも検討すべきである。金融商品に関する情報提供に助言業の登録が必要であるのと同様、政治・経済・医療等の高度な影響力を持つ情報配信にも、一定の資格制度を導入すべきである。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;まとめ\&quot;&gt;まとめ&lt;a class=\&quot;anchor\&quot; href=\&quot;#まとめ\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;これまで三回にわたり述べてきた本テーマを総括すると、以下の通りである：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;新自由主義＋無料広告モデル＋SNS＝阿呆共鳴現象（21世紀Ver.）&lt;/li&gt;\n&lt;li&gt;阿呆共鳴現象は、民主政の主権者に専制政を選択させる（例：20世紀前半の先進諸国）&lt;/li&gt;\n&lt;li&gt;これを防ぐには、新自由主義を抑制し、阿呆共鳴プラットフォーム（無料広告モデル＋SNS）を統制しなければならない&lt;/li&gt;\n&lt;li&gt;新自由主義の抑制には、①蓄財効率の低下（増税/規制強化/公営化）、②資本の政治的影響力抑制（政治献金の制限/禁止）、③拝金主義の抑制（教育/公共財無償化）、④技術資本の分散（競争政策）を実施&lt;/li&gt;\n&lt;li&gt;阿呆共鳴プラットフォームの統制には、①MDMの違法化/厳罰化、②情報配信の免許制導入を実施&lt;/li&gt;\n&lt;li&gt;上記には強力な官僚機構が必要なため、立法により、独立人事権を含めた強い権限を与える一方で、①政治経済的な意義の明確化、②行政における透明性強化、③民衆とのコミュニケーション増大を課す&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;以下が本記事を含めた、本テーマに関する記事である。&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/democratization-intellectualism-stupidity-1/\&quot;&gt;https://notes-of-thought.com/democratization-intellectualism-stupidity-1/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/democratization-intellectualism-stupidity-2/\&quot;&gt;https://notes-of-thought.com/democratization-intellectualism-stupidity-2/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/democratization-intellectualism-stupidity-3/\&quot;&gt;https://notes-of-thought.com/democratization-intellectualism-stupidity-3/&lt;/a&gt;&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;官僚の権力強化&quot;],&quot;text&quot;:[0,&quot;官僚の権力強化#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;阿呆共鳴プラットフォームの統制&quot;],&quot;text&quot;:[0,&quot;阿呆共鳴プラットフォームの統制#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;まとめ&quot;],&quot;text&quot;:[0,&quot;まとめ#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（後編）&quot;],&quot;slug&quot;:[0,&quot;democratization-intellectualism-stupidity-3&quot;],&quot;published&quot;:[3,&quot;2024-12-08T21:42:18.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/Democracy-Intellectualism-StupidityResonance-3.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,11],&quot;words&quot;:[0,2194],&quot;excerpt&quot;:[0,&quot;前々記事では、新自由主義・無料広告モデル・SNSの三位一体が阿呆共鳴現象を引き起こすこと、また、民主政の過剰推進により政治的アジェンダを民衆に委ねすぎると、この現象がファシズムを招き自滅に至ることを述べた。 これを回避するには、新自由主義と阿呆共鳴プラットフォーム（＝無料広告モデル＋SNS）をそれぞれ抑制する必要があり、前記事ではそのうち新自由主義への対処を論じた。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;democratization-intellectualism-stupidity-3&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;democratization-intellectualism-stupidity-2.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（中編）&quot;],&quot;published&quot;:[3,&quot;2024-12-08T21:16:34.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/Democracy-Intellectualism-StupidityResonance-3.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（前編）&quot;],&quot;prevSlug&quot;:[0,&quot;democratization-intellectualism-stupidity-1&quot;],&quot;nextTitle&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（後編）&quot;],&quot;nextSlug&quot;:[0,&quot;democratization-intellectualism-stupidity-3&quot;],&quot;editorId&quot;:[0,&quot;democratization-intellectualism-stupidity-2&quot;]}],&quot;body&quot;:[0,&quot;[前記事](/democratization-intellectualism-stupidity-1/)では、新自由主義・無料広告モデル・SNSの組み合わせが阿呆共鳴現象を産み、政治的アジェンダを民衆に委ねすぎることでファシズムに陥り自滅する可能性を指摘した。  \r\nこれを回避するには、新自由主義と阿呆共鳴プラットフォーム（無料広告モデル＋SNS）の双方を抑制する必要がある。  \r\n本記事では、まず新自由主義を抑止する方法について論じる。\r\n\r\n### 国家権力の強化による新自由主義への歯止め\r\n\r\n阿呆共鳴現象の原因の一つは新自由主義である。すなわち、社会の趨勢を市場に委ね放置するレッセ・フェールの思想がそれを可能にしている。これを止めるには、資本の論理に歯止めをかける別種の社会構造をねじ込む必要がある。\r\n\r\n歴史上、これを唯一実現し得た存在が国家である。国家は暴力装置を独占しており、資本的腐敗に侵されていない暴力は資本より強い。オリガルヒに支配されていた90年代ロシアを、プーチンが暴力によって制圧した事例が端的な証左である。\r\n\r\nもちろん、プーチンのような専制手法を肯定するものではない。だが、立法と文民統制の効いた軍や警察（＝暴力装置）を用いた行政により、新自由主義の進展を反転させることは可能である。\r\n\r\n### 新自由主義を抑える方法\r\n\r\n新自由主義を止めるには、それを推進する勢力と手法を把握する必要がある。ここでは最も分かりやすい例として米国を取り上げる。\r\n\r\n米国における新自由主義の推進勢力は、超富裕層である。彼らは企業、政治団体、ロビイスト、買収したメディア等を通じて政治過程に影響を与える。その思想的・文化的背景は多様であるが、最終的には「さらなる富の蓄積」に収束する。\r\n\r\n超富裕層の政治的行動は、PESTの観点から次のように整理できる：\r\n\r\n- **経済的要因** → 蓄財効率の強化（減税・規制撤廃・民営化の推進）\r\n- **政治的要因** → 政治的影響力の強化（政治献金依存の政治制度維持）\r\n- **社会的要因** → 文化的権威の強化（金銭的成功の絶対視）\r\n- **技術的要因** → 技術資本の強化（上記すべてを効率化する資本独占）\r\n\r\n従って、これに対抗するには以下が必要である：\r\n\r\n- **経済的要因** → 蓄財効率の低下（増税、規制強化、公営化）\r\n- **政治的要因** → 政治的影響力の抑制（政治献金の制限または禁止）\r\n- **社会的要因** → 文化的権威の衰退（教育/公共財無償化を通じた高信頼社会の醸成）\r\n- **技術的要因** → 技術資本の分散（競争政策による資本集積の排除）\r\n\r\n### 各要因への具体的対応\r\n\r\n**再分配率の増加**\r\n\r\nまず、超富裕層への権力集中を抑える最も直接的な方法は、富の再分配率の増加である。金融所得課税の強化、国家インフラ（特にメディア）の私物化防止、公共財に関わる企業の公営化などが挙げられる。  \r\nこれにより資本効率は一時的に低下するが、高信頼社会が形成されれば私的資産に対する需要は減退し（所有しなくても幸福に生きられる）、社会厚生関数はむしろ増大する。\r\n\r\n**企業金銭の排除**\r\n\r\n次に、政治過程に対する金銭の影響を排除することが重要である。米国の大統領選では数千億円が必要とされ、小口献金が[全体の2割に過ぎない](https://www.yomiuri.co.jp/world/uspresident/20241017-OYT1T50020/)ため、超富裕層の意向が政治に及ぶ影響は無視できない。  \r\n実際、民主党の大口献金者リード・ホフマンが、反トラスト政策を進めるリナ・カーンの[更迭を要求した例](https://jp.reuters.com/world/us/WEZNT6XFTZJDJNDYF334MJ6R2U-2024-07-29/)がある。  \r\nこのような介入を防ぐためには、政治献金の制限または禁止が不可欠である。\r\n\r\n**拝金主義の是正**\r\n\r\nまた、米国社会に蔓延する拝金主義を排除し、高信頼社会を再構築する必要がある。米国の子供向けコンテンツでは、ヒーローの多くが富裕層である。アイアンマン、バットマン、プロフェッサーXなど、金銭的成功がヒーロー像に強く結びついている。  \r\n一方、日本の国民的コンテンツでは、大金持ちの主人公は極めて稀である。金儲けは悪役の動機とされ、思想犯が悪の象徴とされることも多い。  \r\n文化は構造的に形成されるもので逆転は容易ではないが、20世紀中頃の米国が高福祉国家であったことに鑑みれば、不可能ではない。  \r\n教育改革と公共サービスの無償提供を通じて、蓄財の文化的正当性を意図的に低下させていくべきである。\r\n\r\n**技術資本独占の排除**\r\n\r\n最後に、技術資本の独占に伴う腐敗を防ぐ必要がある。  \r\nその典型例が、イーロン・マスクによるTwitter買収と、政府効率化省長という公的ポストの獲得である。Twitterを利用してMDM（偽情報・誤情報・悪情報）を拡散し、トランプ勝利を支援した見返りとして、自社への補助金配分等の利益誘導が可能な地位を得た。  \r\n公益性の高い資本を一部の人間が独占すると、知財蓄積に公共財を流用する危険が増大する。  \r\n現連邦取引委員会長のリナ・カーンは、[GoogleのChrome事業分離を命じる](https://forbesjapan.com/articles/detail/75248)などの成果を上げていたが、巨大テック企業や民主党の献金者層からの反発を受け、トランプ政権下で更迭される見通しである。\r\n\r\n資本集積には消費者厚生面での利点もあるため、市場支配力のみを基準とする抑制策は望ましくない。  \r\n今後は、政治過程への影響も加味した多元的な競争政策が必要である。\r\n\r\n以上が、新自由主義を抑制するための主要方策である。  \r\nこれらを執行するには、民間セクターを監督可能な強力な官僚機構の存在が不可欠である。\r\n\r\n本記事も長くなってきたので、[次回](/democratization-intellectualism-stupidity-3/)は「阿呆共鳴プラットフォーム」の殲滅方法と合わせて、より具体的な対応策を論じる。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/democratization-intellectualism-stupidity-2.md&quot;],&quot;digest&quot;:[0,&quot;61257cbdcaf7122b&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;a href=\&quot;/democratization-intellectualism-stupidity-1/\&quot;&gt;前記事&lt;/a&gt;では、新自由主義・無料広告モデル・SNSの組み合わせが阿呆共鳴現象を産み、政治的アジェンダを民衆に委ねすぎることでファシズムに陥り自滅する可能性を指摘した。&lt;br&gt;\nこれを回避するには、新自由主義と阿呆共鳴プラットフォーム（無料広告モデル＋SNS）の双方を抑制する必要がある。&lt;br&gt;\n本記事では、まず新自由主義を抑止する方法について論じる。&lt;/p&gt;\n&lt;section&gt;&lt;h3 id=\&quot;国家権力の強化による新自由主義への歯止め\&quot;&gt;国家権力の強化による新自由主義への歯止め&lt;a class=\&quot;anchor\&quot; href=\&quot;#国家権力の強化による新自由主義への歯止め\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;阿呆共鳴現象の原因の一つは新自由主義である。すなわち、社会の趨勢を市場に委ね放置するレッセ・フェールの思想がそれを可能にしている。これを止めるには、資本の論理に歯止めをかける別種の社会構造をねじ込む必要がある。&lt;/p&gt;&lt;p&gt;歴史上、これを唯一実現し得た存在が国家である。国家は暴力装置を独占しており、資本的腐敗に侵されていない暴力は資本より強い。オリガルヒに支配されていた90年代ロシアを、プーチンが暴力によって制圧した事例が端的な証左である。&lt;/p&gt;&lt;p&gt;もちろん、プーチンのような専制手法を肯定するものではない。だが、立法と文民統制の効いた軍や警察（＝暴力装置）を用いた行政により、新自由主義の進展を反転させることは可能である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;新自由主義を抑える方法\&quot;&gt;新自由主義を抑える方法&lt;a class=\&quot;anchor\&quot; href=\&quot;#新自由主義を抑える方法\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;新自由主義を止めるには、それを推進する勢力と手法を把握する必要がある。ここでは最も分かりやすい例として米国を取り上げる。&lt;/p&gt;&lt;p&gt;米国における新自由主義の推進勢力は、超富裕層である。彼らは企業、政治団体、ロビイスト、買収したメディア等を通じて政治過程に影響を与える。その思想的・文化的背景は多様であるが、最終的には「さらなる富の蓄積」に収束する。&lt;/p&gt;&lt;p&gt;超富裕層の政治的行動は、PESTの観点から次のように整理できる：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;経済的要因&lt;/strong&gt; → 蓄財効率の強化（減税・規制撤廃・民営化の推進）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;政治的要因&lt;/strong&gt; → 政治的影響力の強化（政治献金依存の政治制度維持）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;社会的要因&lt;/strong&gt; → 文化的権威の強化（金銭的成功の絶対視）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;技術的要因&lt;/strong&gt; → 技術資本の強化（上記すべてを効率化する資本独占）&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;従って、これに対抗するには以下が必要である：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;経済的要因&lt;/strong&gt; → 蓄財効率の低下（増税、規制強化、公営化）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;政治的要因&lt;/strong&gt; → 政治的影響力の抑制（政治献金の制限または禁止）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;社会的要因&lt;/strong&gt; → 文化的権威の衰退（教育/公共財無償化を通じた高信頼社会の醸成）&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;技術的要因&lt;/strong&gt; → 技術資本の分散（競争政策による資本集積の排除）&lt;/li&gt;\n&lt;/ul&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h3 id=\&quot;各要因への具体的対応\&quot;&gt;各要因への具体的対応&lt;a class=\&quot;anchor\&quot; href=\&quot;#各要因への具体的対応\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;再分配率の増加&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;まず、超富裕層への権力集中を抑える最も直接的な方法は、富の再分配率の増加である。金融所得課税の強化、国家インフラ（特にメディア）の私物化防止、公共財に関わる企業の公営化などが挙げられる。&lt;br&gt;\nこれにより資本効率は一時的に低下するが、高信頼社会が形成されれば私的資産に対する需要は減退し（所有しなくても幸福に生きられる）、社会厚生関数はむしろ増大する。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;企業金銭の排除&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;次に、政治過程に対する金銭の影響を排除することが重要である。米国の大統領選では数千億円が必要とされ、小口献金が&lt;a href=\&quot;https://www.yomiuri.co.jp/world/uspresident/20241017-OYT1T50020/\&quot;&gt;全体の2割に過ぎない&lt;/a&gt;ため、超富裕層の意向が政治に及ぶ影響は無視できない。&lt;br&gt;\n実際、民主党の大口献金者リード・ホフマンが、反トラスト政策を進めるリナ・カーンの&lt;a href=\&quot;https://jp.reuters.com/world/us/WEZNT6XFTZJDJNDYF334MJ6R2U-2024-07-29/\&quot;&gt;更迭を要求した例&lt;/a&gt;がある。&lt;br&gt;\nこのような介入を防ぐためには、政治献金の制限または禁止が不可欠である。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;拝金主義の是正&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;また、米国社会に蔓延する拝金主義を排除し、高信頼社会を再構築する必要がある。米国の子供向けコンテンツでは、ヒーローの多くが富裕層である。アイアンマン、バットマン、プロフェッサーXなど、金銭的成功がヒーロー像に強く結びついている。&lt;br&gt;\n一方、日本の国民的コンテンツでは、大金持ちの主人公は極めて稀である。金儲けは悪役の動機とされ、思想犯が悪の象徴とされることも多い。&lt;br&gt;\n文化は構造的に形成されるもので逆転は容易ではないが、20世紀中頃の米国が高福祉国家であったことに鑑みれば、不可能ではない。&lt;br&gt;\n教育改革と公共サービスの無償提供を通じて、蓄財の文化的正当性を意図的に低下させていくべきである。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;技術資本独占の排除&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;最後に、技術資本の独占に伴う腐敗を防ぐ必要がある。&lt;br&gt;\nその典型例が、イーロン・マスクによるTwitter買収と、政府効率化省長という公的ポストの獲得である。Twitterを利用してMDM（偽情報・誤情報・悪情報）を拡散し、トランプ勝利を支援した見返りとして、自社への補助金配分等の利益誘導が可能な地位を得た。&lt;br&gt;\n公益性の高い資本を一部の人間が独占すると、知財蓄積に公共財を流用する危険が増大する。&lt;br&gt;\n現連邦取引委員会長のリナ・カーンは、&lt;a href=\&quot;https://forbesjapan.com/articles/detail/75248\&quot;&gt;GoogleのChrome事業分離を命じる&lt;/a&gt;などの成果を上げていたが、巨大テック企業や民主党の献金者層からの反発を受け、トランプ政権下で更迭される見通しである。&lt;/p&gt;&lt;p&gt;資本集積には消費者厚生面での利点もあるため、市場支配力のみを基準とする抑制策は望ましくない。&lt;br&gt;\n今後は、政治過程への影響も加味した多元的な競争政策が必要である。&lt;/p&gt;&lt;p&gt;以上が、新自由主義を抑制するための主要方策である。&lt;br&gt;\nこれらを執行するには、民間セクターを監督可能な強力な官僚機構の存在が不可欠である。&lt;/p&gt;&lt;p&gt;本記事も長くなってきたので、&lt;a href=\&quot;/democratization-intellectualism-stupidity-3/\&quot;&gt;次回&lt;/a&gt;は「阿呆共鳴プラットフォーム」の殲滅方法と合わせて、より具体的な対応策を論じる。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;国家権力の強化による新自由主義への歯止め&quot;],&quot;text&quot;:[0,&quot;国家権力の強化による新自由主義への歯止め#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;新自由主義を抑える方法&quot;],&quot;text&quot;:[0,&quot;新自由主義を抑える方法#&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;各要因への具体的対応&quot;],&quot;text&quot;:[0,&quot;各要因への具体的対応#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（中編）&quot;],&quot;slug&quot;:[0,&quot;democratization-intellectualism-stupidity-2&quot;],&quot;published&quot;:[3,&quot;2024-12-08T21:16:34.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/Democracy-Intellectualism-StupidityResonance-3.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,9],&quot;words&quot;:[0,1818],&quot;excerpt&quot;:[0,&quot;前記事では、新自由主義・無料広告モデル・SNSの組み合わせが阿呆共鳴現象を産み、政治的アジェンダを民衆に委ねすぎることでファシズムに陥り自滅する可能性を指摘した。 これを回避するには、新自由主義と阿呆共鳴プラットフォーム（無料広告モデル＋SNS）の双方を抑制する必要がある。 本記事では、まず新自由主義を抑止する方法について論じる。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;democratization-intellectualism-stupidity-2&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;democratization-intellectualism-stupidity-1.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（前編）&quot;],&quot;published&quot;:[3,&quot;2024-12-08T20:42:14.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/Democracy-Intellectualism-StupidityResonance-3.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;宅建士試験合格体験記（1.5ヶ月/210時間）&quot;],&quot;prevSlug&quot;:[0,&quot;japan-realtor-exam-passed&quot;],&quot;nextTitle&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（中編）&quot;],&quot;nextSlug&quot;:[0,&quot;democratization-intellectualism-stupidity-2&quot;],&quot;editorId&quot;:[0,&quot;democratization-intellectualism-stupidity-1&quot;]}],&quot;body&quot;:[0,&quot;私は知性主義者である。  \r\n高度な知的訓練を受けた専門家、あるいはそのような人間で構成された公的機関を、それなりに信頼している。\r\n\r\nもちろん専門家集団が国家運営を誤ることはある。だが、素人の思いつきによる統治よりは、遥かにマシだ。  \r\n医者が手術を失敗することがあるからといって、素人にメスを握らせようとは誰も思わない。それと同じことである。\r\n\r\nしかし、アメリカ大統領選でトランプが勝利したり、兵庫県知事選で斎藤元彦が当選したりするのを見ると、どうも世界は素人にメスを握らせたがっているように思える。\r\n\r\nその原因は、SNSの浸透によって、素人が素人にウケる思いつきや虚偽を垂れ流し、同じ素人同士が共鳴しあう構造が出来上がってしまったことにある。  \r\n素人は、その専門領域においては端的に言って無知であり、言い換えれば阿呆である。結果として、SNSは阿呆同士が共鳴する「装置」と化してしまった。\r\n\r\nこの「阿呆共鳴現象」の背後には、無料で情報をばら撒き、広告で費用を回収するという、Web特有の収益モデルがある。  \r\nどんなに質の低い情報でも、あるいは明らかな虚偽であっても、ページビューが稼げれば広告収入になる。  \r\n1PV＝数円という構造の中では、調査にも知性にもコストをかけず、ウケ狙いの雑な投稿を量産した方が、よほど儲かる。\r\n\r\nまた、受け手の数も多い。知的な読者より、阿呆の方が圧倒的に多いのだから、ターゲットにするなら当然後者ということになる。\r\n\r\nさらにここに、「新自由主義的」な風潮、すなわち利潤追求を絶対視し、市場原理による淘汰を神聖視するような社会的価値観が加わるとどうなるか。  \r\n答えは簡単だ。社会全体が、阿呆向けの、阿呆な情報で埋め尽くされていく。\r\n\r\nこの「新自由主義＋無料広告モデル＋SNSによる阿呆共鳴現象」は、いわゆるポピュリズムと呼ばれる政治的傾向の温床となっている。  \r\nこれは、知性主義者である私からすれば、唾棄すべき光景である。\r\n\r\nもっとも、この状況は、ある意味で「民主主義の進展」とも捉えることができる。  \r\n民主主義とは、特権階級ではなく「民衆」が主権を持つ体制であり、主権が平等に分配されるほど民主的とされる。  \r\n現在は、知的エリートが独占していたメディア空間に対して、素人＝大衆が、1PV＝数円という極めて平等な「民主的」システムで殴り込みをかけている段階だとも言える。\r\n\r\nつまりこれは、民衆が主権を取り戻す過程なのだ。\r\n\r\nだが、同じような現象は過去にもあった。20世紀初頭、マスメディアが発達した時代である。  \r\n結果として登場したのが、イタリアのムッソリーニ、ドイツのヒトラー、スペインのフランコ。すなわち、ファシズムの台頭である。\r\n\r\nスペインの哲学者オルテガは、1929年に出版した『大衆の反逆』の中で、政治的アジェンダ設定の主導権が知的エリートではなく大衆に移ることの危険性を鋭く指摘していた。  \r\nだがその警告から10年も経たずして、世界は第二次世界大戦へと突入した。\r\n\r\n私は、オルテガとまったく同じ懸念を抱いている。\r\n\r\nしたがって、この記事の結論としてはこうなる。  \r\n民主主義には「ちょうどよい塩梅」が存在する。国家運営は「民主的であればあるほど良い」という単純な話ではない。\r\n\r\n民主政を過信し、民衆に過剰な権力を与え続ければ、最終的にその民衆はファシズムを選択し、自滅する。  \r\nそれは2400年前にプラトンが『国家』で指摘したことであり、21世紀もまた、20世紀の轍を踏もうとしているように見える。\r\n\r\n2024年の世界は、1924年と奇妙に似ている。\r\n\r\nでは、この悲劇の再演を防ぐにはどうすればよいのか？  \r\n答えは一つ。政治的アジェンダ設定の主導権を、再び知的エリートの手に取り戻すことだ。  \r\n民衆は、本来の役割──知的エリートに対する牽制役──に戻ってもらう必要がある。\r\n\r\nそのためには、社会を覆い尽くす「新自由主義＋無料広告モデル＋SNSによる阿呆共鳴現象」を、徹底的に叩き潰さなければならない。\r\n\r\nその具体的方法については、[次回の記事](/democratization-intellectualism-stupidity-2/)で述べる。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/democratization-intellectualism-stupidity-1.md&quot;],&quot;digest&quot;:[0,&quot;0cc80cdda2647e17&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;私は知性主義者である。&lt;br&gt;\n高度な知的訓練を受けた専門家、あるいはそのような人間で構成された公的機関を、それなりに信頼している。&lt;/p&gt;\n&lt;p&gt;もちろん専門家集団が国家運営を誤ることはある。だが、素人の思いつきによる統治よりは、遥かにマシだ。&lt;br&gt;\n医者が手術を失敗することがあるからといって、素人にメスを握らせようとは誰も思わない。それと同じことである。&lt;/p&gt;\n&lt;p&gt;しかし、アメリカ大統領選でトランプが勝利したり、兵庫県知事選で斎藤元彦が当選したりするのを見ると、どうも世界は素人にメスを握らせたがっているように思える。&lt;/p&gt;\n&lt;p&gt;その原因は、SNSの浸透によって、素人が素人にウケる思いつきや虚偽を垂れ流し、同じ素人同士が共鳴しあう構造が出来上がってしまったことにある。&lt;br&gt;\n素人は、その専門領域においては端的に言って無知であり、言い換えれば阿呆である。結果として、SNSは阿呆同士が共鳴する「装置」と化して るほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（前編）&quot;],&quot;slug&quot;:[0,&quot;democratization-intellectualism-stupidity-1&quot;],&quot;published&quot;:[3,&quot;2024-12-08T20:42:14.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/12/Democracy-Intellectualism-StupidityResonance-3.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,7],&quot;words&quot;:[0,1349],&quot;excerpt&quot;:[0,&quot;私は知性主義者である。 高度な知的訓練を受けた専門家、あるいはそのような人間で構成された公的機関を、それなりに信頼している。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;democratization-intellectualism-stupidity-1&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;japan-realtor-exam-passed.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;宅建士試験合格体験記（1.5ヶ月/210時間）&quot;],&quot;published&quot;:[3,&quot;2024-11-26T23:12:02.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/11/realtor.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;FP3級合格体験記（13日間/41時間）&quot;],&quot;prevSlug&quot;:[0,&quot;financial-planner-level3-examp-passed&quot;],&quot;nextTitle&quot;:[0,&quot;国家運営は民主的であるほど良いか？知性主義者の見解、または如何にして阿呆共鳴現象を叩き潰すか（前編）&quot;],&quot;nextSlug&quot;:[0,&quot;democratization-intellectualism-stupidity-1&quot;],&quot;editorId&quot;:[0,&quot;japan-realtor-exam-passed&quot;]}],&quot;body&quot;:[0,&quot;**宅建士試験に合格**した。  \r\n**210時間（1.5ヶ月）**かかった。\r\n\r\n\r\n\r\n## **学習サービス**\r\n\r\n**スタディングの[宅建士講座（スタンダードコース）](https://studying.jp/takken/)を使った。**\r\n\r\n## 教材\r\n\r\n使った教材は以下のとおり：\r\n\r\n- 講義動画：見なかった\r\n- テキスト：**全て読んだ**\r\n- 演習問題/過去問：**全てやった**\r\n- 模試：やらなかった\r\n- AI復習（※）：途中からやらなくなった  \r\n  （※）AI復習：過去の正答率に合わせて、適切な日に適切な問題が出題される機能\r\n\r\nAI復習は民法が終わるあたりまではやっていたが、その後は時間的余裕がなくなり、やめた。  \r\n模試は他の資格試験（米国公認会計士、簿記、証券外務員...etc）を受けた経験上、重い割にベネフィットが薄いと感じていたため、やらなかった。  \r\n合格できたので、いずれも正しい意思決定だったようである。\r\n\r\n## **教材以外の道具**\r\n\r\n**[**Studyplus**](https://www.studyplus.jp/)**を**勉強時間の管理**に使った。\r\n\r\n## 勉強方法\r\n\r\n講座の**「過去問反復学習フロー」**に沿って、テキストと演習を普通にこなした。\r\n\r\n## 勉強時間\r\n\r\n勉強時間は以下だった。\r\n\r\n- 講義：90.5時間\r\n- 演習：119時間\r\n\r\n**合計で209.5時間**かかった。  \r\n9月の初旬に勉強を開始し、10月20日が試験日だったので、およそ1.5ヶ月。  \r\n平日は1日5時間勉強し、土日は休息としていたが、間に合わなくなりそうだったので途中から土日も1日5時間ほど勉強した。\r\n\r\n## 試験\r\n\r\n某大学の校舎で受験した。  \r\nCBTでない資格試験は久しぶり。  \r\nなお、海外移住したため、試験のためにわざわざ帰国した。  \r\n（受かって良かった。。）\r\n\r\n## スコア\r\n\r\nスコアは公表されないが、**自己採点では40点**だった（50点満点）。  \r\n今年（令和6年）の合格点は37点だったようで、ちょうどよい塩梅のスコアと言えよう。他資格の試験結果も合わせて鑑みると、合格点に向けて程よくリソース投入をするが得意なのかもしれない。\r\n\r\n## 資格の活用について\r\n\r\n2023年～2024年にかけて、米国公認会計士（USCPA）、公認内部監査人（CIA）、公認システム監査人（CISA）、証券外務員1種、FP3級、宅建を取得した。  \r\nすべて合格点ちょい上くらいで一発合格したので、効率よく取得できたと思うのだが、活用という意味でいうと、特に何もできていない。  \r\nもともと趣味で受け始めた側面が強く、「教養が溜まって嬉しいなぁ」くらいでも別に良いのだが、せっかくなので、**2025年は既存資格を活かす方面にリソースを割きたいと思っている**。  \r\nただ今年、海外移住してしまったので、どうしたものか。\r\n\r\n## 過去の資格受験記\r\n\r\nhttps://notes-of-thought.com/how-to-pass-uscpa-in-750hours/\r\n\r\nhttps://notes-of-thought.com/cia-exam-passed/\r\n\r\nhttps://notes-of-thought.com/cisa-exam-passed/\r\n\r\nhttps://notes-of-thought.com/securities-sales-representatives-exam-passed/\r\n\r\nhttps://notes-of-thought.com/uscpa-time-to-pass-boki2/\r\n\r\nhttps://notes-of-thought.com/financial-planner-level3-examp-passed/&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/japan-realtor-exam-passed.md&quot;],&quot;digest&quot;:[0,&quot;f7c125873ccd1af8&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;宅建士試験に合格&lt;/strong&gt;した。&lt;br&gt;\n**210時間（1.5ヶ月）**かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;学習サービス\&quot;&gt;&lt;strong&gt;学習サービス&lt;/strong&gt;&lt;a class=\&q n**スタディングの[FP3級合格コース](https://studying.jp/fp/itempage/course3-24.html)を使った。**\r\n\r\n## **教材**\r\n\r\n使った教材は以下のとおり：\r\n\r\n- 講義動画：見なかった\r\n- テキスト：全て読んだ\r\n- 演習問題：全てやった\r\n- 模試：やらなかった\r\n- AI復習（※）：やった  \r\n  （※）AI復習：過去の正答率に合わせて、適切な日に適切な問題が出題される機能\r\n\r\n## **教材以外の道具**\r\n\r\n**[**Studyplus**](https://www.studyplus.jp/)**を勉強時間の管理に使った。\r\n\r\n## **勉強方法**\r\n\r\n講座で用意されている学習フローに沿って、章ごとにテキストと演習を終わらせた。\r\n\r\n## **勉強時間**\r\n\r\n勉強時間は以下：\r\n\r\n- テキスト・演習：**37時間50分**\r\n- AI問題演習：**3時間35分**\r\n\r\n**合計で41時間25分**かかった。\r\n\r\n一日5時間勉強を目標としたが、1回しか果たせず、**平均3時間/日**となった。  \r\n目標時間を維持できていれば、8日ほどで合格できた計算。\r\n\r\n## 試験\r\n\r\n今年の4月からFP協会のCBT (Computer Based Testing) が開始（きんざいは昨年11月から）。  \r\n試験は学科と実技に分かれており、別々に予約。  \r\n私は両方を**同じ日に受験**した。  \r\n  \r\n会場は[市ヶ谷テストセンター](https://www.first-step.jp/pages/testcenter)。  \r\n学科の冒頭5～6問、細かい数値を問う問題で少し不安になったが、そこから先はStudyingの演習と同等の難易度。  \r\n**学科・実技ともに40分ほど回答を完了**した  \r\n（持ち時間は学科が90分、実技が60分。いずれも大幅に余った）。\r\n\r\n## **スコア**\r\n\r\nCBTなので、試験を終えるとすぐにスコアが画面に表示された。  \r\n**学科は52点**（満点：60点、合格ライン：36点）、**実技は95点**（満点：100点、合格ライン：60点）であった。  \r\n概ね手応え通りだった。\r\n\r\n## 受験の感想\r\n\r\n**年金や保険に関する自分の無知さに気付かされ**、勉強になった。  \r\n機会があればFP2級にも挑戦したい。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/financial-planner-level3-examp-passed.md&quot;],&quot;digest&quot;:[0,&quot;05870a31b67e4f59&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;FP3級試験に合格&lt;/strong&gt;した。&lt;br&gt;\n**41時間（13日間）**かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;学習サービス\&quot;&gt;学習サービス&lt;a class=\&quot;anchor\&quot; href=\&quot;#学習サービス\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;スタディングの&lt;a href=\&quot;https://studying.jp/fp/itempage/course3-24.html\&quot;&gt;FP3級合格コース&lt;/a&gt;を使った。&lt;/strong&gt;&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材\&quot;&gt;&lt;strong&gt;教材&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材\&quot;&gt;&lt;span lt;/h2&gt;&lt;p&gt;今年の4月からFP協会のCBT (Computer Based Testing) が開始（きんざいは昨年11月から）。&lt;br&gt;\n試験は学科と実技に分かれており、別々に予約。&lt;br&gt;\n私は両方を&lt;strong&gt;同じ日に受験&lt;/strong&gt;した。&lt;/p&gt;&lt;p&gt;会場は&lt;a href=\&quot;https://www.first-step.jp/pages/testcenter\&quot;&gt;市ヶ谷テストセンター&lt;/a&gt;。&lt;br&gt;\n学科の冒頭5～6問、細かい数値を問う問題で少し不安になったが、そこから先はStudyingの演習と同等の難易度。&lt;br&gt;\n&lt;strong&gt;学科・実技ともに40分ほど回答を完了&lt;/strong&gt;した&lt;br&gt;\n（持ち時間は学科が90分、実技が60分。いずれも大幅に余った）。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;スコア\&quot;&gt;&lt;strong&gt;スコア&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#スコア\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;CBTなので、試験を終えるとすぐにスコアが画面に表示された。&lt;br&gt;\n&lt;strong&gt;学科は52点&lt;/strong&gt;（満点：60点、合格ライン：36点）、&lt;strong&gt;実技は95点&lt;/strong&gt;（満点：100点、合格ライン：60点）であった。&lt;br&gt;\n概ね手応え通りだった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;受験の感想\&quot;&gt;受験の感想&lt;a class=\&quot;anchor\&quot; href=\&quot;#受験の感想\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;年金や保険に関する自分の無知さに気付かされ&lt;/strong&gt;、勉強になった。&lt;br&gt;\n機会があればFP2級にも挑戦したい。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;学習サービス&quot;],&quot;text&quot;:[0,&quot;学習サービス#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材&quot;],&quot;text&quot;:[0,&quot;教材#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材以外の道具&quot;],&quot;text&quot;:[0,&quot;教材以外の道具#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強方法&quot;],&quot;text&quot;:[0,&quot;勉強方法#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強時間&quot;],&quot;text&quot;:[0,&quot;勉強時間#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;試験&quot;],&quot;text&quot;:[0,&quot;試験#&quot ssed&quot;],&quot;editorId&quot;:[0,&quot;securities-sales-representatives-exam-passed&quot;]}],&quot;body&quot;:[0,&quot;**証券外務員試験に合格**した。  \r\n**33時間（10日間）**かかった。\r\n\r\n## 学習サービス\r\n\r\n**スタディングの[証券外務員講座（一種・二種セットコース）](https://studying.jp/gaimuin/itempage/)を使った。**\r\n\r\n## **教材**\r\n\r\n使った教材は以下のとおり：\r\n\r\n- 講義動画：見なかった\r\n- テキスト：全て読んだ\r\n- 演習問題：全てやった\r\n- AI復習（※）：やった  \r\n  （※）AI復習：過去の正答率に合わせて、適切な日に適切な問題が出題される機能\r\n\r\n尚、本（例えば[こちら](https://www.amazon.co.jp/%E3%81%86%E3%81%8B%E3%82%8B%EF%BC%81-%E8%A8%BC%E5%88%B8%E5%A4%96%E5%8B%99%E5%93%A1%E4%B8%80%E7%A8%AE-%E5%BF%85%E4%BF%AE%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88-2023-2024%E5%B9%B4%E7%89%88-%E3%83%95%E3%82%A3%E3%83%8A%E3%83%B3%E3%82%B7%E3%83%A3%E3%83%AB%E3%83%90%E3%83%B3%E3%82%AF%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%86%E3%82%A3%E3%83%81%E3%83%A5%E3%83%BC%E3%83%88/dp/429611879X/ref=sr_1_3?crid=1006T9618AQEY&amp;dib=eyJ2IjoiMSJ9.uiCp7Q9_cCw9ztClM8QSeN8oIzEbBH-kcZSNYmt86lnLKzPZ1ZgC_X80rfYfDET4CD2g1Y1WO4nzxGmaLZ3T_Dw3xqj-ioMMPHFmNlDDRExtv40QdVqkNa3kHa4mYdGIcf2xVicLJyKlI8AdeGgvc7ONAmptezQmptabR4eZzXN2PRveiCZmNjssRTqjP84lQW61bIe1aTrGi2f6j3TP3CxQhW7vAxcKs34pkcjnzEOb300U5NJOUVolQqcii9Dx6zdcs8i2EQyXrNTn6IR9JL0-C4EUmkhnqlR8Ls86nsQ.07dOvfX-5y1KUEjijpCXTACgPeJSZQn7obzfDUtQeIY&amp;dib_tag=se&amp;keywords=%E8%A8%BC%E5%88%B8%E5%A4%96%E5%8B%99%E5%93%A1%E4%B8%80%E7%A8%AE&amp;qid=1713863252&amp;sprefix=%E8%A8%BC%E5%88%B8%E5%A4%96%E5%8B%99%E5%93%A1%2Caps%2C1146&amp;sr=8-3)と[こちら](https://www.amazon.co.jp/%E3%81%86%E3%81%8B%E3%82%8B%EF%BC%81-%E8%A8%BC%E5%88%B8%E5%A4%96%E5%8B%99%E5%93%A1%E4%B8%80%E7%A8%AE-%E5%BF%85%E4%BF%AE%E5%95%8F%E9%A1%8C%E9%9B%86-2023-2024%E5%B9%B4%E7%89%88-%E3%83%95%E3%82%A3%E3%83%8A%E3%83%B3%E3%82%B7%E3%83%A3%E3%83%AB%E3%83%90%E3%83%B3%E3%82%AF%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%86%E3%82%A3%E3%83%81%E3%83%A5%E3%83%BC%E3%83%88/dp/4296118803/ref=sr_1_2?crid=1006T9618AQEY&amp;dib=eyJ2IjoiMSJ9.uiCp7Q9_cCw9ztClM8QSeN8oIzEbBH-kcZSNYmt86lnLKzPZ1ZgC_X80rfYfDET4CD2g1Y1WO4nzxGmaLZ3T_Dw3xqj-ioMMPHFmNlDDRExtv40QdVqkNa3kHa4mYdGIcf2xVicLJyKlI8AdeGgvc7ONAmptezQmptabR4eZzXN2PRveiCZmNjssRTqjP84lQW61bIe1aTrGi2f6j3TP3CxQhW7vAxcKs34pkcjnzEOb300U5NJOUVolQqcii9Dx6zdcs8i2EQyXrNTn6IR9JL0-C4EUmkhnqlR8Ls86nsQ.07dOvfX-5y1KUEjijpCXTACgPeJSZQn7obzfDUtQeIY&amp;dib_tag=se&amp;keywords=%E8%A8%BC%E5%88%B8%E5%A4%96%E5%8B%99%E5%93%A1%E4%B8%80%E7%A8%AE&amp;qid=1713863252&amp;sprefix=%E8%A8%BC%E5%88%B8%E5%A4%96%E5%8B%99%E5%93%A1%2Caps%2C1146&amp;sr=8-2)）を買って済ませることも検討した。  \r\nその場合、出費は5,000円程度となり、スタディングの1.5万円に比べると1/3で収まる。  \r\nただ、簿記2級受験の際に経験したスタディングの**UXが非常に良く、金額分の価値は出そう**だったので、スタディングを選択した。  \r\n勉強を終えて、**選択は正しかった**感じる。\r\n\r\n（簿記2級合格体験記は以下参照）\r\n\r\nhttps://notes-of-thought.com/uscpa-time-to-pass-boki2/\r\n\r\n## **教材以外の道具**\r\n\r\n**[**Studyplus**](https://www.studyplus.jp/)**を勉強時間の管理に使った。\r\n\r\n## **勉強方法**\r\n\r\n講座で用意されている学習フローに沿って、章ごとにテキストと演習を終わらせ、外務員2級→1級の順にこなした。  \r\n但し模試は試験の直前に実施したかったので、テキスト・演習を全て終わらせた後に2級・1級それぞれの模試を受けた。  \r\n模試の正答率は2級が87%、1級が86%であった。\r\n\r\n## **勉強時間**\r\n\r\n勉強時間は以下だった。\r\n\r\n- 2級テキスト・演習：17時間59分\r\n- 1級テキスト・演習：9時間43分\r\n- AI問題演習：4時間47分\r\n\r\n**合計で32時間29分**かかった。\r\n\r\n土日はほぼ勉強せず、それを含めて10日かかった。  \r\n尚、証券外務員試験の予約は5営業日前までにしなければならないのを知らず、受験が先延ばしになったため、5日ほど空白期間があった（その間はFP３級の勉強をしていた）。  \r\nこれを含めると勉強開始から合格まで14日間かかっている。  \r\nこれから試験を受ける人は、上記事項に留意されたい。\r\n\r\n## 試験\r\n\r\n試験会場は[御茶ノ水ソラシティ](https://www.prometric-jp.com/examinee/hall/archives/183)にした。  \r\n理由：米国公認会計士（USCPA）試験で4度足を運んでいるため慣れており、**現地のUXが大変良い**。\r\n\r\n尚、**本人確認を自動で行う機器**が導入されており、驚いた  \r\n（身分証を差し込むとOCRで情報を読み、受験者データと照合。顔写真も自動撮影）。  \r\nテストセンターが完全無人化される日は近いのかもしれない。  \r\n  \r\n（米国公認会計士[USCPA]の合格体験記は以下を参照）\r\n\r\nhttps://notes-of-thought.com/how-to-pass-uscpa-in-750hours/\r\n\r\n## **スコア**\r\n\r\nCBT（computer based testing）なので、試験を終えるとすぐにスコアが画面に表示された。  \r\nスコアは**83.9%**であった（70%で合格**）**。  \r\n手応えよりも低かったが、合格ラインよりだいぶ上なので良しとする。\r\n\r\n## 受験の感想\r\n\r\n私は株式投資をしているが、制度信用の仕組みなど雑な理解で済ませていた部分が多くあり、これらがクリアになって良かった。  \r\nまた、非常に楽しく学習できたので、私は**金融商品に纏わる事象に興味が湧くタチ**であることが確認できた。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/securities-sales-representatives-exam-passed.md&quot;],&quot;digest&quot;:[0,&quot;e053f84cc47337f8&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;証券外務員試験に合格&lt;/strong&gt;した。&lt;br&gt;\n**33時間（10日間）**かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;学習サービス\&quot;&gt;学習サービス&lt;a class=\&quot;anchor\&quot; href=\&quot;#学習サービス\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;スタディングの&lt;a href=\&quot;https://studying.jp/gaimuin/itempage/\&quot;&gt;証券外務員講座（一種・二種セットコース）&lt;/a&gt;を使った。&lt;/strong&gt;&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材\&quot;&gt;&lt;strong&gt;教材&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;使った教材は以下のとおり：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;講義動画：見なかった&lt;/li&gt;\n&lt;li&gt;テキスト：全て読んだ&lt;/li&gt;\n&lt;li&gt;演習問題：全てやった&lt;/li&gt;\n&lt;li&gt;AI復習（※）：やった&lt;br&gt;\n（※）AI復習：過去の正答率に合わせて、適切な日に適切な問題が出題される機能&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;尚、本（例えば&lt;a href=\&quot;https://www.amazon.co.jp/%E3%81%86%E3%81%8B%E3%82%8B%EF%BC%81-%E8%A8%BC%E5%88%B8%E5%A4%96%E5%8B%99%E5%93%A1%E4%B8%80%E7%A8%AE-%E5%BF%85%E4%BF%AE%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88-2023-2024%E5%B9%B4%E7%89%88-%E3%83%95%E3%82%A3%E3%83%8A%E3%83%B3%E3%82%B7%E3%83%A3%E3%83%AB%E3%83%90%E3%83%B3%E3%82%AF%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%86%E3%82%A3%E3%83%81%E3%83%A5%E3%83%BC%E3%83%88/dp/429611879X/ref=sr_1_3?crid=1006T9618AQEY&amp;#x26;dib=eyJ2IjoiMSJ9.uiCp7Q9_cCw9ztClM8QSeN8oIzEbBH-kcZSNYmt86lnLKzPZ1ZgC_X80rfYfDET4CD2g1Y1WO4nzxGmaLZ3T_Dw3xqj-ioMMPHFmNlDDRExtv40QdVqkNa3kHa4mYdGIcf2xVicLJyKlI8AdeGgvc7ONAmptezQmptabR4eZzXN2PRveiCZmNjssRTqjP84lQW61bIe1aTrGi2f6j3TP3CxQhW7vAxcKs34pkcjnzEOb300U5NJOUVolQqcii9Dx6zdcs8i2EQyXrNTn6IR9JL0-C4EUmkhnqlR8Ls86nsQ.07dOvfX-5y1KUEjijpCXTACgPeJSZQn7obzfDUtQeIY&amp;#x26;dib_tag=se&amp;#x26;keywords=%E8%A8%BC%E5%88%B8%
