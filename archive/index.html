&quot;prevTitle&quot;:[0,&quot;新規事業がPMFするまでの落とし穴3選&quot;],&quot;prevSlug&quot;:[0,&quot;3pf-of-new-business&quot;],&quot;nextTitle&quot;:[0,&quot;日本で個人投資家は増えているのか？&quot;],&quot;nextSlug&quot;:[0,&quot;are-japanese-retail-investors-increasing&quot;],&quot;editorId&quot;:[0,&quot;pdfize-electronic-textbooks&quot;]}],&quot;body&quot;:[0,&quot;資格試験の電子教材をPDF化した際の方法を共有する。\r\n\r\n1. iPadで電子教材を開く（単ページ表示）\r\n2. シングルタップでスクショが取れるよう設定（assitive touchを使う。[公式動画](https://www.youtube.com/watch?v=_j4-NTg3QsE&amp;ab_channel=AppleSupport)、[公式ヘルプ](https://support.apple.com/ja-jp/111794)）\r\n3. 電子教材の各ページをタップでスクショ\r\n4. スクショを1冊分終えたら全画像iCloudからPCにダウンロード\r\n5. Adobe Acrobatで全ページ一括トリミングし**、**iPadのステータスバーや余白を消す（[Adobe公式へルプ](https://helpx.adobe.com/acrobat/using/crop-pdf-pages.html)）\r\n6. 上記をPDF化したい全教材で実施\r\n7. Adobe Acrobatで全PDF文字検索可能にする（OCRの「検索可能な画像（非圧縮）」を選択。[Adobe公式ヘルプ](https://helpx.adobe.com/jp/acrobat/kb/649.html)）\r\n\r\n上記により、1ページあたり2秒ほどの作業でPDF化可能。  \r\n250ページの教科書であれば10分弱。\r\n\r\n細かいTips:  \r\n・Step4：iCloud上で想定ページ数とスクショ数を確認し抜け漏れチェックしたほうが良い  \r\n・Step5：電子教材の作りが同じであれば、1冊目トリミング時にトリミング幅をメモしておき、2冊目以降はその数値を使うと時短可能  \r\n・Step7：OCRは複数ファイル同時指定して放置すれば全冊分自動で終わるので楽\r\n\r\n（※著作権や利用規約上問題のない範囲でご参考頂きたい）&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/pdfize-electronic-textbooks.md&quot;],&quot;digest&quot;:[0,&quot;1cc6dbce80a5207d&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;資格試験の電子教材をPDF化した際の方法を共有する。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;iPadで電子教材を開く（単ページ表示）&lt;/li&gt;\n&lt;li&gt;シングルタップでスクショが取れるよう設定（assitive touchを使う。&lt;a href=\&quot;https://www.youtube.com/watch?v=_j4-NTg3QsE&amp;#x26;ab_channel=AppleSupport\&quot;&gt;公式動画&lt;/a&gt;、&lt;a href=\&quot;https://support.apple.com/ja-jp/111794\&quot;&gt;公式ヘルプ&lt;/a&gt;）&lt;/li&gt;\n&lt;li&gt;電子教材の各ページをタップでスクショ&lt;/li&gt;\n&lt;li&gt;スクショを1冊分終えたら全画像iCloudからPCにダウンロード&lt;/li&gt;\n&lt;li&gt;Adobe Acrobatで全ページ一括トリミングし**、**iPadのステータスバーや余白を消す（&lt;a href=\&quot;https://helpx.adobe.com/acrobat/using/crop-pdf-pages.html\&quot;&gt;Adobe公式へルプ&lt;/a&gt;）&lt;/li&gt;\n&lt;li&gt;上記をPDF化したい全教材で実施&lt;/li&gt;\n&lt;li&gt;Adobe Acrobatで全PDF文字検索可能にする（OCRの「検索可能な画像（非圧縮）」を選択。&lt;a href=\&quot;https://helpx.adobe.com/jp/acrobat/kb/649.html\&quot;&gt;Adobe公式ヘルプ&lt;/a&gt;）&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;上記により、1ページあたり2秒ほどの作業でPDF化可能。&lt;br&gt;\n250ページの教科書であれば10分弱。&lt;/p&gt;\n&lt;p&gt;細かいTips:&lt;br&gt;\n・Step4：iCloud上で想定ページ数とスクショ数を確認し抜け漏れチェックしたほうが良い&lt;br&gt;\n・Step5：電子教材の作りが同じであれば、1冊目トリミング時にトリミング幅をメモしておき、2冊目以降はその数値を使うと時短可能&lt;br&gt;\n・Step7：OCRは複数ファイル同時指定して放置すれば全冊分自動で終わるので楽&lt;/p&gt;\n&lt;p&gt;（※著作権や利用規約上問題のない範囲でご参考頂きたい）&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;電子教材を効率良くPDF化する方法&quot;],&quot;slug&quot;:[0,&quot;pdfize-electronic-textbooks&quot;],&quot;published&quot;:[3,&quot;2024-01-25T11:04:06.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/pdfize-electronic-textbooks.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,2],&quot;words&quot;:[0,318],&quot;excerpt&quot;:[0,&quot;資格試験の電子教材をPDF化した際の方法を共有する。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;pdfize-electronic-textbooks&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;3pf-of-new-business.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;新規事業がPMFするまでの落とし穴3選&quot;],&quot;published&quot;:[3,&quot;2024-01-25T09:58:19.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/3pf-of-new-business.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;公認内部監査人（CIA）試験合格体験記（15日間/65時間）&quot;],&quot;prevSlug&quot;:[0,&quot;cia-exam-passed&quot;],&quot;nextTitle&quot;:[0,&quot;電子教材を効率良くPDF化する方法&quot;],&quot;nextSlug&quot;:[0,&quot;pdfize-electronic-textbooks&quot;],&quot;editorId&quot;:[0,&quot;3pf-of-new-business&quot;]}],&quot;body&quot;:[0,&quot;自身の起業/新規事業コンサル経験に照らすと、**新規事業がPMFせずに終わる理由**は、以下の3つに集約される。\r\n\r\n- **解のない問題を解こうとする** (problem with no solution)\r\n- **解に当てはまる問題を探している** (solution searching for a problem)\r\n- **情熱がない** (no passion)\r\n\r\nこれを**3PF** (3 pitfalls)と呼ぼう。  \r\n経験上、3PFを全て回避できたら、よほど知力/人格に問題がない限り、PMFする。  \r\n3PFを回避する方法は簡単で、以下を実施するだけである：\r\n\r\n- **何かをいきなり売りに行き、1年間継続してコンバージョンを生み続ける**  \r\n  （「売る」ものは無料でも良く、最終製品である必要もない。無料記事のPVや、商品コンセプト紹介サイト上の予約販売申込数を「コンバージョン」として良い）\r\n\r\n上記を実現できたら、**情熱と解が存在する問題を解いている**確率が高い。  \r\n尚、新規事業の80%は情熱面で問題があり（no passion）、「いきなり売りに行く」段階で躓くので、検証は1年ではなく**5秒で終わる**。  \r\n「いますぐ何かを売る」のを理由なく先延ばしにしようとしたら、その**事業はほぼ失敗**する。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/3pf-of-new-business.md&quot;],&quot;digest&quot;:[0,&quot;0469f3daf958ecf0&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;自身の起業/新規事業コンサル経験に照らすと、&lt;strong&gt;新規事業がPMFせずに終わる理由&lt;/strong&gt;は、以下の3つに集約される。&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;解のない問題を解こうとする&lt;/strong&gt; (problem with no solution)&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;解に当てはまる問題を探している&lt;/strong&gt; (solution searching for a problem)&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;情熱がない&lt;/strong&gt; (no passion)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;これを&lt;strong&gt;3PF&lt;/strong&gt; (3 pitfalls)と呼ぼう。&lt;br&gt;\n経験上、3PFを全て回避できたら、よほど知力/人格に問題がない限り、PMFする。&lt;br&gt;\n3PFを回避する方法は簡単で、以下を実施するだけである：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;何かをいきなり売りに行き、1年間継続してコンバージョンを生み続ける&lt;/strong&gt;&lt;br&gt;\n（「売る」ものは無料でも良く、最終製品である必要もない。無料記事のPVや、商品コンセプト紹介サイト上の予約販売申込数を「コンバージョン」として良い）&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;上記を実現できたら、&lt;strong&gt;情熱と解が存在する問題を解いている&lt;/strong&gt;確率が高い。&lt;br&gt;\n尚、新規事業の80%は情熱面で問題があり（no passion）、「いきなり売りに行く」段階で躓くので、検証は1年ではなく&lt;strong&gt;5秒で終わる&lt;/strong&gt;。&lt;br&gt;\n「いますぐ何かを売る」のを理由なく先延ばしにしようとしたら、その&lt;strong&gt;事業はほぼ失敗&lt;/strong&gt;する。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;新規事業がPMFするまでの落とし穴3選&quot;],&quot;slug&quot;:[0,&quot;3pf-of-new-business&quot;],&quot;published&quot;:[3,&quot;2024-01-25T09:58:19.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/3pf-of-new-business.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,2],&quot;words&quot;:[0,349],&quot;excerpt&quot;:[0,&quot;自身の起業/新規事業コンサル経験に照らすと、新規事業がPMFせずに終わる理由は、以下の3つに集約される。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;3pf-of-new-business&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;cia-exam-passed.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;公認内部監査人（CIA）試験合格体験記（15日間/65時間）&quot;],&quot;published&quot;:[3,&quot;2024-01-16T10:56:14.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/cia-exam-passed.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;公認情報システム監査人（CISA）試験合格体験記（12日間/55時間）&quot;],&quot;prevSlug&quot;:[0,&quot;cisa-exam-passed&quot;],&quot;nextTitle&quot;:[0,&quot;新規事業がPMFするまでの落とし穴3選&quot;],&quot;nextSlug&quot;:[0,&quot;3pf-of-new-business&quot;],&quot;editorId&quot;:[0,&quot;cia-exam-passed&quot;]}],&quot;body&quot;:[0,&quot;**公認内部監査人（CIA）試験に合格**した。  \r\n**65時間（15日間）**かかった。\r\n\r\n## **予備校**\r\n\r\n**予備校は使わなかった**。\r\n\r\n## **教材**\r\n\r\n**教材は主に以下の２つ**を使った。\r\n\r\n- **内部監査基本テキスト：**[公認内部監査人資格認定試験対応 内部監査基本テキスト〈第4版〉](https://www.amazon.co.jp/%E5%85%AC%E8%AA%8D%E5%86%85%E9%83%A8%E7%9B%A3%E6%9F%BB%E4%BA%BA%E8%B3%87%E6%A0%BC%E8%AA%8D%E5%AE%9A%E8%A9%A6%E9%A8%93%E5%AF%BE%E5%BF%9C-%E5%86%85%E9%83%A8%E7%9B%A3%E6%9F%BB%E5%9F%BA%E6%9C%AC%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88%E3%80%88%E7%AC%AC4%E7%89%88%E3%80%89-%E6%B0%B4%E5%B3%B6-%E6%AD%A3/dp/4502350419/ref=sr_1_1?adgrpid=56111751594&amp;dib=eyJ2IjoiMSJ9.mUBbEl0oBV9PYQxLH5KSdBMRFBDOULzx61_XGngCsMcZBLXV2-5taWElbsinVWXOm8cGN8NtxppqJ7IEWx9nFkDt-lSJqRYGmsB1KKaolrVJBvvCu7A1Jb7tGv8RrNs0rXLG9rUNKHM0ZJO-4aHA4OeRFDqV3QvnF30CHTmGeMocWR1iKK5c8NoFmq1GEYaZQTLAoAuY7MmPAR6w2qHG85ay7-DaieQcxnQgEucfkh8.GgTSbB1AEckaOpS1Nrz4YyMIXhrPodGZwfypDuROL3U&amp;dib_tag=se&amp;gclid=CjwKCAiA75itBhA6EiwAkho9ewyVAZYszV2rig1YySyh9HZlWOTFnBqx2uyWqnX8L7ocyrkLwRFwlhoCeL8QAvD_BwE&amp;hvadid=678987370440&amp;hvdev=c&amp;hvlocphy=1009280&amp;hvnetw=g&amp;hvqmt=e&amp;hvrand=14534512074156209027&amp;hvtargid=kwd-333733348291&amp;hydadcr=27923_14738710&amp;jp-ad-ap=0&amp;keywords=%E5%86%85%E9%83%A8%E7%9B%A3%E6%9F%BB%E5%9F%BA%E6%9C%AC%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88&amp;qid=1705400571&amp;sr=8-1)\r\n- **演習アプリ：** [公認内部監査人（CIA）試験対策Webアプリ](https://cfo-navi.com/cia-app/)\r\n\r\n内部監査基本テキストは460問程度の演習も含まれていた。  \r\n演習アプリは1,000問以上をwebで受けられる。\r\n\r\n上記の他、[IIA国際フレームワーク](https://www.iiajapan.com/leg/guide/ippf.html)における「[内部監査の使命](https://www.theiia.org/en/standards/mission-of-internal-audit/)」と「必須のガイダンス」に含まれる各資料（[内部監査の専門的実施の基本原則](https://www.theiia.org/en/standards/what-are-the-standards/core-principles/)、[内部監査の定義](https://www.theiia.org/en/standards/what-are-the-standards/definition-of-internal-audit/)、[倫理要項](https://www.theiia.org/globalassets/documents/standards/code-of-ethics/code-of-ethics-japanese.pdf)、[内部監査の専門職的実施の国際基準](https://www.theiia.org/globalassets/documents/standards/standards-2017/ippf-standards-2017-japanese.pdf)）に目を通した。\r\n\r\n## **教材以外の道具**\r\n\r\n**[**Studyplus**](https://www.studyplus.jp/)**を勉強時間の管理に使った。\r\n\r\n## **勉強方法**\r\n\r\nCIA試験は3科目を個別に受験する形なので、**科目毎に以下を実施**した。\r\n\r\n1. 内部監査基本テキストの講義部分を読む\r\n2. 内部監査基本テキストの演習問題を解く\r\n3. 演習アプリの演習問題を解く\r\n\r\n（いずれも**1周のみ**）\r\n\r\n## **勉強時間**\r\n\r\n勉強時間は以下だった。\r\n\r\n- 内部監査基本テキスト：20時間25分\r\n- 演習アプリ：38時間46分\r\n- IIA国際フレームワーク：5時間32分\r\n\r\n**合計で64時間43分**かかった。\r\n\r\n## **スコア**\r\n\r\nCIA試験は合格の場合スコアが公開されないため、不明。  \r\n全科目1回目で合格。\r\n\r\n## **事前知識**\r\n\r\n**米国公認会計士（USCPA）に合格済**であった。\r\n\r\n## **試験の印象**\r\n\r\n前述の内部監査基本テキスト・演習アプリ共に、曖昧/恣意的に感じられる問題文/解答が散見されストレスが溜まったが、**試験本番の問題は論旨明快**だった印象。\r\n\r\n## **資格申請手続き**\r\n\r\n資格申請に必要な手続き（実務経験の証明等）を事前に済ませておいたため、**全科目合格の翌日に資格付与のメールが届いた**  \r\n（尚、実務経験の証明は一般的に上司に依頼するところ、私は代表取締役であるため上司に相当するものがおらず、取締役に証明してもらったが、問題は発生しなかった）。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/cia-exam-passed.md&quot;],&quot;digest&quot;:[0,&quot;7d5e14b2349fb97c&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;公認内部監査人（CIA）試験に合格&lt;/strong&gt;した。&lt;br&gt;\n**65時間（15日間）**かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;予備校\&quot;&gt;&lt;strong&gt;予備校&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#予備校\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;予備校は使わなかった&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材\&quot;&gt;&lt;strong&gt;教材&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;教材は主に以下の２つ&lt;/strong&gt;を使った。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;内部監査基本テキスト：&lt;/strong&gt;&lt;a href=\&quot;https://www.amazon.co.jp/%E5%85%AC%E8%AA%8D%E5%86%85%E9%83%A8%E7%9B%A3%E6%9F%BB%E4%BA%BA%E8%B3%87%E6%A0%BC%E8%AA%8D%E5%AE%9A%E8%A9%A6%E9%A8%93%E5%AF%BE%E5%BF%9C-%E5%86%85%E9%83%A8%E7%9B%A3%E6%9F%BB%E5%9F%BA%E6%9C%AC%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88%E3%80%88%E7%AC%AC4%E7%89%88%E3%80%89-%E6%B0%B4%E5%B3%B6-%E6%AD%A3/dp/4502350419/ref=sr_1_1?adgrpid=56111751594&amp;#x26;dib=eyJ2IjoiMSJ9.mUBbEl0oBV9PYQxLH5KSdBMRFBDOULzx61_XGngCsMcZBLXV2-5taWElbsinVWXOm8cGN8NtxppqJ7IEWx9nFkDt-lSJqRYGmsB1KKaolrVJBvvCu7A1Jb7tGv8RrNs0rXLG9rUNKHM0ZJO-4aHA4OeRFDqV3QvnF30CHTmGeMocWR1iKK5c8NoFmq1GEYaZQTLAoAuY7MmPAR6w2qHG85ay7-DaieQcxnQgEucfkh8.GgTSbB1AEckaOpS1Nrz4YyMIXhrPodGZwfypDuROL3U&amp;#x26;dib_tag=se&amp;#x26;gclid=CjwKCAiA75itBhA6EiwAkho9ewyVAZYszV2rig1YySyh9HZlWOTFnBqx2uyWqnX8L7ocyrkLwRFwlhoCeL8QAvD_BwE&amp;#x26;hvadid=678987370440&amp;#x26;hvdev=c&amp;#x26;hvlocphy=1009280&amp;#x26;hvnetw=g&amp;#x26;hvqmt=e&amp;#x26;hvrand=14534512074156209027&amp;#x26;hvtargid=kwd-333733348291&amp;#x26;hydadcr=27923_14738710&amp;#x26;jp-ad-ap=0&amp;#x26;keywords=%E5%86%85%E9%83%A8%E7%9B%A3%E6%9F%BB%E5%9F%BA%E6%9C%AC%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88&amp;#x26;qid=1705400571&amp;#x26;sr=8-1\&quot;&gt;公認内部監査人資格認定試験対応 内部監査基本テキスト〈第4版〉&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;演習アプリ：&lt;/strong&gt; &lt;a href=\&quot;https://cfo-navi.com/cia-app/\&quot;&gt;公認内部監査人（CIA）試験対策Webアプリ&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;内部監査基本テキストは460問程度の演習も含まれていた。&lt;br&gt;\n演習アプリは1,000問以上をwebで受けられる。&lt;/p&gt;&lt;p&gt;上記の他、&lt;a href=\&quot;https://www.iiajapan.com/leg/guide/ippf.html\&quot;&gt;IIA国際フレームワーク&lt;/a&gt;における「&lt;a href=\&quot;https://www.theiia.org/en/standards/mission-of-internal-audit/\&quot;&gt;内部監査の使命&lt;/a&gt;」と「必須のガイダンス」に含まれる各資料（&lt;a href=\&quot;https://www.theiia.org/en/standards/what-are-the-standards/core-principles/\&quot;&gt;内部監査の専門的実施の基本原則&lt;/a&gt;、&lt;a href=\&quot;https://www.theiia.org/en/standards/what-are-the-standards/definition-of-internal-audit/\&quot;&gt;内部監査の定義&lt;/a&gt;、&lt;a href=\&quot;https://www.theiia.org/globalassets/documents/standards/code-of-ethics/code-of-ethics-japanese.pdf\&quot;&gt;倫理要項&lt;/a&gt;、&lt;a href=\&quot;https://www.theiia.org/globalassets/documents/standards/standards-2017/ippf-standards-2017-japanese.pdf\&quot;&gt;内部監査の専門職的実施の国際基準&lt;/a&gt;）に目を通した。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材以外の道具\&quot;&gt;&lt;strong&gt;教材以外の道具&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材以外の道具\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;**&lt;a href=\&quot;https://www.studyplus.jp/\&quot;&gt;&lt;strong&gt;Studyplus&lt;/strong&gt;&lt;/a&gt;**を勉強時間の管理に使った。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勉強方法\&quot;&gt;&lt;strong&gt;勉強方法&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#勉強方法\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;CIA試験は3科目を個別に受験する形なので、&lt;strong&gt;科目毎に以下を実施&lt;/strong&gt;した。&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;内部監査基本テキストの講義部分を読む&lt;/li&gt;\n&lt;li&gt;内部監査基本テキストの演習問題を解く&lt;/li&gt;\n&lt;li&gt;演習アプリの演習問題を解く&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;（いずれも&lt;strong&gt;1周のみ&lt;/strong&gt;）&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勉強時間\&quot;&gt;&lt;strong&gt;勉強時間&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#勉強時間\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;勉強時間は以下だった。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;内部監査基本テキスト：20時間25分&lt;/li&gt;\n&lt;li&gt;演習アプリ：38時間46分&lt;/li&gt;\n&lt;li&gt;IIA国際フレームワーク：5時間32分&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;合計で64時間43分&lt;/strong&gt;かかった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;スコア\&quot;&gt;&lt;strong&gt;スコア&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#スコア\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;CIA試験は合格の場合スコアが公開されないため、不明。&lt;br&gt;\n全科目1回目で合格。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;事前知識\&quot;&gt;&lt;strong&gt;事前知識&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#事前知識\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;米国公認会計士（USCPA）に合格済&lt;/strong&gt;であった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;試験の印象\&quot;&gt;&lt;strong&gt;試験の印象&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#試験の印象\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;前述の内部監査基本テキスト・演習アプリ共に、曖昧/恣意的に感じられる問題文/解答が散見されストレスが溜まったが、&lt;strong&gt;試験本番の問題は論旨明快&lt;/strong&gt;だった印象。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;資格申請手続き\&quot;&gt;&lt;strong&gt;資格申請手続き&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#資格申請手続き\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;資格申請に必要な手続き（実務経験の証明等）を事前に済ませておいたため、&lt;strong&gt;全科目合格の翌日に資格付与のメールが届いた&lt;/strong&gt;&lt;br&gt;\n（尚、実務経験の証明は一般的に上司に依頼するところ、私は代表取締役であるため上司に相当するものがおらず、取締役に証明してもらったが、問題は発生しなかった）。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;予備校&quot;],&quot;text&quot;:[0,&quot;予備校#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材&quot;],&quot;text&quot;:[0,&quot;教材#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材以外の道具&quot;],&quot;text&quot;:[0,&quot;教材以外の道具#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強方法&quot;],&quot;text&quot;:[0,&quot;勉強方法#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強時間&quot;],&quot;text&quot;:[0,&quot;勉強時間#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;スコア&quot;],&quot;text&quot;:[0,&quot;スコア#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;事前知識&quot;],&quot;text&quot;:[0,&quot;事前知識#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;試験の印象&quot;],&quot;text&quot;:[0,&quot;試験の印象#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;資格申請手続き&quot;],&quot;text&quot;:[0,&quot;資格申請手続き#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;公認内部監査人（CIA）試験合格体験記（15日間/65時間）&quot;],&quot;slug&quot;:[0,&quot;cia-exam-passed&quot;],&quot;published&quot;:[3,&quot;2024-01-16T10:56:14.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/cia-exam-passed.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,3],&quot;words&quot;:[0,618],&quot;excerpt&quot;:[0,&quot;公認内部監査人（CIA）試験に合格した。 **65時間（15日間）**かかった。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;cia-exam-passed&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;cisa-exam-passed.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;公認情報システム監査人（CISA）試験合格体験記（12日間/55時間）&quot;],&quot;published&quot;:[3,&quot;2024-01-16T09:54:15.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/cisa-exam-passed.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;米国公認会計士（USCPA）のライセンス取得手続き実施記録&quot;],&quot;prevSlug&quot;:[0,&quot;uscpa-license-procedure&quot;],&quot;nextTitle&quot;:[0,&quot;公認内部監査人（CIA）試験合格体験記（15日間/65時間）&quot;],&quot;nextSlug&quot;:[0,&quot;cia-exam-passed&quot;],&quot;editorId&quot;:[0,&quot;cisa-exam-passed&quot;]}],&quot;body&quot;:[0,&quot;**公認システム監査人（CISA）試験に合格**した。  \r\n**55時間（12日間）**かかった。\r\n\r\n## 予備校\r\n\r\n**予備校は使わなかった**。\r\n\r\n## **教材**\r\n\r\n**教材は以下の２つ**を使った。\r\n\r\n- **DOSHI本：**[CISA - Certified Information Systems Auditor Strudy Guide 2nd Edition (HEMANG DOSHI)](https://www.amazon.co.jp/Certified-Information-Systems-Auditor-Guide-ebook/dp/B0C3R9PMYT/ref=sr_1_2?crid=TPKXTM6BU3E4&amp;dib=eyJ2IjoiMSJ9.uSFcvHPsMrDqpY5s1TdjkFA89SMk9roNbahp3mEa_C9NYWew5ez7oyhBLQCUVxK50wWC6HM80tFqHwREWhHV92ZTwTy9fGiCUUmiwz65FcYn9xh6qTN8fpkYG3hyk6Yri1By3HOxqTQ0amAitc75Hy92Jtgs1_hIy-zl_QwYe6x6Dye6cLTmsha9KM4-dzph.g7Ixt247VNGE2dJ2i8ORRLtOXNRlpFaGi4rc4X7X8sI&amp;dib_tag=se&amp;keywords=doshi+cisa&amp;qid=1705395654&amp;sprefix=dashi+ci%2Caps%2C213&amp;sr=8-2)\r\n- **公式演習サイト：** [CISA Questions, Answers &amp; Explanations Database](https://store.isaca.org/s/store#/store/browse/detail/a2S4w000004Ko5OEAS)\r\n\r\nDOSHI本はテキストの他、850問程度のweb演習が付属している。  \r\n公式演習サイトは、1,000問の公式演習問題をwebで受けられる。  \r\n**試験を受けた印象としては、DOSHI本だけで十分**であった。\r\n\r\n## **教材以外の道具**\r\n\r\n**[**Studyplus**](https://www.studyplus.jp/)**を勉強時間の管理に使った。\r\n\r\n## **勉強方法**\r\n\r\nDOSHI本を各章ごとに読み、演習問題を解いた。  \r\nDOSHI本を終えた後、公式演習サイトの問題を全て解いた。  \r\n（**いずれも一周のみ**）\r\n\r\n## **勉強時間**\r\n\r\n**25時間/週を目標に勉強**した。  \r\nDOSHI本はテキストを読むのに14時間43分、演習に12時間10分かかった。  \r\n公式演習サイトは28時間27分かかった。  \r\n**合計で55時間20分**かかった。\r\n\r\n## **スコア**\r\n\r\n**Total Scale Scoreは564**だった（200～800点のうち450点で合格）  \r\n科目別のスコアは以下：\r\n\r\n- Information Systems Auditing Process: 520\r\n- Governance and Management of IT: 444\r\n- Information Systems Acquisition, Development, and Implementation: 651\r\n- Information Systems Operations and Business Resilience: 643\r\n- Protection of Information Assets: 581\r\n\r\n## **事前知識**\r\n\r\n**米国公認会計士（USCPA）に合格済**だったため、監査の考え方には馴染みがあった。\r\n\r\n## **試験の印象**\r\n\r\nDOSHI本・公式演習サイト共に**、**曖昧/恣意的に感じられる問題文/解答が散見されストレスが溜まったが、**試験本番の問題は論旨明快**な印象だった。\r\n\r\n## 資格申請手続き\r\n\r\n**試験修了直後に合否判定が表示**され、**10日後に正式な合格通知メール**がスコアと共に送付されてきた（公式アナウンスには「10営業日以内にメール送信」とあったが、土日を入れて10日後にメールが届いた）。\r\n\r\n上記メール受領に伴い資格申請手続きが可能になったので、実務経験の証明を実施し資格申請をしたところ、**8日後に資格付与の通知メール**が届いた（尚、実務経験の証明は一般的に上司に依頼するところ、私は代表取締役であるため上司に相当するものがおらず、取締役に証明してもらったが、問題は発生しなかった）。\r\n\r\n以上により、**試験合格から18日後に資格が付与**された。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/cisa-exam-passed.md&quot;],&quot;digest&quot;:[0,&quot;c780c9bf32ea5a44&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;公認システム監査人（CISA）試験に合格&lt;/strong&gt;した。&lt;br&gt;\n**55時間（12日間）**かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;予備校\&quot;&gt;予備校&lt;a class=\&quot;anchor\&quot; href=\&quot;#予備校\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;予備校は使わなかった&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材\&quot;&gt;&lt;strong&gt;教材&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;教材は以下の２つ&lt;/strong&gt;を使った。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;DOSHI本：&lt;/strong&gt;&lt;a href=\&quot;https://www.amazon.co.jp/Certified-Information-Systems-Auditor-Guide-ebook/dp/B0C3R9PMYT/ref=sr_1_2?crid=TPKXTM6BU3E4&amp;#x26;dib=eyJ2IjoiMSJ9.uSFcvHPsMrDqpY5s1TdjkFA89SMk9roNbahp3mEa_C9NYWew5ez7oyhBLQCUVxK50wWC6HM80tFqHwREWhHV92ZTwTy9fGiCUUmiwz65FcYn9xh6qTN8fpkYG3hyk6Yri1By3HOxqTQ0amAitc75Hy92Jtgs1_hIy-zl_QwYe6x6Dye6cLTmsha9KM4-dzph.g7Ixt247VNGE2dJ2i8ORRLtOXNRlpFaGi4rc4X7X8sI&amp;#x26;dib_tag=se&amp;#x26;keywords=doshi+cisa&amp;#x26;qid=1705395654&amp;#x26;sprefix=dashi+ci%2Caps%2C213&amp;#x26;sr=8-2\&quot;&gt;CISA - Certified Information Systems Auditor Strudy Guide 2nd Edition (HEMANG DOSHI)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;公式演習サイト：&lt;/strong&gt; &lt;a href=\&quot;https://store.isaca.org/s/store#/store/browse/detail/a2S4w000004Ko5OEAS\&quot;&gt;CISA Questions, Answers &amp;#x26; Explanations Database&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;DOSHI本はテキストの他、850問程度のweb演習が付属している。&lt;br&gt;\n公式演習サイトは、1,000問の公式演習問題をwebで受けられる。&lt;br&gt;\n&lt;strong&gt;試験を受けた印象としては、DOSHI本だけで十分&lt;/strong&gt;であった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材以外の道具\&quot;&gt;&lt;strong&gt;教材以外の道具&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材以外の道具\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;**&lt;a href=\&quot;https://www.studyplus.jp/\&quot;&gt;&lt;strong&gt;Studyplus&lt;/strong&gt;&lt;/a&gt;**を勉強時間の管理に使った。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勉強方法\&quot;&gt;&lt;strong&gt;勉強方法&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#勉強方法\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;DOSHI本を各章ごとに読み、演習問題を解いた。&lt;br&gt;\nDOSHI本を終えた後、公式演習サイトの問題を全て解いた。&lt;br&gt;\n（&lt;strong&gt;いずれも一周のみ&lt;/strong&gt;）&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勉強時間\&quot;&gt;&lt;strong&gt;勉強時間&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#勉強時間\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;25時間/週を目標に勉強&lt;/strong&gt;した。&lt;br&gt;\nDOSHI本はテキストを読むのに14時間43分、演習に12時間10分かかった。&lt;br&gt;\n公式演習サイトは28時間27分かかった。&lt;br&gt;\n&lt;strong&gt;合計で55時間20分&lt;/strong&gt;かかった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;スコア\&quot;&gt;&lt;strong&gt;スコア&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#スコア\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Total Scale Scoreは564&lt;/strong&gt;だった（200～800点のうち450点で合格）&lt;br&gt;\n科目別のスコアは以下：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;Information Systems Auditing Process: 520&lt;/li&gt;\n&lt;li&gt;Governance and Management of IT: 444&lt;/li&gt;\n&lt;li&gt;Information Systems Acquisition, Development, and Implementation: 651&lt;/li&gt;\n&lt;li&gt;Information Systems Operations and Business Resilience: 643&lt;/li&gt;\n&lt;li&gt;Protection of Information Assets: 581&lt;/li&gt;\n&lt;/ul&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;事前知識\&quot;&gt;&lt;strong&gt;事前知識&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#事前知識\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;米国公認会計士（USCPA）に合格済&lt;/strong&gt;だったため、監査の考え方には馴染みがあった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;試験の印象\&quot;&gt;&lt;strong&gt;試験の印象&lt;/strong&gt;&lt;a class=\&quot;anchor\&quot; href=\&quot;#試験の印象\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;DOSHI本・公式演習サイト共に**、**曖昧/恣意的に感じられる問題文/解答が散見されストレスが溜まったが、&lt;strong&gt;試験本番の問題は論旨明快&lt;/strong&gt;な印象だった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;資格申請手続き\&quot;&gt;資格申請手続き&lt;a class=\&quot;anchor\&quot; href=\&quot;#資格申請手続き\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;試験修了直後に合否判定が表示&lt;/strong&gt;され、&lt;strong&gt;10日後に正式な合格通知メール&lt;/strong&gt;がスコアと共に送付されてきた（公式アナウンスには「10営業日以内にメール送信」とあったが、土日を入れて10日後にメールが届いた）。&lt;/p&gt;&lt;p&gt;上記メール受領に伴い資格申請手続きが可能になったので、実務経験の証明を実施し資格申請をしたところ、&lt;strong&gt;8日後に資格付与の通知メール&lt;/strong&gt;が届いた（尚、実務経験の証明は一般的に上司に依頼するところ、私は代表取締役であるため上司に相当するものがおらず、取締役に証明してもらったが、問題は発生しなかった）。&lt;/p&gt;&lt;p&gt;以上により、&lt;strong&gt;試験合格から18日後に資格が付与&lt;/strong&gt;された。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;予備校&quot;],&quot;text&quot;:[0,&quot;予備校#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材&quot;],&quot;text&quot;:[0,&quot;教材#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;教材以外の道具&quot;],&quot;text&quot;:[0,&quot;教材以外の道具#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強方法&quot;],&quot;text&quot;:[0,&quot;勉強方法#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勉強時間&quot;],&quot;text&quot;:[0,&quot;勉強時間#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;スコア&quot;],&quot;text&quot;:[0,&quot;スコア#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;事前知識&quot;],&quot;text&quot;:[0,&quot;事前知識#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;試験の印象&quot;],&quot;text&quot;:[0,&quot;試験の印象#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;資格申請手続き&quot;],&quot;text&quot;:[0,&quot;資格申請手続き#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;公認情報システム監査人（CISA）試験合格体験記（12日間/55時間）&quot;],&quot;slug&quot;:[0,&quot;cisa-exam-passed&quot;],&quot;published&quot;:[3,&quot;2024-01-16T09:54:15.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2024/01/cisa-exam-passed.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,3],&quot;words&quot;:[0,667],&quot;excerpt&quot;:[0,&quot;公認システム監査人（CISA）試験に合格した。 **55時間（12日間）**かかった。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;cisa-exam-passed&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;uscpa-license-procedure.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;米国公認会計士（USCPA）のライセンス取得手続き実施記録&quot;],&quot;published&quot;:[3,&quot;2023-08-21T09:43:06.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/08/uscpa-license-procedure.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;米国公認会計士（USCPA）の倫理試験（ethics exam）合格体験記（2.5時間）&quot;],&quot;prevSlug&quot;:[0,&quot;uscpa-ethics-pass-in-short-time&quot;],&quot;nextTitle&quot;:[0,&quot;公認情報システム監査人（CISA）試験合格体験記（12日間/55時間）&quot;],&quot;nextSlug&quot;:[0,&quot;cisa-exam-passed&quot;],&quot;editorId&quot;:[0,&quot;uscpa-license-procedure&quot;]}],&quot;body&quot;:[0,&quot;**米国公認会計士（USCPA）のライセンスを取得**た。\r\n\r\n最終試験の**合格発表から1.5ヶ月**かかった。\r\n\r\n\r\n\r\n## ライセンス取得までの道のり：概要\r\n\r\nライセンス取得に向け実施した手続きと作業時間は以下：\r\n\r\n1. **ライセンス質問票**の作成：3.5時間\r\n2. **英文職務経歴書**の作成：1.5時間\r\n3. **無料コンサルテーション**の申請：15分\r\n4. **実務経験証明書**の作成：15分\r\n5. **勤務先証明書**の用意：30分\r\n6. **ライセンス取得サポート**の申請：15分\r\n7. **学歴の評価/送付**の依頼：45分\r\n8. **試験実績送付**の依頼：30分\r\n9. **倫理試験**の合格：4時間\r\n10. **CPA面談**の実施：1時間\r\n11. **ライセンス申請**の実施：30分\r\n12. **その他細かい作業**の実施：2時間\r\n\r\n合計：**15時間**  \r\n（※時間は測定しておらず、大凡の記憶で書いている）  \r\n（※前提：アビタスのライセンス取得サポートを活用、ワシントン州のライセンスを取得）\r\n\r\n尚、上記作業の間に発生した待機期間は以下であった：\r\n\r\n1. **無料コンサルテーションの結果**を待つ：1営業日\r\n2. **CPA面談の実施日**を待つ：3営業日\r\n3. **学歴の評価/転送**を待つ：1.25ヶ月\r\n4. **署名済み実務経験証明書**を待つ：1.1ヶ月\r\n5. **ライセンス発行**を待つ：0.5営業日\r\n\r\n合計：**1.5ヶ月**  \r\n（※単純合計となっていないのは、上記3.と4.を並行させたため）\r\n\r\nまた、ツールとして以下を使った：\r\n\r\n- [**GPT-4**](https://openai.com/research/gpt-4)：**ライセンス質問票**の適格性記入で英文を整えるのに使用\r\n- [**Canva**](https://www.canva.com/ja_jp/)：**英文職務経歴書**の作成に使用\r\n\r\n以下、各種手続き、待機期間、ツールに関して書いていく。  \r\n（※アビタスのライセンス取得サポートに関する手続きが多く、これを活用されない方は該当箇所を読み飛ばしてOK）\r\n\r\n## 無料コンサルテーションの申請\r\n\r\n**無料コンサルテーション**は、私が利用したUSCPA予備校である**アビタスのライセンス取得サポートに必要**となるもの。\r\n\r\nワシントン州のUSCPAライセンス取得にあたっては、会計関連の実務経験（1年以上）を証明するため、**実務経験証明書を現地の会計士委員会に送付**する必要がある。\r\n\r\nこの証明書類には、**一定の要件を満たしたUSCPAホルダーの署名が必要**となるのだが、署名を依頼できる人が身近にいない人は、**アビタスに支援を依頼**することができる。\r\n\r\n具体的には、以下のプロセスを辿る。\r\n\r\n1. 必要書類（ライセンス質問票、英文職務経歴書など）を送ると、**アビタスがライセンス取得の可否を審査**（無料コンサルテーション）\r\n2. 審査結果が良好な場合、**ライセンス取得サポートを申請**し必要書類（実務経験証明書と勤務先証明書）を送付、アビタスの**CPA講師とオンライン面談**（CPA面談）を実施\r\n3. アビタスがメールで**署名済み実務経験証明書を送付**\r\n\r\n## ライセンス質問票の作成\r\n\r\nライセンス質問票は、前述したアビタスの**無料コンサルテーション申請時**に必要となる。\r\n\r\n過去8年間の会計に関する実務経験の月数、総時間数、内訳等の他、**適格性**を記載する。\r\n\r\nこの**適格性**がくせ者で、以下のような**フワっとした文章**で記述されている。\r\n\r\n&gt; As a result of my experience I am aware of the need to listen unemotionally but objectively when evaluating verbal or written input from others.\r\n\r\n&gt; As a result of my experience I became aware that some people make decisions without any basis for the decision. My work and life experiences have taught me how to be reasonably certain I knew what I was talking about by having some objective data or other knowledge base to support my position on a matter.\r\n\r\n**上記の文章に適合するような実務経験**を有することをアピールしなければならないのだが、これが**11項目**もある上、**どこまで具体的に書くか悩ましい**ところである。\r\n\r\n本書類はアビタスのライセンス取得サポートで必要となるに過ぎず、**ワシントン州会計士委員会に提出する必要はない**。\r\n\r\n一方で、アビタスは**実務経験証明書への署名を外部のCPAホルダーに依頼**しており、**雑に書くと問題が発生**する可能性もある。\r\n\r\n結局リスク回避のため割と具体的に書いた結果、全体で**3.5時間**かかった。\r\n\r\n尚、英文を整える際に[GPT-4](https://openai.com/research/gpt-4)を使い、表現を洗練させた。\r\n\r\n## 英文職務経歴書の作成\r\n\r\n英文職務経歴書は、**ワシントン州会計士委員会へのライセンス申請時**に必要となる他、アビタスの**無料コンサルテーション申請時**にも必要となる。\r\n\r\n私は[Canva](https://www.canva.com/ja_jp/create/resumes/english/)の無料版を使い、**英文職務経歴書テンプレート**に記入する形で作成した。\r\n\r\n[![](https://assets.st-note.com/img/1692166306425-90VOVfVFHW.png?width=800)](https://editor.note.com/notes/na03d6ed6f565/edit/)\r\n\r\n上記のような経歴書テンプレートをブラウザ上で編集してダウンロード可能\r\n\r\n良い感じのテンプレートデザインを探したり、記入事項に合わせてデザインを調整したりしていたら、全体で**1.5時間**かかった。\r\n\r\nただ、Wordでゼロから作るよりは、**質・効率ともに良かった**と思われる。\r\n\r\n## 実務経験証明書の作成\r\n\r\n実務経験証明書は、**ワシントン州会計士委員会へのライセンス申請時**に必要となる他、前述した**アビタスのライセンス取得サポート申請時**にも必要となる。\r\n\r\nPDFの入力フォームに住所氏名等を入力の上、印刷し手書きで署名するだけであるため、作業自体は**15分**ほどで終わった。\r\n\r\n一方、これをアビタスに送付し、**CPAホルダーの署名が入った状態で返ってくるのに1.1ヶ月かかった**ので、待機時間を含めると、ライセンス取得の**ボトルネック工程**となっている。  \r\n（※監査法人に勤めている等、署名者を自分で見つけられる人は、1時間ほどで完了可能）\r\n\r\n## 勤務先証明書の用意\r\n\r\n勤務先証明書は、**アビタスのライセンス取得サポート申請時**に必要となる。\r\n\r\n具体的には、以下のどちらかを用意してアビタスに送付する：\r\n\r\n- 収源泉徴収票か確定申告書（コピーと英訳の双方）\r\n- 勤務先が発行した英文在籍証明書\r\n\r\n私は在籍証明書を送付した。\r\n\r\n## ライセンス取得サポートの申請\r\n\r\nアビタスのライセンス取得サポートは、実務経験証明書および勤務先証明書を送付の上、対価を前払いすると完了する。\r\n\r\nその後、CPA面談の日程調整をすると、面談まで待機期間となる。**面談は月に2回実施**されているようで、私は幸運にも3営業日後に面談となった。\r\n\r\nちなみに、無料コンサルテーションを含めアビタスとのやり取りは、基本的に受験生サイトの問い合わせページで実施したが、**2営業日以上待たされることはなく**、スムーズであった。\r\n\r\n## 学歴の評価/送付の依頼\r\n\r\n学歴の評価/送付は、試験出願がワシントン州以外であった場合等に、**会計士委員会へのライセンス申請時までに完了**している必要がある。（※依頼のみならず送付が完了している必要がある）\r\n\r\n私は出願州がニューヨークであったため、日本の大学/大学院に関する学歴の評価とワシントン州会計士委員会への送付を[NIES](https://nasba.org/products/nasbainternationalevaluationservices/)に依頼した。\r\n\r\nまたライセンス取得には、アビタス経由で取得したカルフォルニア州立大学の単位も必要だったため、[parchment](https://www.parchment.com/u/registration/34740/institution)経由で単位証明書の送付を依頼した。\r\n\r\nいずれも**CPA面談までの待機期間中に依頼作業を完了**したが、NIESの**学歴評価/送付は1.25ヶ月**かかり、署名済み実務経験証明書の入手と並び、**ライセンス取得のボトルネック工程**となっている。\r\n\r\n## 試験実績送付の依頼\r\n\r\n試験実績の送付は、試験出願がワシントン州以外であった場合に、**ワシントン州会計士委員会へのライセンス申請時までに完了**している必要がある。（※依頼のみならず送付が完了している必要がある）\r\n\r\n私はニューヨーク州の試験に合格したため、NASBAに試験実績をワシントン州会計士委員会へ送付する旨を依頼した。\r\n\r\n[NASBAのオンラインストア](https://nasba.org/exams/cpaexam/washington/)上にて、**15分～30分程度で実施可能**とおり、CPA面談までの待機期間中に依頼を完了した。\r\n\r\n## 倫理試験の合格\r\n\r\n倫理試験の合格は、**ワシントン州会計士委員会へのライセンス申請時**に必要となる。\r\n\r\n**試験の詳細は以下の記事**に書いたので、そちらをご参照頂きたい：\r\n\r\nhttps://notes-of-thought.com/uscpa-ethics-pass-in-short-time/\r\n\r\n試験合格後、合格証明書が発行されるので、そちらをダウンロードした上で、ライセンス申請時に使用することになる。\r\n\r\n## CPA面談の実施\r\n\r\nCPA面談は、アビタスのライセンス取得サポートにおいて、**署名済み実務経験証明書を送付してもらう**上で必要となるプロせスである。\r\n\r\n面談の内容だが、ライセンス取得サポート申込者が**zoom**上で集まり、それぞれが**アビタスの講師**（CPAホルダー）へ**会計に関する実務経歴を1分程度で説明**するグループ面談となっている。\r\n\r\n説明は1人1分だが、私が参加した回では**25名**程度が参加しており、発言者変更の待機時間や事前説明等のため、**1時間程度かかった**と記憶している。\r\n\r\n尚、このプロセスに**何の意味があるのか**、そもそも**必要なのか**、といった疑問が湧くかと思われるが、実務経験証明書への**署名を外部CPAホルダーに依頼する上で必要**というような説明が講師からあったので（うろ覚えだが）、ワシントン州会計士委員会の規約等で何かあるのかもしれない。\r\n\r\ntwitter等では、**目的の不明瞭さ**や**プライバシーへの懸念**から**不満の声**が見受けられるが、個人的には、1時間程度で終わり、また自身の情報開示にあまり抵抗がないため、**特に嫌悪感はなかった**。\r\n\r\n## 学歴評価と実務経験証明書の待機期間\r\n\r\nCPA面談から1.1ヶ月後、**ボトルネック工程**となっていた学歴評価と署名済み実務経験証明書の取得が**ほぼ同時に完了**した。\r\n\r\n以上をもって、ようやく**ライセンス申請が可能**となった。\r\n\r\n## ライセンス申請の実施\r\n\r\n[ワシントン州オンラインシステム](https://secureaccess.wa.gov/)にアクセスし、①各種情報の入力、②書類（署名済み実務経験証明書/英文職務経歴書/倫理試験の合格証明書）のアップロード、③申請料金の支払い、を完了したところ、**10時間**後にライセンスが発行された旨のメール通知を受領した。\r\n\r\nアビタスの情報では申請後1～2週間かかるとのことだったため、想定より**非常に早かった**。\r\n\r\n以上をもって、最終試験の合格発表から**1.5ヶ月後**、はれて**米国公認会計士になった**。\r\n\r\n## 所感\r\n\r\n思ったより**細かい作業**が多く、**相互依存も多い**ので、**早めに全体像を把握**し、**事務作業**は要所で時間を取って**一気に終わらせる**のをおすすめする。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/uscpa-license-procedure.md&quot;],&quot;digest&quot;:[0,&quot;5fece226086b0b5b&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;米国公認会計士（USCPA）のライセンスを取得&lt;/strong&gt;た。&lt;/p&gt;\n&lt;p&gt;最終試験の&lt;strong&gt;合格発表から1.5ヶ月&lt;/strong&gt;かかった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;ライセンス取得までの道のり概要\&quot;&gt;ライセンス取得までの道のり：概要&lt;a class=\&quot;anchor\&quot; href=\&quot;#ライセンス取得までの道のり概要\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;ライセンス取得に向け実施した手続きと作業時間は以下：&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;ライセンス質問票&lt;/strong&gt;の作成：3.5時間&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;英文職務経歴書&lt;/strong&gt;の作成：1.5時間&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;無料コンサルテーション&lt;/strong&gt;の申請：15分&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;実務経験証明書&lt;/strong&gt;の作成：15分&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;勤務先証明書&lt;/strong&gt;の用意：30分&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ライセンス取得サポート&lt;/strong&gt;の申請：15分&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;学歴の評価/送付&lt;/strong&gt;の依頼：45分&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;試験実績送付&lt;/strong&gt;の依頼：30分&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;倫理試験&lt;/strong&gt;の合格：4時間&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;CPA面談&lt;/strong&gt;の実施：1時間&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ライセンス申請&lt;/strong&gt;の実施：30分&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;その他細かい作業&lt;/strong&gt;の実施：2時間&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;合計：&lt;strong&gt;15時間&lt;/strong&gt;&lt;br&gt;\n（※時間は測定しておらず、大凡の記憶で書いている）&lt;br&gt;\n（※前提：アビタスのライセンス取得サポートを活用、ワシントン州のライセンスを取得）&lt;/p&gt;&lt;p&gt;尚、上記作業の間に発生した待機期間は以下であった：&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;無料コンサルテーションの結果&lt;/strong&gt;を待つ：1営業日&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;CPA面談の実施日&lt;/strong&gt;を待つ：3営業日&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;学歴の評価/転送&lt;/strong&gt;を待つ：1.25ヶ月&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;署名済み実務経験証明書&lt;/strong&gt;を待つ：1.1ヶ月&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ライセンス発行&lt;/strong&gt;を待つ：0.5営業日&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;合計：&lt;strong&gt;1.5ヶ月&lt;/strong&gt;&lt;br&gt;\n（※単純合計となっていないのは、上記3.と4.を並行させたため）&lt;/p&gt;&lt;p&gt;また、ツールとして以下を使った：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;https://openai.com/research/gpt-4\&quot;&gt;&lt;strong&gt;GPT-4&lt;/strong&gt;&lt;/a&gt;：&lt;strong&gt;ライセンス質問票&lt;/strong&gt;の適格性記入で英文を整えるのに使用&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://www.canva.com/ja_jp/\&quot;&gt;&lt;strong&gt;Canva&lt;/strong&gt;&lt;/a&gt;：&lt;strong&gt;英文職務経歴書&lt;/strong&gt;の作成に使用&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;以下、各種手続き、待機期間、ツールに関して書いていく。&lt;br&gt;\n（※アビタスのライセンス取得サポートに関する手続きが多く、これを活用されない方は該当箇所を読み飛ばしてOK）&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;無料コンサルテーションの申請\&quot;&gt;無料コンサルテーションの申請&lt;a class=\&quot;anchor\&quot; href=\&quot;#無料コンサルテーションの申請\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;無料コンサルテーション&lt;/strong&gt;は、私が利用したUSCPA予備校である&lt;strong&gt;アビタスのライセンス取得サポートに必要&lt;/strong&gt;となるもの。&lt;/p&gt;&lt;p&gt;ワシントン州のUSCPAライセンス取得にあたっては、会計関連の実務経験（1年以上）を証明するため、&lt;strong&gt;実務経験証明書を現地の会計士委員会に送付&lt;/strong&gt;する必要がある。&lt;/p&gt;&lt;p&gt;この証明書類には、&lt;strong&gt;一定の要件を満たしたUSCPAホルダーの署名が必要&lt;/strong&gt;となるのだが、署名を依頼できる人が身近にいない人は、&lt;strong&gt;アビタスに支援を依頼&lt;/strong&gt;することができる。&lt;/p&gt;&lt;p&gt;具体的には、以下のプロセスを辿る。&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;必要書類（ライセンス質問票、英文職務経歴書など）を送ると、&lt;strong&gt;アビタスがライセンス取得の可否を審査&lt;/strong&gt;（無料コンサルテーション）&lt;/li&gt;\n&lt;li&gt;審査結果が良好な場合、&lt;strong&gt;ライセンス取得サポートを申請&lt;/strong&gt;し必要書類（実務経験証明書と勤務先証明書）を送付、アビタスの&lt;strong&gt;CPA講師とオンライン面談&lt;/strong&gt;（CPA面談）を実施&lt;/li&gt;\n&lt;li&gt;アビタスがメールで&lt;strong&gt;署名済み実務経験証明書を送付&lt;/strong&gt;&lt;/li&gt;\n&lt;/ol&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;ライセンス質問票の作成\&quot;&gt;ライセンス質問票の作成&lt;a class=\&quot;anchor\&quot; href=\&quot;#ライセンス質問票の作成\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;ライセンス質問票は、前述したアビタスの&lt;strong&gt;無料コンサルテーション申請時&lt;/strong&gt;に必要となる。&lt;/p&gt;&lt;p&gt;過去8年間の会計に関する実務経験の月数、総時間数、内訳等の他、&lt;strong&gt;適格性&lt;/strong&gt;を記載する。&lt;/p&gt;&lt;p&gt;この&lt;strong&gt;適格性&lt;/strong&gt;がくせ者で、以下のような&lt;strong&gt;フワっとした文章&lt;/strong&gt;で記述されている。&lt;/p&gt;&lt;blockquote&gt;\n&lt;p&gt;As a result of my experience I am aware of the need to listen unemotionally but objectively when evaluating verbal or written input from others.&lt;/p&gt;\n&lt;/blockquote&gt;&lt;blockquote&gt;\n&lt;p&gt;As a result of my experience I became aware that some people make decisions without any basis for the decision. My work and life experiences have taught me how to be reasonably certain I knew what I was talking about by having some objective data or other knowledge base to support my position on a matter.&lt;/p&gt;\n&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;上記の文章に適合するような実務経験&lt;/strong&gt;を有することをアピールしなければならないのだが、これが&lt;strong&gt;11項目&lt;/strong&gt;もある上、&lt;strong&gt;どこまで具体的に書くか悩ましい&lt;/strong&gt;ところである。&lt;/p&gt;&lt;p&gt;本書類はアビタスのライセンス取得サポートで必要となるに過ぎず、&lt;strong&gt;ワシントン州会計士委員会に提出する必要はない&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;一方で、アビタスは&lt;strong&gt;実務経験証明書への署名を外部のCPAホルダーに依頼&lt;/strong&gt;しており、&lt;strong&gt;雑に書くと問題が発生&lt;/strong&gt;する可能性もある。&lt;/p&gt;&lt;p&gt;結局リスク回避のため割と具体的に書いた結果、全体で&lt;strong&gt;3.5時間&lt;/strong&gt;かかった。&lt;/p&gt;&lt;p&gt;尚、英文を整える際に&lt;a href=\&quot;https://openai.com/research/gpt-4\&quot;&gt;GPT-4&lt;/a&gt;を使い、表現を洗練させた。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;英文職務経歴書の作成\&quot;&gt;英文職務経歴書の作成&lt;a class=\&quot;anchor\&quot; href=\&quot;#英文職務経歴書の作成\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;英文職務経歴書は、&lt;strong&gt;ワシントン州会計士委員会へのライセンス申請時&lt;/strong&gt;に必要となる他、アビタスの&lt;strong&gt;無料コンサルテーション申請時&lt;/strong&gt;にも必要となる。&lt;/p&gt;&lt;p&gt;私は&lt;a href=\&quot;https://www.canva.com/ja_jp/create/resumes/english/\&quot;&gt;Canva&lt;/a&gt;の無料版を使い、&lt;strong&gt;英文職務経歴書テンプレート&lt;/strong&gt;に記入する形で作成した。&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://editor.note.com/notes/na03d6ed6f565/edit/\&quot;&gt;&lt;img src=\&quot;https://assets.st-note.com/img/1692166306425-90VOVfVFHW.png?width=800\&quot; alt=\&quot;\&quot;&gt;&lt;/a&gt;&lt;/p&gt;&lt;p&gt;上記のような経歴書テンプレートをブラウザ上で編集してダウンロード可能&lt;/p&gt;&lt;p&gt;良い感じのテンプレートデザインを探したり、記入事項に合わせてデザインを調整したりしていたら、全体で&lt;strong&gt;1.5時間&lt;/strong&gt;かかった。&lt;/p&gt;&lt;p&gt;ただ、Wordでゼロから作るよりは、&lt;strong&gt;質・効率ともに良かった&lt;/strong&gt;と思われる。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;実務経験証明書の作成\&quot;&gt;実務経験証明書の作成&lt;a class=\&quot;anchor\&quot; href=\&quot;#実務経験証明書の作成\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;実務経験証明書は、&lt;strong&gt;ワシントン州会計士委員会へのライセンス申請時&lt;/strong&gt;に必要となる他、前述した&lt;strong&gt;アビタスのライセンス取得サポート申請時&lt;/strong&gt;にも必要となる。&lt;/p&gt;&lt;p&gt;PDFの入力フォームに住所氏名等を入力の上、印刷し手書きで署名するだけであるため、作業自体は&lt;strong&gt;15分&lt;/strong&gt;ほどで終わった。&lt;/p&gt;&lt;p&gt;一方、これをアビタスに送付し、&lt;strong&gt;CPAホルダーの署名が入った状態で返ってくるのに1.1ヶ月かかった&lt;/strong&gt;ので、待機時間を含めると、ライセンス取得の&lt;strong&gt;ボトルネック工程&lt;/strong&gt;となっている。&lt;br&gt;\n（※監査法人に勤めている等、署名者を自分で見つけられる人は、1時間ほどで完了可能）&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;勤務先証明書の用意\&quot;&gt;勤務先証明書の用意&lt;a class=\&quot;anchor\&quot; href=\&quot;#勤務先証明書の用意\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;勤務先証明書は、&lt;strong&gt;アビタスのライセンス取得サポート申請時&lt;/strong&gt;に必要となる。&lt;/p&gt;&lt;p&gt;具体的には、以下のどちらかを用意してアビタスに送付する：&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;収源泉徴収票か確定申告書（コピーと英訳の双方）&lt;/li&gt;\n&lt;li&gt;勤務先が発行した英文在籍証明書&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;私は在籍証明書を送付した。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;ライセンス取得サポートの申請\&quot;&gt;ライセンス取得サポートの申請&lt;a class=\&quot;anchor\&quot; href=\&quot;#ライセンス取得サポートの申請\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;アビタスのライセンス取得サポートは、実務経験証明書および勤務先証明書を送付の上、対価を前払いすると完了する。&lt;/p&gt;&lt;p&gt;その後、CPA面談の日程調整をすると、面談まで待機期間となる。&lt;strong&gt;面談は月に2回実施&lt;/strong&gt;されているようで、私は幸運にも3営業日後に面談となった。&lt;/p&gt;&lt;p&gt;ちなみに、無料コンサルテーションを含めアビタスとのやり取りは、基本的に受験生サイトの問い合わせページで実施したが、&lt;strong&gt;2営業日以上待たされることはなく&lt;/strong&gt;、スムーズであった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;学歴の評価送付の依頼\&quot;&gt;学歴の評価/送付の依頼&lt;a class=\&quot;anchor\&quot; href=\&quot;#学歴の評価送付の依頼\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;学歴の評価/送付は、試験出願がワシントン州以外であった場合等に、&lt;strong&gt;会計士委員会へのライセンス申請時までに完了&lt;/strong&gt;している必要がある。（※依頼のみならず送付が完了している必要がある）&lt;/p&gt;&lt;p&gt;私は出願州がニューヨークであったため、日本の大学/大学院に関する学歴の評価とワシントン州会計士委員会への送付を&lt;a href=\&quot;https://nasba.org/products/nasbainternationalevaluationservices/\&quot;&gt;NIES&lt;/a&gt;に依頼した。&lt;/p&gt;&lt;p&gt;またライセンス取得には、アビタス経由で取得したカルフォルニア州立大学の単位も必要だったため、&lt;a href=\&quot;https://www.parchment.com/u/registration/34740/institution\&quot;&gt;parchment&lt;/a&gt;経由で単位証明書の送付を依頼した。&lt;/p&gt;&lt;p&gt;いずれも&lt;strong&gt;CPA面談までの待機期間中に依頼作業を完了&lt;/strong&gt;したが、NIESの&lt;strong&gt;学歴評価/送付は1.25ヶ月&lt;/strong&gt;かかり、署名済み実務経験証明書の入手と並び、&lt;strong&gt;ライセンス取得のボトルネック工程&lt;/strong&gt;となっている。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;試験実績送付の依頼\&quot;&gt;試験実績送付の依頼&lt;a class=\&quot;anchor\&quot; href=\&quot;#試験実績送付の依頼\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;試験実績の送付は、試験出願がワシントン州以外であった場合に、&lt;strong&gt;ワシントン州会計士委員会へのライセンス申請時までに完了&lt;/strong&gt;している必要がある。（※依頼のみならず送付が完了している必要がある）&lt;/p&gt;&lt;p&gt;私はニューヨーク州の試験に合格したため、NASBAに試験実績をワシントン州会計士委員会へ送付する旨を依頼した。&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://nasba.org/exams/cpaexam/washington/\&quot;&gt;NASBAのオンラインストア&lt;/a&gt;上にて、&lt;strong&gt;15分～30分程度で実施可能&lt;/strong&gt;とおり、CPA面談までの待機期間中に依頼を完了した。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;倫理試験の合格\&quot;&gt;倫理試験の合格&lt;a class=\&quot;anchor\&quot; href=\&quot;#倫理試験の合格\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;倫理試験の合格は、&lt;strong&gt;ワシントン州会計士委員会へのライセンス申請時&lt;/strong&gt;に必要となる。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;試験の詳細は以下の記事&lt;/strong&gt;に書いたので、そちらをご参照頂きたい：&lt;/p&gt;&lt;p&gt;&lt;a href=\&quot;https://notes-of-thought.com/uscpa-ethics-pass-in-short-time/\&quot;&gt;https://notes-of-thought.com/uscpa-ethics-pass-in-short-time/&lt;/a&gt;&lt;/p&gt;&lt;p&gt;試験合格後、合格証明書が発行されるので、そちらをダウンロードした上で、ライセンス申請時に使用することになる。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;cpa面談の実施\&quot;&gt;CPA面談の実施&lt;a class=\&quot;anchor\&quot; href=\&quot;#cpa面談の実施\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;CPA面談は、アビタスのライセンス取得サポートにおいて、&lt;strong&gt;署名済み実務経験証明書を送付してもらう&lt;/strong&gt;上で必要となるプロせスである。&lt;/p&gt;&lt;p&gt;面談の内容だが、ライセンス取得サポート申込者が&lt;strong&gt;zoom&lt;/strong&gt;上で集まり、それぞれが&lt;strong&gt;アビタスの講師&lt;/strong&gt;（CPAホルダー）へ&lt;strong&gt;会計に関する実務経歴を1分程度で説明&lt;/strong&gt;するグループ面談となっている。&lt;/p&gt;&lt;p&gt;説明は1人1分だが、私が参加した回では&lt;strong&gt;25名&lt;/strong&gt;程度が参加しており、発言者変更の待機時間や事前説明等のため、&lt;strong&gt;1時間程度かかった&lt;/strong&gt;と記憶している。&lt;/p&gt;&lt;p&gt;尚、このプロセスに&lt;strong&gt;何の意味があるのか&lt;/strong&gt;、そもそも&lt;strong&gt;必要なのか&lt;/strong&gt;、といった疑問が湧くかと思われるが、実務経験証明書への&lt;strong&gt;署名を外部CPAホルダーに依頼する上で必要&lt;/strong&gt;というような説明が講師からあったので（うろ覚えだが）、ワシントン州会計士委員会の規約等で何かあるのかもしれない。&lt;/p&gt;&lt;p&gt;twitter等では、&lt;strong&gt;目的の不明瞭さ&lt;/strong&gt;や&lt;strong&gt;プライバシーへの懸念&lt;/strong&gt;から&lt;strong&gt;不満の声&lt;/strong&gt;が見受けられるが、個人的には、1時間程度で終わり、また自身の情報開示にあまり抵抗がないため、&lt;strong&gt;特に嫌悪感はなかった&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;学歴評価と実務経験証明書の待機期間\&quot;&gt;学歴評価と実務経験証明書の待機期間&lt;a class=\&quot;anchor\&quot; href=\&quot;#学歴評価と実務経験証明書の待機期間\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;CPA面談から1.1ヶ月後、&lt;strong&gt;ボトルネック工程&lt;/strong&gt;となっていた学歴評価と署名済み実務経験証明書の取得が&lt;strong&gt;ほぼ同時に完了&lt;/strong&gt;した。&lt;/p&gt;&lt;p&gt;以上をもって、ようやく&lt;strong&gt;ライセンス申請が可能&lt;/strong&gt;となった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;ライセンス申請の実施\&quot;&gt;ライセンス申請の実施&lt;a class=\&quot;anchor\&quot; href=\&quot;#ライセンス申請の実施\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;a href=\&quot;https://secureaccess.wa.gov/\&quot;&gt;ワシントン州オンラインシステム&lt;/a&gt;にアクセスし、①各種情報の入力、②書類（署名済み実務経験証明書/英文職務経歴書/倫理試験の合格証明書）のアップロード、③申請料金の支払い、を完了したところ、&lt;strong&gt;10時間&lt;/strong&gt;後にライセンスが発行された旨のメール通知を受領した。&lt;/p&gt;&lt;p&gt;アビタスの情報では申請後1～2週間かかるとのことだったため、想定より&lt;strong&gt;非常に早かった&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;以上をもって、最終試験の合格発表から&lt;strong&gt;1.5ヶ月後&lt;/strong&gt;、はれて&lt;strong&gt;米国公認会計士になった&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;所感\&quot;&gt;所感&lt;a class=\&quot;anchor\&quot; href=\&quot;#所感\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;思ったより&lt;strong&gt;細かい作業&lt;/strong&gt;が多く、&lt;strong&gt;相互依存も多い&lt;/strong&gt;ので、&lt;strong&gt;早めに全体像を把握&lt;/strong&gt;し、&lt;strong&gt;事務作業&lt;/strong&gt;は要所で時間を取って&lt;strong&gt;一気に終わらせる&lt;/strong&gt;のをおすすめする。&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;ライセンス取得までの道のり概要&quot;],&quot;text&quot;:[0,&quot;ライセンス取得までの道のり：概要#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;無料コンサルテーションの申請&quot;],&quot;text&quot;:[0,&quot;無料コンサルテーションの申請#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;ライセンス質問票の作成&quot;],&quot;text&quot;:[0,&quot;ライセンス質問票の作成#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;英文職務経歴書の作成&quot;],&quot;text&quot;:[0,&quot;英文職務経歴書の作成#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;実務経験証明書の作成&quot;],&quot;text&quot;:[0,&quot;実務経験証明書の作成#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;勤務先証明書の用意&quot;],&quot;text&quot;:[0,&quot;勤務先証明書の用意#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;ライセンス取得サポートの申請&quot;],&quot;text&quot;:[0,&quot;ライセンス取得サポートの申請#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;学歴の評価送付の依頼&quot;],&quot;text&quot;:[0,&quot;学歴の評価/送付の依頼#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;試験実績送付の依頼&quot;],&quot;text&quot;:[0,&quot;試験実績送付の依頼#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;倫理試験の合格&quot;],&quot;text&quot;:[0,&quot;倫理試験の合格#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;cpa面談の実施&quot;],&quot;text&quot;:[0,&quot;CPA面談の実施#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;学歴評価と実務経験証明書の待機期間&quot;],&quot;text&quot;:[0,&quot;学歴評価と実務経験証明書の待機期間#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;ライセンス申請の実施&quot;],&quot;text&quot;:[0,&quot;ライセンス申請の実施#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;所感&quot;],&quot;text&quot;:[0,&quot;所感#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;米国公認会計士（USCPA）のライセンス取得手続き実施記録&quot;],&quot;slug&quot;:[0,&quot;uscpa-license-procedure&quot;],&quot;published&quot;:[3,&quot;2023-08-21T09:43:06.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/08/uscpa-license-procedure.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,15],&quot;words&quot;:[0,2952],&quot;excerpt&quot;:[0,&quot;米国公認会計士（USCPA）のライセンスを取得た。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;uscpa-license-procedure&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;uscpa-ethics-pass-in-short-time.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;米国公認会計士（USCPA）の倫理試験（ethics exam）合格体験記（2.5時間）&quot;],&quot;published&quot;:[3,&quot;2023-07-18T08:00:49.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/uscpa-ethics-pass-in-short-time.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;試験勉強せずにIELTS 8.0を取る上で役立った習慣&quot;],&quot;prevSlug&quot;:[0,&quot;ielts-pass-without-studying&quot;],&quot;nextTitle&quot;:[0,&quot;米国公認会計士（USCPA）のライセンス取得手続き実施記録&quot;],&quot;nextSlug&quot;:[0,&quot;uscpa-license-procedure&quot;],&quot;editorId&quot;:[0,&quot;uscpa-ethics-pass-in-short-time&quot;]}],&quot;body&quot;:[0,&quot;米国公認会計士の**倫理試験**（ethics exam）を受験し、**1回目で合格**した。  \r\n  \r\nスコアは**97点**だった（100点満点中、90点で合格）。\r\n\r\n（※本記事は私が受験した2023年7月時点におけるワシントン州の倫理試験を前提としている）\r\n\r\n\r\n\r\n## 注意（2024年4月17日追記）\r\n\r\n本記事に記載の**participant manual**は、X（旧twitter）の投稿を見る限り、2023年の秋頃から**閲覧不能**になっているようだ（[ソース1](https://x.com/Lehmann_uscpa/status/1726426947276947798)、[ソース2](https://x.com/uscpa_prejcpa/status/1744289228975174118)）。従って本記事の方法は役立たない可能性があるので、ご了承頂きたい。\r\n\r\n## 概要\r\n\r\n以下のようにすれば、**2.5時間で1発合格**する。\r\n\r\n1. テキストや演習は**無視**\r\n2. **Participant manual**をダウンロードしてざっと**目を通す**（15分～30分）\r\n3. テストを開始\r\n4. **Particpant manual**から**答えを効率的に検索**しながら回答（1.5時間～2時間）\r\n\r\n尚、**注意点**として、以下がある。\r\n\r\n- キーボードの**CtrlやAltの無効化**を推奨\r\n- 問題/回答の**記録は不要**\r\n\r\n以下、順を追って説明する。\r\n\r\n## テキストや演習は無視\r\n\r\n倫理試験は、**オンライン教材及びテスト**を**AICPAウェブサイト上で購入**し、**自分のパソコン**から**ブラウザ上で受験**する形となっている。\r\n\r\n建付けとしては、テキスト・演習（Contents）を**こなした上で**試験に進む流れなのだが、テキスト・演習の内容をまとめた**PDFファイル**（participant manual）を**ダウンロード可能**で、こちらを**検索しながら試験を受けてOK**なため、**いきなり試験を始めてOK**である。\r\n\r\n## Participant manualに目を通す\r\n\r\n倫理試験は**open-book**形式。  \r\nつまり、**資料を参照**しながら**受験**することが**公式に許容**されている。  \r\n（参考：[ワシントン州会計士協会資料](https://cpaboard.wa.gov/sites/default/files/WashingtonStateEthicsforCPAApplicants.pdf)）\r\n\r\nそこで、オンライン教材のまとめPDF資料である**Participant manual（以下PDF）を事前にダウンロード**しておく。（教材ソフトのホーム画面右上にあるResourcesボタンから取得可能）\r\n\r\nPDFは**それなりのボリューム**があるため（全**127ページ**）、**情報検索を効率的**にすべく、ファイルに目を通して**章立てや各章の内容を把握**しておくと良い。\r\n\r\n尚、私は**30分ほどかけて斜め読み**したが、5分程度に短縮したり、本ステップを丸ごとskipしてもOKかもしれない。\r\n\r\n## Participant manualを効率的に検索\r\n\r\nPDFの内容をざっくり把握したら、テストを開始し、**ファイルで情報を検索**しながら問題を問いてく。\r\n\r\n私が解いた問題に関する限り、**答えは全てPDFにそのまま書いて**あり、**類推や思考を要するものはなかった**。\r\n\r\n従って、**効率的かつ確実に検索**さえすれば、**短時間で着実に合格**できると思われる。\r\n\r\n検索の方法だが、基本的には**問題中のキーワードを抜き出してPDF内を検索**すればOK。\r\n\r\n但し、**検索がたくさんヒット**するケースがあるため、その場合は**検索**や**PDFの目次リンクから適切な章に飛び**（ファイルの内容を事前に把握したことがここで活きる）、**章の冒頭にカーソルを合わせた上でキーワード検索**すると、ほぼ**5ヒット以内**に**「答えがそのまま書いてある」文章**にたどり着く。\r\n\r\n**全48問**なので、**1問あたり2.5分**で解くと、**2時間**で終わる。\r\n\r\n尚、場合によっては検索せずにAUDやREGの記憶を頼りに回答すればより早く終わると思うが、**不合格になったときの面倒さ＆答えが必ずPDF内に書いてある**ことを考え、私は**頭を空っぽ**にして**検索→回答を繰り返す**スタイルを取った。  \r\n  \r\n（上記の**頭空っぽスタイル**は**試験の趣旨**に適合するのか？という議論あるが、伝え聞くところによると「**常に一次情報にあたる**」ことが**会計士の重要な行動特性**とのことであり、**open-book形式**とは**つまりはそういうこと**なので、**曖昧な記憶に頼る**よりは**こちらが正解では**？と考え実行した）\r\n\r\n## CtrlやAltを無効化\r\n\r\n**注意点**として、倫理試験はブラウザでテストサイトにアクセスした際に開かれる**新規ウィンドウ内に回答**していく形を取っているのだが、**ウィンドウを消すと最初から受け直し**になる。\r\n\r\n**途中経過は保持され**ない。\r\n\r\n私は作業が終わったウィンドウを**無意識にCtrl+wで閉じる癖**があり、テスト途中でPDFファイルを見に行く際にCtrl+wを押してしまったのか**ウィンドウが消え**（無意識なので記憶にない）、**8割ほど回答完了していたにも関わらずテスト受け直し**になるというミスを犯した。\r\n\r\n**深夜に1.5時間**ほどかけた作業が**一瞬で水泡に帰した**。\r\n\r\nよって、似たような癖を持っている人は、[Keyswap](https://www.vector.co.jp/soft/winnt/util/se228667.html)等のソフトでCtrlやAlt等の**「危険なキー」**を**無効化**にしておけば安心である。\r\n\r\n## 問題/回答の記録は不要\r\n\r\n倫理試験に関する情報で、\r\n\r\n「**試験を何回受けても問題は同じ**なので、**問題/回答をExcel等に記録**しておき、不合格だった場合は**回答記録を参照**しながら**自信のない問題の回答だけ変える**形で再チャレンジすると良い」\r\n\r\nという**メソッドを何度か目にした**。\r\n\r\n私もそれに倣って**問題/回答を記録していた**が、**PDFに回答がそのまま書いてある問題ばかり**だったので**途中でやめた**。\r\n\r\nまた、前述したようにテスト途中でウィンドウを消してしまい再テストする羽目になったのだが、「**何回受けても問題は同じ**」という**情報と異なり**、**再試験では7割程度が前回と異なる問題**であった。\r\n\r\n（上記の情報を提供していた方々とは違う州なのか、試験の仕様が変わったのだと思われる。私が受けたのは2023年7月時点のワシントン州の倫理試験である）。\r\n\r\n逆に言えば**3割程度は同じ問題が出題**されたため、試験に何度も落ちるリスクが高く出題内容はランダムと考える場合、質問/回答の記録を続け、試験サイトにストックされている**全問題をあらかたリスト化**してしまう戦術もアリとは思う。\r\n\r\nただ、**回答が全てPDFにそのまま書いてある**のと、**問題/回答を記録していく手間**を考えると、**問題/回答を記録する意義**はあまり**見いだせなかった**。\r\n\r\n## 結論\r\n\r\n上記を実施すれば、**英語の読解力に問題がない限り**、倫理試験は**2.5時間×1回**で合格すると思われる。  \r\n（※私は「ウィンドウ閉じる事件」のため3.5時間かかった）&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/uscpa-ethics-pass-in-short-time.md&quot;],&quot;digest&quot;:[0,&quot;2318b1a061547a16&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;米国公認会計士の&lt;strong&gt;倫理試験&lt;/strong&gt;（ethics exam）を受験し、&lt;strong&gt;1回目で合格&lt;/strong&gt;した。&lt;/p&gt;\n&lt;p&gt;スコアは&lt;strong&gt;97点&lt;/strong&gt;だった（100点満点中、90点で合格）。&lt;/p&gt;\n&lt;p&gt;（※本記事は私が受験した2023年7月時点におけるワシントン州の倫理試験を前提としている）&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;注意2024年4月17日追記\&quot;&gt;注意（2024年4月17日追記）&lt;a class=\&quot;anchor\&quot; href=\&quot;#注意2024年4月17日追記\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;本記事に記載の&lt;strong&gt;participant manual&lt;/strong&gt;は、X（旧twitter）の投稿を見る限り、2023年の秋頃から&lt;strong&gt;閲覧不能&lt;/strong&gt;になっているようだ（&lt;a href=\&quot;https://x.com/Lehmann_uscpa/status/1726426947276947798\&quot;&gt;ソース1&lt;/a&gt;、&lt;a href=\&quot;https://x.com/uscpa_prejcpa/status/1744289228975174118\&quot;&gt;ソース2&lt;/a&gt;）。従って本記事の方法は役立たない可能性があるので、ご了承頂きたい。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;概要\&quot;&gt;概要&lt;a class=\&quot;anchor\&quot; href=\&quot;#概要\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;以下のようにすれば、&lt;strong&gt;2.5時間で1発合格&lt;/strong&gt;する。&lt;/p&gt;&lt;ol&gt;\n&lt;li&gt;テキストや演習は&lt;strong&gt;無視&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Participant manual&lt;/strong&gt;をダウンロードしてざっと&lt;strong&gt;目を通す&lt;/strong&gt;（15分～30分）&lt;/li&gt;\n&lt;li&gt;テストを開始&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Particpant manual&lt;/strong&gt;から&lt;strong&gt;答えを効率的に検索&lt;/strong&gt;しながら回答（1.5時間～2時間）&lt;/li&gt;\n&lt;/ol&gt;&lt;p&gt;尚、&lt;strong&gt;注意点&lt;/strong&gt;として、以下がある。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;キーボードの&lt;strong&gt;CtrlやAltの無効化&lt;/strong&gt;を推奨&lt;/li&gt;\n&lt;li&gt;問題/回答の&lt;strong&gt;記録は不要&lt;/strong&gt;&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;以下、順を追って説明する。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;テキストや演習は無視\&quot;&gt;テキストや演習は無視&lt;a class=\&quot;anchor\&quot; href=\&quot;#テキストや演習は無視\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;倫理試験は、&lt;strong&gt;オンライン教材及びテスト&lt;/strong&gt;を&lt;strong&gt;AICPAウェブサイト上で購入&lt;/strong&gt;し、&lt;strong&gt;自分のパソコン&lt;/strong&gt;から&lt;strong&gt;ブラウザ上で受験&lt;/strong&gt;する形となっている。&lt;/p&gt;&lt;p&gt;建付けとしては、テキスト・演習（Contents）を&lt;strong&gt;こなした上で&lt;/strong&gt;試験に進む流れなのだが、テキスト・演習の内容をまとめた&lt;strong&gt;PDFファイル&lt;/strong&gt;（participant manual）を&lt;strong&gt;ダウンロード可能&lt;/strong&gt;で、こちらを&lt;strong&gt;検索しながら試験を受けてOK&lt;/strong&gt;なため、&lt;strong&gt;いきなり試験を始めてOK&lt;/strong&gt;である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;participant-manualに目を通す\&quot;&gt;Participant manualに目を通す&lt;a class=\&quot;anchor\&quot; href=\&quot;#participant-manualに目を通す\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;倫理試験は&lt;strong&gt;open-book&lt;/strong&gt;形式。&lt;br&gt;\nつまり、&lt;strong&gt;資料を参照&lt;/strong&gt;しながら&lt;strong&gt;受験&lt;/strong&gt;することが&lt;strong&gt;公式に許容&lt;/strong&gt;されている。&lt;br&gt;\n（参考：&lt;a href=\&quot;https://cpaboard.wa.gov/sites/default/files/WashingtonStateEthicsforCPAApplicants.pdf\&quot;&gt;ワシントン州会計士協会資料&lt;/a&gt;）&lt;/p&gt;&lt;p&gt;そこで、オンライン教材のまとめPDF資料である&lt;strong&gt;Participant manual（以下PDF）を事前にダウンロード&lt;/strong&gt;しておく。（教材ソフトのホーム画面右上にあるResourcesボタンから取得可能）&lt;/p&gt;&lt;p&gt;PDFは&lt;strong&gt;それなりのボリューム&lt;/strong&gt;があるため（全&lt;strong&gt;127ページ&lt;/strong&gt;）、&lt;strong&gt;情報検索を効率的&lt;/strong&gt;にすべく、ファイルに目を通して&lt;strong&gt;章立てや各章の内容を把握&lt;/strong&gt;しておくと良い。&lt;/p&gt;&lt;p&gt;尚、私は&lt;strong&gt;30分ほどかけて斜め読み&lt;/strong&gt;したが、5分程度に短縮したり、本ステップを丸ごとskipしてもOKかもしれない。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;participant-manualを効率的に検索\&quot;&gt;Participant manualを効率的に検索&lt;a class=\&quot;anchor\&quot; href=\&quot;#participant-manualを効率的に検索\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;PDFの内容をざっくり把握したら、テストを開始し、&lt;strong&gt;ファイルで情報を検索&lt;/strong&gt;しながら問題を問いてく。&lt;/p&gt;&lt;p&gt;私が解いた問題に関する限り、&lt;strong&gt;答えは全てPDFにそのまま書いて&lt;/strong&gt;あり、&lt;strong&gt;類推や思考を要するものはなかった&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;従って、&lt;strong&gt;効率的かつ確実に検索&lt;/strong&gt;さえすれば、&lt;strong&gt;短時間で着実に合格&lt;/strong&gt;できると思われる。&lt;/p&gt;&lt;p&gt;検索の方法だが、基本的には&lt;strong&gt;問題中のキーワードを抜き出してPDF内を検索&lt;/strong&gt;すればOK。&lt;/p&gt;&lt;p&gt;但し、&lt;strong&gt;検索がたくさんヒット&lt;/strong&gt;するケースがあるため、その場合は&lt;strong&gt;検索&lt;/strong&gt;や&lt;strong&gt;PDFの目次リンクから適切な章に飛び&lt;/strong&gt;（ファイルの内容を事前に把握したことがここで活きる）、&lt;strong&gt;章の冒頭にカーソルを合わせた上でキーワード検索&lt;/strong&gt;すると、ほぼ&lt;strong&gt;5ヒット以内&lt;/strong&gt;に**「答えがそのまま書いてある」文章**にたどり着く。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;全48問&lt;/strong&gt;なので、&lt;strong&gt;1問あたり2.5分&lt;/strong&gt;で解くと、&lt;strong&gt;2時間&lt;/strong&gt;で終わる。&lt;/p&gt;&lt;p&gt;尚、場合によっては検索せずにAUDやREGの記憶を頼りに回答すればより早く終わると思うが、&lt;strong&gt;不合格になったときの面倒さ＆答えが必ずPDF内に書いてある&lt;/strong&gt;ことを考え、私は&lt;strong&gt;頭を空っぽ&lt;/strong&gt;にして&lt;strong&gt;検索→回答を繰り返す&lt;/strong&gt;スタイルを取った。&lt;/p&gt;&lt;p&gt;（上記の&lt;strong&gt;頭空っぽスタイル&lt;/strong&gt;は&lt;strong&gt;試験の趣旨&lt;/strong&gt;に適合するのか？という議論あるが、伝え聞くところによると「&lt;strong&gt;常に一次情報にあたる&lt;/strong&gt;」ことが&lt;strong&gt;会計士の重要な行動特性&lt;/strong&gt;とのことであり、&lt;strong&gt;open-book形式&lt;/strong&gt;とは&lt;strong&gt;つまりはそういうこと&lt;/strong&gt;なので、&lt;strong&gt;曖昧な記憶に頼る&lt;/strong&gt;よりは&lt;strong&gt;こちらが正解では&lt;/strong&gt;？と考え実行した）&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;ctrlやaltを無効化\&quot;&gt;CtrlやAltを無効化&lt;a class=\&quot;anchor\&quot; href=\&quot;#ctrlやaltを無効化\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;注意点&lt;/strong&gt;として、倫理試験はブラウザでテストサイトにアクセスした際に開かれる&lt;strong&gt;新規ウィンドウ内に回答&lt;/strong&gt;していく形を取っているのだが、&lt;strong&gt;ウィンドウを消すと最初から受け直し&lt;/strong&gt;になる。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;途中経過は保持され&lt;/strong&gt;ない。&lt;/p&gt;&lt;p&gt;私は作業が終わったウィンドウを&lt;strong&gt;無意識にCtrl+wで閉じる癖&lt;/strong&gt;があり、テスト途中でPDFファイルを見に行く際にCtrl+wを押してしまったのか&lt;strong&gt;ウィンドウが消え&lt;/strong&gt;（無意識なので記憶にない）、&lt;strong&gt;8割ほど回答完了していたにも関わらずテスト受け直し&lt;/strong&gt;になるというミスを犯した。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;深夜に1.5時間&lt;/strong&gt;ほどかけた作業が&lt;strong&gt;一瞬で水泡に帰した&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;よって、似たような癖を持っている人は、&lt;a href=\&quot;https://www.vector.co.jp/soft/winnt/util/se228667.html\&quot;&gt;Keyswap&lt;/a&gt;等のソフトでCtrlやAlt等の**「危険なキー」&lt;strong&gt;を&lt;/strong&gt;無効化**にしておけば安心である。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;問題回答の記録は不要\&quot;&gt;問題/回答の記録は不要&lt;a class=\&quot;anchor\&quot; href=\&quot;#問題回答の記録は不要\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;倫理試験に関する情報で、&lt;/p&gt;&lt;p&gt;「&lt;strong&gt;試験を何回受けても問題は同じ&lt;/strong&gt;なので、&lt;strong&gt;問題/回答をExcel等に記録&lt;/strong&gt;しておき、不合格だった場合は&lt;strong&gt;回答記録を参照&lt;/strong&gt;しながら&lt;strong&gt;自信のない問題の回答だけ変える&lt;/strong&gt;形で再チャレンジすると良い」&lt;/p&gt;&lt;p&gt;という&lt;strong&gt;メソッドを何度か目にした&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;私もそれに倣って&lt;strong&gt;問題/回答を記録していた&lt;/strong&gt;が、&lt;strong&gt;PDFに回答がそのまま書いてある問題ばかり&lt;/strong&gt;だったので&lt;strong&gt;途中でやめた&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;また、前述したようにテスト途中でウィンドウを消してしまい再テストする羽目になったのだが、「&lt;strong&gt;何回受けても問題は同じ&lt;/strong&gt;」という&lt;strong&gt;情報と異なり&lt;/strong&gt;、&lt;strong&gt;再試験では7割程度が前回と異なる問題&lt;/strong&gt;であった。&lt;/p&gt;&lt;p&gt;（上記の情報を提供していた方々とは違う州なのか、試験の仕様が変わったのだと思われる。私が受けたのは2023年7月時点のワシントン州の倫理試験である）。&lt;/p&gt;&lt;p&gt;逆に言えば&lt;strong&gt;3割程度は同じ問題が出題&lt;/strong&gt;されたため、試験に何度も落ちるリスクが高く出題内容はランダムと考える場合、質問/回答の記録を続け、試験サイトにストックされている&lt;strong&gt;全問題をあらかたリスト化&lt;/strong&gt;してしまう戦術もアリとは思う。&lt;/p&gt;&lt;p&gt;ただ、&lt;strong&gt;回答が全てPDFにそのまま書いてある&lt;/strong&gt;のと、&lt;strong&gt;問題/回答を記録していく手間&lt;/strong&gt;を考えると、&lt;strong&gt;問題/回答を記録する意義&lt;/strong&gt;はあまり&lt;strong&gt;見いだせなかった&lt;/strong&gt;。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;結論\&quot;&gt;結論&lt;a class=\&quot;anchor\&quot; href=\&quot;#結論\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;上記を実施すれば、&lt;strong&gt;英語の読解力に問題がない限り&lt;/strong&gt;、倫理試験は&lt;strong&gt;2.5時間×1回&lt;/strong&gt;で合格すると思われる。&lt;br&gt;\n（※私は「ウィンドウ閉じる事件」のため3.5時間かかった）&lt;/p&gt;&lt;/section&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;注意2024年4月17日追記&quot;],&quot;text&quot;:[0,&quot;注意（2024年4月17日追記）#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;概要&quot;],&quot;text&quot;:[0,&quot;概要#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;テキストや演習は無視&quot;],&quot;text&quot;:[0,&quot;テキストや演習は無視#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;participant-manualに目を通す&quot;],&quot;text&quot;:[0,&quot;Participant manualに目を通す#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;participant-manualを効率的に検索&quot;],&quot;text&quot;:[0,&quot;Participant manualを効率的に検索#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;ctrlやaltを無効化&quot;],&quot;text&quot;:[0,&quot;CtrlやAltを無効化#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;問題回答の記録は不要&quot;],&quot;text&quot;:[0,&quot;問題/回答の記録は不要#&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;結論&quot;],&quot;text&quot;:[0,&quot;結論#&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;米国公認会計士（USCPA）の倫理試験（ethics exam）合格体験記（2.5時間）&quot;],&quot;slug&quot;:[0,&quot;uscpa-ethics-pass-in-short-time&quot;],&quot;published&quot;:[3,&quot;2023-07-18T08:00:49.000Z&quot;],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/uscpa-ethics-pass-in-short-time.webp&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;minutes&quot;:[0,9],&quot;words&quot;:[0,1859],&quot;excerpt&quot;:[0,&quot;米国公認会計士の倫理試験（ethics exam）を受験し、1回目で合格した。&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;uscpa-ethics-pass-in-short-time&quot;],&quot;render&quot;:[0,null],&quot;localExcerpt&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ielts-pass-without-studying.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;試験勉強せずにIELTS 8.0を取る上で役立った習慣&quot;],&quot;published&quot;:[3,&quot;2023-07-12T07:30:11.000Z&quot;],&quot;publishedPrecision&quot;:[0,&quot;datetime&quot;],&quot;aliases&quot;:[1,[]],&quot;draft&quot;:[0,false],&quot;description&quot;:[0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/ielts-pass-without-studying.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;ビジネス実務法務検定2級 合格体験記（6日間/22時間）&quot;],&quot;prevSlug&quot;:[0,&quot;business-law-pass-in-short-time&quot;],&quot;nextTitle&quot;:[0,&quot;米国公認会計士（USCPA）の倫理試験（ethics exam）合格体験記（2.5時間）&quot;],&quot;nextSlug&quot;:[0,&quot;uscpa-ethics-pass-in-short-time&quot;],&quot;editorId&quot;:[0,&quot;ielts-pass-without-studying&quot;]}],&quot;body&quot;:[0,&quot;**IELTS**で**overall 8.0**を取った（**overall 8.0：**[**TOEFL 110点相当**](https://www.ets.org/toefl/score-users/ibt/compare-scores.html) / [**ハーバードやMITに入学可能**](https://www.path-to-success.net/what-is-a-good-ielts-score#IELTS-3)）。\r\n\r\n**IELTS用の勉強を一切せず**に上記スコアを取得できたため、**IELTS 8.0を取る英語力が自然と身についた習慣**を共有する。\r\n\r\n\r\n\r\n## 概要\r\n\r\nIELTSには、TOEFL同様**リスニング、リーディング、スピーキング、ライティングの4科目**があるため、それぞれに関して記載する。\r\n\r\n基本的に、**英語のコンテンツを消費する**以上のことはやっていない。\r\n\r\n## リスニング\r\n\r\nNetflixやYouTube等の**英語動画を字幕なしで視聴**し、**聞き取れない箇所**が出る度に巻き戻して**その部分の字幕を表示**していた。\r\n\r\n## リーディング\r\n\r\n以下を実施して、**日常的に英語を読んでいた**。\r\n\r\n- スマホやパソコン等、**電子機器の言語を全て英語**にする\r\n- **英字新聞**の電子版を**購読**\r\n- **twitter**で**英語話者をフォロー**\r\n- Kindleで**英語の本を購読**\r\n- **知らない単語**は出来る限り**辞書を引く**\r\n\r\n## スピーキング\r\n\r\n上記のように**英語コンテンツに触れる度に**、感想を**英語で考えたり**、独り言として**話したり**していた。\r\n\r\n## ライティング\r\n\r\n**特に何もしていない**。\r\n\r\n**英語を読んでいれば**ある程度は**自然と身につく**ようである。\r\n\r\n## 実施期間\r\n\r\n高校以来、上記をなんとなく実施してきたため、期間で考えると10年以上やっているが、大学1年の時と今で英語のスキルはそれほど変わっていないため、上記を**1日平均30分、3年ほど続ければ、IELTS 8.0は取れると思われる**。\r\n\r\n## 結論\r\n\r\n書いてて気づいたが、**大したことはしていない**。  \r\n**とにかく英語のインプットを雑に続けるだけでも、IELTS 8.0を取る程度に英語力は向上する**ようである。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/ielts-pass-without-studying.md&quot;],&quot;digest&quot;:[0,&quot;3ab0378192cd4b40&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;IELTS&lt;/strong&gt;で&lt;strong&gt;overall 8.0&lt;/strong&gt;を取った（&lt;strong&gt;overall 8.0：&lt;/strong&gt;&lt;a href=\&quot;https://www.ets.org/toefl/score-users/ibt/compare-scores.html\&quot;&gt;&lt;strong&gt;TOEFL 110点相当&lt;/strong&gt;&lt;/a&gt; / &lt;a href=\&quot;https://www.path-to-success.net/what-is-a-good-ielts-score#IELTS-3\&quot;&gt;&lt;strong&gt;ハーバードやMITに入学可能&lt;/strong&gt;&lt;/a&gt;）。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;IELTS用の勉強を一切せず&lt;/strong&gt;に上記スコアを取得できたため、&lt;strong&gt;IELTS 8.0を取る英語力が自然と身についた習慣&lt;/strong&gt;を共有する。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;概要\&quot;&gt;概要&lt;a class=\&quot;anchor\&quot; href=\&quot;#概要\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;IELTSには、TOEFL同様&lt;strong&gt;リスニング、リーディング、スピーキング、ライティングの4科目&lt;/strong&gt;があるため、それぞれに関して記載する。&lt;/p&gt;&lt;p&gt;基本的に、&lt;strong&gt;英語のコンテンツを消費する&lt;/strong&gt;以上のことはやっていない。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;リスニング\&quot;&gt;リスニング&lt;a class=\&quot;anchor\&quot; href=\&quot;#リスニング\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;NetflixやYouTube等の&lt;strong&gt;英語動画を字幕なしで視聴&lt;/strong&gt;し、&lt;strong&gt;聞き取れない箇所&lt;/strong&gt;が出る度に巻き戻して&lt;strong&gt;その部分の字幕を表示&lt;/strong&gt;していた。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;リーディング\&quot;&gt;リーディング&lt;a class=\&quot;anchor\&quot; href=\&quot;#リーディング\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;以下を実施して、&lt;strong&gt;日常的に英語を読んでいた&lt;/strong&gt;。&lt;/p&gt;&lt;ul&gt;\n&lt;li&gt;スマホやパソコン等、&lt;strong&gt;電子機器の言語を全て英語&lt;/strong&gt;にする&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;英字新聞&lt;/strong&gt;の電子版を&lt;strong&gt;購読&lt;/strong&gt;&lt;/l 0,&quot;&quot;],&quot;image&quot;:[0,&quot;/wp-content/uploads/2023/07/business-law-pass-in-short-time.webp&quot;],&quot;tags&quot;:[1,[]],&quot;category&quot;:[0,&quot;Uncategorized&quot;],&quot;lang&quot;:[0,&quot;ja&quot;],&quot;prevTitle&quot;:[0,&quot;コンサルに転職して4年で年収を2400万円にする方法&quot;],&quot;prevSlug&quot;:[0,&quot;consulting-get-24millionyen-in-4years&quot;],&quot;nextTitle&quot;:[0,&quot;試験勉強せずにIELTS 8.0を取る上で役立った習慣&quot;],&quot;nextSlug&quot;:[0,&quot;ielts-pass-without-studying&quot;],&quot;editorId&quot;:[0,&quot;business-law-pass-in-short-time&quot;]}],&quot;body&quot;:[0,&quot;**ビジネス実務法務検定2級に合格**した。\r\n\r\n勉強時間は**22時間**だった。\r\n\r\n\r\n\r\n## 予備校\r\n\r\nなし。  \r\n**市販の本を買えば十分**だった。\r\n\r\n## 教材\r\n\r\n- **テキスト：**なし\r\n- **問題週：**[法務教科書 ビジネス実務法務検定試験(R)2級 精選問題集 2022年版](https://www.amazon.co.jp/%E6%B3%95%E5%8B%99%E6%95%99%E7%A7%91%E6%9B%B8-%E3%83%93%E3%82%B8%E3%83%8D%E3%82%B9%E5%AE%9F%E5%8B%99%E6%B3%95%E5%8B%99%E6%A4%9C%E5%AE%9A%E8%A9%A6%E9%A8%93-2%E7%B4%9A-%E7%B2%BE%E9%81%B8%E5%95%8F%E9%A1%8C%E9%9B%86-2022%E5%B9%B4%E7%89%88-ebook/dp/B09R9Z31WR/ref=tmm_kin_swatch_0?_encoding=UTF8&amp;qid=1688724971&amp;sr=1-5)\r\n\r\n尚、**民法や会社法の知識が一切ない**人は、伊藤真の[民法入門](https://www.amazon.co.jp/%E4%BC%8A%E8%97%A4%E7%9C%9F%E3%81%AE%E6%B0%91%E6%B3%95%E5%85%A5%E9%96%80-%E4%BC%8A%E8%97%A4%E7%9C%9F%E3%81%AE%E6%B3%95%E5%BE%8B%E5%85%A5%E9%96%80%E3%82%B7%E3%83%AA%E3%83%BC%E3%82%BA-%E4%BC%8A%E8%97%A4-%E7%9C%9F-ebook/dp/B08HYCK177/ref=tmm_kin_swatch_0?_encoding=UTF8&amp;amp;amp;amp;qid=&amp;amp;amp;amp;sr=)と[会社法入門](https://www.amazon.co.jp/%E4%BC%8A%E8%97%A4%E7%9C%9F%E3%81%AE%E4%BC%9A%E7%A4%BE%E6%B3%95%E5%85%A5%E9%96%80-%E8%AC%9B%E7%BE%A9%E5%86%8D%E7%8F%BE%E7%89%88-%E4%BC%8A%E8%97%A4%E7%9C%9F%E3%81%AE%E6%B3%95%E5%BE%8B%E5%85%A5%E9%96%80%E3%82%B7%E3%83%AA%E3%83%BC%E3%82%BA-%E4%BC%8A%E8%97%A4-%E7%9C%9F-ebook/dp/B081DJBHPD/ref=tmm_kin_swatch_0?_encoding=UTF8&amp;qid=1688725275&amp;sr=1-1)を読むのが良いと思われる。Kindle Unlimitedに入っていると、どちらも**無料で読める**。\r\n\r\n上記を読む場合、1冊5時間ほどかかるため、合計勉強時間は+10時間で**32時間**になる。\r\n\r\n## 教材以外の道具\r\n\r\n**iPhone、Studyplus**を以下のように使った。\r\n\r\n- **iPhone**：問題集をやる\r\n- [**Studyplus**](https://www.studyplus.jp/)：勉強時間を記録\r\n\r\n## 勉強方法\r\n\r\n**問題集を2周**した。  \r\n間違えた問題のメモ等はしなかった。\r\n\r\n## スコア\r\n\r\n**84点**だった。  \r\nなお、100点満点中70点で合格。\r\n\r\n## 試験内容に関する印象\r\n\r\nビジネスパーソンが一般に知っておくと良い法律知識が効率的に身につく、**良い資格試験**だと感じた。&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/business-law-pass-in-short-time.md&quot;],&quot;digest&quot;:[0,&quot;0b0d8380bea55d31&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;&lt;strong&gt;ビジネス実務法務検定2級に合格&lt;/strong&gt;した。&lt;/p&gt;\n&lt;p&gt;勉強時間は&lt;strong&gt;22時間&lt;/strong&gt;だった。&lt;/p&gt;\n&lt;section&gt;&lt;h2 id=\&quot;予備校\&quot;&gt;予備校&lt;a class=\&quot;anchor\&quot; href=\&quot;#予備校\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;p&gt;なし。&lt;br&gt;\n&lt;strong&gt;市販の本を買えば十分&lt;/strong&gt;だった。&lt;/p&gt;&lt;/section&gt;\n&lt;section&gt;&lt;h2 id=\&quot;教材\&quot;&gt;教材&lt;a class=\&quot;anchor\&quot; href=\&quot;#教材\&quot;&gt;&lt;span class=\&quot;anchor-icon\&quot; data-pagefind-ignore=\&quot;\&quot;&gt;#&lt;/span&gt;&lt;/a&gt;&lt;/h2&gt;&lt;ul&gt;\n&lt;li&gt;**テキスト：**なし&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;問題週：&lt;/strong&gt;&lt;a href=\&quot;https://www.amazon.co.jp/%E6%B3%95%E5%8B%99%E6%95%99%E7%A7%91%E6%9B%B8-%E3%83%93%E3%82%B8%E3%83%8D%E3%82%B9%E5%AE%9F%E5%8B%99%E6%B3%95%E5%8B%99%E6%A4%9C%E5%AE%9A%E8%A9%A6%E9%A8%93-2%E7%B4%9A-%E7%B2%BE%E9%81%B8%E5%95%8F%E9%A1%8C%E9%9B%86-2022%E5%B9%B4%E7%89%88-ebook/dp/B09R9Z31WR/ref=tmm_kin_swatch_0?_encoding=UTF8&amp;#x26;qid=1688724971&amp;#x26;sr=1-5\&quot;&gt;法務教科書 ビジネス実務法務検定試験(R)2級 精選問題集 2022年版&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&lt;p&gt;尚、&lt;strong&gt;民法や会社法の知識が一切ない&lt;/strong&gt;人は、伊藤真の&lt;a href=\&quot;https://www.amazon.co.jp/%E4%BC%8A%E8%97%A4%E7%9C%9F%E3%81%AE%E6%B0%91%E6%B3%95%E5%85%A5%E9%96%80-%E4%BC%8A%E8%97%A4%E7%9C%9F%E3%81%AE%E6%B3%95%E5%BE%8B%E5%85%A5%E9%96%80%E3%
